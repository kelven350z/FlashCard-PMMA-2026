<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulados PMMA 2026</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --primary:#1e3a8a; --primary2:#2563eb;
  --success:#16a34a; --danger:#dc2626; --warn:#d97706; --text:#1f2937; --muted:#6b7280;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0f1420;--card:#1a2233;--text:#e5e7eb;--muted:#9ca3af;}
}
:root[data-theme="dark"]{--bg:#0f1420;--card:#1a2233;--text:#e5e7eb;--muted:#9ca3af;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:16px;min-height:100%}
.container{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{color:var(--primary);font-size:1.3rem;margin:4px 0 0}
p.sub{color:var(--muted);margin:0 0 8px;font-size:.85rem}
.card{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:10px;color:#fff;background:var(--primary2)}
.btn.secondary{background:#64748b}
.btn.success{background:var(--success)}
.btn.danger{background:var(--danger)}
.btn:disabled{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;background:#e0e7ff;color:var(--primary);padding:3px 9px;border-radius:20px;font-size:.7rem;font-weight:700;text-transform:uppercase;margin-right:6px}
.tag.diff-facil{background:#dcfce7;color:#166534}
.tag.diff-media{background:#fef3c7;color:#92400e}
.tag.diff-dificil{background:#fee2e2;color:#991b1b}
.qtext{font-size:1rem;line-height:1.5;margin:12px 0;font-weight:500}
.progress{height:6px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-bottom:4px}
.progress>div{height:100%;background:var(--primary2)}
.small{font-size:.78rem;color:var(--muted)}
.feedback{border-radius:10px;padding:14px;margin-top:10px;font-size:.92rem;line-height:1.45;display:none}
.feedback.ok{background:#dcfce7;color:#14532d;border:1px solid #86efac}
.feedback.bad{background:#fee2e2;color:#7f1d1d;border:1px solid #fca5a5}
.feedback.blank{background:#fef3c7;color:#78350f;border:1px solid #fde68a}
.row{display:flex;gap:10px}
.hidden{display:none}
table{width:100%;border-collapse:collapse;font-size:.85rem}
td,th{padding:6px 4px;border-bottom:1px solid rgba(128,128,128,.2);text-align:left}
.center{text-align:center}
.big{font-size:2rem;font-weight:800}
.badge-status{padding:4px 10px;border-radius:8px;font-weight:700;font-size:.85rem}
.st-aprovado{background:#dcfce7;color:#14532d}
.st-caminho{background:#fef3c7;color:#78350f}
.st-estudar{background:#fee2e2;color:#7f1d1d}
select{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;background:var(--card);color:var(--text)}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0}
.bar .lbl{width:100px;font-size:.75rem;color:var(--muted)}
.bar .track{flex:1;height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--primary2)}
textarea,input[type=text]{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;background:var(--card);color:var(--text);font-family:inherit;font-size:.9rem}
.imgprev{max-width:100%;border-radius:10px;margin-top:8px;display:block}
.qcheck{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid rgba(128,128,128,.25);border-radius:10px;margin-bottom:10px}
.aibox{background:var(--card);border:1px solid #c7d2fe;border-left:4px solid var(--primary2);border-radius:10px;padding:12px;margin-top:10px;font-size:.88rem}
label.small{display:block;margin-top:10px}
.pillbox{background:var(--card);border:1px solid #c7d2fe;border-left:4px solid var(--primary2);border-radius:12px;padding:14px;margin-top:10px}
.pillbox h3{margin:0 0 10px;font-size:.95rem;color:var(--primary)}
.pill-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.pill-item:last-child{margin-bottom:0}
.pill-ico{font-size:1.15rem;line-height:1.4;flex-shrink:0}
.pill-body b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--primary2);margin-bottom:2px}
.pill-body span{font-size:.87rem;line-height:1.45;color:var(--text)}
.pill-tags{display:flex;flex-wrap:wrap;gap:6px}
.pill-tags span.kw{background:#e0e7ff;color:var(--primary);padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600;display:inline-block}
.btn.reforco{background:#7c3aed}
.pill-list{margin:2px 0 0;padding-left:18px;font-size:.87rem;line-height:1.45;color:var(--text)}
.pill-list li{margin-bottom:4px}
.pill-loading{font-size:.85rem;color:var(--muted);padding:8px 0}
#homeFab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:12px 16px;border:none;border-radius:26px;background:var(--primary);color:#fff;font-weight:700;font-size:.95rem;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:1000;display:none;cursor:pointer}
</style>
</head>
<body>
<div class="container" id="app"></div>
<button id="homeFab" type="button" aria-label="Voltar ao início" onclick="goHome()">🏠 Início</button>

<script>
/* Rede de segurança: se algum navegador (ex.: Safari antigo) falhar, mostra o erro em vez de tela preta */
window.addEventListener("error",function(ev){
  try{
    var box=document.getElementById("app")||document.body;
    if(box && !box.getAttribute("data-err")){
      box.setAttribute("data-err","1");
      box.innerHTML='<div style="background:#fff;color:#111;padding:16px;border-radius:12px;margin:16px;font:15px -apple-system,Arial,sans-serif"><b>Não foi possível carregar o app.</b><br>Tire um print desta mensagem e envie para o criador:<br><br><code style="word-break:break-all">'+String(ev.message||"erro")+' (linha '+(ev.lineno||"?")+')</code></div>';
    }
  }catch(e){}
});
</script>
<script>
/* ===== BANCO DE QUESTÕES ===== */
// bloco: G = Conhecimentos Gerais, E = Conhecimentos Específicos
// dif: facil, media, dificil  1�7 todas questões são inéditas, estilo Cebraspe (sem atribuição a provas reais)
const BANK = [
// ---- PORTUGUÊS (G) ----
{m:"Português",bloco:"G",tema:"Regência verbal",dif:"media",s:"O verbo 'visar', no sentido de ter como objetivo, exige obrigatoriamente a preposição 'a'.",a:true,e:"CERTO. Nesse sentido, 'visar' é transitivo indireto: 'Ele visa a um cargo melhor'. No sentido de mirar ou rubricar, é transitivo direto."},
{m:"Português",bloco:"G",tema:"Crase",dif:"media",s:"A crase é facultativa antes da maioria dos pronomes demonstrativos, como 'este' e 'isto'.",a:false,e:"ERRADO. A crase é proibida antes de pronomes demonstrativos que não admitem artigo (este, esse, isto, isso, aquilo). É facultativa antes de possessivos femininos."},
{m:"Português",bloco:"G",tema:"Concordância verbal",dif:"facil",s:"Na frase 'A maioria dos policiais aprovou a mudança', a concordância verbal está correta.",a:true,e:"CERTO. Com expressões partitivas (a maioria de, grande parte de), o verbo pode concordar com o núcleo ('maioria') ou com o adjunto ('policiais'), ambas corretas."},
{m:"Português",bloco:"G",tema:"Pontuação",dif:"media",s:"O uso de vírgula antes de 'e' é sempre proibido em orações coordenadas.",a:false,e:"ERRADO. A vírgula antes de 'e' é permitida quando os sujeitos das orações são diferentes ou para evitar ambiguidade."},
{m:"Português",bloco:"G",tema:"Interpretação textual",dif:"facil",s:"Um texto dissertativo-argumentativo tem como finalidade principal narrar uma sequência de fatos.",a:false,e:"ERRADO. O texto dissertativo-argumentativo visa defender um ponto de vista por meio de argumentos; narrar fatos é função do texto narrativo."},
{m:"Português",bloco:"G",tema:"Coesão textual",dif:"media",s:"Pronomes relativos como 'que' e 'o qual' funcionam como elementos de coesão referencial, retomando termos anteriores.",a:true,e:"CERTO. Pronomes relativos retomam um antecedente e evitam repetição, sendo mecanismos clássicos de coesão referencial."},
{m:"Português",bloco:"G",tema:"Ortografia",dif:"facil",s:"As palavras 'excesso' e 'obsessão' são grafadas corretamente com dois esses.",a:true,e:"CERTO. Ambas seguem a norma culta: 'excesso' e 'obsessão' têm 'ss' em sua grafia oficial."},
{m:"Português",bloco:"G",tema:"Colocação pronominal",dif:"dificil",s:"Em início de frase, a próclise (pronome antes do verbo) é a norma-padrão exigida pela gramática normativa.",a:false,e:"ERRADO. Em início de frase, a norma-padrão exige a ênclise (pronome depois do verbo), salvo em orações negativas, interrogativas ou com palavras atrativas antes do verbo."},
{m:"Português",bloco:"G",tema:"Semântica",dif:"media",s:"As palavras 'mas' e 'porém' podem ser usadas como sinônimas em contextos que exigem ideia de adversidade.",a:true,e:"CERTO. Ambas são conjunções adversativas e, na maioria dos contextos, podem ser substituídas uma pela outra sem alterar o sentido geral."},
{m:"Português",bloco:"G",tema:"Concordância nominal",dif:"media",s:"Na frase 'Seguem anexas as fotocópias dos documentos', a concordância nominal de 'anexas' está correta.",a:true,e:"CERTO. 'Anexo' é adjetivo variável e deve concordar em gênero e número com o substantivo a que se refere ('fotocópias', feminino plural)."},
{m:"Português",bloco:"G",tema:"Figuras de linguagem",dif:"facil",s:"A metáfora consiste em comparar dois elementos utilizando conectivo comparativo explícito, como 'como' ou 'tal qual'.",a:false,e:"ERRADO. Essa é a definição de comparação/símile. A metáfora ocorre sem conectivo, por transferência direta de sentido ('seus olhos são estrelas')."},
{m:"Português",bloco:"G",tema:"Regência nominal",dif:"dificil",s:"O adjetivo 'apto' rege a preposição 'para' ou 'a', ambas aceitas na norma culta.",a:true,e:"CERTO. 'Apto para' e 'apto a' são regências consagradas pela norma-padrão para indicar capacidade ou habilitação."},
{m:"Português",bloco:"G",tema:"Funções da linguagem",dif:"media",s:"Um texto de lei, por sua natureza objetiva e informativa, tem como função de linguagem predominante a função referencial (ou denotativa).",a:true,e:"CERTO. Textos normativos priorizam a transmissão objetiva de informação sobre a realidade, característica central da função referencial da linguagem."},
{m:"Português",bloco:"G",tema:"Sujeito",dif:"media",s:"Na frase 'Choveu muito na capital maranhense ontem', o sujeito é classificado como inexistente (oração sem sujeito).",a:true,e:"CERTO. Verbos que indicam fenômenos da natureza (chover, nevar, ventar), quando usados em sentido literal, são impessoais e formam orações sem sujeito."},
{m:"Português",bloco:"G",tema:"Vozes verbais",dif:"media",s:"Na frase 'O suspeito foi detido pelos policiais', tem-se um exemplo de voz passiva analítica.",a:true,e:"CERTO. A voz passiva analítica é formada por verbo auxiliar (ser/estar) + particípio, com o agente da ação introduzido por 'por' (agente da passiva)."},
{m:"Português",bloco:"G",tema:"Acentuação gráfica",dif:"facil",s:"As palavras 'polícia' e 'história' são acentuadas por serem paroxítonas terminadas em ditongo crescente.",a:false,e:"ERRADO. Ambas são proparoxítonas ('po-LÍ-ci-a' e 'his-TÓ-ri-a'), e toda palavra proparoxítona é acentuada, independentemente da terminação."},
{m:"Português",bloco:"G",tema:"Classes de palavras",dif:"facil",s:"Na frase 'Ele agiu rapidamente durante a ocorrência', a palavra 'rapidamente' classifica-se como advérbio de modo.",a:true,e:"CERTO. Advérbios terminados em '-mente' geralmente indicam modo, modificando o verbo e respondendo à pergunta 'como?'."},
{m:"Português",bloco:"G",tema:"Uso do 'porque/por que'",dif:"media",s:"Em perguntas diretas ou indiretas, deve-se usar a forma separada 'por que', e não 'porquê' ou 'porque'.",a:true,e:"CERTO. 'Por que' (separado, sem acento) é empregado em perguntas diretas e indiretas; 'porquê' é substantivo, e 'porque' introduz explicação/causa em respostas."},
{m:"Português",bloco:"G",tema:"Ambiguidade",dif:"dificil",s:"A frase 'O policial viu o suspeito com o binóculo' pode ser considerada ambígua, pois admite mais de uma interpretação quanto ao uso do binóculo.",a:true,e:"CERTO. A expressão 'com o binóculo' pode se referir ao instrumento usado pelo policial para ver ou a um objeto que estava com o suspeito, gerando dupla interpretação."},
{m:"Português",bloco:"G",tema:"Período composto",dif:"dificil",s:"Na frase 'Quando a viatura chegou, os suspeitos já haviam fugido', a oração 'Quando a viatura chegou' classifica-se como subordinada adverbial temporal.",a:true,e:"CERTO. A conjunção 'quando' introduz circunstância de tempo, caracterizando uma oração subordinada adverbial temporal."},

// ---- HISTÓRIA DO BRASIL (G) ----
{m:"História do Brasil",bloco:"G",tema:"Era Vargas",dif:"media",s:"O Estado Novo (1937-1945), governo de Getúlio Vargas, foi marcado por centralização do poder e supressão do Congresso Nacional.",a:true,e:"CERTO. Instaurado por golpe em 1937, o Estado Novo fechou o Congresso, extinguiu partidos políticos e concentrou poderes no Executivo."},
{m:"História do Brasil",bloco:"G",tema:"Independência",dif:"facil",s:"A independência do Brasil, em 1822, resultou em ruptura imediata e completa dos laços econômicos com Portugal.",a:false,e:"ERRADO. O Brasil manteve fortes vínculos econômicos e até indenizou Portugal (Tratado de 1825), além de preservar estruturas sociais e produtivas herdadas da Colônia."},
{m:"História do Brasil",bloco:"G",tema:"Ditadura Militar",dif:"media",s:"O AI-5, editado em 1968, suspendeu garantias constitucionais e fortaleceu os poderes do Executivo durante o regime militar.",a:true,e:"CERTO. O Ato Institucional nº 5 permitiu fechar o Congresso, cassar mandatos e suspender o habeas corpus para crimes políticos."},
{m:"História do Brasil",bloco:"G",tema:"República Velha",dif:"dificil",s:"A política do 'café com leite' consistia na alternância do poder presidencial entre representantes de São Paulo e Minas Gerais.",a:true,e:"CERTO. Durante a República Velha, paulistas (economia cafeeira) e mineiros (pecuária leiteira) revezavam-se na Presidência da República."},
{m:"História do Brasil",bloco:"G",tema:"Abolição",dif:"facil",s:"A Lei Áurea, de 1888, foi a primeira lei abolicionista promulgada no Brasil Imperial.",a:false,e:"ERRADO. Antes dela vieram a Lei Eusébio de Queirós (1850), a Lei do Ventre Livre (1871) e a Lei dos Sexagenários (1885)."},
{m:"História do Brasil",bloco:"G",tema:"Nova República",dif:"media",s:"A Constituição Federal de 1988 é conhecida como 'Constituição Cidadã' por ampliar direitos sociais e individuais após o fim do regime militar.",a:true,e:"CERTO. Promulgada em contexto de redemocratização, ampliou significativamente os direitos fundamentais, sociais e políticos."},
{m:"História do Brasil",bloco:"G",tema:"Período Colonial",dif:"media",s:"O sistema de capitanias hereditárias, adotado no início da colonização, concentrava a posse da terra nas mãos da Coroa, sem qualquer delegação a particulares.",a:false,e:"ERRADO. As capitanias hereditárias delegavam a administração e exploração das terras a donatários particulares, mantendo a Coroa apenas a soberania."},
{m:"História do Brasil",bloco:"G",tema:"Proclamação da República",dif:"media",s:"A Proclamação da República, em 1889, contou com ampla participação popular e resultou imediatamente na adoção do voto universal para todos os brasileiros.",a:false,e:"ERRADO. A Proclamação foi essencialmente um movimento militar, sem participação popular relevante; o voto permaneceu restrito, excluindo mulheres, analfabetos e outros grupos."},
{m:"História do Brasil",bloco:"G",tema:"Redemocratização",dif:"media",s:"As eleições diretas para presidente da República foram retomadas no Brasil em 1989, após mais de duas décadas sem esse tipo de pleito.",a:true,e:"CERTO. Após o regime militar (1964-1985) e a eleição indireta de Tancredo Neves em 1985, o voto direto para presidente só voltou a ocorrer em 1989, vencido por Fernando Collor."},
{m:"História do Brasil",bloco:"G",tema:"Revolução de 1930",dif:"dificil",s:"A Revolução de 1930 encerrou a chamada República Velha e marcou o início da chamada Era Vargas, com Getúlio Vargas assumindo o poder por meio de um movimento armado.",a:true,e:"CERTO. Vargas chegou ao poder após o movimento revolucionário de 1930, encerrando a hegemonia política das oligarquias cafeeiras da República Velha."},
{m:"História do Brasil",bloco:"G",tema:"Escravidão e trabalho",dif:"media",s:"A Lei do Ventre Livre (1871) libertou imediatamente todos os escravizados existentes no Brasil naquele momento.",a:false,e:"ERRADO. A Lei do Ventre Livre libertava apenas os filhos de mulheres escravizadas nascidos a partir de sua promulgação, mantendo escravizados os já existentes."},
{m:"História do Brasil",bloco:"G",tema:"Constituinte de 1987-88",dif:"dificil",s:"A Assembleia Nacional Constituinte que elaborou a Constituição de 1988 foi convocada exclusivamente para revisar pontualmente a Constituição de 1967, sem poderes para elaborar um novo texto integral.",a:false,e:"ERRADO. A Constituinte de 1987-88 tinha poder originário para elaborar uma Constituição inteiramente nova, o que de fato ocorreu, rompendo com a ordem constitucional anterior."},
{m:"História do Brasil",bloco:"G",tema:"Diretas Já",dif:"media",s:"O movimento 'Diretas Já', ocorrido em 1983-1984, reivindicava eleições diretas para presidente da República ainda durante o regime militar.",a:true,e:"CERTO. Foi um dos maiores movimentos populares da história do país, embora a emenda que previa eleições diretas tenha sido rejeitada pelo Congresso em 1984."},

// ---- HISTÓRIA DO MARANHÃO (G) ----
{m:"História do Maranhão",bloco:"G",tema:"Balaiada",dif:"media",s:"A Balaiada (1838-1841) foi um movimento popular maranhense que reuniu sertanejos, vaqueiros e escravizados.",a:true,e:"CERTO. Contou com lideranças como Raimundo Gomes, Manuel dos Anjos Ferreira (o 'Balaio') e o líder negro Cosme Bento das Chagas."},
{m:"História do Maranhão",bloco:"G",tema:"França Equinocial",dif:"facil",s:"A fundação de São Luís, em 1612, foi realizada por colonizadores franceses, sendo a única capital brasileira fundada por não portugueses.",a:true,e:"CERTO. Daniel de La Touche fundou o Forte de São Luís em 1612, batizando a cidade em homenagem a Luís XIII da França."},
{m:"História do Maranhão",bloco:"G",tema:"Economia colonial",dif:"media",s:"O Maranhão colonial teve sua economia baseada exclusivamente na cana-de-açúcar, sem relevância do algodão e do arroz.",a:false,e:"ERRADO. No século XVIII, com a Companhia de Comércio do Grão-Pará e Maranhão, o algodão e o arroz tornaram-se os principais produtos de exportação."},
{m:"História do Maranhão",bloco:"G",tema:"Companhia de Comércio",dif:"dificil",s:"A Companhia Geral de Comércio do Grão-Pará e Maranhão, criada no século XVIII, também foi responsável por intensificar o tráfico de escravizados africanos para a região.",a:true,e:"CERTO. Criada por Pombal em 1755, a companhia fomentou a agricultura e ampliou significativamente a introdução de mão de obra escravizada africana no Maranhão."},
{m:"História do Maranhão",bloco:"G",tema:"Adesão à Independência",dif:"media",s:"O Maranhão foi uma das primeiras províncias a aderir à Independência do Brasil, em 1822.",a:false,e:"ERRADO. O Maranhão só aderiu em 1823, sendo uma das últimas províncias, após forte resistência de setores ligados a Portugal."},
{m:"História do Maranhão",bloco:"G",tema:"Cultura maranhense",dif:"facil",s:"O bumba meu boi é uma manifestação cultural popular tradicionalmente associada ao Maranhão, com apresentações concentradas no período junino.",a:true,e:"CERTO. É uma das maiores manifestações culturais do estado, com diferentes sotaques (de zabumba, de matraca, de orquestra, etc.)."},
{m:"História do Maranhão",bloco:"G",tema:"Golpe de 1937",dif:"dificil",s:"Durante a Era Vargas, o Maranhão manteve-se totalmente isolado das políticas de centralização e intervenção federal aplicadas aos estados.",a:false,e:"ERRADO. Como os demais estados, o Maranhão teve interventores nomeados pelo governo federal durante o Estado Novo, perdendo autonomia política."},
{m:"História do Maranhão",bloco:"G",tema:"Ciclo do algodão",dif:"media",s:"O chamado 'ciclo do algodão' maranhense, no século XVIII, esteve diretamente relacionado ao aumento da demanda internacional durante períodos de crise na produção de outras regiões produtoras.",a:true,e:"CERTO. A Guerra de Independência dos EUA (1775-1783) reduziu a oferta americana de algodão, favorecendo a expansão da produção maranhense no mercado internacional."},
{m:"História do Maranhão",bloco:"G",tema:"Belle Époque maranhense",dif:"dificil",s:"O período de prosperidade econômica vivido por São Luís no final do século XIX, ligado à indústria têxtil, ficou conhecido como 'Belle Époque' maranhense.",a:true,e:"CERTO. Nesse período, a cidade viveu intensa urbanização e modernização arquitetônica, impulsionada pelo desenvolvimento das fábricas de tecidos locais."},
{m:"História do Maranhão",bloco:"G",tema:"Coronelismo",dif:"media",s:"O coronelismo, fenômeno político característico da República Velha, teve pouca expressão no interior do Maranhão, restringindo-se apenas à capital.",a:false,e:"ERRADO. O coronelismo foi um fenômeno marcante no interior maranhense, com forte domínio político e econômico de grandes proprietários de terra sobre a população local."},
{m:"História do Maranhão",bloco:"G",tema:"Formação territorial",dif:"dificil",s:"O Maranhão, durante o período colonial, chegou a integrar o Estado do Grão-Pará e Maranhão, administrativamente separado do restante do Brasil (Estado do Brasil).",a:true,e:"CERTO. Criado em 1621, o Estado do Maranhão (depois Grão-Pará e Maranhão) tinha administração autônoma, subordinada diretamente a Lisboa, e não ao governo-geral do Brasil."},
{m:"História do Maranhão",bloco:"G",tema:"Cosme Bento",dif:"dificil",s:"Cosme Bento das Chagas, líder negro que se destacou na Balaiada, chegou a ser proclamado 'imperador' pelos rebeldes durante o movimento.",a:true,e:"CERTO. Cosme foi aclamado 'imperador das Limitações' pelos balaios, liderando um contingente expressivo de escravizados fugidos durante a revolta."},
{m:"História do Maranhão",bloco:"G",tema:"Grão-Pará e Maranhão",dif:"media",s:"A Companhia de Comércio do Grão-Pará e Maranhão foi extinta ainda no período pombalino, antes mesmo do fim do governo de Marquês de Pombal.",a:false,e:"ERRADO. A companhia foi extinta apenas em 1778, alguns anos após a queda de Pombal do governo português, ocorrida em 1777."},

// ---- GEOGRAFIA DO BRASIL (G) ----
{m:"Geografia do Brasil",bloco:"G",tema:"Regiões",dif:"facil",s:"O Brasil é dividido oficialmente pelo IBGE em cinco grandes regiões: Norte, Nordeste, Centro-Oeste, Sudeste e Sul.",a:true,e:"CERTO. Essa é a divisão regional oficial adotada pelo IBGE desde 1970, com fins estatísticos e administrativos."},
{m:"Geografia do Brasil",bloco:"G",tema:"Clima",dif:"media",s:"O clima equatorial, predominante na Amazônia, caracteriza-se por baixa amplitude térmica e chuvas bem distribuídas ao longo do ano.",a:true,e:"CERTO. O clima equatorial apresenta temperaturas elevadas e constantes, com pouca variação térmica e precipitação abundante o ano todo."},
{m:"Geografia do Brasil",bloco:"G",tema:"Hidrografia",dif:"media",s:"A bacia hidrográfica Amazônica é a maior do mundo em volume de água, mas não é a maior em extensão territorial.",a:false,e:"ERRADO. A bacia Amazônica é a maior do mundo tanto em volume de água quanto em extensão territorial, cobrindo cerca de 40% do território brasileiro."},
{m:"Geografia do Brasil",bloco:"G",tema:"Relevo",dif:"dificil",s:"Segundo a classificação de Aziz Ab'Saber, o relevo brasileiro é predominantemente formado por planaltos e depressões, com pouca expressão de grandes cadeias montanhosas.",a:true,e:"CERTO. O Brasil possui relevo antigo e desgastado por erosão, sem grandes cadeias montanhosas modernas como os Andes, predominando planaltos e depressões."},
{m:"Geografia do Brasil",bloco:"G",tema:"Vegetação",dif:"facil",s:"O Cerrado é o segundo maior bioma brasileiro em extensão, superado apenas pela Amazônia.",a:true,e:"CERTO. O Cerrado ocupa cerca de 22% do território nacional, sendo o segundo maior bioma, atrás apenas da Floresta Amazônica."},
{m:"Geografia do Brasil",bloco:"G",tema:"População",dif:"media",s:"O processo de urbanização brasileira se intensificou principalmente a partir da segunda metade do século XX, com êxodo rural expressivo.",a:true,e:"CERTO. A partir de 1950, a industrialização acelerada atraiu grande contingente populacional do campo para as cidades, invertendo o padrão predominantemente rural."},
{m:"Geografia do Brasil",bloco:"G",tema:"Divisão política",dif:"facil",s:"O Brasil é uma república federativa composta por 26 estados, um Distrito Federal e milhares de municípios.",a:true,e:"CERTO. A organização político-administrativa brasileira compreende a União, 26 estados, o Distrito Federal e os municípios, conforme a Constituição Federal."},
{m:"Geografia do Brasil",bloco:"G",tema:"Biomas",dif:"media",s:"A Mata Atlântica é considerada um dos biomas mais devastados do Brasil, restando atualmente pequena fração de sua cobertura vegetal original.",a:true,e:"CERTO. Estima-se que restem menos de 15% da cobertura original da Mata Atlântica, um dos biomas mais ameaçados e com maior histórico de desmatamento do país."},
{m:"Geografia do Brasil",bloco:"G",tema:"Fusos horários",dif:"dificil",s:"O território brasileiro está dividido oficialmente em quatro fusos horários, incluindo o fuso que abrange o arquipélago de Fernando de Noronha.",a:true,e:"CERTO. O Brasil possui quatro fusos horários oficiais: um deles é o de Fernando de Noronha (UTC-2), adiantado em relação ao horário de Brasília."},
{m:"Geografia do Brasil",bloco:"G",tema:"Agropecuária",dif:"media",s:"O MATOPIBA é uma região de expansão da fronteira agrícola brasileira que engloba partes dos estados do Maranhão, Tocantins, Piauí e Bahia.",a:true,e:"CERTO. O nome é um acrônimo formado pelas iniciais dos quatro estados que compõem essa importante região de produção de grãos, sobretudo soja."},
{m:"Geografia do Brasil",bloco:"G",tema:"Urbanização",dif:"dificil",s:"As regiões metropolitanas brasileiras são criadas por lei complementar estadual, reunindo municípios limítrofes com o objetivo de organizar funções públicas de interesse comum.",a:true,e:"CERTO. Conforme a Constituição Federal, cabe aos estados, por lei complementar, instituir regiões metropolitanas, aglomerações urbanas e microrregiões."},
{m:"Geografia do Brasil",bloco:"G",tema:"Industrialização",dif:"media",s:"O processo de industrialização brasileiro historicamente concentrou-se, de forma predominante, na região Sudeste, especialmente em São Paulo.",a:true,e:"CERTO. Fatores como acúmulo de capital cafeeiro, infraestrutura e mão de obra fizeram de São Paulo o principal polo industrial do país desde o início do século XX."},
{m:"Geografia do Brasil",bloco:"G",tema:"Recursos hídricos",dif:"dificil",s:"O aquífero Guarani, um dos maiores reservatórios subterrâneos de água doce do mundo, está localizado exclusivamente em território brasileiro.",a:false,e:"ERRADO. O aquífero Guarani se estende também por território da Argentina, Paraguai e Uruguai, sendo, portanto, um recurso hídrico transfronteiriço."},
{m:"Geografia do Brasil",bloco:"G",tema:"Desigualdades regionais",dif:"media",s:"O Índice de Desenvolvimento Humano (IDH) apresenta, historicamente, disparidades regionais expressivas no Brasil, com maiores índices concentrados nas regiões Sul e Sudeste.",a:true,e:"CERTO. Indicadores socioeconômicos mostram que Sul e Sudeste concentram, em geral, os maiores IDHs do país, enquanto Norte e Nordeste apresentam índices mais baixos."},
{m:"Geografia do Brasil",bloco:"G",tema:"Litoral brasileiro",dif:"facil",s:"O litoral brasileiro se estende por mais de sete mil quilômetros de extensão, sendo um dos mais longos do mundo.",a:true,e:"CERTO. A costa brasileira possui cerca de 7.400 km em linha reta (e bem mais considerando recortes), configurando um dos litorais mais extensos do planeta."},

// ---- GEOGRAFIA DO MARANHÃO (G) ----
{m:"Geografia do Maranhão",bloco:"G",tema:"Lençóis Maranhenses",dif:"media",s:"O Parque Nacional dos Lençóis Maranhenses situa-se em uma zona de transição entre a Amazônia, o Cerrado e o ambiente costeiro.",a:true,e:"CERTO. A região apresenta características de transição entre esses domínios, o que explica sua biodiversidade peculiar."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Vegetação",dif:"facil",s:"A Mata dos Cocais, formação vegetal típica de transição, é uma das características marcantes da paisagem maranhense.",a:true,e:"CERTO. Composta principalmente por babaçuais e carnaubais, a Mata dos Cocais ocupa faixa de transição entre a Amazônia e o Nordeste semiárido."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Posição regional",dif:"media",s:"Embora integre oficialmente a região Nordeste, o Maranhão apresenta características físico-naturais que o aproximam da região Norte.",a:true,e:"CERTO. Clima equatorial/tropical úmido, vegetação de transição amazônica e a proximidade com o bioma amazônico aproximam o Maranhão do padrão físico da região Norte."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Hidrografia",dif:"dificil",s:"Os rios Mearim, Itapecuru e Pindaré são importantes bacias hidrográficas que drenam o território maranhense em direção ao litoral.",a:true,e:"CERTO. Esses três rios formam bacias hidrográficas relevantes para a economia e o abastecimento do estado, deságuando na Baía de São Marcos."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Economia",dif:"media",s:"A produção de soja no Maranhão está concentrada exclusivamente na região metropolitana de São Luís, sem expressão nas demais mesorregiões.",a:false,e:"ERRADO. A produção de soja concentra-se principalmente na região do Cerrado maranhense, em municípios do sul e leste do estado, integrantes do MATOPIBA."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Clima",dif:"facil",s:"O clima predominante no Maranhão é o tropical, com estações bem definidas de chuva e estiagem.",a:true,e:"CERTO. O estado apresenta clima tropical quente e úmido, com um período chuvoso (geralmente de janeiro a junho) e outro mais seco."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Divisão territorial",dif:"media",s:"O Maranhão é o estado brasileiro com a maior quantidade de municípios da região Nordeste.",a:true,e:"CERTO. O Maranhão possui 217 municípios, o maior número entre os estados nordestinos, refletindo um padrão de forte fragmentação territorial."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Ilha do Maranhão",dif:"facil",s:"São Luís está localizada em uma ilha, compartilhada também pelos municípios de São José de Ribamar, Paço do Lumiar e Raposa.",a:true,e:"CERTO. A Ilha do Maranhão (ou Ilha de Upaon-Açu) abriga esses quatro municípios, que formam a região metropolitana da capital."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Baixada Maranhense",dif:"dificil",s:"A Baixada Maranhense é uma área de planície sujeita a inundações sazonais, reconhecida internacionalmente como sítio Ramsar de importância para aves aquáticas.",a:true,e:"CERTO. A região é reconhecida pela Convenção de Ramsar como área úmida de importância internacional, especialmente relevante para a avifauna migratória."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Porto do Itaqui",dif:"media",s:"O Complexo Portuário do Itaqui, localizado em São Luís, é um dos principais portos do país, com destaque para o escoamento de minério de ferro e grãos.",a:true,e:"CERTO. O Porto do Itaqui é estratégico para a exportação de commodities do MATOPIBA e minério proveniente do Corredor Norte, ligado à Estrada de Ferro Carajás."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Relevo maranhense",dif:"dificil",s:"O relevo do Maranhão é predominantemente montanhoso, com altitudes médias superiores a 1.500 metros em quase todo o território.",a:false,e:"ERRADO. O relevo maranhense é majoritariamente de baixas altitudes, formado por planícies e planaltos suavemente ondulados, sem grandes elevações."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Energia",dif:"media",s:"O Maranhão vem se destacando na produção de energia eólica, sobretudo na faixa litorânea do estado, favorecida pelos ventos constantes.",a:true,e:"CERTO. Municípios do litoral maranhense, como os da região dos Lençóis, têm atraído parques eólicos devido ao regime de ventos favorável."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Divisão regional",dif:"dificil",s:"O Maranhão é dividido oficialmente pelo IBGE em mesorregiões, entre elas o Norte Maranhense, o Leste Maranhense, o Centro Maranhense, o Oeste Maranhense e o Sul Maranhense.",a:true,e:"CERTO. Essas são as cinco mesorregiões geográficas em que o IBGE tradicionalmente divide o estado do Maranhão para fins estatísticos."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Extrativismo",dif:"media",s:"O babaçu é uma palmeira nativa de grande importância econômica e social no Maranhão, sendo utilizado na produção de óleo, carvão e outros derivados.",a:true,e:"CERTO. O Maranhão é o maior produtor nacional de babaçu, cujo extrativismo envolve tradicionalmente as chamadas 'quebradeiras de coco babaçu'."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Hidrografia",dif:"media",s:"A Baía de São Marcos, onde se localiza o porto de São Luís, é considerada uma das mais profundas do mundo, permitindo a atracação de grandes navios.",a:true,e:"CERTO. A grande profundidade natural da Baía de São Marcos é um diferencial estratégico que favorece a operação de navios de grande porte no Porto do Itaqui."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Corredor Carajás",dif:"dificil",s:"A Estrada de Ferro Carajás liga a Serra dos Carajás, no Pará, ao Porto do Itaqui, no Maranhão, sendo essencial para o escoamento do minério de ferro extraído na região.",a:true,e:"CERTO. Com cerca de 900 km, essa ferrovia é uma das principais responsáveis pelo transporte de minério de ferro entre o Pará e o litoral maranhense."},

// ---- RACIOCÍNIO LÓGICO-MATEMÁTICO (G) ----
{m:"Raciocínio Lógico",bloco:"G",tema:"Proposições",dif:"facil",s:"Uma proposição lógica é toda sentença declarativa que pode ser classificada, sem ambiguidade, como verdadeira ou falsa.",a:true,e:"CERTO. É a definição clássica de proposição: sentença afirmativa à qual se pode atribuir exatamente um valor lógico (V ou F)."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Proposições",dif:"facil",s:"A frase 'Que dia lindo!' constitui uma proposição lógica, pois exprime uma ideia completa.",a:false,e:"ERRADO. Frases exclamativas, interrogativas ou imperativas não são proposições, pois não podem ser julgadas como verdadeiras ou falsas."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Conectivos",dif:"media",s:"Na lógica proposicional, o conectivo 'e' (conjunção) resulta em uma proposição composta verdadeira somente quando todas as proposições simples envolvidas forem verdadeiras.",a:true,e:"CERTO. A conjunção (∄1�7) só é verdadeira quando todos os seus termos são verdadeiros; basta um ser falso para que o todo seja falso."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Conectivos",dif:"media",s:"Na disjunção inclusiva ('ou'), a proposição composta é falsa apenas quando ambas as proposições simples envolvidas são falsas.",a:true,e:"CERTO. A disjunção inclusiva (∄1�7) só é falsa quando todos os termos são falsos; basta um ser verdadeiro para o todo ser verdadeiro."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Condicional",dif:"dificil",s:"Na proposição condicional 'se P, então Q', o único caso em que o valor lógico é falso ocorre quando P é verdadeira e Q é falsa.",a:true,e:"CERTO. O condicional (P→Q) só é falso na combinação V-F; nas demais combinações (V-V, F-V, F-F) ele é verdadeiro."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Bicondicional",dif:"dificil",s:"A proposição bicondicional 'P se, e somente se, Q' é verdadeira sempre que P e Q possuem o mesmo valor lógico, sejam ambas verdadeiras ou ambas falsas.",a:true,e:"CERTO. O bicondicional (P↔Q) é verdadeiro quando P e Q têm valores iguais (V-V ou F-F) e falso quando têm valores diferentes."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Negação",dif:"media",s:"A negação de uma proposição verdadeira é sempre falsa, e a negação de uma proposição falsa é sempre verdadeira.",a:true,e:"CERTO. Esse é o princípio básico da negação lógica: ela inverte o valor lógico da proposição original."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Leis de De Morgan",dif:"dificil",s:"Segundo as Leis de De Morgan, a negação de 'P e Q' equivale a 'não P ou não Q'.",a:true,e:"CERTO. A primeira Lei de De Morgan estabelece: ¬(P∧Q) ≄1�7 (¬P∨¬Q)."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Leis de De Morgan",dif:"dificil",s:"Segundo as Leis de De Morgan, a negação de 'P ou Q' equivale a 'não P e não Q'.",a:true,e:"CERTO. A segunda Lei de De Morgan estabelece: ¬(P∨Q) ≄1�7 (¬P∧¬Q)."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Tabela-verdade",dif:"media",s:"Uma tabela-verdade com duas proposições simples distintas possui, ao todo, quatro combinações possíveis de valores lógicos.",a:true,e:"CERTO. Com n proposições simples, o número de linhas da tabela-verdade é 2⁄1�7; para duas proposições, 2²=4 combinações."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Equivalências",dif:"dificil",s:"A proposição condicional 'se P, então Q' é logicamente equivalente à sua contrapositiva 'se não Q, então não P'.",a:true,e:"CERTO. P→Q e ¬Q→¬P possuem exatamente a mesma tabela-verdade, sendo, portanto, logicamente equivalentes."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Equivalências",dif:"dificil",s:"A proposição condicional 'se P, então Q' é logicamente equivalente a 'não P ou Q'.",a:true,e:"CERTO. P→Q equivale a ¬P∨Q, uma das equivalências mais cobradas em provas de raciocínio lógico."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Argumentação",dif:"dificil",s:"Um argumento é considerado válido quando, sendo todas as premissas verdadeiras, a conclusão é necessariamente verdadeira.",a:true,e:"CERTO. A validade de um argumento está ligada à sua estrutura lógica: premissas verdadeiras devem garantir conclusão verdadeira."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Negação de quantificadores",dif:"dificil",s:"A negação da proposição 'Todo policial militar é corajoso' é 'Nenhum policial militar é corajoso'.",a:false,e:"ERRADO. A negação correta é 'Existe (pelo menos um) policial militar que não é corajoso'; negar 'todo' resulta em 'existe um que não', e não em 'nenhum'."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Negação de quantificadores",dif:"media",s:"A negação da proposição 'Algum candidato foi aprovado' é 'Nenhum candidato foi aprovado'.",a:true,e:"CERTO. A negação de 'algum' (existencial) é 'nenhum', pois nega a existência de ao menos um elemento com a propriedade."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Diagramas lógicos",dif:"media",s:"Em diagramas lógicos (conjuntos), a proposição 'Todo A é B' é representada por um círculo A totalmente contido dentro do círculo B.",a:true,e:"CERTO. A representação padrão de proposições universais afirmativas em diagramas de Euler-Venn mostra o conjunto A inteiramente contido em B."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Sentenças abertas",dif:"media",s:"Uma sentença aberta, como 'x + 2 = 5', não é considerada uma proposição lógica enquanto a variável x não for especificada.",a:true,e:"CERTO. Sentenças abertas dependem de uma variável não determinada e só se tornam proposições (julgáveis como V ou F) após a substituição da variável por um valor."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Número de conectivos",dif:"dificil",s:"Uma proposição composta por três proposições simples ligadas apenas pelo conectivo 'e' é verdadeira se, e somente se, as três proposições simples forem verdadeiras.",a:true,e:"CERTO. A conjunção de múltiplos termos só é verdadeira quando absolutamente todos os termos envolvidos forem verdadeiros."},

// ---- LEGISLAÇÃO PMMA / GERAIS (G) ----
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"Constituição Federal",dif:"media",s:"Conforme a Constituição Federal, as polícias militares são consideradas forças auxiliares e reserva do Exército Brasileiro.",a:true,e:"CERTO. O art. 144, §6º, da CF/88 estabelece essa condição para as polícias militares e corpos de bombeiros militares dos estados."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"Segurança pública",dif:"facil",s:"A segurança pública, segundo a Constituição Federal, é dever exclusivo do Estado, não cabendo qualquer responsabilidade aos cidadãos.",a:false,e:"ERRADO. O art. 144 da CF estabelece que a segurança pública é dever do Estado, direito e responsabilidade de todos, exercida para a preservação da ordem pública."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"Hierarquia e disciplina",dif:"media",s:"A hierarquia e a disciplina são princípios basilares que estruturam a organização das Polícias Militares dos estados.",a:true,e:"CERTO. Assim como nas Forças Armadas, a hierarquia e a disciplina constituem a base institucional das corporações militares estaduais."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"Direitos fundamentais",dif:"dificil",s:"O direito à vida, previsto no art. 5º da Constituição Federal, admite exceções apenas em caso de guerra declarada, conforme dispositivo constitucional específico.",a:true,e:"CERTO. O art. 5º, XLVII, 'a', da CF veda a pena de morte, salvo em caso de guerra declarada nos termos do art. 84, XIX."},

// ---- LEGISLAÇÃO INSTITUCIONAL (E) ----
// Bloco A: baseado no Estatuto dos Policiais Militares do Maranhão (itens inspirados na prova real Cebraspe PM/MA 2017, reescritos - não são cópia literal)
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - hierarquia",dif:"media",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"Posto e graduação, na Polícia Militar do Maranhão, são graus hierárquicos conferidos por ato do comandante-geral, sendo os postos de oficiais confirmados por carta patente.",a:true,e:"CERTO. O posto do oficial é conferido por ato do comandante-geral e confirmado por carta patente assinada pelo governador; a graduação da praça também decorre de ato do comando."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - antiguidade",dif:"dificil",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"Situação hipotética: dois soldados são promovidos a cabo na mesma data após cursos de formação distintos; um deles obteve a última colocação em seu curso, concluído antes do curso do outro. Assertiva: nesse caso, o critério de antiguidade favorece quem concluiu o curso de formação primeiro, independentemente da colocação obtida nele.",a:true,e:"CERTO. Entre praças promovidas na mesma data, a antiguidade é definida, entre outros critérios, pela data de conclusão do curso de habilitação; quem se formou antes tem precedência sobre quem se formou depois, mesmo com colocação melhor no curso posterior."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - praças especiais",dif:"facil",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"Aspirantes a oficial são classificados como praças especiais e têm precedência sobre as demais praças da corporação.",a:true,e:"CERTO. O aspirante a oficial é praça especial, situado hierarquicamente acima das demais praças (subtenentes, sargentos, cabos e soldados)."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - ingresso",dif:"dificil",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"A simples aprovação em concurso público é condição única e suficiente para que um cidadão ingresse diretamente na graduação de terceiro-sargento da PMMA.",a:false,e:"ERRADO. Além da aprovação em concurso, exige-se a conclusão do respectivo curso de formação (de sargentos), entre outros requisitos previstos em lei e regulamento."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - deveres",dif:"media",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"Ao ingressar na Polícia Militar, o cidadão deve prestar compromisso de honra em ato solene perante a tropa, aceitando conscientemente as obrigações e os deveres do policial militar.",a:true,e:"CERTO. O compromisso solene marca a incorporação e formaliza a aceitação consciente dos deveres e obrigações do cargo."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - responsabilidade",dif:"dificil",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"Quando uma mesma conduta configura, simultaneamente, crime militar e transgressão disciplinar, o policial militar pode ser punido cumulativamente nas duas esferas.",a:true,e:"CERTO. As responsabilidades penal militar e disciplinar são independentes; a mesma conduta pode gerar, ao mesmo tempo, processo criminal e punição disciplinar."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - reserva remunerada",dif:"media",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"As praças da reserva remunerada da PMMA permanecem sujeitas a conselho de disciplina, ainda que não estejam no serviço ativo.",a:true,e:"CERTO. A sujeição a conselho de disciplina alcança também militares da reserva remunerada, nos termos do Estatuto, e não apenas os da ativa."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - promoção irregular",dif:"dificil",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"Uma promoção concedida em desacordo com a legislação pode ser convalidada, enquadrando-se o policial militar como último na ordem de precedência do novo posto ou graduação, até que reúna as condições legais.",a:true,e:"CERTO. Nessa hipótese o Estatuto admite o aproveitamento do ato, com o militar posicionado como o mais moderno do novo grau, regularizando a situação sem anular a promoção."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - fardamento",dif:"media",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"Apenas cadetes, cabos e soldados fazem jus ao uso do fardamento da Polícia Militar do Maranhão.",a:false,e:"ERRADO. O direito ao fardamento se estende a todos os policiais militares da ativa, conforme seu posto ou graduação, e não somente às praças mais modernas."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - candidatura eletiva",dif:"dificil",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"O policial militar com mais de cinco anos de serviço que pretenda concorrer a cargo eletivo deve ser agregado pela autoridade competente e, se eleito, passa automaticamente para a inatividade no ato da diplomação.",a:true,e:"CERTO. Esse é o regime tradicional aplicável a militares com maior tempo de serviço: agregação durante a candidatura e passagem para a reserva remunerada em caso de eleição."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - agregação",dif:"media",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"Enquanto estiver agregado, o policial militar não ocupa vaga na escala hierárquica do seu quadro nem pode ser promovido.",a:true,e:"CERTO. A agregação retira o militar da contagem de vagas do quadro, e ele permanece sem concorrer a promoções enquanto durar essa situação."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - deserção",dif:"media",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"A praça que se torna desertora, com ou sem estabilidade, é automaticamente excluída do serviço ativo assim que essa condição é declarada.",a:true,e:"CERTO. A declaração oficial de deserção implica, por si, a exclusão da praça do serviço ativo, independentemente de ela possuir estabilidade."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - exclusão disciplinar",dif:"dificil",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"A praça excluída a bem da disciplina tem direito a indenização correspondente ao tempo de serviço que prestou até a exclusão.",a:false,e:"ERRADO. A exclusão a bem da disciplina é penalidade decorrente de grave transgressão; ela não gera, por si só, direito à indenização pelo tempo de serviço."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - licenças",dif:"media",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"O gozo de licença-prêmio pelo policial militar impede que ele obtenha, no mesmo período, licença para tratamento de saúde de pessoa da família.",a:false,e:"ERRADO. Trata-se de licenças com finalidades distintas; o gozo de uma não anula, por si, o direito à outra caso sobrevenha a necessidade de tratamento de saúde de familiar."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - direitos eleitorais",dif:"facil",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"Todos os policiais militares da ativa são alistáveis como eleitores, podendo votar normalmente nas eleições.",a:true,e:"CERTO. O militar é alistável (pode ser eleitor); a restrição constitucional recai sobre a elegibilidade, não sobre o direito de alistamento e voto."},

// Bloco B: itens adicionais sobre situação, direitos, deveres e disciplina do policial militar (conteúdo padrão de estatutos de PMs estaduais)
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - situações do militar",dif:"media",fonte:"Questão inédita, estilo Cebraspe, sobre o Estatuto dos Policiais Militares do MA",s:"O policial militar pode encontrar-se, entre outras, nas situações de atividade, agregação, inatividade (reserva remunerada ou reforma), conforme dispuser a legislação estatutária.",a:true,e:"CERTO. Os estatutos de policiais militares, de modo geral, preveem essas situações funcionais básicas para classificar a condição do militar perante a corporação."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - categoria especial de servidor",dif:"facil",fonte:"Questão inédita, estilo Cebraspe, sobre o Estatuto dos Policiais Militares do MA",s:"O policial militar do Maranhão é considerado, para efeitos estatutários, uma categoria especial de servidor público estadual, distinta do servidor público civil.",a:true,e:"CERTO. Os estatutos de PMs, seguindo o padrão nacional, classificam o policial militar como categoria especial de servidor público, sujeita a regime jurídico próprio (militar estadual), diverso do regime dos servidores civis."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - valores éticos",dif:"media",fonte:"Questão inédita, estilo Cebraspe, sobre o Estatuto dos Policiais Militares do MA",s:"Entre os valores éticos e deveres do policial militar previstos no Estatuto estão o culto à verdade, o pundonor militar, o decoro de classe e a disciplina consciente.",a:true,e:"CERTO. Esses são valores tradicionalmente consagrados nos estatutos e regulamentos disciplinares das corporações militares como base da conduta do militar."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - punição disciplinar e recurso",dif:"dificil",fonte:"Questão inédita, estilo Cebraspe, sobre o Estatuto dos Policiais Militares do MA",s:"A aplicação de punição disciplinar a policial militar deve observar o direito à ampla defesa e ao contraditório, cabendo recurso à autoridade competente nos prazos e formas previstos na legislação estatutária e regulamentar.",a:true,e:"CERTO. Mesmo em processos administrativos disciplinares militares, são assegurados ampla defesa e contraditório, com possibilidade de recurso hierárquico contra a decisão punitiva."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - inatividade",dif:"dificil",fonte:"Questão inédita, estilo Cebraspe, sobre o Estatuto dos Policiais Militares do MA",s:"A reforma, diferentemente da reserva remunerada, corresponde à situação de inatividade decorrente, em regra, de incapacidade física definitiva do policial militar para o serviço ativo.",a:true,e:"CERTO. A reforma é, em geral, associada à incapacidade definitiva (por invalidez, doença ou acidente em serviço), enquanto a reserva remunerada decorre normalmente de tempo de serviço ou outros critérios legais."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - readaptação",dif:"dificil",fonte:"Questão inédita, estilo Cebraspe, sobre o Estatuto dos Policiais Militares do MA",s:"O policial militar considerado parcialmente incapaz para as atividades operacionais pode, conforme previsto em legislação estatutária, ser readaptado para funções compatíveis com sua limitação, permanecendo na ativa.",a:true,e:"CERTO. A readaptação funcional é instrumento previsto nos estatutos militares para aproveitar o militar com incapacidade parcial em atividades administrativas ou técnicas compatíveis, sem afastá-lo da ativa."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - promoção post mortem",dif:"media",fonte:"Questão inédita, estilo Cebraspe, sobre o Estatuto dos Policiais Militares do MA",s:"A promoção post mortem pode ser concedida ao policial militar falecido em razão de ato de bravura ou em circunstâncias que a legislação considere excepcionais, mesmo sem preencher todos os requisitos ordinários de promoção.",a:true,e:"CERTO. A promoção post mortem é modalidade excepcional prevista para reconhecer o mérito do militar falecido em serviço, especialmente em atos de bravura, dispensando alguns requisitos ordinários."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - transferência para reserva a pedido",dif:"media",fonte:"Questão inédita, estilo Cebraspe, sobre o Estatuto dos Policiais Militares do MA",s:"O policial militar pode requerer, a seu pedido, transferência para a reserva remunerada, desde que atendidos os requisitos de tempo de serviço estabelecidos na legislação estatutária.",a:true,e:"CERTO. A transferência para a reserva a pedido do próprio militar é direito assegurado quando cumpridos os requisitos de tempo de contribuição/serviço previstos em lei."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - vitaliciedade do posto",dif:"dificil",fonte:"Questão inédita, estilo Cebraspe, sobre o Estatuto dos Policiais Militares do MA",s:"O oficial da Polícia Militar perde o posto e a patente somente por meio de decisão de tribunal competente, em processo específico, e não por simples ato administrativo do comandante-geral.",a:true,e:"CERTO. Assim como ocorre com oficiais das Forças Armadas, a perda de posto e patente de oficial da PM depende de decisão judicial (Tribunal de Justiça Militar ou órgão competente), não bastando ato administrativo interno."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - uso de uniforme fora de serviço",dif:"media",fonte:"Questão inédita, estilo Cebraspe, sobre o Estatuto dos Policiais Militares do MA",s:"O uso indevido do uniforme da Polícia Militar por pessoa não pertencente à corporação, ou de forma a comprometer o decoro da instituição, pode caracterizar infração a ser apurada nos termos da legislação aplicável.",a:true,e:"CERTO. A farda é elemento de identificação institucional protegido por lei; seu uso indevido ou por pessoa estranha à corporação pode configurar infração administrativa e, a depender do caso, ilícito penal."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - conselho de justificação",dif:"dificil",fonte:"Questão inédita, estilo Cebraspe, sobre o Estatuto dos Policiais Militares do MA",s:"O conselho de justificação é o instrumento processual destinado a apurar se o oficial deve ou não ser julgado incapaz de permanecer na ativa, por incapacidade moral ou profissional, assegurados ampla defesa e contraditório.",a:true,e:"CERTO. O conselho de justificação é o rito específico aplicável a oficiais para apurar incapacidade moral, profissional ou de conduta, com garantias processuais equivalentes às do conselho de disciplina para praças."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - conselho de disciplina",dif:"media",fonte:"Questão inédita, estilo Cebraspe, sobre o Estatuto dos Policiais Militares do MA",s:"O conselho de disciplina é o instrumento processual aplicável às praças (e não a oficiais) para apurar fatos que possam ensejar sua exclusão da corporação por incapacidade de permanecer na ativa.",a:true,e:"CERTO. Diferentemente do conselho de justificação (destinado a oficiais), o conselho de disciplina é o rito aplicável às praças (subtenentes, sargentos, cabos e soldados) em situação equivalente."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - dependentes",dif:"media",fonte:"Questão inédita, estilo Cebraspe, sobre o Estatuto dos Policiais Militares do MA",s:"O Estatuto dos Policiais Militares reconhece determinados direitos e assistência a dependentes do militar, como cônjuge, companheiro(a) e filhos, nos termos e limites previstos em lei.",a:true,e:"CERTO. Assim como em outros estatutos militares, são previstos direitos assistenciais (saúde, pensão, entre outros) extensíveis aos dependentes legalmente reconhecidos do policial militar."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - transferência de corporação",dif:"dificil",fonte:"Questão inédita, estilo Cebraspe, sobre o Estatuto dos Policiais Militares do MA",s:"A transferência de policial militar de uma corporação estadual para outra ocorre de forma automática, mediante simples requerimento do interessado, independentemente de anuência dos comandos envolvidos.",a:false,e:"ERRADO. A transferência entre corporações de diferentes estados, quando admitida, depende de anuência dos comandos-gerais envolvidos e de atendimento a requisitos legais e regulamentares específicos, não sendo automática."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - hierarquia entre postos e graduações",dif:"facil",fonte:"Questão inédita, estilo Cebraspe, sobre o Estatuto dos Policiais Militares do MA",s:"Na hierarquia das praças da Polícia Militar, o subtenente ocupa posição hierárquica superior à do primeiro-sargento, que por sua vez é superior à do segundo-sargento.",a:true,e:"CERTO. A ordem hierárquica decrescente das praças, do topo para a base, é: subtenente, 1º sargento, 2º sargento, 3º sargento, cabo e soldado."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - continência",dif:"media",fonte:"Questão inédita, estilo Cebraspe, sobre o Estatuto dos Policiais Militares do MA",s:"A continência é o ato mediante o qual o militar mais moderno demonstra respeito e reconhecimento à precedência hierárquica do mais antigo, conforme normas de cerimonial militar.",a:true,e:"CERTO. A continência é a manifestação formal de respeito e disciplina hierárquica entre militares, regulada por normas de cerimonial e conduta militar."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - princípio da hierarquia",dif:"facil",fonte:"Questão inédita, estilo Cebraspe, sobre o Estatuto dos Policiais Militares do MA",s:"A hierarquia militar caracteriza-se pela ordenação da autoridade em níveis diferentes, resultando em situação de subordinação do posto ou graduação inferior perante o superior.",a:true,e:"CERTO. É a essência do princípio da hierarquia, que ordena a autoridade dentro da corporação, estabelecendo relações de subordinação entre os diferentes níveis hierárquicos."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - disciplina militar",dif:"media",fonte:"Questão inédita, estilo Cebraspe, sobre o Estatuto dos Policiais Militares do MA",s:"A disciplina militar manifesta-se, entre outros aspectos, pela pronta obediência a ordens legais dos superiores hierárquicos e pela dedicação integral ao serviço, mesmo com sacrifício da própria segurança.",a:true,e:"CERTO. A disciplina militar pressupõe, tradicionalmente, obediência às ordens legais e dedicação ao serviço, valores estruturantes da atividade policial-militar."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - competência para punição",dif:"dificil",fonte:"Questão inédita, estilo Cebraspe, sobre o Estatuto dos Policiais Militares do MA",s:"A competência para aplicar punições disciplinares a um policial militar é, em regra, escalonada conforme o posto/graduação do infrator e a gravidade da transgressão, cabendo às autoridades de maior nível hierárquico a aplicação das punições mais severas.",a:true,e:"CERTO. Regulamentos disciplinares militares, de modo geral, escalonam a competência punitiva conforme a hierarquia da autoridade e a gravidade da transgressão cometida."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - direitos e vantagens",dif:"media",fonte:"Questão inédita, estilo Cebraspe, sobre o Estatuto dos Policiais Militares do MA",s:"Entre os direitos assegurados ao policial militar previstos em legislação estatutária estão a remuneração, o soldo, as gratificações e adicionais previstos em lei, além de assistência à saúde.",a:true,e:"CERTO. Esses são direitos tipicamente previstos nos estatutos de militares estaduais, assegurando remuneração e assistência compatíveis com a atividade policial-militar."},

// Bloco B: Lei Orgânica Nacional das PMs (Lei nº 14.751/2023) - texto legal é de domínio público
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"LOB Nacional - natureza jurídica",dif:"media",fonte:"Lei nº 14.751/2023, art. 2º",s:"Segundo a Lei Orgânica Nacional das Polícias Militares (Lei nº 14.751/2023), as PMs são instituições militares permanentes, organizadas com base na hierarquia e disciplina e comandadas por oficial da ativa do último posto, integrante do Quadro de Oficiais de Estado-Maior.",a:true,e:"CERTO. É exatamente o que dispõe o art. 2º da Lei nº 14.751/2023, que também as define como forças auxiliares e reserva do Exército."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"LOB Nacional - princípios",dif:"media",fonte:"Lei nº 14.751/2023, art. 3º",s:"Entre os princípios básicos que a Lei Orgânica Nacional impõe às polícias militares estão a legalidade, a impessoalidade, a moralidade, a eficiência e a razoabilidade e proporcionalidade.",a:true,e:"CERTO. O art. 3º da Lei nº 14.751/2023 lista, entre outros, hierarquia, disciplina, legalidade, impessoalidade, moralidade, eficiência, efetividade e razoabilidade/proporcionalidade."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"LOB Nacional - hierarquia",dif:"dificil",fonte:"Lei nº 14.751/2023, art. 12",s:"Na estrutura hierárquica prevista pela Lei Orgânica Nacional, o aspirante a oficial e o cadete são classificados como praças especiais, situando-se entre os oficiais e as demais praças.",a:true,e:"CERTO. O art. 12 estabelece três grupos: oficiais, praças especiais (aspirante a oficial, cadete, aluno-oficial) e praças (do subtenente ao aluno-soldado)."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"LOB Nacional - condições de ingresso",dif:"dificil",fonte:"Lei nº 14.751/2023, art. 13",s:"Entre as condições básicas de ingresso nas polícias militares previstas na Lei Orgânica Nacional está a aprovação em exame de saúde e em exame toxicológico com larga janela de detecção.",a:true,e:"CERTO. O art. 13, VIII, exige exatamente essa aprovação como condição de ingresso, além de requisitos como nacionalidade brasileira e aprovação em concurso público."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"LOB Nacional - progressão na carreira",dif:"media",fonte:"Lei nº 14.751/2023, art. 14",s:"A progressão do militar estadual na hierarquia, segundo a Lei Orgânica Nacional, deve ocorrer exclusivamente pelo critério de antiguidade, sendo vedado o critério de merecimento.",a:false,e:"ERRADO. O art. 14 prevê que as promoções ocorrem pelos critérios de antiguidade E merecimento (este com parâmetros objetivos), além de admitir promoção por bravura e post mortem."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"LOB Nacional - garantias",dif:"dificil",fonte:"Lei nº 14.751/2023, art. 18",s:"Entre as garantias asseguradas aos militares estaduais pela Lei Orgânica Nacional está a estabilidade de carreira após três anos de efetivo serviço na corporação.",a:true,e:"CERTO. O art. 18, XXVI, prevê a estabilidade dos militares de carreira após 3 (três) anos de efetivo serviço."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"LOB Nacional - candidatura eletiva",dif:"dificil",fonte:"Lei nº 14.751/2023, art. 22",s:"Segundo a Lei Orgânica Nacional, o militar com mais de dez anos de serviço que se candidate a cargo eletivo é agregado com remuneração durante o pleito e, se eleito, passa para a reserva remunerada no ato da diplomação.",a:true,e:"CERTO. O art. 22, II, estabelece exatamente essa regra para militares com mais de dez anos de serviço."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"LOB Nacional - comandante-geral",dif:"media",fonte:"Lei nº 14.751/2023, art. 29",s:"O comandante-geral da Polícia Militar é nomeado por ato do governador entre os oficiais da ativa do último posto, devendo apresentar plano de comando em até 60 dias da posse.",a:true,e:"CERTO. O art. 29 e seu §2º preveem exatamente essa nomeação e o prazo de 60 dias para apresentação do plano de comando com metas e indicadores."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"LOB Nacional - denominações",dif:"media",fonte:"Lei nº 14.751/2023, art. 35",s:"A Lei Orgânica Nacional instituiu o dia 21 de abril como data comemorativa nacional das polícias militares e o dia 2 de julho como data comemorativa dos corpos de bombeiros militares.",a:true,e:"CERTO. O art. 35, §1º, institui essas duas datas comemorativas nacionais, facultando ainda datas comemorativas estaduais próprias de cada corporação."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"LOB Nacional - revogação do DL 667/69",dif:"media",fonte:"Lei nº 14.751/2023",s:"A Lei nº 14.751/2023 revogou integralmente o Decreto-Lei nº 667/1969, que deixou de ter qualquer eficácia jurídica após a nova lei.",a:false,e:"ERRADO. A Lei nº 14.751/2023 revogou apenas dispositivos específicos do Decreto-Lei nº 667/1969 (como os arts. 1º, 2º e 4º a 17), não o diploma por inteiro."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"LOB Nacional - uso da força",dif:"media",fonte:"Lei nº 14.751/2023, art. 4º",s:"Entre as diretrizes da Lei Orgânica Nacional está o uso racional da força e o uso progressivo dos meios pelos policiais militares.",a:true,e:"CERTO. O art. 4º, XIV, prevê expressamente o 'uso racional da força e uso progressivo dos meios' como diretriz institucional."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"LOB Nacional - Susp",dif:"dificil",fonte:"Lei nº 14.751/2023, art. 2º, §3º",s:"As polícias militares estaduais, segundo a Lei Orgânica Nacional, integram apenas o Sistema Único de Segurança Pública (Susp), não se vinculando a outros sistemas nacionais.",a:false,e:"ERRADO. O art. 2º, §3º, V, prevê que as PMs integram também a Defesa Nacional, o Sistema Nacional de Proteção e Defesa Civil e o Sistema Nacional do Meio Ambiente, além do Susp."},

// Bloco D: Decreto nº 88.777/1983 (R-200) - Regulamento para as Polícias Militares e Corpos de Bombeiros Militares
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"R-200 - forças auxiliares",dif:"media",fonte:"Decreto nº 88.777/1983 (R-200), art. 44",s:"Segundo o Regulamento para as Polícias Militares e Corpos de Bombeiros Militares (R-200), para que um Corpo de Bombeiros tenha a condição de 'militar' e seja considerado força auxiliar e reserva do Exército, ele deve, entre outras condições, estar estruturado à base da hierarquia e da disciplina militar e sujeitar-se ao Código Penal Militar.",a:true,e:"CERTO. O art. 44 do R-200 exige, entre outras condições, estrutura baseada em hierarquia e disciplina militares e sujeição ao Código Penal Militar para que um Corpo de Bombeiros seja reconhecido como força militar auxiliar."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"R-200 - hierarquia militar",dif:"media",fonte:"Decreto nº 88.777/1983 (R-200), art. 2º",s:"De acordo com o R-200, hierarquia militar é a ordenação da autoridade em níveis diferentes dentro da estrutura das Forças Armadas e Forças Auxiliares, sendo a escala hierárquica a fixação ordenada dos postos e graduações existentes nas Polícias Militares.",a:true,e:"CERTO. Essas são exatamente as definições de 'Hierarquia Militar' e 'Escala Hierárquica' constantes do rol de conceitos do art. 2º do R-200."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"R-200 - posto e graduação",dif:"media",fonte:"Decreto nº 88.777/1983 (R-200), art. 2º",s:"Segundo os conceitos do R-200, 'posto' é o grau hierárquico do oficial, e 'graduação' é o grau hierárquico da praça.",a:true,e:"CERTO. É a distinção clássica adotada pelo R-200: posto para oficiais, graduação para praças, ambos compondo a escala hierárquica da corporação."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"R-200 - policiamento ostensivo",dif:"dificil",fonte:"Decreto nº 88.777/1983 (R-200), art. 2º",s:"O policiamento ostensivo, conforme conceituado pelo R-200, é ação policial exclusiva das Polícias Militares em que o homem ou a fração de tropa empregados são identificados de relance, seja pela farda, pelo equipamento ou pela viatura, visando à manutenção da ordem pública.",a:true,e:"CERTO. É a definição literal de 'Policiamento Ostensivo' prevista no item 27 do art. 2º do R-200, que também lista suas modalidades (geral, de trânsito, florestal, rodoviário etc.)."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"R-200 - agregação",dif:"media",fonte:"Decreto nº 88.777/1983 (R-200), art. 2º",s:"Segundo o R-200, agregação é a situação na qual o policial-militar da ativa deixa de ocupar vaga na escala hierárquica do seu quadro, nela permanecendo sem número.",a:true,e:"CERTO. Essa é exatamente a definição de 'Agregação' prevista no rol de conceitos do art. 2º do Regulamento."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"R-200 - controle do Exército",dif:"dificil",fonte:"Decreto nº 88.777/1983 (R-200), art. 3º",s:"O R-200 estabelece que compete ao Ministério do Exército, por meio do Estado-Maior do Exército e outros órgãos, exercer o controle e a coordenação das Polícias Militares, abrangendo aspectos como organização, efetivos, disciplina, ensino, instrução e material bélico.",a:true,e:"CERTO. O art. 3º e seu parágrafo único preveem exatamente esse controle e coordenação federal sobre aspectos institucionais das Polícias Militares estaduais."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"R-200 - convocação",dif:"media",fonte:"Decreto nº 88.777/1983 (R-200), art. 4º",s:"Conforme o R-200, a Polícia Militar poderá ser convocada, total ou parcialmente, em caso de guerra externa ou para prevenir e reprimir grave perturbação da ordem, entre outras hipóteses previstas no Regulamento.",a:true,e:"CERTO. O art. 4º prevê essas hipóteses de convocação total ou parcial da Polícia Militar, mediante diretrizes especiais do Presidente da República."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"R-200 - comandante-geral",dif:"dificil",fonte:"Decreto nº 88.777/1983 (R-200), art. 10",s:"Segundo o R-200, os Comandantes-Gerais das Polícias Militares são responsáveis, perante os Governadores das respectivas Unidades Federativas, pela administração e emprego da Corporação, em nível de Administração Direta.",a:true,e:"CERTO. O art. 10 do R-200 estabelece exatamente essa responsabilidade dos Comandantes-Gerais perante os Governadores, no âmbito da Administração Direta estadual."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"R-200 - manutenção da ordem pública",dif:"media",fonte:"Decreto nº 88.777/1983 (R-200), art. 2º",s:"Manutenção da ordem pública, segundo o R-200, é o exercício estático do poder de polícia, manifestado por atuações predominantemente investigativas, visando reprimir eventos que já tenham violado a ordem pública.",a:false,e:"ERRADO. O R-200 define manutenção da ordem pública como o exercício DINÂMICO do poder de polícia, com atuações predominantemente OSTENSIVAS, visando prevenir, dissuadir, coibir ou reprimir violações à ordem pública  1�7 e não um exercício estático ou meramente investigativo."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"R-200 - categoria de servidor",dif:"facil",fonte:"Decreto nº 88.777/1983 (R-200), art. 46",s:"Segundo o R-200, os integrantes das Polícias Militares constituem uma categoria de servidores públicos dos Estados, Territórios e Distrito Federal, denominada 'policiais-militares'.",a:true,e:"CERTO. O art. 46 do R-200 estabelece exatamente essa classificação dos integrantes da corporação como categoria especial de servidores públicos."},

// Bloco E: Código Penal Militar (Decreto-lei nº 1.001/1969) - noções gerais
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"CPM - crime propriamente militar",dif:"media",fonte:"Decreto-lei nº 1.001/1969 (Código Penal Militar) - noções gerais",s:"Crime propriamente militar é aquele que só pode ser praticado por militar, pois atenta diretamente contra as instituições militares, como é o caso do crime de deserção.",a:true,e:"CERTO. Crimes propriamente militares pressupõem a condição de militar do agente e violam bens jurídicos exclusivos da vida castrense, como a deserção, o abandono de posto e a insubordinação."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"CPM - crime impropriamente militar",dif:"dificil",fonte:"Decreto-lei nº 1.001/1969 (Código Penal Militar) - noções gerais",s:"Crime impropriamente militar é aquele previsto tanto na lei penal comum quanto no Código Penal Militar, podendo, a depender das circunstâncias (tempo, lugar e pessoa), ser praticado inclusive por civil.",a:true,e:"CERTO. Diferente do crime propriamente militar, o impropriamente militar tem correspondência na legislação penal comum, ganhando natureza militar em razão de circunstâncias específicas previstas no CPM."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"CPM - aplicação no tempo",dif:"media",fonte:"Decreto-lei nº 1.001/1969 (Código Penal Militar) - noções gerais",s:"O Código Penal Militar distingue a aplicação de suas normas em tempo de paz e em tempo de guerra, prevendo penas mais severas para determinados crimes militares cometidos em tempo de guerra.",a:true,e:"CERTO. O CPM possui parte específica destinada aos crimes militares em tempo de guerra, com tratamento penal mais rigoroso do que o previsto para o tempo de paz."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"CPM - Justiça Militar Estadual",dif:"dificil",fonte:"Decreto-lei nº 1.001/1969 (Código Penal Militar) - noções gerais",s:"Compete à Justiça Militar Estadual processar e julgar os militares dos Estados nos crimes militares definidos em lei, sem prejuízo do foro por prerrogativa de função nos casos previstos na Constituição.",a:true,e:"CERTO. A Justiça Militar Estadual, prevista na Constituição Federal, tem competência para julgar os crimes militares praticados por integrantes das Polícias Militares e Corpos de Bombeiros Militares estaduais."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"CPM - transgressão disciplinar x crime militar",dif:"media",fonte:"Decreto-lei nº 1.001/1969 (Código Penal Militar) - noções gerais",s:"Toda transgressão disciplinar cometida por policial militar configura, necessariamente, também um crime militar previsto no Código Penal Militar.",a:false,e:"ERRADO. Transgressão disciplinar e crime militar são esferas distintas de responsabilização; uma conduta pode configurar apenas infração disciplinar (sem tipificação penal) ou, em outros casos, configurar simultaneamente as duas esferas."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"CPM - deserção",dif:"media",fonte:"Decreto-lei nº 1.001/1969 (Código Penal Militar) - noções gerais",s:"A deserção é tratada pelo Código Penal Militar como crime propriamente militar, consistindo, em regra, na ausência do militar do seu posto ou unidade por tempo superior ao legalmente tolerado, sem autorização.",a:true,e:"CERTO. A deserção é um dos exemplos clássicos de crime propriamente militar, caracterizada pelo afastamento não autorizado da unidade por prazo superior ao legalmente estabelecido."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"CPM - legítima defesa",dif:"dificil",fonte:"Decreto-lei nº 1.001/1969 (Código Penal Militar) - noções gerais",s:"O Código Penal Militar prevê excludentes de ilicitude, como a legítima defesa e o estrito cumprimento do dever legal, aplicáveis também aos policiais militares no exercício de sua atividade funcional.",a:true,e:"CERTO. Assim como no Código Penal comum, o CPM prevê causas de exclusão de ilicitude, entre elas a legítima defesa e o estrito cumprimento do dever legal."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"CPM - competência da Justiça comum",dif:"dificil",fonte:"Decreto-lei nº 1.001/1969 (Código Penal Militar) - noções gerais",s:"Compete à Justiça comum, e não à Justiça Militar Estadual, julgar os crimes dolosos contra a vida praticados por policial militar contra civil, conforme entendimento consolidado na legislação processual penal militar.",a:true,e:"CERTO. Desde alteração legislativa no Código de Processo Penal Militar, os crimes dolosos contra a vida de civil praticados por militar estadual são julgados pelo Tribunal do Júri (Justiça comum), e não pela Justiça Militar."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"CPM - hierarquia como bem jurídico",dif:"media",fonte:"Decreto-lei nº 1.001/1969 (Código Penal Militar) - noções gerais",s:"A hierarquia e a disciplina militares são bens jurídicos especialmente protegidos pelo Código Penal Militar, justificando a existência de tipos penais específicos, como insubordinação e desrespeito a superior.",a:true,e:"CERTO. O CPM tipifica diversas condutas que atentam contra a hierarquia e a disciplina, pilares da organização militar, como os crimes de insubordinação e desrespeito a superior hierárquico."},

// Bloco F: Lei estadual nº 10.823/2018 (criação e transformação de organizações policiais militares da PMMA)
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"Lei 10.823/2018 - objeto",dif:"media",fonte:"Lei estadual nº 10.823/2018",s:"A Lei estadual nº 10.823/2018 dispõe sobre a criação e a transformação de organizações policiais militares (OPMs) no âmbito da Polícia Militar do Maranhão.",a:true,e:"CERTO. Esse é o objeto central da Lei nº 10.823/2018, que trata da criação e transformação de unidades (organizações policiais militares) na estrutura da PMMA."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"Lei 10.823/2018 - organização administrativa",dif:"dificil",fonte:"Lei estadual nº 10.823/2018",s:"A criação de novas organizações policiais militares pela Lei nº 10.823/2018 tem como finalidade, entre outras, adequar a estrutura organizacional da PMMA às necessidades operacionais e territoriais do Estado.",a:true,e:"CERTO. Leis desse tipo, comuns na estrutura das polícias militares estaduais, buscam justamente reorganizar e adequar unidades (batalhões, companhias etc.) às demandas operacionais e à expansão territorial do policiamento."},
{m:"Legislação Pertinente à PMMA",bloco:"E",tema:"Lei 10.823/2018 - competência legislativa",dif:"media",fonte:"Lei estadual nº 10.823/2018",s:"A criação e a transformação de organizações policiais militares estaduais, como tratada pela Lei nº 10.823/2018, dependem de lei estadual, cabendo à Assembleia Legislativa do Maranhão a competência para sua aprovação.",a:true,e:"CERTO. Por envolver estrutura organizacional e, em regra, despesa pública, a criação/transformação de unidades da PMMA depende de lei em sentido estrito, aprovada pelo Poder Legislativo estadual."},

// Bloco G: Lei nº 12.896/2026 (Lei de Organização Básica da PMMA - LOB)
