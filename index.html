{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:34,s:"É proibida a inclusão em editais de concurso militar de exigência que imponha a comprovação de procedimento social e idoneidade moral por meio de investigação social.",a:false,e:"ERRADO. Essa exigência é permitida (e comum) nos editais de concurso militar, não proibida."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:35,s:"O ingresso no Quadro de Oficiais de Estado-Maior (QOEM) das polícias militares exige bacharelado em Direito, sendo facultada outra graduação de nível superior na legislação do ente federado para os corpos de bombeiros militares.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:36,s:"Aos oficiais integrantes do Quadro de Oficiais Especialistas (QOE), oriundos do quadro de praças, é permitida a progressão na hierarquia militar até o posto de Tenente-Coronel.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:37,s:"Os policiais e bombeiros militares que já pertencem aos quadros da própria instituição militar não se submetem a limite de idade para a prestação de concurso público de ingresso no Quadro de Oficiais de Estado-Maior (QOEM).",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:38,s:"O Curso de Comando e Estado-Maior (CCEM) destina-se aos Capitães da corporação como requisito de habilitação à promoção ao posto de Major.",a:false,e:"ERRADO. É o Curso de Aperfeiçoamento de Oficiais (CAO) que habilita à promoção a Major; o CCEM se destina a postos mais elevados (Tenente-Coronel/Coronel)."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:39,s:"Todas as armas de fogo institucionais e as armas particulares registradas em nome dos integrantes das corporações militares estaduais devem ser cadastradas no Sistema de Gerenciamento Militar de Armas (Sigma).",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:40,s:"O militar preso em flagrante delito por autoridade de polícia civil poderá permanecer custodiado em delegacia comum durante todo o trâmite da instrução criminal probatória.",a:false,e:"ERRADO. A custódia em delegacia comum é permitida apenas até a lavratura do auto de prisão; depois, o militar deve ser recolhido a unidade militar."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:41,s:"Os militares de carreira adquirem a estabilidade funcional após o cumprimento do período de três anos de efetivo serviço nas corporações militares.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:42,s:"O Comandante-Geral nomeado pelo Governador do Estado dispõe do prazo de até 60 dias contados da posse para apresentar o Plano de Comando contendo metas de produtividade e de redução da criminalidade.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:43,s:"Os entes federados dispõem do prazo de transição de até 6 anos contados da publicação da Lei Orgânica Nacional para implementar a exigência de escolaridade de nível superior nos concursos públicos de ingresso.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:44,s:"A Polícia Militar do Maranhão admite a equivalência legal entre as expressões \"servidor público militar estadual\", \"servidor público militar\", \"militar\", \"policial militar\" e \"servidor militar do estado\" para a incidência das normas do seu Estatuto.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:45,s:"Os alunos matriculados nos cursos de formação de policiais militares são enquadrados estatutariamente na situação de militares na inatividade até a conclusão com aproveitamento do respectivo curso.",a:false,e:"ERRADO. Os alunos são enquadrados na situação de ATIVIDADE, não de inatividade, durante o curso de formação."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:46,s:"A carreira de Oficial da Polícia Militar do Maranhão é privativa de brasileiros natos, ao passo que as praças podem ter nacionalidade brasileira nata ou naturalizada.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:47,s:"O edital de concurso público para ingresso na PMMA pode estabelecer a restrição de vaga com base em crença religiosa ou raça, desde que devidamente justificado por necessidade da administração policial militar.",a:false,e:"ERRADO. É vedada qualquer restrição de vaga por raça ou crença religiosa, sem exceção."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:48,s:"Os candidatos civis aprovados em concurso público para o Curso de Formação de Sargentos e Curso de Formação de Soldados ingressam na PMMA já nomeados na graduação efetiva respectiva desde o primeiro dia do curso.",a:false,e:"ERRADO. Os aprovados ingressam como alunos do curso de formação, sendo nomeados na graduação efetiva apenas após a conclusão com aproveitamento."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:49,s:"A hierarquia e a disciplina constituem as bases institucionais da Polícia Militar do Maranhão, sendo que a autoridade e a responsabilidade crescem com o grau hierárquico.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:50,s:"O preenchimento das vagas do Quadro de Oficiais de Administração (QOA) recairá sobre os Subtenentes mais bem classificados na prova de aptidão física do concurso de promoção, independentemente do seu tempo na graduação.",a:false,e:"ERRADO. O preenchimento depende também do tempo de graduação/antiguidade, não apenas da classificação na prova de aptidão física."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:51,s:"Os conceitos profissional e moral do Subtenente candidato ao QOA ou QOE que afetem a honra e o decoro da classe dependem de comprovação prévia em devido processo legal para obstar sua indicação aos cursos de habilitação.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:52,s:"O profissional de saúde aprovado em concurso público para o Quadro de Oficiais de Saúde (QOS) da PMMA é nomeado imediatamente no posto de Primeiro-Tenente PM no primeiro dia de apresentação à corporação, dispensada a realização de estágio.",a:false,e:"ERRADO. É exigido estágio (cerca de 90 dias) antes da nomeação efetiva, não sendo dispensado."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:53,s:"Metade das vagas destinadas ao preenchimento da graduação de 3º Sargento PM deve ser obrigatoriamente preenchida mediante concurso público.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:54,s:"A ordenação da autoridade na Polícia Militar se faz por postos e graduações, sendo que o acatamento à sequência de autoridade consubstancia o respeito à hierarquia.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:55,s:"O Círculo de Oficiais Intermediários da Polícia Militar do Maranhão é composto pelos postos de Capitão e Primeiro-Tenente.",a:false,e:"ERRADO. A composição do Círculo de Oficiais Intermediários é diferente da descrita (não inclui o Primeiro-Tenente, que integra o círculo de oficiais subalternos)."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:56,s:"O Posto é o grau hierárquico do oficial, conferido por decreto do Governador do Estado e confirmado em Carta Patente.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:57,s:"A Graduação é o grau hierárquico da praça, conferido por ato do Secretário de Estado da Segurança Pública.",a:false,e:"ERRADO. A graduação é conferida por ato do Comandante-Geral da corporação, não do Secretário de Segurança Pública."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:58,s:"Na escala de precedência estabelecida no Estatuto, os Cadetes possuem superioridade hierárquica sobre os Subtenentes da corporação.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:59,s:"Em igualdade de posto ou graduação, a precedência entre militares da ativa e os da reserva remunerada, quando estes forem convocados, é definida pela data de nascimento dos militares.",a:false,e:"ERRADO. A precedência nesse caso é definida pelo tempo de serviço (TS), e não pela data de nascimento."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:60,s:"A antiguidade no posto ou na graduação, para efeito de promoção, é o tempo computado dia a dia no exercício de funções policiais militares ou de natureza policial militar.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:61,s:"As praças especiais compreendem exclusivamente os Cadetes matriculados no Curso de Formação de Oficiais.",a:false,e:"ERRADO. As praças especiais não se restringem exclusivamente aos Cadetes; a categoria abrange outras situações de alunos/aspirantes previstas no Estatuto."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:62,s:"A declaração de Aspirante-a-Oficial dos Cadetes que concluem o curso de formação é de competência do Comandante-Geral da Polícia Militar do Maranhão.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:63,s:"Em igualdade de posto ou graduação, os policiais militares na inatividade possuem precedência hierárquica sobre os militares da ativa.",a:false,e:"ERRADO. É o inverso: os militares da ativa têm precedência sobre os da inatividade em igualdade de posto ou graduação."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:64,s:"Cargo policial-militar é aquele criado por lei, especificado nos Quadros de Organização e que pode ser exercido por policiais militares em serviço ativo ou na reserva remunerada.",a:false,e:"ERRADO. O cargo policial-militar é privativo de militar em serviço ativo, e não da reserva remunerada."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:65,s:"Os cargos policiais-militares são considerados vagos a partir do momento de sua criação e até que um policial militar tome posse, bem como quando seus ocupantes forem considerados extraviados ou desertores.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:66,s:"O cargo de Comandante-Geral da Polícia Militar do Maranhão é de livre nomeação pelo Governador do Estado, devendo recair obrigatoriamente sobre Oficial da ativa do último posto do Quadro de Oficiais de Estado-Maior (QOEM).",a:true,e:"CERTO (na sistemática atual, com o QOEM substituindo o antigo Quadro de Combatentes/QOPM previsto na redação original da Lei)."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:67,s:"A situação interina do servidor militar caracteriza-se quando este é nomeado para exercer cargo e satisfaz integralmente todos os requisitos de grau hierárquico, quadro e especialização.",a:false,e:"ERRADO. A situação interina ocorre justamente quando o militar NÃO satisfaz integralmente todos os requisitos de grau hierárquico, quadro ou especialização para o cargo."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:68,s:"O policial militar nomeado para exercer função na Assessoria Militar do Tribunal de Justiça ou na Corregedoria do Sistema de Segurança Pública é considerado no exercício de função de natureza policial-militar.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:69,s:"O exercício de cargo ou função não catalogado em lei como de natureza policial-militar ou de interesse policial-militar importa no enquadramento do militar da ativa no exercício de função de natureza civil.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:70,s:"É permitido ao policial militar da ativa exercer diretamente a gerência de sociedade empresária de responsabilidade limitada, desde que seja o sócio majoritário.",a:false,e:"ERRADO. É vedado ao militar da ativa exercer diretamente a gerência de sociedade empresária, independentemente de ser sócio majoritário."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:71,s:"Aos médicos e demais integrantes do Quadro de Saúde da PMMA é vedado o exercício de atividade técnico-profissional no meio civil, mesmo sem prejuízo do serviço policial.",a:false,e:"ERRADO. O exercício de atividade técnico-profissional no meio civil é permitido, desde que não haja prejuízo ao serviço policial."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:72,s:"A subordinação hierárquica afeta a dignidade pessoal do militar e decorre do poder disciplinar discricionário dos oficiais superiores.",a:false,e:"ERRADO. O Estatuto estabelece expressamente que a subordinação hierárquica não afeta a dignidade pessoal do militar."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:73,s:"O policial militar responde integralmente pelas decisões que tomar, pelas ordens que emitir e pelos atos que praticar no exercício do comando ou chefia.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:74,s:"É integralmente permitido ao policial-militar da ativa tomar parte na administração ou gerência de sociedades empresárias privadas, desde que o faça na condição de sócio-gerente.",a:false,e:"ERRADO. Não é permitido atuar como sócio-gerente; o militar da ativa só pode participar como cotista ou acionista, sem função de gerência."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:75,s:"As penas disciplinares de detenção ou prisão aplicadas no âmbito administrativo da Polícia Militar do Maranhão não podem ultrapassar trinta dias.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:76,s:"O Oficial da ativa considerado presumivelmente incapaz de permanecer na corporação será submetido a Conselho de Justiça e afastado automaticamente de suas funções.",a:false,e:"ERRADO. O órgão competente é o Conselho de JUSTIFICAÇÃO, e não Conselho de Justiça."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:77,s:"Compete ao Conselho Superior de Polícia julgar, em última instância, os processos oriundos dos Conselhos de Justificação instaurados contra oficiais da PMMA.",a:false,e:"ERRADO. Quem julga em última instância os processos oriundos dos Conselhos de Justificação é o Tribunal de Justiça do Estado."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:78,s:"As praças sem estabilidade assegurada que se tornarem incompatíveis com a função policial militar são submetidas a Conselho de Disciplina.",a:false,e:"ERRADO. Praças sem estabilidade assegurada são submetidas a processo administrativo próprio (PAD), e não ao Conselho de Disciplina, que se destina às praças com estabilidade."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:79,s:"Compete ao Conselho Superior de Polícia julgar, em última instância, os processos oriundos dos Conselhos de Disciplina no âmbito da corporação.",a:false,e:"ERRADO. Também nesse caso, é o Tribunal de Justiça do Estado quem julga em última instância os processos oriundos dos Conselhos de Disciplina."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:80,s:"Compete ao Tribunal de Justiça do Estado julgar, em última instância, os processos oriundos dos Conselhos de Disciplina convocados no âmbito da corporação.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:81,s:"O policial militar da ativa que ingressar com ação no Poder Judiciário deve comunicar previamente essa iniciativa à autoridade militar a que estiver subordinado.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:82,s:"O militar estadual transferido para a reserva remunerada ou reformado receberá automaticamente a promoção ao grau hierárquico imediatamente superior na data de sua inatividade.",a:false,e:"ERRADO. Essa promoção não é automática; depende do cumprimento de requisitos específicos previstos em lei."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:83,s:"Os militares em serviço ativo possuem o direito de promoverem a sindicalização e de aderirem ao direito de greve no âmbito da segurança pública.",a:false,e:"ERRADO. É vedado ao militar em atividade a sindicalização e o direito de greve."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:84,s:"Os vencimentos dos policiais militares são irredutíveis e impenhoráveis, ressalvadas as exceções previstas em lei, como a execução de alimentos.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:85,s:"O adicional por tempo de serviço concedido ao policial militar incide sobre o soldo à razão de 5% a cada cinco anos de efetivo serviço público estadual, até o limite máximo de 35%.",a:false,e:"ERRADO. Os parâmetros de percentual, periodicidade ou base de cálculo desse adicional divergem do descrito no item, conforme a legislação estatutária vigente."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:86,s:"As promoções de praças da PMMA efetuam-se mediante ato administrativo do Comandante-Geral da corporação.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:87,s:"A legislação estatutária veda de forma peremptória a promoção de policial militar por ocasião de sua transferência para a reserva remunerada ou reforma.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:88,s:"A promoção do militar feita em ressarcimento de preterição produz efeitos retroativos, recebendo ele o número que lhe competir na escala hierárquica como se houvesse sido promovido na época devida.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:89,s:"O policial militar adquire o direito de gozar férias anuais de trinta dias consecutivos logo após a conclusão dos primeiros seis meses de efetivo serviço.",a:false,e:"ERRADO. O direito às férias anuais é adquirido após 12 meses de efetivo serviço, não seis."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:90,s:"A acumulação do gozo de férias anuais pelo policial militar é permitida por até no máximo dois anos, em caso de imperiosa necessidade do serviço.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:91,s:"O afastamento total do serviço por motivo de núpcias ou de luto em razão do falecimento de cônjuge, pais ou filhos é concedido ao policial militar pelo prazo de oito dias consecutivos.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:92,s:"O período de trânsito é o afastamento concedido ao militar após a sua apresentação na unidade para a qual foi transferido com mudança de sede.",a:false,e:"ERRADO. O período de trânsito é concedido ANTES do deslocamento e apresentação na nova unidade, não depois."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:93,s:"A licença para tratamento de saúde em pessoa da família pode ser concedida ao militar pelo prazo máximo de doze meses contínuos.",a:false,e:"ERRADO. O prazo máximo dessa licença é de 6 meses, e não de doze meses contínuos."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:94,s:"A licença para tratar de interesse particular (LTIP) exige que o policial militar conte com mais de dez anos de efetivo serviço e é concedida com prejuízo da remuneração e do tempo de serviço por até dois anos.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:95,s:"O policial-militar fardado é proibido de usar uniforme em reuniões, propaganda ou qualquer outra manifestação de caráter político-partidário.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:96,s:"O policial militar preso por autoridade policial civil em flagrante delito pode permanecer recolhido em delegacia comum durante toda a instrução criminal probatória.",a:false,e:"ERRADO. A permanência em delegacia comum é permitida apenas até a lavratura do auto de prisão em flagrante."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:97,s:"Os militares da inatividade cuja conduta seja considerada ofensiva à dignidade da classe podem ser definitivamente proibidos de usar uniformes por decisão do Comandante-Geral.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:98,s:"O policial militar que ultrapassar um ano contínuo em Licença para Tratamento de Saúde Própria (LTSP) será obrigatoriamente agregado.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:99,s:"Os militares da inatividade que praticarem conduta considerada ofensiva à dignidade da classe poderão ser definitivamente proibidos de usar uniformes por decisão do Comandante-Geral.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:100,s:"Reversão é o ato pelo qual o militar promovido por bravura sem vaga ocupa a primeira vaga aberta em seu quadro.",a:false,e:"ERRADO. O conceito descrito corresponde à promoção em vaga excedente, e não à reversão, que tem outro significado no Estatuto."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:101,s:"Considera-se ausente o policial militar que deixar de comparecer à sua unidade sem comunicação por mais de vinte e quatro horas consecutivas.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:102,s:"O militar da ativa cujo paradeiro for ignorado por mais de oito dias consecutivos em operações militares é oficialmente considerado extraviado.",a:false,e:"ERRADO. Nesse caso o militar é considerado \"desaparecido\", e não \"extraviado\" (termo usado para cargos vagos)."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:103,s:"A incapacidade definitiva do policial-militar para o serviço ativo deverá ser obrigatoriamente constatada por Junta Superior de Saúde nomeada pelo Governador do Estado.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:104,s:"O Oficial do sexo masculino e a Praça do sexo masculino serão transferidos compulsoriamente para a reserva remunerada ao atingirem, respectivamente, as idades limites de 62 e 60 anos.",a:false,e:"ERRADO. Os limites de idade corretos são diferentes: Oficiais Generais aos 65 anos, Coronéis aos 67 e praças aos 65 anos, por exemplo  1�7 não 62 e 60."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:105,s:"O militar da reserva remunerada pode ser convocado para o serviço ativo voluntariamente e em caráter transitório para prestar serviços técnicos, não podendo a convocação exceder a seis meses.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:106,s:"A incapacidade definitiva do militar para o serviço ativo deve ser atestada obrigatoriamente por Junta Superior de Saúde nomeada pelo Governador do Estado.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:107,s:"A demissão a pedido do Oficial que contar com menos de cinco anos de oficialato será concedida sem qualquer ônus ou necessidade de indenização das despesas de sua formação ao Estado.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:108,s:"O licenciamento a bem da disciplina é aplicado às praças sem estabilidade assegurada que ingressarem no mau comportamento.",a:true,e:"CERTO. (A praça COM estabilidade, em situação equivalente, é submetida à exclusão a bem da disciplina, não ao licenciamento.)"},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:109,s:"A exclusão a bem da disciplina é aplicada ex officio às praças com estabilidade assegurada e aos Aspirantes condenados a pena privativa de liberdade superior a dois anos por sentença judicial.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:110,s:"A demissão do Oficial ou a exclusão da praça com estabilidade em razão do crime de deserção processa-se após um ano de agregação, caso não ocorra captura ou apresentação voluntária.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:111,s:"Na apuração do tempo de serviço do policial militar, utiliza-se o divisor 365 para a conversão do tempo apurado dia a dia em anos de efetivo serviço.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto dos Policiais Militares do Maranhão (Lei 6.513/1995)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:112,s:"O tempo de serviço passado pelo militar em licença para tratar de interesse particular (LTIP) é computado normalmente para fins de inatividade e aposentadoria.",a:false,e:"ERRADO. O tempo em LTIP NÃO é computado normalmente para fins de inatividade e aposentadoria, pois a licença é concedida com prejuízo do tempo de serviço."},
{m:"Legislação Institucional",id:"Legislação Institucional|Estatuto PMMA - CFO: reprovação e 3º Sargento|l6-1",bloco:"E",tema:"Estatuto PMMA - CFO: reprovação e 3º Sargento",dif:"dificil",fonte:"QG dos Concurseiros (Instagram)  1�7 questão de prova",lote:"lote6",ordem3:1,s:"Com base nas disposições da Lei nº 6.513/1995 (Estatuto dos Policiais Militares do Estado do Maranhão), julgue o item: O aluno do Curso de Formação de Oficiais, após concluir o primeiro ano com aproveitamento, se reprovado nos anos subsequentes e não tendo direito à rematrícula, deverá ser promovido à graduação de 3º Sargento.",a:false,e:"ERRADO. O parágrafo único do art. 161 da Lei 6.513/1995 diz que o aluno do CFO, nessa situação, PODERÁ ser promovido a 3º Sargento, e não 'deverá'. A pegadinha está na troca de 'poderá' por 'deverá': a promoção é uma faculdade, não uma obrigatoriedade."},
{m:"Informática",id:"Informática|Redes - topologia em estrela x malha|l6-2",bloco:"E",tema:"Redes - topologia em estrela x malha",dif:"media",fonte:"QG dos Concurseiros (Instagram)  1�7 questão de prova",lote:"lote6",ordem3:2,s:"Com relação à topologia em estrela nas redes de computadores, julgue o item: Em uma rede com topologia física em estrela, cada computador é conectado diretamente aos outros, formando vários caminhos independentes e dispensando a existência de um equipamento central.",a:false,e:"ERRADO. Na topologia em estrela, os dispositivos são conectados individualmente a um ponto central, normalmente um switch. A existência de múltiplos caminhos diretos entre todos os dispositivos caracteriza a topologia em MALHA."},
{m:"Legislação Pertinente à PMMA",id:"Legislação Pertinente à PMMA|CBMMA - Diretoria de Planejamento e Modernização (Lei 10.230/2015)|l6-3",bloco:"E",tema:"CBMMA - Diretoria de Planejamento e Modernização (Lei 10.230/2015)",dif:"media",fonte:"QG dos Concurseiros (Instagram)  1�7 questão de prova",lote:"lote6",ordem3:3,s:"Conforme a Lei Estadual nº 10.230/2015, a condução da gestão de novos projetos, da modernização administrativa do CBMMA e da implementação de sistemas de tecnologia da informação compete à Diretoria de Planejamento e Modernização.",a:true,e:"CERTO. Conforme o § 7º do dispositivo, compete à Diretoria de Planejamento e Modernização realizar o planejamento orçamentário, gerir projetos, elaborar planos de modernização institucional e implementar sistemas de tecnologia da informação."},
{m:"Legislação Pertinente à PMMA",id:"Legislação Pertinente à PMMA|CBMMA - Diretoria de Planejamento e Modernização (Lei 10.230/2015)|l6-4",bloco:"E",tema:"CBMMA - Diretoria de Planejamento e Modernização (Lei 10.230/2015)",dif:"media",fonte:"QG dos Concurseiros (Instagram)  1�7 questão de prova",lote:"lote6",ordem3:4,s:"Conforme a Lei Estadual nº 10.230/2015, a condução da gestão de novos projetos, da modernização administrativa do CBMMA e da implementação de sistemas de tecnologia da informação compete, exclusivamente, à Diretoria de Finanças.",a:false,e:"ERRADO. Essas atividades competem à Diretoria de Planejamento e Modernização (§ 7º), que realiza o planejamento orçamentário, gere projetos, elabora planos de modernização institucional e implementa sistemas de TI. Finanças não é a diretoria responsável."},
{m:"Legislação Institucional",id:"Legislação Institucional|Estatuto PMMA - Justiça Militar estadual (art. 58)|l6-5",bloco:"E",tema:"Estatuto PMMA - Justiça Militar estadual (art. 58)",dif:"media",fonte:"QG dos Concurseiros (Instagram)  1�7 questão de prova",lote:"lote6",ordem3:5,s:"Enquanto o Estado do Maranhão não dispuser de Tribunal Militar, a Auditoria da Justiça Militar Estadual processa e julga os militares estaduais pela prática de crimes militares, cabendo ao Tribunal de Justiça do Estado o julgamento em segunda instância.",a:true,e:"CERTO. Conforme o art. 58 da Lei 6.513/1995, enquanto o Maranhão não dispuser de Tribunal Militar, a Auditoria da Justiça Militar Estadual processa e julga os militares estaduais nos crimes militares, tendo o Tribunal de Justiça do Estado como órgão de segunda instância."},
{m:"Legislação Institucional",id:"Legislação Institucional|Estatuto PMMA - Justiça Militar estadual (art. 58)|l6-6",bloco:"E",tema:"Estatuto PMMA - Justiça Militar estadual (art. 58)",dif:"media",fonte:"QG dos Concurseiros (Instagram)  1�7 questão de prova",lote:"lote6",ordem3:6,s:"Enquanto o Estado do Maranhão não dispuser de Tribunal Militar, compete à Justiça Federal processar e julgar os militares estaduais pela prática de crimes militares, com recurso para o Superior Tribunal Militar.",a:false,e:"ERRADO. Pelo art. 58 da Lei 6.513/1995, quem processa e julga é a Auditoria da Justiça Militar Estadual, com o Tribunal de Justiça do Estado como segunda instância. Justiça Federal e STM não entram nessa regra."},
{m:"Legislação Institucional",id:"Legislação Institucional|Estatuto PMMA - tempo de serviço (definição)|l6-7",bloco:"E",tema:"Estatuto PMMA - tempo de serviço (definição)",dif:"media",fonte:"QG dos Concurseiros (Instagram)  1�7 questão de prova",lote:"lote6",ordem3:7,s:"Com base nas disposições da Lei nº 6.513/1995, julgue o item: Tempo de serviço é o espaço de tempo computado dia a dia entre a data de ingresso e a data-limite estabelecida para sua contagem ou a data do desligamento do serviço ativo, salvo se tal espaço de tempo for parcelado.",a:false,e:"ERRADO. Conforme a Lei 6.513/1995, o tempo de serviço é computado dia a dia entre o ingresso e a data-limite ou o desligamento do serviço ativo, MESMO QUE tal espaço de tempo seja parcelado. O erro está em afirmar que o tempo não é computado quando parcelado, contrariando o texto legal."},
{m:"Informática",id:"Informática|Word - Pincel de Formatação x Estilos|l6-8",bloco:"E",tema:"Word - Pincel de Formatação x Estilos",dif:"media",fonte:"QG dos Concurseiros (Instagram)  1�7 questão de prova",lote:"lote6",ordem3:8,s:"Com relação aos recursos de formatação do Microsoft Word, julgue o item: Durante a elaboração de um manual, um servidor utilizou o Pincel de Formatação para estabelecer padrões permanentes para todos os títulos das seções. Dessa forma, qualquer alteração posterior realizada no formato copiado pelo pincel será automaticamente aplicada a todos os títulos do documento.",a:false,e:"ERRADO. O Pincel de Formatação apenas copia a formatação de um conteúdo e a aplica a outro. Para estabelecer padrões reutilizáveis e permitir alterações uniformes nos títulos, o recurso apropriado é Estilos."},
{m:"Geografia do Brasil",id:"Geografia do Brasil|Matriz de transportes|l6-9",bloco:"G",tema:"Matriz de transportes",dif:"media",fonte:"QG dos Concurseiros (Instagram)  1�7 questão de prova",lote:"lote6",ordem3:9,s:"A respeito da matriz de transportes e do escoamento da produção no território brasileiro, julgue o item: A predominância do transporte rodoviário no Brasil decorre principalmente de sua maior eficiência para conduzir grandes volumes de mercadorias por longas distâncias, pois esse modal apresenta menor consumo de energia e custo operacional inferior aos transportes ferroviário e aquaviário.",a:false,e:"ERRADO. O rodoviário tem flexibilidade de rotas e leva a carga direto da origem ao destino, mas para grandes volumes e longas distâncias costuma ter custos operacionais e consumo de combustível SUPERIORES aos modais ferroviário e aquaviário. A predominância das rodovias se liga às políticas de expansão rodoviária, ao desenvolvimento da indústria automobilística e à insuficiência histórica de investimentos integrados em ferrovias e hidrovias."},
{m:"Legislação Institucional",id:"Legislação Institucional|Estatuto PMMA - candidatura eletiva (art. 106, mais de 10 anos)|l6-10",bloco:"E",tema:"Estatuto PMMA - candidatura eletiva (art. 106, mais de 10 anos)",dif:"dificil",fonte:"QG dos Concurseiros (Instagram)  1�7 questão de prova",lote:"lote6",ordem3:10,s:"Conforme o art. 106, § 1º, da Lei nº 6.513/1995, o bombeiro militar com mais de dez anos de serviço que se candidate a cargo eletivo deverá ser agregado, observadas as demais disposições legais.",a:true,e:"CERTO. O militar deverá ser agregado quando se candidatar a cargo eletivo e contar com mais de dez anos de serviço, observadas as demais disposições legais (art. 106, § 1º, da Lei 6.513/1995)."},
{m:"Legislação Institucional",id:"Legislação Institucional|Estatuto PMMA - candidatura eletiva (art. 106, mais de 10 anos)|l6-11",bloco:"E",tema:"Estatuto PMMA - candidatura eletiva (art. 106, mais de 10 anos)",dif:"dificil",fonte:"QG dos Concurseiros (Instagram)  1�7 questão de prova",lote:"lote6",ordem3:11,s:"Um bombeiro militar com mais de dez anos de serviço que se candidate a cargo eletivo deverá ser transferido para a reserva não remunerada no registro da candidatura.",a:false,e:"ERRADO. Com mais de dez anos de serviço, o militar candidato a cargo eletivo deve ser AGREGADO (art. 106, § 1º, da Lei 6.513/1995), e não transferido para a reserva não remunerada no registro da candidatura."},
{m:"Português",id:"Português|Sintaxe: oração subordinada substantiva objetiva direta|l6-12",bloco:"G",tema:"Sintaxe: oração subordinada substantiva objetiva direta",dif:"dificil",fonte:"QG dos Concurseiros (Instagram)  1�7 questão de prova",lote:"lote6",ordem3:12,s:"Leia o terceiro período do último parágrafo do texto 2A1-I: “Se essas pessoas são privadas de dignidade, de acesso pleno aos sistemas de saúde e de concorrência justa aos postos de trabalho e submetidas a chacotas e opressões que deterioram sua autoestima e saúde mental, é no mínimo perverso dizer que elas são culpadas pela própria obesidade. 1�7 Considerando a classificação das orações presentes no período, julgue o item: A oração “que elas são culpadas pela própria obesidade 1�7 classifica-se como oração subordinada substantiva objetiva direta, pois completa o sentido da forma verbal “dizer 1�7 sem a presença de preposição.",a:true,e:"CERTO. O verbo “dizer 1�7 é transitivo direto e a oração “que elas são culpadas pela própria obesidade 1�7 lhe serve de complemento, sem preposição (teste: “dizer ISSO 1�7)."},
{m:"Informática",id:"Informática|Navegadores - Edge e Chromium|l7-1",bloco:"E",tema:"Navegadores - Edge e Chromium",dif:"facil",fonte:"QG dos Concurseiros (Instagram)  1�7 questão de prova",lote:"lote7",ordem3:1,s:"Com relação às características dos navegadores de Internet, julgue o item: Durante a atualização dos navegadores utilizados pela Polícia Militar do Maranhão, um técnico informou que as versões atuais do Microsoft Edge são baseadas no projeto de código aberto Chromium, também utilizado como base por navegadores como Google Chrome, Opera e Brave.",a:true,e:"CERTO. O Edge atual é baseado no Chromium, o que favorece a compatibilidade com tecnologias Web e extensões feitas para Chrome, Opera e Brave. Isso não significa que Edge e Chrome sejam idênticos: cada um tem recursos e integrações próprios."},
{m:"Legislação Institucional",id:"Legislação Institucional|Estatuto PMMA - luto (art. 84, II)|l7-2",bloco:"E",tema:"Estatuto PMMA - luto (art. 84, II)",dif:"media",fonte:"QG dos Concurseiros (Instagram)  1�7 questão de prova",lote:"lote7",ordem3:2,s:"Em razão do falecimento de seu pai, um bombeiro militar que solicitou o afastamento previsto no Estatuto terá direito a oito dias de afastamento.",a:true,e:"CERTO. Conforme o art. 84, inciso II, da Lei 6.513/1995, o militar tem direito a OITO dias de afastamento por luto em decorrência do falecimento de cônjuge ou companheiro, pais, madrasta, padrasto, pais adotivos, filhos, menor sob guarda ou tutela e irmãos."},
{m:"Legislação Institucional",id:"Legislação Institucional|Estatuto PMMA - luto (art. 84, II)|l7-3",bloco:"E",tema:"Estatuto PMMA - luto (art. 84, II)",dif:"media",fonte:"QG dos Concurseiros (Instagram)  1�7 questão de prova",lote:"lote7",ordem3:3,s:"Em razão do falecimento de seu pai, um bombeiro militar que solicitou o afastamento previsto no Estatuto terá direito a três dias de afastamento.",a:false,e:"ERRADO. O afastamento por luto pelo falecimento de pais é de OITO dias (art. 84, II, da Lei 6.513/1995), e não três."},
{m:"Legislação Institucional",id:"Legislação Institucional|Estatuto PMMA - dispensa de júri e Justiça Eleitoral (art. 101)|l7-4",bloco:"E",tema:"Estatuto PMMA - dispensa de júri e Justiça Eleitoral (art. 101)",dif:"media",fonte:"QG dos Concurseiros (Instagram)  1�7 questão de prova",lote:"lote7",ordem3:4,s:"Com base na Lei nº 6.513/1995, julgue o item: Os servidores militares da ativa não são dispensados do corpo de jurados da Justiça Comum nem do serviço da Justiça Eleitoral.",a:false,e:"ERRADO. Conforme o art. 101, os militares da ativa SÃO dispensados do corpo de jurados da Justiça Comum e do serviço da Justiça Eleitoral. O erro está em afirmar que não são dispensados."},
{m:"Legislação Institucional",id:"Legislação Institucional|Estatuto PMMA - círculos hierárquicos|l7-5",bloco:"E",tema:"Estatuto PMMA - círculos hierárquicos",dif:"media",fonte:"QG dos Concurseiros (Instagram)  1�7 questão de prova",lote:"lote7",ordem3:5,s:"No Estatuto da PMMA, integram o Círculo de Oficiais Subalternos os postos de Primeiro-Tenente e Segundo-Tenente, e o Aspirante-a-Oficial, por ser praça especial, frequenta esse círculo.",a:true,e:"CERTO. Círculo de Oficiais Subalternos: 1º e 2º Tenente. O Aspirante-a-Oficial (praça especial) frequenta o Círculo de Oficiais Subalternos."},
{m:"Legislação Institucional",id:"Legislação Institucional|Estatuto PMMA - círculos hierárquicos|l7-6",bloco:"E",tema:"Estatuto PMMA - círculos hierárquicos",dif:"media",fonte:"QG dos Concurseiros (Instagram)  1�7 questão de prova",lote:"lote7",ordem3:6,s:"O Cadete, praça especial, integra em caráter permanente o Círculo de Oficiais Subalternos.",a:false,e:"ERRADO. O Cadete tem acesso ao Círculo de Oficiais apenas EXCEPCIONALMENTE ou em reuniões sociais. Quem frequenta o Círculo de Oficiais Subalternos é o Aspirante-a-Oficial."},
{m:"Legislação Institucional",id:"Legislação Institucional|Estatuto PMMA - círculos hierárquicos|l7-7",bloco:"E",tema:"Estatuto PMMA - círculos hierárquicos",dif:"media",fonte:"QG dos Concurseiros (Instagram)  1�7 questão de prova",lote:"lote7",ordem3:7,s:"O Círculo de Praças da PMMA abrange o Círculo de Subtenentes e Sargentos (Subtenente e 1º, 2º e 3º Sargentos) e o Círculo de Cabos e Soldados; os alunos do Curso de Formação de Sargentos têm acesso excepcional ao círculo de Subtenentes e Sargentos.",a:true,e:"CERTO. Subtenentes e Sargentos: Subtenente, 1º, 2º e 3º Sargento. Cabos e Soldados: círculo próprio. Os alunos do Curso de Formação de Sargentos têm acesso excepcional (ou em reuniões sociais) ao círculo de Subtenentes e Sargentos."},
{m:"Legislação Institucional",id:"Legislação Institucional|Estatuto PMMA - círculos hierárquicos|l7-8",bloco:"E",tema:"Estatuto PMMA - círculos hierárquicos",dif:"media",fonte:"QG dos Concurseiros (Instagram)  1�7 questão de prova",lote:"lote7",ordem3:8,s:"Os alunos do Curso de Formação de Cabos e Soldados frequentam o Círculo de Subtenentes e Sargentos.",a:false,e:"ERRADO. Os alunos do Curso de Formação de Cabos e Soldados frequentam o Círculo de Cabos e Soldados. O acesso ao círculo de Subtenentes e Sargentos é excepcional e cabe aos alunos do Curso de Formação de Sargentos."},

{m:"Português",id:"Simulado3|001",bloco:"G",tema:"Crase e regência - à medida que",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:1,s:"Texto: «O consumo consciente deixou de ser bandeira de poucos para tornar-se exigência de muitos. À medida que se agravam os sinais das mudanças climáticas, cresce a pressão sobre empresas e governos, aos quais se cobram medidas concretas. Não basta, porém, transferir a responsabilidade ao poder público: cada cidadão, na condição de consumidor, dispõe de instrumentos para pressionar o mercado, seja pela escolha do que compra, seja pela recusa do que degrada. O planeta, afinal, não é herança, mas empréstimo.» Com base nas ideias e nas estruturas linguísticas do texto, julgue o item: O emprego do acento grave em \"À medida que\" justifica-se por integrar locução de valor proporcional e de base feminina, que estabelece relação de proporção entre o agravamento dos sinais climáticos e o aumento da pressão social.",a:true,e:"CERTO. 'À medida que' é locução conjuntiva proporcional de base feminina (a + a medida): daí a crase."},
{m:"Português",id:"Simulado3|002",bloco:"G",tema:"Crase e regência - aos quais",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:2,s:"Texto: «O consumo consciente deixou de ser bandeira de poucos para tornar-se exigência de muitos. À medida que se agravam os sinais das mudanças climáticas, cresce a pressão sobre empresas e governos, aos quais se cobram medidas concretas. Não basta, porém, transferir a responsabilidade ao poder público: cada cidadão, na condição de consumidor, dispõe de instrumentos para pressionar o mercado, seja pela escolha do que compra, seja pela recusa do que degrada. O planeta, afinal, não é herança, mas empréstimo.» Com base nas ideias e nas estruturas linguísticas do texto, julgue o item: Em \"empresas e governos, aos quais se cobram medidas concretas\", a expressão \"aos quais\" retoma \"empresas e governos\" e vem precedida da preposição exigida pela regência da forma verbal \"cobram\".",a:true,e:"CERTO. 'Cobrar algo a alguém' exige a preposição 'a'; por isso 'aos quais' (a + os quais) retoma 'empresas e governos'."},
{m:"Português",id:"Simulado3|003",bloco:"G",tema:"Pontuação, orações e conjunções - porém",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:3,s:"Texto: «O consumo consciente deixou de ser bandeira de poucos para tornar-se exigência de muitos. À medida que se agravam os sinais das mudanças climáticas, cresce a pressão sobre empresas e governos, aos quais se cobram medidas concretas. Não basta, porém, transferir a responsabilidade ao poder público: cada cidadão, na condição de consumidor, dispõe de instrumentos para pressionar o mercado, seja pela escolha do que compra, seja pela recusa do que degrada. O planeta, afinal, não é herança, mas empréstimo.» Com base nas ideias e nas estruturas linguísticas do texto, julgue o item: A conjunção \"porém\", empregada no terceiro período, exprime ideia de conclusão, razão por que poderia ser substituída, sem prejuízo do sentido, pela conjunção \"portanto\".",a:false,e:"ERRADO. 'Porém' é conjunção adversativa (oposição), e não conclusiva. 'Portanto' é conclusiva e mudaria o sentido."},
{m:"Português",id:"Simulado3|004",bloco:"G",tema:"Crase e regência - dispor de",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:4,s:"Texto: «O consumo consciente deixou de ser bandeira de poucos para tornar-se exigência de muitos. À medida que se agravam os sinais das mudanças climáticas, cresce a pressão sobre empresas e governos, aos quais se cobram medidas concretas. Não basta, porém, transferir a responsabilidade ao poder público: cada cidadão, na condição de consumidor, dispõe de instrumentos para pressionar o mercado, seja pela escolha do que compra, seja pela recusa do que degrada. O planeta, afinal, não é herança, mas empréstimo.» Com base nas ideias e nas estruturas linguísticas do texto, julgue o item: A substituição de \"dispõe de instrumentos\" por \"dispõe dos meios\" preservaria a correção gramatical do período, uma vez que a forma verbal \"dispor\", nesse emprego, rege complemento introduzido pela preposição \"de\".",a:true,e:"CERTO. 'Dispor' rege a preposição 'de': 'dispõe de instrumentos' passa a 'dispõe dos meios' (de + os) sem erro."},
{m:"Português",id:"Simulado3|005",bloco:"G",tema:"Denotação e conotação",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:5,s:"Texto: «O consumo consciente deixou de ser bandeira de poucos para tornar-se exigência de muitos. À medida que se agravam os sinais das mudanças climáticas, cresce a pressão sobre empresas e governos, aos quais se cobram medidas concretas. Não basta, porém, transferir a responsabilidade ao poder público: cada cidadão, na condição de consumidor, dispõe de instrumentos para pressionar o mercado, seja pela escolha do que compra, seja pela recusa do que degrada. O planeta, afinal, não é herança, mas empréstimo.» Com base nas ideias e nas estruturas linguísticas do texto, julgue o item: No trecho \"O planeta, afinal, não é herança, mas empréstimo\", os vocábulos \"herança\" e \"empréstimo\" são empregados em sentido conotativo, opondo a ideia de posse definitiva à de posse temporária.",a:true,e:"CERTO. Herança e empréstimo aparecem em sentido figurado (conotativo) para opor a posse definitiva à temporária do planeta."},
{m:"Português",id:"Simulado3|006",bloco:"G",tema:"Pontuação, orações e conjunções - dois-pontos",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:6,s:"Texto: «O consumo consciente deixou de ser bandeira de poucos para tornar-se exigência de muitos. À medida que se agravam os sinais das mudanças climáticas, cresce a pressão sobre empresas e governos, aos quais se cobram medidas concretas. Não basta, porém, transferir a responsabilidade ao poder público: cada cidadão, na condição de consumidor, dispõe de instrumentos para pressionar o mercado, seja pela escolha do que compra, seja pela recusa do que degrada. O planeta, afinal, não é herança, mas empréstimo.» Com base nas ideias e nas estruturas linguísticas do texto, julgue o item: O emprego dos dois-pontos após \"ao poder público\" justifica-se por introduzir uma enumeração de elementos, função típica desse sinal nesse contexto.",a:false,e:"ERRADO. Os dois-pontos introduzem uma explicação/desdobramento da ideia anterior, e não uma enumeração."},
{m:"Português",id:"Simulado3|007",bloco:"G",tema:"Crase e regência - aonde",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:7,s:"Texto: «A tecnologia da informação redesenhou as relações de trabalho. Se, no passado, o expediente terminava ao cruzar a porta do escritório, hoje as mensagens perseguem o trabalhador aonde quer que ele vá. Convém, portanto, que se estabeleçam limites claros, sob pena de o descanso converter-se em mera ficção.» Com base nas ideias e nos aspectos linguísticos do texto, julgue o item: O emprego de \"aonde\", em \"aonde quer que ele vá\", decorre da regência da forma verbal \"vá\", que exige a preposição \"a\", indicativa de destino ou movimento.",a:true,e:"CERTO. 'Aonde' = a + onde e indica movimento/destino; o verbo 'ir' rege a preposição 'a'."},
{m:"Português",id:"Simulado3|008",bloco:"G",tema:"Colocação pronominal",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:8,s:"Texto: «A tecnologia da informação redesenhou as relações de trabalho. Se, no passado, o expediente terminava ao cruzar a porta do escritório, hoje as mensagens perseguem o trabalhador aonde quer que ele vá. Convém, portanto, que se estabeleçam limites claros, sob pena de o descanso converter-se em mera ficção.» Com base nas ideias e nos aspectos linguísticos do texto, julgue o item: No trecho \"que se estabeleçam limites claros\", seria igualmente correta, na norma-padrão, a colocação do pronome em ênclise, como em \"que estabeleçam-se limites claros\".",a:false,e:"ERRADO. Depois de 'que' (palavra atrativa), a próclise é obrigatória: 'que se estabeleçam'. A ênclise seria incorreta."},
{m:"Português",id:"Simulado3|009",bloco:"G",tema:"Orações subordinadas substantivas",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:9,s:"Texto: «A tecnologia da informação redesenhou as relações de trabalho. Se, no passado, o expediente terminava ao cruzar a porta do escritório, hoje as mensagens perseguem o trabalhador aonde quer que ele vá. Convém, portanto, que se estabeleçam limites claros, sob pena de o descanso converter-se em mera ficção.» Com base nas ideias e nos aspectos linguísticos do texto, julgue o item: Em \"Convém, portanto, que se estabeleçam limites claros\", a oração \"que se estabeleçam limites claros\" exerce a função de sujeito da forma verbal \"Convém\".",a:true,e:"CERTO. A oração 'que se estabeleçam limites claros' é o sujeito de 'Convém' (subordinada substantiva subjetiva)."},
{m:"Português",id:"Simulado3|010",bloco:"G",tema:"Concordância verbal e nominal - anexo",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:10,s:"A respeito da concordância, da regência e do emprego dos vocábulos na norma-padrão, julgue o item: Na frase \"Seguem anexas as certidões solicitadas\", o vocábulo \"anexas\" concorda em gênero e número com \"certidões\", razão por que se flexiona no feminino plural.",a:true,e:"CERTO. 'Anexo' é adjetivo e concorda com o substantivo: 'anexas' (feminino plural) com 'certidões'."},
{m:"Português",id:"Simulado3|011",bloco:"G",tema:"Concordância verbal e nominal - haver",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:11,s:"A respeito da concordância, da regência e do emprego dos vocábulos na norma-padrão, julgue o item: Na oração \"Houveram muitos debates sobre o tema\", a forma verbal \"Houveram\", empregada no sentido de existir, flexiona-se corretamente no plural para concordar com \"muitos debates\".",a:false,e:"ERRADO. 'Haver' no sentido de existir é impessoal e fica no singular: 'Houve muitos debates'."},
{m:"Português",id:"Simulado3|012",bloco:"G",tema:"Crase e regência - preferir",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:12,s:"A respeito da concordância, da regência e do emprego dos vocábulos na norma-padrão, julgue o item: Na frase \"Ela prefere o teatro do que o cinema\", a regência da forma verbal \"prefere\" está de acordo com a norma-padrão, que admite a estrutura comparativa \"preferir mais isto do que aquilo\".",a:false,e:"ERRADO. 'Preferir' rege a preposição 'a' e não admite 'do que' nem 'mais': 'prefere o teatro ao cinema'."},
{m:"História do Brasil",id:"Simulado3|013",bloco:"G",tema:"Colonial - governo-geral",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:13,s:"A respeito do período colonial e do Império no Brasil, julgue o item: Diante do fracasso parcial do sistema de capitanias hereditárias, a Coroa portuguesa instituiu, em 1548, o governo-geral, tendo sido Tomé de Sousa o primeiro governador-geral do Brasil, com sede na cidade de Salvador.",a:true,e:"CERTO. O governo-geral foi criado em 1548; Tomé de Sousa foi o primeiro governador-geral, com sede em Salvador."},
{m:"História do Brasil",id:"Simulado3|014",bloco:"G",tema:"Colonial - Inconfidência Mineira",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:14,s:"A respeito do período colonial e do Império no Brasil, julgue o item: A Inconfidência Mineira, de 1789, influenciada pelos ideais iluministas, teve caráter separatista e republicano e resultou na proclamação, ainda que efêmera, de uma república em Vila Rica, logo sufocada pelas tropas da Coroa.",a:false,e:"ERRADO. A conspiração foi descoberta e reprimida antes da revolta; não houve proclamação de república."},
{m:"História do Brasil",id:"Simulado3|015",bloco:"G",tema:"Abolição da escravidão - Lei Áurea",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:15,s:"A respeito do período colonial e do Império no Brasil, julgue o item: A Lei Áurea, assinada em 1888 pela Princesa Isabel, extinguiu a escravidão no Brasil sem prever indenização aos proprietários nem políticas de integração dos libertos à sociedade.",a:true,e:"CERTO. A Lei Áurea (1888) aboliu a escravidão sem indenizar os senhores e sem prever inserção social dos libertos."},
{m:"História do Brasil",id:"Simulado3|016",bloco:"G",tema:"República Velha - Revolta da Chibata",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:16,s:"A respeito do período colonial e do Império no Brasil, julgue o item: A Revolta da Chibata, ocorrida em 1910 e liderada pelo marinheiro João Cândido, protestava contra os castigos físicos impostos aos marujos e resultou na abolição desses castigos e na plena anistia dos revoltosos, que retornaram sem punição às suas funções na Marinha.",a:false,e:"ERRADO. Houve anistia formal, mas os marinheiros foram depois punidos (expulsões, prisões e a tragédia da Ilha das Cobras); não voltaram sem punição."},
{m:"História do Brasil",id:"Simulado3|017",bloco:"G",tema:"República Velha - Semana de Arte Moderna",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:17,s:"Acerca da história republicana do Brasil, julgue o item: A Semana de Arte Moderna de 1922, realizada no Rio de Janeiro, então capital federal, reuniu artistas em ruptura com o academicismo e na valorização de temas nacionais, entre eles Mário de Andrade e Anita Malfatti.",a:false,e:"ERRADO. A Semana de 1922 ocorreu em São Paulo (Theatro Municipal), e não no Rio de Janeiro."},
{m:"História do Brasil",id:"Simulado3|018",bloco:"G",tema:"Era Vargas - Revolução Constitucionalista de 1932",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:18,s:"Acerca da história republicana do Brasil, julgue o item: A Revolução Constitucionalista de 1932, deflagrada em São Paulo contra o governo provisório de Getúlio Vargas, reivindicava a convocação de uma assembleia constituinte e, embora militarmente derrotada, contribuiu para a promulgação da Constituição de 1934.",a:true,e:"CERTO. A revolta paulista exigia constituinte; foi derrotada, mas contribuiu para a Constituição de 1934."},
{m:"História do Brasil",id:"Simulado3|019",bloco:"G",tema:"Era Vargas - suicídio de Vargas",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:19,s:"Acerca da história republicana do Brasil, julgue o item: Getúlio Vargas, após retornar à Presidência pelo voto popular em 1951, suicidou-se em 1954, em meio a grave crise política, deixando uma carta-testamento de forte apelo popular.",a:true,e:"CERTO. Vargas foi eleito em 1950, assumiu em 1951 e se suicidou em 1954, deixando a Carta-Testamento."},
{m:"História do Brasil",id:"Simulado3|020",bloco:"G",tema:"Ditadura militar - golpe de 1964",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:20,s:"Acerca da história republicana do Brasil, julgue o item: O golpe civil-militar de 1964 depôs o presidente João Goulart e inaugurou um regime que, logo em seu primeiro ato institucional, restabeleceu as eleições diretas para a Presidência da República.",a:false,e:"ERRADO. O golpe depôs Jango, mas o AI-1 manteve eleição INDIRETA (pelo Congresso) para a Presidência."},
{m:"História do Maranhão",id:"Simulado3|021",bloco:"G",tema:"São Luís: franceses, portugueses e holandeses",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:21,s:"A respeito da história do Maranhão nos períodos colonial e imperial, julgue o item: Entre 1641 e 1644, São Luís esteve sob domínio holandês, ocupada por forças da Companhia das Índias Ocidentais, tendo a expulsão dos neerlandeses resultado de intensa resistência de colonos e indígenas locais.",a:true,e:"CERTO. Os holandeses (WIC) ocuparam São Luís de 1641 a 1644 e foram expulsos pela resistência local."},
{m:"História do Maranhão",id:"Simulado3|022",bloco:"G",tema:"Adesão do Maranhão à Independência",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:22,s:"A respeito da história do Maranhão nos períodos colonial e imperial, julgue o item: A adesão do Maranhão à independência do Brasil deu-se ainda em setembro de 1822, imediatamente após o Grito do Ipiranga, figurando São Luís entre as primeiras cidades a reconhecer D. Pedro I.",a:false,e:"ERRADO. O Maranhão só aderiu à independência em 28 de julho de 1823, quase um ano após o Grito do Ipiranga."},
{m:"História do Maranhão",id:"Simulado3|023",bloco:"G",tema:"Maranhão colonial: algodão e economia colonial",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:23,s:"A respeito da história do Maranhão nos períodos colonial e imperial, julgue o item: A economia maranhense conheceu, no fim do século XVIII, notável prosperidade fundada nas lavouras de algodão e de arroz; a decadência do algodão, no século XIX, associou-se, entre outros fatores, à concorrência da produção norte-americana.",a:true,e:"CERTO. Algodão e arroz enriqueceram o Maranhão no fim do séc. XVIII; a concorrência norte-americana contribuiu para a queda do algodão."},
{m:"História do Maranhão",id:"Simulado3|024",bloco:"G",tema:"Patrimônio e cultura do Maranhão - Atenas Brasileira",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:24,s:"A respeito da história do Maranhão nos períodos colonial e imperial, julgue o item: No século XIX, São Luís recebeu a alcunha de \"Atenas Brasileira\" em razão da intensa vida literária e da geração de escritores maranhenses de projeção nacional, como Gonçalves Dias e Aluísio Azevedo.",a:true,e:"CERTO. São Luís foi chamada de 'Atenas Brasileira' pela efervescência literária (Gonçalves Dias, Aluísio Azevedo, entre outros)."},
{m:"História do Maranhão",id:"Simulado3|025",bloco:"G",tema:"Cultura maranhense - Gonçalves Dias",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:25,s:"Acerca de figuras e manifestações culturais do Maranhão, julgue o item: Gonçalves Dias, poeta maranhense do Romantismo, é autor de \"Canção do Exílio\" e do romance indianista \"O Guarani\", obra que consagrou o herói Peri.",a:false,e:"ERRADO. 'O Guarani' é de José de Alencar. Gonçalves Dias escreveu a 'Canção do Exílio', mas não esse romance."},
{m:"História do Maranhão",id:"Simulado3|026",bloco:"G",tema:"Cultura maranhense - bumba meu boi",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:26,s:"Acerca de figuras e manifestações culturais do Maranhão, julgue o item: O Bumba meu boi maranhense, reconhecido como Patrimônio Cultural Imaterial do Brasil, organiza-se em um único sotaque, o de matraca, típico da Ilha de São Luís.",a:false,e:"ERRADO. O bumba meu boi do Maranhão tem vários sotaques (matraca, zabumba, orquestra, baixada, costa de mão)."},
{m:"História do Maranhão",id:"Simulado3|027",bloco:"G",tema:"Cultura maranhense - Tambor de Crioula",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:27,s:"Acerca de figuras e manifestações culturais do Maranhão, julgue o item: O Tambor de Crioula, dança de matriz africana típica do Maranhão, executada ao som de tambores e em louvor a São Benedito, é reconhecido como Patrimônio Cultural Imaterial do Brasil.",a:true,e:"CERTO. O Tambor de Crioula, ligado à devoção a São Benedito, é Patrimônio Cultural Imaterial do Brasil."},
{m:"Geografia do Brasil",id:"Simulado3|028",bloco:"G",tema:"Relevo brasileiro",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:28,s:"A respeito dos aspectos físicos do território brasileiro, julgue o item: No relevo brasileiro predominam os planaltos e as depressões, sendo menos extensas as planícies; o país não apresenta cadeias montanhosas de dobramentos modernos, o que explica as altitudes relativamente modestas de suas terras.",a:true,e:"CERTO. Predominam planaltos e depressões; não há cadeias de dobramentos modernos, o que explica as altitudes modestas."},
{m:"Geografia do Brasil",id:"Simulado3|029",bloco:"G",tema:"Clima tropical",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:29,s:"A respeito dos aspectos físicos do território brasileiro, julgue o item: O clima tropical típico, presente em grande parte do território, caracteriza-se por duas estações bem definidas  1�7 uma quente e chuvosa e outra quente e seca  1�7 e por temperaturas médias elevadas ao longo do ano.",a:true,e:"CERTO. O clima tropical típico tem duas estações (quente e chuvosa, quente e seca) e médias térmicas elevadas."},
{m:"Geografia do Brasil",id:"Simulado3|030",bloco:"G",tema:"Biomas - Amazônia",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:30,s:"A respeito dos aspectos físicos do território brasileiro, julgue o item: Na Floresta Amazônica, grande parte dos nutrientes concentra-se em solos profundos e naturalmente férteis, o que explica a elevada produtividade agrícola espontânea observada em toda a região.",a:false,e:"ERRADO. Na Amazônia os solos são em geral pobres e rasos; os nutrientes ficam na serapilheira (ciclagem rápida da matéria orgânica)."},
{m:"Geografia do Brasil",id:"Simulado3|031",bloco:"G",tema:"Biomas - Mata Atlântica",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:31,s:"A respeito dos aspectos físicos do território brasileiro, julgue o item: A Mata Atlântica, bioma que se estende pelo litoral brasileiro, mantém-se hoje majoritariamente preservada, conservando mais de setenta por cento de sua cobertura vegetal original.",a:false,e:"ERRADO. A Mata Atlântica é o bioma mais devastado: restam por volta de 12% a 15% da cobertura original."},
{m:"Geografia do Brasil",id:"Simulado3|032",bloco:"G",tema:"Hidrografia - bacia do Paraná e Itaipu",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:32,s:"Acerca da hidrografia, da população e da economia do espaço brasileiro, julgue o item: A bacia do rio Paraná destaca-se pelo elevado potencial hidrelétrico, nela se localizando a usina de Itaipu, uma das maiores do mundo em geração de energia.",a:true,e:"CERTO. A bacia do Paraná tem alto potencial hidrelétrico e abriga Itaipu, uma das maiores usinas do mundo."},
{m:"Geografia do Brasil",id:"Simulado3|033",bloco:"G",tema:"População - urbanização",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:33,s:"Acerca da hidrografia, da população e da economia do espaço brasileiro, julgue o item: O Brasil consolidou-se como país predominantemente urbano ainda na primeira metade do século XX, de modo que, já no recenseamento de 1950, a população urbana havia superado a rural no conjunto do território nacional.",a:false,e:"ERRADO. O Brasil tornou-se predominantemente urbano no censo de 1970; em 1950 a população rural ainda era maioria."},
{m:"Geografia do Brasil",id:"Simulado3|034",bloco:"G",tema:"População - transição demográfica",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:34,s:"Acerca da hidrografia, da população e da economia do espaço brasileiro, julgue o item: O Brasil encontra-se em fase inicial da transição demográfica, marcada por altas taxas de natalidade e de mortalidade e por uma pirâmide etária de base larga e topo muito estreito.",a:false,e:"ERRADO. O Brasil está em fase avançada da transição demográfica: natalidade e mortalidade baixas e envelhecimento da população."},
{m:"Geografia do Brasil",id:"Simulado3|035",bloco:"G",tema:"Matriz energética",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:35,s:"Acerca da hidrografia, da população e da economia do espaço brasileiro, julgue o item: Na matriz energética brasileira, considerados todos os usos de energia, os combustíveis fósseis, sobretudo o petróleo e seus derivados, ainda respondem por parcela expressiva do consumo.",a:true,e:"CERTO. Petróleo e derivados seguem como a maior fatia da matriz energética brasileira (considerando todos os usos)."},
{m:"Geografia do Maranhão",id:"Simulado3|036",bloco:"G",tema:"Litoral do Maranhão",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:36,s:"A respeito dos aspectos geográficos do Maranhão, julgue o item: O Maranhão possui um dos litorais mais extensos do Brasil, entrecortado por baías, golfões e reentrâncias, e faz limite, a leste, com o Piauí, tendo o rio Parnaíba como divisa natural.",a:true,e:"CERTO. O litoral maranhense é um dos maiores do país, com baías e reentrâncias; a leste faz divisa com o Piauí (rio Parnaíba)."},
{m:"Geografia do Maranhão",id:"Simulado3|037",bloco:"G",tema:"Litoral do Maranhão - ilha de São Luís",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:37,s:"A respeito dos aspectos geográficos do Maranhão, julgue o item: A capital, São Luís, localiza-se em uma ilha situada no Golfão Maranhense, entre as baías de São Marcos e São José, sendo a única capital brasileira instalada em ambiente insular.",a:false,e:"ERRADO. São Luís está mesmo na ilha entre as baías de São Marcos e São José, mas não é a única capital insular: Florianópolis e Vitória também ocupam ilhas."},
{m:"Geografia do Maranhão",id:"Simulado3|038",bloco:"G",tema:"Chapada das Mesas",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:38,s:"A respeito dos aspectos geográficos do Maranhão, julgue o item: No sul do Maranhão, no município de Carolina, situa-se a Chapada das Mesas, conjunto de formações rochosas tabulares, cachoeiras e nascentes, com crescente exploração turística.",a:true,e:"CERTO. A Chapada das Mesas fica no sul do estado (Carolina), com formações tabulares, cachoeiras e nascentes."},
{m:"Geografia do Maranhão",id:"Simulado3|039",bloco:"G",tema:"Litoral do Maranhão - Lençóis Maranhenses",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:39,s:"A respeito dos aspectos geográficos do Maranhão, julgue o item: Os Lençóis Maranhenses, extenso campo de dunas do litoral do estado, constituem uma formação desértica, uma vez que a região apresenta baixos índices pluviométricos ao longo do ano.",a:false,e:"ERRADO. Os Lençóis têm dunas, mas chuvas intensas (jan-jun) formam lagoas; não são um deserto."},
{m:"Geografia do Maranhão",id:"Simulado3|040",bloco:"G",tema:"Economia do Maranhão - Porto do Itaqui",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:40,s:"Acerca da economia e da hidrografia do Maranhão, julgue o item: O Porto do Itaqui, em São Luís, dedica-se ao turismo e à pesca artesanal, não desempenhando papel relevante na exportação de minério de ferro, atividade concentrada em portos da Região Sudeste.",a:false,e:"ERRADO. O Itaqui é um dos principais portos de escoamento de minério de ferro (Carajás), soja e derivados."},
{m:"Geografia do Maranhão",id:"Simulado3|041",bloco:"G",tema:"Economia do Maranhão - Imperatriz",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:41,s:"Acerca da economia e da hidrografia do Maranhão, julgue o item: Imperatriz, segunda maior cidade do Maranhão, localiza-se no sudoeste do estado, na margem direita do rio Tocantins, e constitui importante polo comercial e de serviços, cortada pela rodovia BR-010, a Belém–Brasília.",a:true,e:"CERTO. Imperatriz é a segunda maior cidade do MA, no sudoeste, à margem direita do Tocantins, cortada pela BR-010."},
{m:"Geografia do Maranhão",id:"Simulado3|042",bloco:"G",tema:"Hidrografia do Maranhão - rio Itapecuru",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:42,s:"Acerca da economia e da hidrografia do Maranhão, julgue o item: O rio Itapecuru, genuinamente maranhense, tem grande importância histórica e econômica, servindo, inclusive, ao abastecimento de água de parte da Região Metropolitana de São Luís.",a:true,e:"CERTO. O Itapecuru nasce e desagua no Maranhão e abastece parte da Grande São Luís (sistema Italuís)."},
{m:"Raciocínio Lógico",id:"Simulado3|043",bloco:"G",tema:"Negações - condicional",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:43,s:"Acerca de estruturas lógicas, negações, valores lógicos e equivalências, julgue o item: A negação da proposição \"Se Paulo corre, então emagrece\" é \"Paulo corre e não emagrece\".",a:true,e:"CERTO. A negação de p ↄ1�7 q é p ∄1�7 ~q: 'Paulo corre e não emagrece'."},
{m:"Raciocínio Lógico",id:"Simulado3|044",bloco:"G",tema:"Proposições, conectivos e tabela-verdade - valor lógico",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:44,s:"Acerca de estruturas lógicas, negações, valores lógicos e equivalências, julgue o item: Sejam p e q proposições simples, com p verdadeira e q falsa. Nessas condições, a proposição composta (p ∄1�7 q) ∄1�7 (¬p) tem valor lógico verdadeiro.",a:false,e:"ERRADO. Com p = V e q = F: (p ∄1�7 q) = V e ¬p = F; logo V ∄1�7 F = F."},
{m:"Raciocínio Lógico",id:"Simulado3|045",bloco:"G",tema:"Negações - quantificadores",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:45,s:"Acerca de estruturas lógicas, negações, valores lógicos e equivalências, julgue o item: A negação da proposição \"Todos os alunos foram aprovados\" é \"Nenhum aluno foi aprovado\".",a:false,e:"ERRADO. A negação de 'Todos' é 'Algum ... não' (pelo menos um não foi aprovado), e não 'Nenhum'."},
