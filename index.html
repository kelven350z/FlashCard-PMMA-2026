{m:"Legislação Institucional",bloco:"E",tema:"LOB/PMMA - Lei 12.896/2026",dif:"media",fonte:"Lei nº 12.896/2026 (Lei de Organização Básica da PMMA)",s:"A Lei nº 12.896/2026 dispõe sobre a organização básica da Polícia Militar do Estado do Maranhão, disciplinando sua estrutura organizacional em consonância com a Lei Orgânica Nacional das Polícias Militares.",a:true,e:"CERTO. A Lei nº 12.896/2026 é a Lei de Organização Básica (LOB) da PMMA, que define a estrutura organizacional da corporação em harmonia com a Lei Federal nº 14.751/2023."},
{m:"Legislação Institucional",bloco:"E",tema:"LOB/PMMA - estrutura organizacional",dif:"dificil",fonte:"Lei nº 12.896/2026 (Lei de Organização Básica da PMMA)",s:"Compete à Lei de Organização Básica da PMMA (Lei nº 12.896/2026) definir a estrutura de comando, as unidades e as organizações policiais militares (OPMs) que compõem a corporação.",a:true,e:"CERTO. É função típica de uma Lei de Organização Básica estabelecer o desenho institucional, o comando e as unidades operacionais e administrativas da corporação."},
{m:"Legislação Institucional",bloco:"E",tema:"LOB/PMMA - hierarquia entre normas",dif:"dificil",fonte:"Lei nº 12.896/2026 (Lei de Organização Básica da PMMA)",s:"A Lei nº 12.896/2026, por ser lei estadual, deve observar os parâmetros gerais fixados pela Lei Federal nº 14.751/2023 (Lei Orgânica Nacional das Polícias Militares e Corpos de Bombeiros Militares).",a:true,e:"CERTO. As leis estaduais de organização básica das polícias militares devem obediência às normas gerais estabelecidas pela Lei Orgânica Nacional, de caráter federal."},
{m:"Legislação Institucional",bloco:"E",tema:"LOB/PMMA - vigência",dif:"media",fonte:"Lei nº 12.896/2026 (Lei de Organização Básica da PMMA)",s:"A edição da Lei nº 12.896/2026 revoga automaticamente, em sua totalidade, o Estatuto dos Policiais Militares do Maranhão (Lei estadual nº 6.513/1995).",a:false,e:"ERRADO. A LOB trata da organização básica (estrutura, unidades, efetivos) da corporação, matéria distinta do Estatuto, que disciplina a situação, os direitos e deveres dos policiais militares; uma lei não revoga a outra automaticamente por tratarem de objetos diversos."},
{m:"Legislação Institucional",bloco:"E",tema:"LOB/PMMA - efetivo",dif:"media",fonte:"Lei nº 12.896/2026 (Lei de Organização Básica da PMMA)",s:"A fixação do efetivo geral da Polícia Militar do Maranhão, por envolver despesa pública e estrutura de pessoal, deve ser tratada por lei em sentido estrito, como a Lei nº 12.896/2026.",a:true,e:"CERTO. Por implicar despesa e organização de quadros de pessoal, a definição do efetivo de uma corporação militar estadual é matéria reservada à lei, não podendo ser tratada apenas por ato infralegal."},
{m:"Legislação Institucional",bloco:"E",tema:"LOB/PMMA - competência legislativa",dif:"facil",fonte:"Lei nº 12.896/2026 (Lei de Organização Básica da PMMA)",s:"A Lei nº 12.896/2026 foi aprovada pela Assembleia Legislativa do Estado do Maranhão, casa legislativa competente para tratar da organização básica da Polícia Militar estadual.",a:true,e:"CERTO. Por se tratar de matéria de organização de órgão estadual, a competência legislativa é da Assembleia Legislativa do respectivo estado, no caso, do Maranhão."},

// ---- INFORMÁTICA (E) ----
// Bloco A: itens inspirados na prova real Cebraspe PM/MA 2017 (reescritos, não são cópia literal)
{m:"Informática",bloco:"E",tema:"Windows 7 - perfis de usuário",dif:"media",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"No Windows 7, um perfil de usuário é criado automaticamente na primeira vez em que a pessoa efetua login no sistema, independentemente de o computador estar conectado à internet.",a:true,e:"CERTO. O perfil local é criado no primeiro login, mesmo sem conexão à internet; a criação de perfil não depende de sincronização em nuvem."},
{m:"Informática",bloco:"E",tema:"Windows 7 - perfis de usuário",dif:"dificil",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"Se o computador estiver conectado à internet, o perfil local do usuário no Windows 7 passa a ser armazenado exclusivamente na nuvem da Microsoft, deixando de existir localmente.",a:false,e:"ERRADO. O Windows 7 mantém o perfil localmente no computador; a conexão à internet, por si só, não migra o perfil para a nuvem."},
{m:"Informática",bloco:"E",tema:"Word - formatos de arquivo",dif:"facil",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"Os documentos criados no Microsoft Word 2007 e versões posteriores utilizam, por padrão, a extensão .docx.",a:true,e:"CERTO. A partir do Word 2007, o formato padrão baseado em XML passou a usar a extensão .docx, substituindo o antigo .doc."},
{m:"Informática",bloco:"E",tema:"Word - imagens",dif:"facil",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"O Microsoft Word permite a inserção de imagens nos formatos JPEG e PNG diretamente em um documento.",a:true,e:"CERTO. O Word suporta a inserção de diversos formatos de imagem, incluindo JPEG e PNG, por meio da opção de inserir imagem."},
{m:"Informática",bloco:"E",tema:"Word - formato XML",dif:"dificil",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"O uso do padrão XML nos arquivos do Word 2007 torna os documentos maiores e menos confiáveis quando comparados a arquivos no formato RTF.",a:false,e:"ERRADO. O formato XML (.docx) é compactado e, em geral, resulta em arquivos menores e mais robustos contra corrupção do que o RTF, e não maiores/menos confiáveis."},
{m:"Informática",bloco:"E",tema:"Excel - função SE",dif:"media",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"No Microsoft Excel, a função SE retorna um valor caso uma condição de teste seja verdadeira e outro valor caso essa condição seja falsa.",a:true,e:"CERTO. Essa é a definição padrão da função condicional SE (ou IF): =SE(condição; valor_se_verdadeiro; valor_se_falso)."},
{m:"Informática",bloco:"E",tema:"PowerPoint - impressão",dif:"media",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"O Microsoft PowerPoint 2007 permite imprimir uma apresentação no formato de folhetos, com até nove slides reduzidos em uma única página.",a:true,e:"CERTO. A opção de impressão em folhetos do PowerPoint permite configurar de 1 a 9 slides por página impressa."},
{m:"Informática",bloco:"E",tema:"PowerPoint - abas",dif:"dificil",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"No Microsoft PowerPoint 2007, é na aba Revisão que se escolhe o tipo e a velocidade da transição entre os slides de uma apresentação.",a:false,e:"ERRADO. A configuração de transições entre slides fica na aba Animações (Transição para este Slide), e não na aba Revisão, que trata de comentários e correção ortográfica."},
{m:"Informática",bloco:"E",tema:"Windows 7 - arquivos e pastas",dif:"media",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"No Windows 7, uma mesma pasta pode conter dois arquivos com exatamente o mesmo nome e a mesma extensão.",a:false,e:"ERRADO. Dentro de uma mesma pasta, não é permitido haver dois arquivos com nome e extensão idênticos; o sistema exige nomes distintos nesse mesmo diretório."},
{m:"Informática",bloco:"E",tema:"Redes - DNS, HTTP e HTTPS",dif:"media",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"Tanto o protocolo HTTP quanto o protocolo HTTPS podem ser utilizados tanto em redes internas (intranets) quanto na internet pública.",a:true,e:"CERTO. Ambos os protocolos funcionam em qualquer rede baseada em TCP/IP, seja uma intranet corporativa, seja a internet."},
{m:"Informática",bloco:"E",tema:"Redes - DNS",dif:"dificil",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"O protocolo DNS tem como função converter um nome de domínio em um endereço MAC da placa de rede do servidor de destino.",a:false,e:"ERRADO. O DNS traduz nomes de domínio em endereços IP, não em endereços MAC, que são resolvidos por outros protocolos (como o ARP) na rede local."},
{m:"Informática",bloco:"E",tema:"Software livre",dif:"media",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"Um requisito essencial para que um software seja considerado livre é o usuário ter acesso ao código-fonte, podendo aperfeiçoá-lo e compartilhar os aprimoramentos com a comunidade.",a:true,e:"CERTO. Essa liberdade de estudar, modificar e redistribuir o código-fonte é um dos pilares centrais da definição de software livre."},
{m:"Informática",bloco:"E",tema:"Software livre",dif:"dificil",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"Para ser classificado como livre, um software não pode ser comercializado nem ter cópias distribuídas mediante pagamento.",a:false,e:"ERRADO. Software livre refere-se à liberdade de uso, estudo, modificação e redistribuição, e não a preço; é plenamente possível vender cópias de um software livre."},
{m:"Informática",bloco:"E",tema:"Software livre - licenças",dif:"media",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"GNU GPL e GNU Lesser GPL (LGPL) são exemplos de licenças amplamente utilizadas para softwares livres.",a:true,e:"CERTO. GPL e LGPL, mantidas pela Free Software Foundation, são licenças clássicas de software livre/código aberto."},
{m:"Informática",bloco:"E",tema:"Hardware - dual-channel",dif:"dificil",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"A tecnologia dual-channel de memória exige a instalação de pelo menos dois módulos de memória RAM compatíveis, mas não exige a existência de dois processadores físicos.",a:true,e:"CERTO. O dual-channel diz respeito ao acesso simultâneo a dois (ou mais) módulos de memória pelo mesmo processador/controlador de memória, não dependendo de múltiplos processadores físicos."},
{m:"Informática",bloco:"E",tema:"Hardware - desempenho",dif:"media",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"Processadores modernos são capazes de ajustar dinamicamente seu desempenho de acordo com a demanda de processamento exigida no momento.",a:true,e:"CERTO. Tecnologias de escalonamento de frequência (como o Turbo Boost) permitem que o processador ajuste seu clock conforme a carga de trabalho."},
{m:"Informática",bloco:"E",tema:"Backup / becape",dif:"media",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"Entre as boas práticas de becape (cópia de segurança) está a criptografia das cópias quando houver necessidade de manter sigilo e confidencialidade dos dados.",a:true,e:"CERTO. Criptografar becapes que contenham dados sensíveis é prática recomendada de segurança da informação."},
{m:"Informática",bloco:"E",tema:"Segurança - malware",dif:"dificil",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"O ransomware é um tipo de ataque que, geralmente utilizando criptografia, torna inacessíveis os dados armazenados em um equipamento até que um resgate seja pago.",a:true,e:"CERTO. Essa é a definição clássica de ransomware: sequestro de dados por criptografia, com exigência de pagamento para a suposta liberação."},
{m:"Informática",bloco:"E",tema:"Segurança - bot",dif:"dificil",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"Um bot é um programa malicioso que permite a um invasor controlar remotamente o computador infectado, podendo propagar a infecção de forma automática.",a:true,e:"CERTO. Bots dispõem de mecanismos de comunicação remota com o invasor (formando botnets), permitindo controle à distância e propagação automática da infecção."},
{m:"Informática",bloco:"E",tema:"Segurança - vírus x worm",dif:"dificil",fonte:"Inspirada em item da Cebraspe  1�7 PM/MA 2017",s:"Diferentemente do vírus, que costuma depender de um arquivo hospedeiro e de ação do usuário, o worm é capaz de se propagar automaticamente pela rede, explorando vulnerabilidades.",a:true,e:"CERTO. Essa é a distinção clássica: o vírus infecta arquivos e precisa de execução pelo usuário; o worm se autorreplica pela rede sem necessidade de ação humana."},

// Bloco B: fundamentos gerais, estilo Cebraspe
{m:"Informática",bloco:"E",tema:"Windows",dif:"facil",fonte:"Questão inédita, estilo Cebraspe",s:"No Windows 11, o atalho Ctrl+Shift+Esc abre diretamente o Gerenciador de Tarefas, sem passar pela tela de segurança.",a:true,e:"CERTO. Diferente de Ctrl+Alt+Del (que abre um menu intermediário), Ctrl+Shift+Esc abre o Gerenciador de Tarefas diretamente."},
{m:"Informática",bloco:"E",tema:"Segurança da informação",dif:"media",fonte:"Questão inédita, estilo Cebraspe",s:"O protocolo HTTPS utiliza criptografia para impedir que terceiros na rede leiam o conteúdo transmitido entre cliente e servidor.",a:true,e:"CERTO. O HTTPS emprega TLS/SSL para garantir confidencialidade e integridade dos dados durante a transmissão."},
{m:"Informática",bloco:"E",tema:"Correio eletrônico",dif:"facil",fonte:"Questão inédita, estilo Cebraspe",s:"O campo 'Cco' (cópia oculta) de um e-mail permite enviar uma cópia da mensagem sem que os demais destinatários visualizem esse endereço.",a:true,e:"CERTO. O campo 'Cco' (Cópia Carbono Oculta / Bcc) oculta o destinatário para os demais receptores da mensagem."},
{m:"Informática",bloco:"E",tema:"Armazenamento em nuvem",dif:"facil",fonte:"Questão inédita, estilo Cebraspe",s:"Serviços de armazenamento em nuvem, como Google Drive e OneDrive, permitem acessar arquivos a partir de diferentes dispositivos conectados à internet.",a:true,e:"CERTO. Esse é o princípio básico da computação em nuvem: sincronização e acesso remoto a arquivos independentemente do dispositivo local."},
{m:"Informática",bloco:"E",tema:"Hardware",dif:"media",fonte:"Questão inédita, estilo Cebraspe",s:"A memória RAM é um tipo de memória não volátil, mantendo os dados armazenados mesmo após o desligamento do computador.",a:false,e:"ERRADO. A memória RAM é volátil: seu conteúdo é perdido quando o computador é desligado. Memória não volátil é, por exemplo, o HD/SSD."},
{m:"Informática",bloco:"E",tema:"Sistemas operacionais",dif:"dificil",fonte:"Questão inédita, estilo Cebraspe",s:"O sistema de arquivos NTFS, utilizado pelo Windows, oferece suporte a permissões de acesso e criptografia de arquivos, ao contrário do FAT32.",a:true,e:"CERTO. O NTFS suporta recursos avançados como permissões granulares, criptografia (EFS) e journaling, ausentes no sistema FAT32."},

// Bloco C: temas atuais mais cobrados (Windows 10/11, nuvem, IA, cibersegurança, redes sociais)
{m:"Informática",bloco:"E",tema:"Windows 10/11 - área de trabalho virtual",dif:"media",fonte:"Questão inédita, estilo Cebraspe",s:"O Windows 10 e o Windows 11 permitem a criação de múltiplas áreas de trabalho virtuais, possibilitando organizar janelas e aplicativos em ambientes separados.",a:true,e:"CERTO. O recurso 'Visão de Tarefas' (Task View) permite criar e alternar entre diversas áreas de trabalho virtuais no mesmo computador."},
{m:"Informática",bloco:"E",tema:"Windows 11 - requisitos",dif:"dificil",fonte:"Questão inédita, estilo Cebraspe",s:"Entre os requisitos mínimos oficiais para instalação do Windows 11 está a presença do módulo de segurança TPM (Trusted Platform Module) na versão 2.0.",a:true,e:"CERTO. A Microsoft exige, entre os requisitos mínimos, TPM 2.0, Secure Boot habilitado e processador compatível com a lista oficial de suporte."},
{m:"Informática",bloco:"E",tema:"Navegadores - modo anônimo",dif:"facil",fonte:"Questão inédita, estilo Cebraspe",s:"A navegação anônima (ou privada) em navegadores como Chrome e Edge impede que o histórico de navegação seja salvo localmente no dispositivo, mas não torna o usuário totalmente anônimo perante sites visitados ou o provedor de internet.",a:true,e:"CERTO. O modo anônimo evita o registro local de histórico e cookies, mas não oculta o endereço IP nem impede que sites e provedores de internet identifiquem a navegação."},
{m:"Informática",bloco:"E",tema:"Computação em nuvem - modelos",dif:"dificil",fonte:"Questão inédita, estilo Cebraspe",s:"No modelo de nuvem SaaS (Software as a Service), o usuário final acessa aplicações prontas pela internet, sem necessidade de gerenciar infraestrutura, servidores ou sistemas operacionais subjacentes.",a:true,e:"CERTO. No SaaS, toda a infraestrutura, plataforma e manutenção do software ficam a cargo do provedor; o usuário apenas consome a aplicação, geralmente via navegador."},
{m:"Informática",bloco:"E",tema:"Inteligência artificial generativa",dif:"media",fonte:"Questão inédita, estilo Cebraspe",s:"Ferramentas de inteligência artificial generativa, como chatbots baseados em grandes modelos de linguagem, podem produzir respostas incorretas apresentadas com aparência de certeza, fenômeno conhecido como 'alucinação'.",a:true,e:"CERTO. A 'alucinação' em IA generativa refere-se à geração de conteúdo falso, impreciso ou inventado, apresentado de forma confiante pelo modelo."},
{m:"Informática",bloco:"E",tema:"Autenticação - dois fatores",dif:"media",fonte:"Questão inédita, estilo Cebraspe",s:"A autenticação de dois fatores (2FA) aumenta a segurança de uma conta ao exigir, além da senha, um segundo elemento de verificação, como um código enviado ao celular do usuário.",a:true,e:"CERTO. A 2FA combina algo que o usuário sabe (senha) com algo que ele possui (celular/token) ou é (biometria), dificultando o acesso não autorizado mesmo com a senha comprometida."},
{m:"Informática",bloco:"E",tema:"Engenharia social - phishing",dif:"media",fonte:"Questão inédita, estilo Cebraspe",s:"O phishing é uma técnica de engenharia social que busca induzir a vítima a fornecer dados sensíveis, como senhas e números de cartão, geralmente por meio de mensagens ou sites falsos que imitam serviços legítimos.",a:true,e:"CERTO. O phishing explora a confiança do usuário por meio de comunicações fraudulentas (e-mail, SMS, redes sociais) que simulam instituições confiáveis para roubo de dados."},
{m:"Informática",bloco:"E",tema:"Redes sociais e privacidade",dif:"facil",fonte:"Questão inédita, estilo Cebraspe",s:"Configurações de privacidade em redes sociais permitem, em geral, restringir a visualização de publicações e informações pessoais apenas a determinados grupos de contatos.",a:true,e:"CERTO. A maioria das redes sociais oferece opções de privacidade granulares, permitindo limitar o público de cada publicação ou informação de perfil."},
{m:"Informática",bloco:"E",tema:"Firewall",dif:"media",fonte:"Questão inédita, estilo Cebraspe",s:"Um firewall tem como função principal controlar o tráfego de rede que entra e sai de um dispositivo ou rede, permitindo ou bloqueando conexões conforme regras de segurança definidas.",a:true,e:"CERTO. O firewall atua como uma barreira de controle de tráfego, com base em regras (portas, protocolos, endereços) para permitir ou negar comunicações."},
{m:"Informática",bloco:"E",tema:"Atalhos de teclado",dif:"facil",fonte:"Questão inédita, estilo Cebraspe",s:"O atalho Ctrl+L, na maioria dos navegadores de internet, posiciona o cursor na barra de endereços.",a:true,e:"CERTO. Ctrl+L (assim como Alt+D em alguns navegadores) é um atalho padrão para selecionar rapidamente a barra de endereços."},
{m:"Informática",bloco:"E",tema:"Word - controle de alterações",dif:"dificil",fonte:"Questão inédita, estilo Cebraspe",s:"O recurso 'Controlar Alterações' do Microsoft Word permite registrar edições feitas em um documento, possibilitando que sejam posteriormente aceitas ou rejeitadas por um revisor.",a:true,e:"CERTO. Disponível na aba Revisão, esse recurso marca inserções, exclusões e formatações alteradas, permitindo revisão colaborativa do documento."},
{m:"Informática",bloco:"E",tema:"Excel - referência absoluta",dif:"dificil",fonte:"Questão inédita, estilo Cebraspe",s:"No Microsoft Excel, o uso do símbolo '$' antes da letra da coluna e do número da linha de uma célula (ex.: $A$1) fixa essa referência ao copiar a fórmula para outras células.",a:true,e:"CERTO. O cifrão indica referência absoluta, impedindo que a célula referenciada mude quando a fórmula é copiada ou arrastada para outras posições da planilha."},
{m:"Informática",bloco:"E",tema:"Armazenamento - SSD x HD",dif:"media",fonte:"Questão inédita, estilo Cebraspe",s:"Unidades SSD (Solid State Drive) costumam apresentar velocidade de leitura e gravação superior à dos discos rígidos (HD) tradicionais, por não possuírem partes móveis.",a:true,e:"CERTO. Por utilizarem memória flash, sem componentes mecânicos, os SSDs alcançam velocidades de acesso e transferência significativamente maiores que os HDs."},
{m:"Informática",bloco:"E",tema:"Cibersegurança - VPN",dif:"media",fonte:"Questão inédita, estilo Cebraspe",s:"Uma VPN (Virtual Private Network) cria um túnel criptografado entre o dispositivo do usuário e a rede de destino, o que pode ajudar a proteger dados em conexões com redes Wi-Fi públicas.",a:true,e:"CERTO. A VPN encripta o tráfego entre o dispositivo e o servidor de destino, dificultando a interceptação de dados por terceiros em redes não confiáveis."},
{m:"Informática",bloco:"E",tema:"Backup em nuvem",dif:"media",fonte:"Questão inédita, estilo Cebraspe",s:"Um becape armazenado exclusivamente no mesmo local físico do dado original oferece proteção equivalente a um becape mantido em nuvem ou em outro local geograficamente distante.",a:false,e:"ERRADO. Manter cópias apenas no mesmo local expõe os dados a riscos simultâneos (incêndio, roubo, desastres); a boa prática recomenda cópias em locais geograficamente distintos, inclusive em nuvem."},
{m:"Informática",bloco:"E",tema:"Compartilhamento de arquivos",dif:"facil",fonte:"Questão inédita, estilo Cebraspe",s:"Serviços como Google Drive permitem definir diferentes níveis de permissão para arquivos compartilhados, como 'apenas visualização', 'comentário' ou 'edição'.",a:true,e:"CERTO. Esses serviços de nuvem oferecem controle granular de permissões, possibilitando restringir o que cada pessoa com acesso ao link pode fazer com o arquivo."},
{m:"Informática",bloco:"E",tema:"Redes - Wi-Fi e criptografia",dif:"dificil",fonte:"Questão inédita, estilo Cebraspe",s:"O protocolo WPA3 oferece, em geral, mecanismos de segurança superiores aos de seus antecessores (WEP e WPA2) para proteção de redes Wi-Fi.",a:true,e:"CERTO. O WPA3 introduziu melhorias como criptografia individualizada em redes abertas e maior resistência a ataques de força bruta, superando WEP e WPA2 em segurança."},
{m:"Informática",bloco:"E",tema:"Aplicativos de mensagens",dif:"media",fonte:"Questão inédita, estilo Cebraspe",s:"A criptografia de ponta a ponta, utilizada em aplicativos como WhatsApp, garante que apenas remetente e destinatário consigam ler o conteúdo das mensagens trocadas.",a:true,e:"CERTO. Nesse modelo, as mensagens são cifradas no dispositivo de origem e decifradas apenas no dispositivo de destino, impedindo o acesso ao conteúdo por terceiros, inclusive pelo próprio provedor do serviço."},
// ---- INFORMÁTICA - Windows 11 (simulado Prof. Joelson Cei, turma PM Maranhão, 25/09/26) ----
{m:"Informática",bloco:"E",tema:"Windows 11 - requisitos mínimos",dif:"media",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"Os requisitos mínimos de hardware estipulados pela Microsoft para a instalação nativa do Windows 11 visam garantir melhor desempenho e segurança por meio de recursos de hardware dedicados. Nesse sentido, para a execução do referido sistema operacional em arquitetura de 64 bits, exige-se, entre outros requisitos oficiais, o mínimo de 4 GB de memória RAM e 64 GB de espaço disponível em disco.",a:true,e:"CERTO. Os requisitos mínimos oficiais da Microsoft para o Windows 11 incluem processador de 1 GHz com 2+ núcleos, 4 GB de RAM, 64 GB de armazenamento, firmware UEFI com Secure Boot e TPM 2.0."},
{m:"Informática",bloco:"E",tema:"Windows 11 - Barra de Tarefas",dif:"media",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"A área de trabalho do Windows 11 atua como o ambiente gráfico central de interação do usuário com os recursos do sistema. Por padrão de fábrica, a Barra de Tarefas vem configurada para permanecer fixada obrigatoriamente na extremidade superior da tela, atuando adicionalmente como repositório físico permanente de arquivos temporários eliminados pelo usuário.",a:false,e:"ERRADO. Por padrão, a Barra de Tarefas do Windows 11 fica na extremidade inferior da tela (e pode ser reposicionada). Além disso, ela não funciona como repositório de arquivos excluídos; essa função é da Lixeira."},
{m:"Informática",bloco:"E",tema:"Windows 11 - Lixeira",dif:"media",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"No sistema operacional Windows 11, ao acionar o procedimento padrão de exclusão de um arquivo armazenado na unidade de disco rígido local, o item é transferido para a Lixeira. Caso o usuário decida restaurar esse arquivo a partir da Lixeira, o sistema operacional irá movê-lo automaticamente para o diretório 'Meus Documentos', independentemente do caminho de origem onde o arquivo estava salvo no momento do envio à Lixeira.",a:false,e:"ERRADO. Ao restaurar um arquivo da Lixeira, o Windows o devolve para a pasta original de onde ele foi excluído, e não para 'Meus Documentos'."},
{m:"Informática",bloco:"E",tema:"Windows 11 - exclusão em mídia removível",dif:"media",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"As regras de gerenciamento de arquivos no Windows 11 preveem exceções para a destinação de itens removidos pelo usuário. Quando a exclusão de um arquivo é executada em dispositivos de armazenamento de massa removíveis, como pen drives formatados em sistemas de arquivos compatíveis, o item não é enviado para a Lixeira, ocorrendo a sua eliminação direta e permanente da mídia.",a:true,e:"CERTO. Arquivos excluídos de unidades removíveis (como pen drives) normalmente não passam pela Lixeira, sendo apagados de forma direta e permanente do dispositivo."},
{m:"Informática",bloco:"E",tema:"Windows 11 - atalho do Menu Iniciar",dif:"facil",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"No Windows 11, a interação com os componentes do sistema pode ser realizada mediante atalhos de teclado. Caso o usuário pretenda abrir o Menu Iniciar para acessar seus aplicativos fixados ou navegar pelas configurações do sistema sem utilizar a tecla com o logotipo do Windows, ele poderá obter o mesmo resultado pressionando simultaneamente as teclas CTRL + ESC.",a:true,e:"CERTO. O atalho CTRL+ESC abre o Menu Iniciar como alternativa à tecla Windows, funcionalidade herdada de versões antigas do sistema e mantida no Windows 11."},
{m:"Informática",bloco:"E",tema:"Windows 11 - Widgets",dif:"dificil",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"Na interface do Windows 11, os painéis dinâmicos que exibem informações em tempo real  1�7 como previsão do tempo, cotações financeiras, notícias personalizadas e lembretes do calendário  1�7 são denominados Gadgets do Sistema, herdando exatamente a mesma nomenclatura e arquitetura de código introduzida no Windows 7.",a:false,e:"ERRADO. No Windows 11 esse recurso é chamado de Widgets, e não de Gadgets. Os Gadgets do Windows 7/Vista foram descontinuados em 2012 por falhas de segurança; os Widgets do Windows 11 usam arquitetura própria, sem herdar o código antigo."},
{m:"Informática",bloco:"E",tema:"Windows 11 - Assistente de Foco",dif:"facil",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"O recurso nativo do Windows 11 projetado para minimizar distrações durante momentos de estudo ou trabalho, permitindo ao usuário definir regras para o silenciamento ou a exibição seletiva de alertas e notificações emitidos por aplicativos e pelo próprio sistema, é denominado Assistente de Foco.",a:true,e:"CERTO. O Assistente de Foco (Focus Assist) permite configurar regras de silenciamento de notificações por horário, atividade ou automaticamente ao espelhar tela, entre outras condições."},
{m:"Informática",bloco:"E",tema:"Windows 11 - Explorador de Arquivos (modo Detalhes)",dif:"facil",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"Ao utilizar o Explorador de Arquivos do Windows 11 para organizar um diretório, o usuário pode selecionar o modo de exibição 'Detalhes'. Esse modo estrutura os elementos da pasta em forma de tabela, disponibilizando colunas ordenáveis contendo informações específicas sobre os arquivos, tais como nome, data de modificação, tipo do arquivo e tamanho em disco.",a:true,e:"CERTO. O modo 'Detalhes' exibe os arquivos em formato de tabela com colunas como Nome, Data de modificação, Tipo e Tamanho, todas ordenáveis por clique no cabeçalho."},
{m:"Informática",bloco:"E",tema:"Windows 11 - Barra de Título",dif:"facil",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"No padrão visual das janelas de aplicativos e ferramentas do Windows 11, a estrutura situada na parte superior da janela, responsável por exibir o nome do arquivo atualmente em edição e a identificação do programa proprietário, é denominada Barra de Título.",a:true,e:"CERTO. A Barra de Título fica na parte superior da janela e exibe o nome do arquivo/documento em edição, junto ao nome do programa."},
{m:"Informática",bloco:"E",tema:"Windows 11 - arrastar e soltar",dif:"dificil",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"Durante o processo de movimentação de arquivos via interface gráfica ('arrastar e soltar') no Windows 11, o sistema operacional adota comportamentos padrão distintos dependendo das unidades envolvidas. Se o usuário arrastar um elemento de uma pasta para outra situada na mesma unidade de disco, o comportamento padrão do sistema será a cópia do arquivo, mantendo o original intacto.",a:false,e:"ERRADO. O padrão é o inverso: arrastar um arquivo entre pastas da MESMA unidade resulta em MOVER; entre unidades DIFERENTES, o padrão é COPIAR, mantendo o original."},
{m:"Informática",bloco:"E",tema:"Windows 11 - caracteres proibidos em nomes de arquivo",dif:"facil",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"Para assegurar a integridade da estrutura do sistema de arquivos no Windows 11, determinados caracteres reservados não podem ser empregados na nomeação de arquivos ou diretórios. Entre estes caracteres proibidos pelo sistema de arquivos inclui-se o ponto de interrogação (?).",a:true,e:"CERTO. Caracteres como \\ / : * ? \" < > | são reservados pelo sistema e não podem ser usados em nomes de arquivos ou pastas no Windows."},
{m:"Informática",bloco:"E",tema:"Windows 11 - Limpeza de Disco x Desfragmentação",dif:"media",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"A ferramenta nativa 'Limpeza de Disco' do Windows 11 possui como atribuição primária a análise da desfragmentação física dos setores do disco rígido, reorganizando os blocos contíguos de dados para otimizar o tempo de leitura da agulha de gravação.",a:false,e:"ERRADO. A 'Limpeza de Disco' serve para excluir arquivos desnecessários (temporários, cache, lixeira etc.) e liberar espaço; quem trata da desfragmentação é a ferramenta 'Otimizar e Desfragmentar Unidades'."},
{m:"Informática",bloco:"E",tema:"Windows 11 - Otimizar e Desfragmentar Unidades",dif:"media",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"Com a gravação e a alteração contínua de dados no disco rígido, trechos de um mesmo arquivo podem ser armazenados em setores fisicamente não adjacentes do volume. Para mitigar o impacto de desempenho decorrente dessa dispersão, a ferramenta 'Otimizar e Desfragmentar Unidades' do Windows 11 reúne esses fragmentos em blocos contínuos.",a:true,e:"CERTO. A desfragmentação reorganiza os fragmentos espalhados de um arquivo em blocos contíguos, reduzindo o tempo de acesso em discos mecânicos (HDs)."},
{m:"Informática",bloco:"E",tema:"Windows 11 - Painel de Controle",dif:"facil",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"No Painel de Controle do Windows 11, ferramenta legada de administração mantida no sistema operacional, a exibição dos itens de configuração pode ser configurada pelo usuário nos modos: Categoria, Ícones grandes e Ícones pequenos.",a:true,e:"CERTO. O Painel de Controle permanece no Windows 11 e oferece essas três opções de exibição: Categoria, Ícones grandes e Ícones pequenos."},
{m:"Informática",bloco:"E",tema:"Windows 11 - Central de Facilidade de Acesso",dif:"facil",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"A 'Central de Facilidade de Acesso', acessível por meio do Painel de Controle ou das Configurações do Windows 11, concentra utilitários voltados à acessibilidade, incluindo a Lupa, o Teclado Virtual, o Narrador e a adaptação do contraste da tela para usuários com deficiência visual ou motora.",a:true,e:"CERTO. Essa central reúne recursos de acessibilidade como Lupa, Teclado Virtual, Narrador e ajuste de alto contraste, entre outros."},
{m:"Informática",bloco:"E",tema:"Windows 11 - Microsoft Defender",dif:"media",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"A solução de segurança nativa do Windows 11 comercialmente conhecida como Microsoft Defender atua de maneira exclusiva na filtragem de tráfego de rede (firewall), sendo desprovida de mecanismos para detecção, verificação proativa e remoção de malwares, como vírus, spywares e trojans.",a:false,e:"ERRADO. O Microsoft Defender vai além do firewall: inclui antivírus com proteção em tempo real, detecção proativa e remoção de malwares como vírus, spywares e trojans."},
{m:"Informática",bloco:"E",tema:"Windows 11 - BitLocker",dif:"facil",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"Para reforçar a segurança corporativa contra o vazamento de informações em caso de roubo ou perda física de computadores, o Windows 11 oferece o BitLocker, ferramenta nativa capaz de realizar a criptografia completa do volume de disco onde o sistema e os dados estão armazenados.",a:true,e:"CERTO. O BitLocker criptografa volumes inteiros, protegendo os dados caso o dispositivo seja perdido ou roubado."},
{m:"Informática",bloco:"E",tema:"Windows 11 - sistema de arquivos NTFS",dif:"media",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"O sistema de arquivos NTFS, padrão em instalações modernas do Windows 11, destaca-se por incorporar suporte a listas de controle de acesso (ACLs) para gerenciamento granular de permissões, recursos de auditoria, diário de transações (journaling) e criptografia individual de arquivos por meio do EFS (Encrypting File System).",a:true,e:"CERTO. O NTFS oferece ACLs para permissões, auditoria, journaling (log de transações para recuperação após falhas) e criptografia via EFS."},
{m:"Informática",bloco:"E",tema:"Windows 11 - atalho Windows + I",dif:"media",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"Para acesso rápido ao ambiente de personalização e administração do sistema operacional Windows 11, o atalho de teclado Windows + I executa o acionamento direto do Explorador de Arquivos.",a:false,e:"ERRADO. Windows + I abre as Configurações do sistema, não o Explorador de Arquivos; para abrir o Explorador de Arquivos o atalho é Windows + E."},
{m:"Informática",bloco:"E",tema:"Windows 11 - atalho nova pasta",dif:"facil",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"No Gerenciador de Arquivos do Windows 11 (Explorador de Arquivos), a criação de uma nova pasta no diretório em que o usuário se encontra pode ser realizada instantaneamente por meio do acionamento conjunto do atalho de teclado CTRL + SHIFT + N.",a:true,e:"CERTO. CTRL+SHIFT+N cria uma nova pasta diretamente no diretório atual do Explorador de Arquivos."},
{m:"Informática",bloco:"E",tema:"Windows 11 - Snap Layouts",dif:"media",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"No Windows 11, o recurso denominado Snap Layouts permite ao usuário organizar com rapidez janelas abertas em grades pré-configuradas na tela. A ativação desse recurso por meio do ponteiro do mouse ocorre ao posicionar o cursor sobre o botão 'Maximizar' de qualquer janela compatível.",a:true,e:"CERTO. Ao pairar o mouse sobre o botão Maximizar de uma janela, o Windows 11 exibe as opções de Snap Layouts para organização automática das janelas na tela."},
{m:"Informática",bloco:"E",tema:"Windows 11 - Área de Transferência (Windows + V)",dif:"media",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"A Área de Transferência avançada do Windows 11 permite armazenar múltiplos itens copiados (textos e imagens) para colagens posteriores. O acesso ao histórico desse recurso é realizado por meio do acionamento do atalho de teclado Windows + V.",a:true,e:"CERTO. Windows + V abre o histórico da Área de Transferência, permitindo colar itens copiados anteriormente (após habilitar o recurso nas configurações)."},
{m:"Informática",bloco:"E",tema:"Windows 11 - Ferramenta de Captura",dif:"facil",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"A combinação de teclas Windows + Shift + S ativa a ferramenta de captura do Windows 11, permitindo ao usuário selecionar e recortar uma região específica da tela para cópia ou salvamento de imagem.",a:true,e:"CERTO. Esse atalho aciona a ferramenta de recorte, permitindo capturar uma área, janela ou tela inteira."},
{m:"Informática",bloco:"E",tema:"Windows 11 - Menu de Links Rápidos",dif:"media",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"O 'Menu de Links Rápidos' (ou Menu do Usuário Avançado), que disponibiliza atalhos diretos para utilitários administrativos do sistema como o Gerenciamento de Disco e o Gerenciador de Dispositivos, é invocado ao pressionar a combinação de teclas Windows + X.",a:true,e:"CERTO. Windows + X abre o Menu de Links Rápidos com acesso direto a ferramentas administrativas como Gerenciamento de Disco e Gerenciador de Dispositivos."},
{m:"Informática",bloco:"E",tema:"Windows 11 - Áreas de Trabalho Virtuais",dif:"media",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"O Windows 11 possibilita ao usuário organizar diferentes fluxos de trabalho ou projetos por meio do recurso de Múltiplas Áreas de Trabalho Virtuais, cuja interface de gerenciamento (Visão de Tarefas) pode ser acessada pelo atalho Windows + Tab.",a:true,e:"CERTO. Windows + Tab abre a Visão de Tarefas, de onde é possível criar, alternar e gerenciar múltiplas áreas de trabalho virtuais."},
{m:"Informática",bloco:"E",tema:"Windows 11 - Gerenciador de Tarefas",dif:"facil",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"O Gerenciador de Tarefas do Windows 11, utilizado para monitorar o desempenho de hardware e encerrar processos travados, pode ser chamado diretamente via teclado sem a intermediação de telas de segurança pelo atalho CTRL + SHIFT + ESC.",a:true,e:"CERTO. Diferentemente de CTRL+ALT+DEL (que abre uma tela intermediária), CTRL+SHIFT+ESC abre o Gerenciador de Tarefas diretamente."},
{m:"Informática",bloco:"E",tema:"Windows 11 - abas no Explorador de Arquivos",dif:"media",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"A partir do Windows 11, o Explorador de Arquivos recebeu uma reformulação em sua interface, passando a oferecer suporte à navegação por abas (guias), o que permite a abertura de múltiplos diretórios distintos em uma única janela.",a:true,e:"CERTO. Uma atualização do Windows 11 (2022) adicionou suporte a abas no Explorador de Arquivos, permitindo múltiplas pastas abertas na mesma janela."},
{m:"Informática",bloco:"E",tema:"Windows 11 - Notificações x Configurações Rápidas",dif:"dificil",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"No Windows 11, a combinação de teclas Windows + A é utilizada para abrir a central de Notificações e o Calendário do sistema, enquanto o painel de Configurações Rápidas (controle de Wi-Fi, som e brilho) é acionado exclusivamente por meio do mouse.",a:false,e:"ERRADO. É o inverso: Windows + A abre as Configurações Rápidas (Wi-Fi, som, brilho); a Central de Notificações e o Calendário são abertos por Windows + N ou clicando na data/hora na Barra de Tarefas."},
{m:"Informática",bloco:"E",tema:"Windows 11 - Windows Hello",dif:"facil",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"O Windows Hello é uma funcionalidade nativa do Windows 11 que provê autenticação biométrica segura  1�7 via reconhecimento facial, leitura de impressão digital ou PIN forte  1�7, permitindo o acesso ao sistema sem a necessidade de digitação de senhas tradicionais da conta Microsoft.",a:true,e:"CERTO. O Windows Hello permite login por reconhecimento facial, impressão digital ou PIN, dispensando a digitação da senha tradicional."},
{m:"Informática",bloco:"E",tema:"Windows 11 - alinhamento da Barra de Tarefas",dif:"media",fonte:"Questão do material do Prof. Joelson Cei (turma PM Maranhão)",s:"No que se refere ao design visual padrão do Windows 11, o botão do Menu Iniciar e os ícones de aplicativos fixados na Barra de Tarefas vêm alinhados, por padrão de instalação do sistema, no canto inferior esquerdo da tela.",a:false,e:"ERRADO. Por padrão, o Windows 11 centraliza o botão Iniciar e os ícones na Barra de Tarefas; o alinhamento à esquerda (padrão do Windows 10) pode ser restaurado manualmente nas configurações."},
