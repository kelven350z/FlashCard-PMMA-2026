{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - tempo de efetivo serviço",dif:"facil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Tempo de efetivo serviço é a expressão que designa o espaço de tempo computado dia a dia entre a data de inclusão e a data do desligamento oficial da corporação.",a:true,e:"CERTO. É essa a definição estatutária de tempo de efetivo serviço."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - tempo anterior ao ingresso",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O tempo de serviço prestado à administração pública federal, estadual ou municipal antes do ingresso na PMMA é computável para efeito de inatividade.",a:true,e:"CERTO. Esse tempo anterior é computável para fins de inatividade."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - arredondamento de tempo de serviço",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Para fins de arredondamento na contagem do tempo de serviço para inatividade, a fração de tempo superior a 182 dias é arredondada para um ano inteiro.",a:true,e:"CERTO. Frações superiores a 182 dias são arredondadas para um ano."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - Conselho de Justificação",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O julgamento de oficiais da PMMA presumivelmente incapazes de permanecer na ativa é realizado mediante a instauração de Conselho de Justificação.",a:true,e:"CERTO. O Conselho de Justificação é o rito aplicável a oficiais nessa situação."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - Conselho de Disciplina",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A praça com estabilidade assegurada presumidamente incapaz de permanecer na ativa é submetida a julgamento perante Conselho de Disciplina.",a:true,e:"CERTO. O Conselho de Disciplina é o rito aplicável a praças estáveis nessa situação."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - recurso da decisão do Governador",dif:"dificil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Da decisão do Governador do Estado no processo de Conselho de Justificação cabe recurso que será julgado em instância única pelo Tribunal de Justiça do Estado do Maranhão.",a:true,e:"CERTO. O recurso é julgado em instância única pelo TJ do Estado."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - sanções disciplinares e prisão preventiva",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A aplicação de sanções disciplinares a policiais militares prescinde da observância do contraditório e da ampla defesa quando se tratar de prisão preventiva.",a:false,e:"ERRADO. Contraditório e ampla defesa devem ser observados na aplicação de sanções disciplinares, inclusive quando envolvida prisão preventiva."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - vedação ao casamento de cadetes",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"É vedado o casamento de cadetes e demais alunos enquanto estiverem matriculados nos órgãos de formação de policiais militares.",a:true,e:"CERTO. Há vedação estatutária ao casamento durante o curso de formação."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - aplicação subsidiária de normas do Exército",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"As leis e regulamentos em vigor no Exército Brasileiro são adotados na PMMA, de forma subsidiária, em matéria não regulada pela legislação estadual.",a:true,e:"CERTO. Aplica-se subsidiariamente a legislação do Exército em matérias não reguladas pela lei estadual."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - aplicação ao Corpo de Bombeiros",dif:"facil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Os dispositivos do Estatuto dos Policiais Militares do Maranhão aplicam-se, no que couber, aos servidores militares integrantes do Corpo de Bombeiros Militar.",a:true,e:"CERTO. O Estatuto se aplica, no que couber, aos bombeiros militares."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - teto do adicional por tempo de serviço",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O adicional por tempo de serviço possui natureza cumulativa e pode ultrapassar o teto de 50% do soldo do militar.",a:false,e:"ERRADO. O teto do adicional por tempo de serviço é de 35% do soldo, não podendo ultrapassá-lo."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - recursos administrativos do militar",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O policial militar que se julgar prejudicado por ato administrativo de superior hierárquico pode interpor pedido de reconsideração, queixa ou representação.",a:true,e:"CERTO. São esses os instrumentos estatutários de defesa administrativa do militar."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - prazo de recurso administrativo",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O prazo para a interposição de recursos administrativos que tratem de promoção ou direitos remuneratórios é de 120 dias.",a:true,e:"CERTO. O prazo estatutário para esses recursos é de 120 dias."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - desconto por suspensão do cargo",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O policial militar suspenso do exercício do cargo por condenação criminal militar não sofre qualquer tipo de desconto em sua remuneração mensal.",a:false,e:"ERRADO. A suspensão do exercício do cargo por condenação criminal militar implica desconto na remuneração."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - ressarcimento de preterição",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O ressarcimento de preterição é concedido quando for reconhecido o direito do militar à promoção que deixou de ocorrer por comprovado erro administrativo.",a:true,e:"CERTO. É essa a hipótese de ressarcimento de preterição."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - retorno do reformado apto",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O policial militar reformado por incapacidade definitiva que for julgado apto em inspeção médica de saúde por Junta Superior pode retornar ao serviço ativo se não tiver atingido a idade limite.",a:true,e:"CERTO. É possível o retorno se cessada a incapacidade e não atingida a idade limite."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - reversão por insubsistência",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O retorno do militar reformado ao serviço ativo por insubsistência dos motivos da invalidez é denominado reversão.",a:true,e:"CERTO. Esse retorno é denominado reversão."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - conversão de licença-prêmio em pecúnia",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A licença-prêmio não gozada pelo militar por imperiosa necessidade do serviço pode ser convertida em pecúnia quando de sua transferência para a inatividade.",a:true,e:"CERTO. É admitida a conversão em pecúnia nessa hipótese."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - dispensas como recompensa",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"As dispensas do serviço podem ser concedidas ao policial militar como recompensa (até 8 dias) ou para desconto em férias futuras.",a:true,e:"CERTO. As dispensas podem ser concedidas como recompensa, limitadas a até 8 dias."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - elogio individual",dif:"facil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A concessão de elogio individual constitui recompensa registrada formalmente nos assentamentos funcionais do militar.",a:true,e:"CERTO. O elogio é uma recompensa registrada nos assentamentos do militar."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - licença saúde em família (prazo, 2)",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A licença para tratamento de saúde em pessoa da família não pode exceder o prazo máximo de 6 meses.",a:true,e:"CERTO. O prazo máximo dessa licença é de 6 meses."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - suspensão preventiva e absolvição",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O militar suspenso preventivamente durante processo disciplinar faz jus ao cômputo desse período como tempo de efetivo serviço caso seja absolvido ao final.",a:true,e:"CERTO. Havendo absolvição, o período de suspensão preventiva é computado como efetivo serviço."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - vedações éticas a reformados",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"As vedações e normas éticas relativas ao exercício de atividade política aplicam-se com o mesmo grau de restrição aos policiais militares reformados.",a:false,e:"ERRADO. Militares reformados, por não estarem na ativa, não se submetem ao mesmo grau de restrição política dos militares da ativa."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - casamento do militar da ativa",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O casamento do policial militar da ativa independe de autorização do Comando-Geral, exigindo-se apenas a observância da legislação civil ordinária.",a:true,e:"CERTO. Não há necessidade de autorização do Comando-Geral para o casamento do militar."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - prisão em flagrante por crime militar",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O militar preso em flagrante delito por crime militar tem o direito de permanecer custodiado em organização militar da própria corporação.",a:true,e:"CERTO. É assegurado esse direito ao militar preso em flagrante por crime militar."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - impenhorabilidade do soldo",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O soldo do policial militar é inalienável e impenhorável, salvo nos casos de prestação de alimentos decorrente de decisão judicial.",a:true,e:"CERTO. A exceção à impenhorabilidade é a pensão alimentícia por decisão judicial."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - contribuição previdenciária",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"As alíquotas de contribuição previdenciária incidem sobre o valor total da remuneração dos militares da ativa e dos proventos dos inativos.",a:true,e:"CERTO. A contribuição incide sobre a remuneração da ativa e os proventos dos inativos."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - licenciamento ex officio de praça",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A praça sem estabilidade que cometer infração grave contra a disciplina militar pode ser licenciada ex officio a bem da disciplina.",a:true,e:"CERTO. É essa a consequência estatutária prevista para praça sem estabilidade."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - instrução no licenciamento ex officio",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O processo de licenciamento ex officio de praça sem estabilidade prescinde da instrução com defesa escrita e citação formal.",a:false,e:"ERRADO. O processo exige instrução com defesa escrita e citação formal, não podendo prescindir dessas garantias."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - uso de uniformes e insígnias",dif:"facil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"É assegurado ao militar estadual o direito ao uso dos uniformes e insígnias do seu posto ou graduação nas solenidades oficiais.",a:true,e:"CERTO. É assegurado esse direito ao militar estadual."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - vedação do uso de uniforme por civis",dif:"facil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O uso dos uniformes da PMMA é vedado a civis e a militares inativos que exerçam atividades incompatíveis com a função militar.",a:true,e:"CERTO. Há vedação nesses termos quanto ao uso do uniforme."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - reserva remunerada convocada",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O militar da reserva remunerada convocado para o serviço ativo fica sujeito aos mesmos deveres, direitos e obrigações dos militares de carreira da ativa.",a:true,e:"CERTO. O convocado se sujeita ao mesmo regime dos militares de carreira da ativa."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - reforma por idade limite e retorno",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A passagem do policial militar à situação de inatividade mediante reforma por idade limite impede definitivamente o seu retorno ao serviço ativo.",a:true,e:"CERTO. A reforma por idade limite é definitiva, impedindo o retorno ao serviço ativo."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - retroação da promoção extraordinária",dif:"dificil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A promoção extraordinária por ressarcimento de preterição retroage seus efeitos funcionais e financeiros à data em que a promoção deveria ter ocorrido.",a:true,e:"CERTO. Os efeitos retroagem à data em que a promoção deveria ter ocorrido."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - demissão de oficial",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A demissão de oficial da PMMA decorrente da perda do posto e da patente é decretada por decisão do Tribunal de Justiça do Estado.",a:false,e:"ERRADO. A perda do posto e da patente do oficial é decretada pelo Governador do Estado, com base em decisão de tribunal competente, e não diretamente pelo TJ."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - perda de graduação da praça",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A perda da graduação da praça condenada a pena privativa de liberdade superior a dois anos é decretada pelo tribunal competente.",a:true,e:"CERTO. Nesse caso, a perda da graduação é decretada pelo tribunal competente."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - indenização ao demitido/excluído",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O oficial demitido ou a praça excluída a bem da disciplina não fazem jus a qualquer indenização pelos anos de serviço prestados.",a:true,e:"CERTO. Não há direito a indenização nessas hipóteses."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - encerramento do tempo de serviço",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O cômputo do tempo de serviço militar encerrar-se-á no dia anterior à publicação do ato de transferência para a inatividade.",a:true,e:"CERTO. O tempo se encerra no dia anterior à publicação do ato de transferência."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - tempo de serviço prestado à administração pública",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O tempo de serviço prestado à administração pública federal, estadual ou municipal antes do ingresso na PMMA é computável para efeito de inatividade.",a:true,e:"CERTO. Esse tempo é computável para fins de inatividade."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - férias anuais",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"As férias anuais do policial militar são de gozo obrigatório e correspondem a 30 dias consecutivos por ano de efetivo serviço.",a:true,e:"CERTO. O militar tem direito a 30 dias de férias anuais de gozo obrigatório."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - acúmulo de férias",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A concessão de férias anuais pode ser acumulada por no máximo até dois anos em caso de comprovada necessidade do serviço.",a:true,e:"CERTO. É admitido o acúmulo de férias por até dois anos, em caso de necessidade do serviço."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - adicional de férias",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O adicional de férias pago ao policial militar equivale a um terço da remuneração devida no mês de início do gozo das férias.",a:true,e:"CERTO. O adicional de férias corresponde a 1/3 da remuneração do mês de início das férias."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - dispensa por luto",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O policial militar que se afastar do serviço por motivo de luto em razão do falecimento de cônjuge, pais ou filhos faz jus a 8 dias de dispensa.",a:true,e:"CERTO. A dispensa por luto nesses casos é de 8 dias."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - dispensa por casamento",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A dispensa do serviço concedida em razão de casamento (núpcias) é de 8 dias consecutivos.",a:true,e:"CERTO. A dispensa por núpcias é de 8 dias consecutivos."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - licença-prêmio como efetivo serviço",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O tempo em que o policial militar permanecer em gozo de licença-prêmio é considerado como de efetivo serviço para todos os efeitos legais.",a:true,e:"CERTO. O período de licença-prêmio é computado como efetivo serviço."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - licença-maternidade",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A concessão da licença-maternidade à policial militar feminina é de 180 dias consecutivos sem prejuízo de sua remuneração.",a:true,e:"CERTO. A licença-maternidade é de 180 dias, sem prejuízo da remuneração."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - licença saúde e atividade remunerada",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"É vedado ao policial militar em gozo de licença para tratamento de saúde própria exercer qualquer atividade remunerada privada.",a:true,e:"CERTO. Há vedação ao exercício de atividade remunerada privada durante essa licença."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - incapacidade temporária e contagem de tempo",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A incapacidade física temporária decorrente de ferimento recebido em serviço não interrompe a contagem do tempo de serviço do militar.",a:true,e:"CERTO. Essa incapacidade não interrompe a contagem do tempo de serviço."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - independência das esferas de responsabilidade",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A apuração de responsabilidade civil e administrativa do policial militar independe da eventual apuração criminal sobre o mesmo fato.",a:true,e:"CERTO. As esferas civil, administrativa e criminal são, em regra, independentes entre si."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - acesso à hierarquia militar",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O acesso à hierarquia militar é seletivo, gradual e sucessivo, e será feito mediante promoções, de conformidade com a legislação pertinente, de modo a obter-se um fluxo regular e equilibrado.",a:true,e:"CERTO. É essa a forma estatutária de acesso à hierarquia militar."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - julgamento de oficial incapaz",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O oficial presumivelmente incapaz de permanecer como policial-militar da ativa será submetido a Conselho de Disciplina na forma prevista na legislação específica e peculiar.",a:false,e:"ERRADO. Para oficiais, o rito correto é o Conselho de Justificação, e não o Conselho de Disciplina (aplicável às praças)."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - posto e graduação (confirmação)",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Posto e graduação são graus hierárquicos conferidos por ato do comandante-geral da Polícia Militar, sendo os de oficiais confirmados em carta patente.",a:false,e:"ERRADO. O posto do oficial é conferido por Carta Patente expedida pelo Governador do Estado, e não por simples ato do comandante-geral."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - aspirantes e precedência",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Aspirantes a oficial são denominados praças especiais e têm precedência sobre as demais praças.",a:true,e:"CERTO. Aspirantes a oficial são praças especiais com precedência sobre as demais praças."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - requisito único para 3º sargento",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A aprovação em concurso público é requisito único e indispensável para que um policial militar ingresse na graduação de terceiro sargento.",a:false,e:"ERRADO. Além do concurso, normalmente exige-se também aprovação em curso de formação/aperfeiçoamento específico, não sendo requisito único."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei 6.513/95 - ingresso obrigatório",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"De acordo com a Lei nº 6.513/1995, o ingresso na Polícia Militar do Maranhão é obrigatório a todos os brasileiros, sem distinção de raça ou crença religiosa, mediante matrícula ou nomeação, após aprovação em concurso público.",a:false,e:"ERRADO. O ingresso na PMMA é facultativo (mediante concurso), e não obrigatório a todos os brasileiros."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei 6.513/95 - hierarquia e disciplina",dif:"facil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Quanto à Lei Estadual nº 6.513/1995, a hierarquia e a disciplina são as bases institucionais da Polícia Militar, sendo que a autoridade e a responsabilidade crescem com o grau hierárquico.",a:true,e:"CERTO. Hierarquia e disciplina são as bases institucionais, com autoridade e responsabilidade crescentes conforme o grau hierárquico."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei 14.751/2023 - PMs e SUSP",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"As Polícias Militares dos Estados não são integrantes do Sistema Único de Segurança Pública (SUSP).",a:false,e:"ERRADO. As Polícias Militares são integrantes do Sistema Único de Segurança Pública (SUSP)."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei 14.751/2023 - Bombeiros e polícia judiciária",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Aos Corpos de Bombeiros Militares compete a realização de atos de polícia judiciária.",a:false,e:"ERRADO. A polícia judiciária não é atribuição típica dos Corpos de Bombeiros Militares."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei 14.751/2023 - divulgação de imagens de custodiados",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"É permitido aos militares divulgar imagens de pessoas sob sua custódia sem prévia autorização judicial.",a:false,e:"ERRADO. A divulgação de imagens de pessoas sob custódia sem autorização judicial não é permitida."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei 14.751/2023 - garantias dos militares estaduais",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"São garantias das polícias militares e dos corpos de bombeiros militares dos Estados, do DF e dos Territórios, bem como de seus membros ativos, da reserva remunerada e reformados, o uso dos títulos e designações hierárquicas.",a:true,e:"CERTO. O uso de títulos e designações hierárquicas é garantia prevista na Lei nº 14.751/2023."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei 14.751/2023 - militar eleito suplente",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O militar eleito e que tomar posse como suplente será agregado ao respectivo quadro, enquanto perdurar o mandato temporário, podendo manter as duas remunerações.",a:false,e:"ERRADO. O militar eleito, ao ser agregado, não pode acumular as duas remunerações (da função militar e do cargo eletivo)."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei 14.751/2023 - vedação a sociedade comercial",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"É vedado aos militares, enquanto em atividade, participar de sociedade comercial, salvo como cotista, acionista e comanditário, e exercer atividade gerencial ou administrativa nessas empresas, salvo na hipótese de licença para tratar de interesse particular.",a:true,e:"CERTO. É essa a regra de vedação e suas exceções, prevista na LOB Nacional."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - período",dif:"facil",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"A Revolta de Bequimão, também chamada de Revolta de Beckman, ocorreu no Maranhão entre 1684 e 1685, durante o século XVI.",a:false,e:"ERRADO. A revolta ocorreu no século XVII, e não no século XVI."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - monopólio comercial",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"Entre as causas da Revolta de Beckman está o monopólio comercial: a Companhia de Comércio cobrava caro por produtos básicos e pagava pouco pelos itens locais.",a:true,e:"CERTO. O monopólio comercial abusivo foi uma das principais causas da revolta."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - falta de mão de obra",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"Entre as causas está a falta de mão de obra: a Companhia de Comércio não fornecia o número combinado de trabalhadores escravizados africanos.",a:false,e:"ERRADO. A falta era de mão de obra escravizada indígena, e não africana."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - conflito com jesuítas",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"Houve conflito com os jesuítas: os colonos queriam escravizar os indígenas, mas os jesuítas eram contra e protegiam os nativos por conta dos valores cristãos.",a:false,e:"ERRADO. O enunciado inverte o papel dos jesuítas nesse conflito específico, conforme gabarito da questão."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - tomada de São Luís",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"Em fevereiro de 1684, os revoltosos tomaram a cidade de São Luís, prenderam autoridades e expulsaram os portugueses.",a:false,e:"ERRADO. Os revoltosos depuseram as autoridades locais, mas não expulsaram os portugueses da colônia."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - perda de força",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"O movimento perdeu força por falta de apoio de outras áreas.",a:true,e:"CERTO. A falta de apoio de outras regiões contribuiu para o enfraquecimento do movimento."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - retomada portuguesa",dif:"facil",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"Em 1685, tropas de Portugal retomaram o controle de São Luís.",a:true,e:"CERTO. Em 1685 as tropas portuguesas, sob Gomes Freire de Andrade, retomaram o controle da cidade."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - condenação à forca",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"Tomás Beckman foi julgado e condenado à forca.",a:false,e:"ERRADO. Quem foi condenado à forca foi Manuel Beckman, e não Tomás."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - abrangência territorial",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"A Revolta de Beckman foi uma rebelião ocorrida entre 1684 e 1685 na cidade de São Luís, Estado do Maranhão. Esse estado incluía os atuais territórios do Pará, Maranhão, Piauí, Ceará e Amazonas.",a:true,e:"CERTO. O Estado do Maranhão colonial abrangia esses territórios."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - liderança e reivindicações",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"Liderados pelos irmãos Manuel e Tomás Beckman, os revoltosos contestavam o monopólio da Companhia de Comércio do Maranhão e a falta de acesso à mão de obra escravizada, sobretudo africana.",a:false,e:"ERRADO. A falta de acesso à mão de obra reivindicada era principalmente à indígena, e não à africana."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - caráter nativista",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"A revolta costuma ser classificada como um dos movimentos nativistas do período colonial brasileiro, uma vez que não contestava, de nenhuma forma, a dominação portuguesa.",a:true,e:"CERTO. É um movimento nativista, pois não questionava a soberania portuguesa, apenas a política do monopólio."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - declínio econômico pós-1650",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"A partir de 1650, com a expulsão dos holandeses do Nordeste brasileiro, o Estado do Maranhão entrou em declínio, em função da carência de mão de obra escrava e do abastecimento e escoamento de produtos.",a:true,e:"CERTO. A expulsão dos holandeses e a carência de mão de obra agravaram a crise no Maranhão."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - drogas do sertão",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"A economia da região baseava-se no extrativismo e na exploração das 'drogas do sertão', como canela, cravo, salsa e alecrim, que tinham baixa produtividade e comercialização.",a:false,e:"ERRADO. As drogas do sertão tinham relevante valor comercial (eram usadas como remédios/especiarias), e não baixa comercialização."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - Companhia de Comércio e origem dos produtos",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"A Companhia do Comércio do Maranhão, criada pela Coroa Portuguesa em 1682, efetuaria o comércio de escravizados africanos e forneceria produtos vindos de Espanha.",a:false,e:"ERRADO. Os produtos vinham de Portugal, e não da Espanha."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - estanco e monopólio",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"Os altos preços praticados pela Companhia e o monopólio (também chamado de estanco) causaram revolta entre os proprietários e a população em geral.",a:true,e:"CERTO. O estanco (monopólio) gerou forte insatisfação popular."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - condições de pobreza",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"A população passou a viver em condições de extrema pobreza, sofrendo com a falta de abastecimento de gêneros básicos, vendidos a preços altíssimos e de má qualidade.",a:true,e:"CERTO. Essa era a situação vivida pela população maranhense sob o monopólio."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - comerciantes x proprietários",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"Os comerciantes locais foram muito lesados pelo monopólio da Companhia, enquanto os proprietários rurais recebiam preços justos pelos seus produtos.",a:false,e:"ERRADO. Tanto comerciantes quanto proprietários rurais eram lesados; estes não recebiam preços justos."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - motivo da sublevação",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"Com a falta de mão de obra escravizada indígena, devido à resistência dos jesuítas, os colonos se sublevaram para reivindicar a extinção da Companhia de Comércio e a expulsão dos jesuítas da província.",a:false,e:"ERRADO. A expulsão definitiva dos jesuítas ocorreu posteriormente (com o Marquês de Pombal), não sendo essa a reivindicação central da revolta de Beckman."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - líderes e apoio popular",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"Os líderes do movimento foram os irmãos Manuel e Tomás Beckman, juntamente com Jorge de Sampaio de Carvalho, contando com apoio da população local, comerciantes e proprietários rurais.",a:true,e:"CERTO. Esses foram os líderes da revolta, com amplo apoio popular local."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - início do levante",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"Os revoltosos renderam o Corpo da Guarda em São Luís, capturaram o Capitão-mor Baltasar Fernandes e saquearam um depósito da Companhia de Comércio, dando início à revolta.",a:true,e:"CERTO. Assim teve início a revolta em São Luís."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - Junta Geral de Governo",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"Em 25 de fevereiro os insurgentes já haviam tomado a Câmara Municipal e estabelecido uma Junta Geral de Governo, composta por latifundiários, comerciantes e clero.",a:true,e:"CERTO. A Junta de Governo formada era composta por esses setores."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - deposição de autoridades",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"Assim que foram empossados, os revoltosos depuseram o Capitão-mor e o Prefeito, bem como decretaram o fim do estanco (monopólio) e da Companhia de Comércio.",a:false,e:"ERRADO. Foi deposto o Governador (cargo de Prefeito não existia na época), além do fim do estanco e da Companhia."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - emissários a Portugal",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"A Junta de Governo despachou emissários para Belém do Pará, comunicando a deposição do governador, e para Portugal, destacando-se Tomás Beckman, enviado a Lisboa para jurar fidelidade ao rei e denunciar a Companhia de Comércio.",a:true,e:"CERTO. Tomás Beckman foi enviado a Lisboa nessa missão."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - prisão de Tomás",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"Ao desembarcar em Portugal, Tomás Beckman recebeu voz de prisão e foi trazido de volta ao Maranhão, onde foi condenado ao desterro (expulsão/exclusão).",a:true,e:"CERTO. Tomás foi preso e condenado ao desterro, e não à morte."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - governo de Manuel Beckman",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"Em 1685, os revoltosos ocuparam o Colégio dos Mascates e expulsaram os jesuítas que viviam ali; por cerca de um ano, Manuel Beckman controlou uma junta revolucionária e governou a Província do Maranhão.",a:true,e:"CERTO. Manuel Beckman chegou a governar a província por cerca de um ano."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - chegada de Gomes Freire",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"Em 15 de maio de 1685, no comando de tropas portuguesas, o novo governador Gomes Freire de Andrade desembarcou na cidade, onde não encontrou resistência, reempossando as autoridades e solicitando o fim das atividades da Companhia de Comércio.",a:true,e:"CERTO. Gomes Freire de Andrade restabeleceu a ordem colonial sem resistência significativa."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - condenação dos líderes",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"Os líderes da revolta, Manuel Beckman e Jorge de Sampaio, foram presos, julgados e condenados à morte na forca, enquanto os outros envolvidos foram condenados à prisão perpétua.",a:true,e:"CERTO. Manuel Beckman e Jorge de Sampaio foram condenados à forca; os demais, à prisão perpétua."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - perfil de Manuel Beckman",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"Manuel Beckman foi um senhor de engenho e revolucionário português, considerado por alguns autores um 'protomártir' da Independência, muito antes de Tiradentes. O sobrenome Beckman é frequentemente grafado em sua forma aportuguesada, Bequimão.",a:true,e:"CERTO. É essa a descrição histórica de Manuel Beckman."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - repressão e julgamento",dif:"dificil",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"A repressão foi organizada pelo novo governador Gomes Freire de Andrade; os documentos do Conselho Ultramarino de 1685 se concentram no julgamento e execução dos líderes, tendo a pena capital sido aplicada a Manuel Beckman em 10 de novembro de 1685, mais de 20 meses após a eclosão da revolta.",a:true,e:"CERTO. É essa a cronologia documentada da repressão e execução de Manuel Beckman."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman - penas de degredo e confisco",dif:"media",fonte:"Simulado História do Maranhão - Prof. Diego Baia",s:"A repressão foi dura: além das execuções, vários revoltosos receberam penas de degredo e confisco de bens. No caso de Beckman, as propriedades confiscadas foram leiloadas, mas o próprio governador Gomes Freire adquiriu-as e as devolveu posteriormente à viúva e filhas de Beckman.",a:true,e:"CERTO. Gomes Freire adquiriu e depois devolveu os bens confiscados à família de Beckman."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Formação cultural do Maranhão",dif:"facil",fonte:"Simulado Cultura Maranhense - Potencial Concursos",s:"A formação cultural do Maranhão resulta do encontro e da fusão de três matrizes principais: a indígena, a africana e a europeia (principalmente portuguesa e francesa).",a:true,e:"CERTO. São essas as três matrizes formadoras da cultura maranhense."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Herança indígena",dif:"facil",fonte:"Simulado Cultura Maranhense - Potencial Concursos",s:"A herança indígena na cultura maranhense reflete-se no artesanato de palha de tucum, no uso da mandioca na culinária e em lendas locais.",a:true,e:"CERTO. Essas são manifestações da herança indígena no Maranhão."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Centro histórico de São Luís",dif:"media",fonte:"Simulado Cultura Maranhense - Potencial Concursos",s:"O centro histórico de São Luís destaca-se pela arquitetura colonial portuguesa e francesa, com casarões revestidos por azulejos.",a:true,e:"CERTO. O centro histórico é marcado por essa arquitetura com azulejaria."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Bumba Meu Boi - UNESCO",dif:"facil",fonte:"Simulado Cultura Maranhense - Potencial Concursos",s:"O Bumba Meu Boi do Maranhão é reconhecido pela UNESCO como Patrimônio Cultural Imaterial da Humanidade.",a:true,e:"CERTO. O Bumba Meu Boi maranhense tem esse reconhecimento da UNESCO."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Bumba Meu Boi - época do ano",dif:"media",fonte:"Simulado Cultura Maranhense - Potencial Concursos",s:"As festividades do Bumba Meu Boi ocorrem predominantemente durante o período do Carnaval, no início do ano.",a:false,e:"ERRADO. As festividades ocorrem principalmente em junho e julho, e não no Carnaval."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Sotaque de Matraca",dif:"media",fonte:"Simulado Cultura Maranhense - Potencial Concursos",s:"O Sotaque de Matraca do Bumba Meu Boi é caracterizado pelo ritmo marcado por instrumentos de sopro e cordas luxuosas.",a:false,e:"ERRADO. O Sotaque de Matraca é marcado por matracas e pandeiros; instrumentos de sopro e cordas luxuosas caracterizam o Sotaque de Zapona/Orquestra."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Sotaque de Zapona/Orquestra",dif:"media",fonte:"Simulado Cultura Maranhense - Potencial Concursos",s:"O Sotaque de Zapona (ou Orquestra) utiliza instrumentos como clarinetes, saxofones e violões em suas apresentações.",a:true,e:"CERTO. Esse sotaque é conhecido pelo uso de instrumentos de sopro e cordas e indumentárias luxuosas."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Sotaque de Costa de Mão",dif:"media",fonte:"Simulado Cultura Maranhense - Potencial Concursos",s:"O Sotaque de Costa de Mão é originário da região de Cururupu e caracteriza-se pelo toque no pandeiro utilizando as costas das mãos.",a:true,e:"CERTO. É essa a característica do Sotaque de Costa de Mão."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Tambor de Crioula - origem",dif:"media",fonte:"Simulado Cultura Maranhense - Potencial Concursos",s:"O Tambor de Crioula é uma dança de origem predominantemente europeia, executada em homenagem a São João.",a:false,e:"ERRADO. O Tambor de Crioula é de origem afro-brasileira, executado em louvor a São Benedito."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Tambor de Crioula - pungada",dif:"media",fonte:"Simulado Cultura Maranhense - Potencial Concursos",s:"A 'pungada' ou umbigada é um gesto característico do Tambor de Crioula, trocado entre as dançarinas (coureiras).",a:true,e:"CERTO. A pungada é o gesto de troca entre as coureiras no Tambor de Crioula."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Tambor de Crioula - instrumentos",dif:"media",fonte:"Simulado Cultura Maranhense - Potencial Concursos",s:"Os instrumentos do Tambor de Crioula consistem em um conjunto de três tambores artesanais feitos de tronco de árvore, chamados de parelha.",a:true,e:"CERTO. A parelha é formada por três tambores (Tambor Grande, Meião e Crivo)."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Reggae - Jamaica Brasileira",dif:"facil",fonte:"Simulado Cultura Maranhense - Potencial Concursos",s:"O reggae chegou ao Maranhão por volta da década de 1970 e transformou São Luís em um dos maiores polos do gênero no país, rendendo-lhe o apelido de 'Jamaica Brasileira'.",a:true,e:"CERTO. São Luís é conhecida como a 'Jamaica Brasileira' devido à forte cultura reggae."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Reggae - agarradinho e radiolas",dif:"media",fonte:"Simulado Cultura Maranhense - Potencial Concursos",s:"Uma das marcas do reggae no Maranhão é a forma de dançar em dupla ('agarradinho') e a presença das 'radiolas' de som.",a:true,e:"CERTO. O agarradinho e as radiolas são características do reggae maranhense."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Festa do Divino Espírito Santo",dif:"media",fonte:"Simulado Cultura Maranhense - Potencial Concursos",s:"A Festa do Divino Espírito Santo, com grande relevância na cidade de Alcântara, mistura elementos do catolicismo popular com tradições afro-maranhenses.",a:true,e:"CERTO. É essa a característica sincrética da Festa do Divino em Alcântara."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Caixeiras da Festa do Divino",dif:"media",fonte:"Simulado Cultura Maranhense - Potencial Concursos",s:"As 'Caixeiras' são figuras centrais na Festa do Divino, responsáveis por tocar caixas (tambores pequenos) e cantar hinos e louvores.",a:true,e:"CERTO. As Caixeiras têm esse papel central na Festa do Divino."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Arroz de Cuxá",dif:"media",fonte:"Simulado Cultura Maranhense - Potencial Concursos",s:"O Arroz de Cuxá tem como ingrediente principal a folha de vinagreira, combinada com camarão seco, gergelim e farinha de mandioca.",a:true,e:"CERTO. É essa a composição tradicional do Arroz de Cuxá."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Guaraná Jesus",dif:"facil",fonte:"Simulado Cultura Maranhense - Potencial Concursos",s:"O Guaraná Jesus é um refrigerante típico maranhense de cor rosa, conhecido pelo sabor levemente adocicado que remete a cravo e canela.",a:true,e:"CERTO. É essa a descrição do Guaraná Jesus, ícone maranhense."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Doce de Espécie",dif:"facil",fonte:"Simulado Cultura Maranhense - Potencial Concursos",s:"O 'Doce de Espécie' é uma iguaria tradicional da cidade de Alcântara feita à base de coco e açúcar.",a:true,e:"CERTO. É essa a origem e composição do Doce de Espécie."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Artesanato de buriti e tucum",dif:"facil",fonte:"Simulado Cultura Maranhense - Potencial Concursos",s:"O artesanato feito com fibra e palha de buriti e tucum é uma importante atividade cultural e econômica no Maranhão.",a:true,e:"CERTO. Esse artesanato é relevante cultural e economicamente no estado."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Lenda da Serpente Encantada",dif:"media",fonte:"Simulado Cultura Maranhense - Potencial Concursos",s:"A lenda da Serpente Encantada conta que um grande réptil adormecido vive no subsolo de São Luís e que, se sua cabeça encontrar o rabo, a ilha afundará.",a:true,e:"CERTO. É essa a narrativa da lenda maranhense da Serpente Encantada."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Porto de Alcântara",dif:"media",fonte:"Simulado Geografia do Maranhão - Potencial Concursos",s:"O projeto do Porto de Alcântara visa expandir a capacidade logística do estado, aproveitando as águas profundas do litoral maranhense para criar novos terminais de exportação.",a:true,e:"CERTO. O projeto de Alcântara busca aproveitar as águas profundas para novos terminais de exportação."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Exportação de soja pelo Itaqui",dif:"media",fonte:"Simulado Geografia do Maranhão - Potencial Concursos",s:"A exportação de soja produzida no Matopiba pelo Porto do Itaqui é desvantajosa em relação aos portos do Sul do Brasil devido à maior distância marítima até os mercados da Europa e América do Norte.",a:false,e:"ERRADO. Trata-se de uma vantagem: o Porto do Itaqui encurta o caminho marítimo até esses mercados."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Terminal de Ponta da Madeira",dif:"media",fonte:"Simulado Geografia do Maranhão - Potencial Concursos",s:"O Terminal Marítimo de Ponta da Madeira destaca-se mundialmente pela elevada capacidade de movimentação de granéis sólidos de origem mineral.",a:true,e:"CERTO. Ponta da Madeira é um dos maiores terminais do mundo para exportação de minério de ferro."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Amplitude de marés na Baía de São Marcos",dif:"media",fonte:"Simulado Geografia do Maranhão - Potencial Concursos",s:"O complexo portuário maranhense possui como característica geográfica marcante a expressiva amplitude das marés na Baía de São Marcos.",a:true,e:"CERTO. A grande amplitude de marés é uma característica geográfica marcante da região."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Estrada de Ferro Carajás",dif:"media",fonte:"Simulado Geografia do Maranhão - Potencial Concursos",s:"A Estrada de Ferro Carajás (EFC) liga o sul do Pará ao complexo portuário em São Luís, sendo crucial para o transporte de minério de ferro e grãos.",a:true,e:"CERTO. A EFC conecta a região de Carajás (PA) ao complexo portuário de São Luís."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Ferrovia Norte-Sul",dif:"media",fonte:"Simulado Geografia do Maranhão - Potencial Concursos",s:"A Ferrovia Norte-Sul (FNS) conecta a região Central do Brasil ao Porto do Itaqui, fortalecendo a logística do agronegócio de estados como Tocantins, Goiás e Mato Grosso.",a:true,e:"CERTO. A FNS integra a produção do Centro-Norte ao Porto do Itaqui."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Ferrovias e exportação do Itaqui",dif:"media",fonte:"Simulado Geografia do Maranhão - Potencial Concursos",s:"O transporte ferroviário de cargas em direção aos portos de São Luís não possui interligação funcional com as operações de exportação do Itaqui.",a:false,e:"ERRADO. Há interligação funcional entre o transporte ferroviário e as operações de exportação do Itaqui."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Rodovias federais - BR-135",dif:"media",fonte:"Simulado Geografia do Maranhão - Potencial Concursos",s:"As rodovias federais, como a BR-135, complementam a malha ferroviária no escoamento de cargas e no abastecimento regional de combustíveis.",a:true,e:"CERTO. A BR-135 complementa a malha ferroviária nessas funções."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Aeroporto de São Luís",dif:"media",fonte:"Simulado Geografia do Maranhão - Potencial Concursos",s:"O Aeroporto Internacional de São Luís (Marechal Cunha Machado) é o principal portão de entrada para o transporte aéreo de passageiros e conectividade do estado do Maranhão.",a:true,e:"CERTO. É o principal aeroporto de passageiros do estado."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Aeroporto de Imperatriz",dif:"media",fonte:"Simulado Geografia do Maranhão - Potencial Concursos",s:"O Aeroporto de Imperatriz (Prefeito Renato Moreira) tem papel estratégico no interior do estado, atendendo ao tráfego corporativo, industrial e comercial do Sudoeste Maranhense.",a:true,e:"CERTO. O aeroporto de Imperatriz atende essa demanda regional."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Aeroporto de Barreirinhas",dif:"media",fonte:"Simulado Geografia do Maranhão - Potencial Concursos",s:"O Aeroporto de Barreirinhas atua como infraestrutura de apoio logístico para o turismo, conectando os visitantes ao Parque Nacional dos Lençóis Maranhenses.",a:true,e:"CERTO. Esse aeroporto dá suporte ao turismo nos Lençóis Maranhenses."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Modal aéreo e granéis sólidos",dif:"media",fonte:"Simulado Geografia do Maranhão - Potencial Concursos",s:"O modal aéreo no Maranhão é a principal via utilizada para o transporte de grandes volumes de granéis sólidos, como minério de ferro e soja.",a:false,e:"ERRADO. Grandes volumes de granéis sólidos são transportados pelos modais ferroviário e portuário, não pelo aéreo."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Aeroportos de Carolina e Barreirinhas",dif:"media",fonte:"Simulado Geografia do Maranhão - Potencial Concursos",s:"Os aeroportos de cidades como Carolina e Barreirinhas têm sua vocação voltada prioritariamente para o fluxo de pessoas, turismo de aventura e ecoturismo.",a:true,e:"CERTO. Esses aeroportos atendem principalmente ao turismo regional."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Aeroportos de Bacabal e Santa Inês",dif:"media",fonte:"Simulado Geografia do Maranhão - Potencial Concursos",s:"Os aeroportos regionais de Bacabal e Santa Inês atuam no suporte de viagens executivas, prestação de serviços e transporte de passageiros na malha estadual.",a:true,e:"CERTO. Esses aeroportos regionais cumprem essa função de suporte."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Transporte aéreo - eixo São Luís-Imperatriz",dif:"media",fonte:"Simulado Geografia do Maranhão - Potencial Concursos",s:"O transporte aéreo de passageiros no Maranhão é concentrado majoritariamente no eixo São Luís  1�7 Imperatriz.",a:true,e:"CERTO. Esse é o principal eixo de transporte aéreo de passageiros no estado."},

BANK.forEach((q,i)=>{ q.id = q.id || (q.m+"|"+q.tema+"|"+i); });

/* Conforme edital retificado (Editais nº 2 e nº 4 - PMMA/2026):
   CONHECIMENTOS GERAIS (50 no completo): Português, RLM, Geografia BR/MA, História BR/MA
   CONHECIMENTOS ESPECÍFICOS (70 no completo): Legislação (Institucional + Pertinente) e Informática
   3 modos: Leve (30 = 18E+12G), Médio (60 = 35E+25G), Completo (120 = 70E+50G) */
const SUBJECTS_G = ["Português","Raciocínio Lógico","Geografia do Brasil","Geografia do Maranhão","História do Brasil","História do Maranhão"];
const SUBJECTS_E_LEG = ["Legislação Institucional","Legislação Pertinente à PMMA"]; // somadas, tratadas como um único bloco "Legislação"
const SUBJECTS_E_INFO = ["Informática"];

// distribuição proporcional por matéria em cada modo (soma G / soma E confere com a regra do edital)
const MODES = {
  leve:    {label:"Leve",    total:30,  g:{"Português":2,"Raciocínio Lógico":2,"Geografia do Brasil":2,"Geografia do Maranhão":2,"História do Brasil":2,"História do Maranhão":2}, legislacao:9, info:9},
  medio:   {label:"Médio",   total:60,  g:{"Português":5,"Raciocínio Lógico":4,"Geografia do Brasil":4,"Geografia do Maranhão":4,"História do Brasil":4,"História do Maranhão":4}, legislacao:18, info:17},
  completo:{label:"Completo",total:120, g:{"Português":10,"Raciocínio Lógico":8,"Geografia do Brasil":8,"Geografia do Maranhão":8,"História do Brasil":8,"História do Maranhão":8}, legislacao:35, info:35}
};

// pega `need` questões de um pool, priorizando reforço (questões com mais erros que acertos no histórico)
// e completando com rodízio aleatório do restante, evitando repetição dentro do mesmo simulado
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickFrom(pool, need, qStats){
  if(!pool.length || need<=0) return [];
  qStats = qStats || {};
  const reforco = pool.filter(q=>{ const st=qStats[q.id]; return st && st.e > st.a; });
  const reforcoSlots = Math.min(need, Math.ceil(need*0.5), reforco.length);
  let picks = shuffle(reforco).slice(0, reforcoSlots);
  const pickedIds = new Set(picks.map(q=>q.id));
  const restNeed = need - picks.length;
  if(restNeed>0){
    const seen = new Set();
    const rest=[];
    let guard=0;
    while(rest.length<restNeed && guard<50){
      for(const q of shuffle(pool)){
        if(rest.length>=restNeed) break;
        if(pickedIds.has(q.id) || seen.has(q.id)) continue;
        seen.add(q.id); rest.push(q);
      }
      guard++;
      if(seen.size>=pool.length) break; // pool esgotado (menor que o necessário); evita loop infinito
    }
    // se o pool for menor que o total necessário, completa permitindo repetição (rodízio)
    while(rest.length<restNeed){ rest.push(...shuffle(pool)); }
    picks = picks.concat(rest.slice(0,restNeed));
  }
  return picks;
}

function buildSimulado(modeKey){
  if(modeKey === "fixo") return buildSimuladoFixo();
  if(modeKey === "fixo2") return buildSimuladoFixo2();
  if(modeKey === "fixo3") return buildSimuladoFixo3();
  const cfg = MODES[modeKey] || MODES.completo;
  const qStats = getQStats();
  const bank = allQuestions();
  let items=[];
  // Conhecimentos Gerais
  for(const subj of Object.keys(cfg.g)){
    items = items.concat(pickFrom(bank.filter(q=>q.m===subj), cfg.g[subj], qStats));
  }
  // Conhecimentos Específicos: Legislação (institucional + pertinente somadas) + Informática
  items = items.concat(pickFrom(bank.filter(q=>SUBJECTS_E_LEG.includes(q.m)), cfg.legislacao, qStats));
  items = items.concat(pickFrom(bank.filter(q=>q.m==="Informática"), cfg.info, qStats));
  return shuffle(items);
}

// Simulado fixo: as 120 questões do 1º simulado, na ordem original
function buildSimuladoFixo(){
  return allQuestions()
    .filter(q => q.fixo === true)
    .sort((a,b) => (a.ordem||0) - (b.ordem||0));
}

// Simulado fixo 3: as 120 questões do 3º simulado PM-MA (27/09/2026), na ordem original
function buildSimuladoFixo3(){
  return allQuestions().filter(q => q.fixo3 === true).sort((a,b) => (a.ordem4||0) - (b.ordem4||0));
}

// Simulado fixo 2: as 69 questões do 2º simulado, na ordem original
function buildSimuladoFixo2(){
  return allQuestions()
    .filter(q => q.fixo2 === true)
    .sort((a,b) => (a.ordem2||0) - (b.ordem2||0));
}

function buscarGlossario(texto){
  const achados = [];
  const vistos = new Set();
  GLOSSARIO.forEach(([re, termo, def])=>{
    if(re.test(texto) && !vistos.has(termo)){
      vistos.add(termo);
      achados.push({termo, def});
    }
  });
  return achados.slice(0,4);
}

{cat:"Ausência e desaparecimento", t:"Desaparecido e extraviado", re:"extravi|desaparec|paradeiro",
 fb:"Desaparecido: paradeiro ignorado por mais de 8 dias (art. 113). Extraviado: desaparecido por mais de 30 dias (art. 114). Exclusão do serviço ativo 6 meses após a agregação por extravio.",
 itens:["Desaparecido: militar da ativa em serviço, viagem, operação ou calamidade com paradeiro ignorado por MAIS DE 8 DIAS; só se não houver indício de deserção.","Extraviado: desaparecido por MAIS DE 30 DIAS, declarado oficialmente.","Extraviado é agregado; a exclusão do serviço ativo ocorre 6 MESES após a agregação (o desligamento vem após a conclusão do IPM).","Naufrágio, sinistro aéreo e catástrofe: extravio vira falecimento quando esgotam os prazos de sobrevivência.","Reaparecido: reinclusão após JMS e nova agregação; pode ir a Conselho de Justificação ou de Disciplina."],fonte:"Lei 6.513/1995, arts. 113-115, 146 e 147"},
{cat:"Dispensas e afastamentos", t:"Núpcias, luto, trânsito e instalação", re:"núpcias|luto|período de trânsito|trânsito é|instalação|afastamento total",
 fb:"Núpcias 8 dias, luto 8 dias, trânsito até 30 dias, instalação até 10 dias (art. 84). Trânsito é ANTES da mudança; instalação é DEPOIS, na apresentação à nova OPM.",
 itens:["Núpcias: 8 dias. Luto: 8 dias (cônjuge/companheiro, pais, madrasta, padrasto, pais adotivos, filhos, menor sob guarda ou tutela e irmãos).","Trânsito: até 30 dias, para mudança obrigatória de sede, usado nos preparativos.","Instalação: até 10 dias, concedida APÓS o trânsito, na apresentação à nova OPM.","Núpcias e luto: comprovação prévia ou posterior por documento oficial.","Tudo com remuneração total e contado como tempo de serviço (art. 85)."],fonte:"Lei 6.513/1995, arts. 84 e 85"},
{cat:"Dispensas e afastamentos", t:"Recompensas e dispensas do serviço", re:"dispensa|recompensa|elogio|louvor",
 fb:"Dispensa como recompensa: no máximo 8 dias. Por prescrição médica ou desconto em férias: até 15 dias (art. 159, §1º).",
 itens:["Recompensas: prêmio de Honra ao Mérito, condecorações, elogios/louvores e dispensas do serviço.","Dispensas: como recompensa, para desconto em férias ou por prescrição médica.","Recompensa: até 8 dias. Prescrição médica e desconto em férias: até 15 dias.","Sempre com remuneração integral e sem prejuízo do tempo de efetivo serviço."],fonte:"Lei 6.513/1995, arts. 158 e 159"},
{cat:"Dispensas e afastamentos", t:"Férias", re:"férias",
 fb:"Férias: 30 dias consecutivos por ano, direito após 12 meses de efetivo exercício; acumulação de no máximo 2 anos, só por imperiosa necessidade do serviço (arts. 80 e 82).",
 itens:["30 dias consecutivos por ano; direito só após os 12 primeiros meses.","Acumulação: no máximo 2 anos, em caso de imperiosa necessidade de serviço.","Adicional de 1/3 pago independentemente de pedido; pagamento no mês anterior ao gozo.","Interrompem férias: guerra, estado de sítio, estado de defesa, grave perturbação da ordem e extrema necessidade do serviço."],fonte:"Lei 6.513/1995, arts. 80-83"},
{cat:"Dispensas e afastamentos", t:"Licenças", re:"licença",
 fb:"Licença-prêmio: 3 meses por quinquênio. Pessoa da família: até 6 meses. Interesse particular: mais de 10 anos de serviço, até 2 anos, sem remuneração e sem contar tempo. Gestante: 120 dias.",
 itens:["Licença-prêmio: 3 meses de uma só vez a cada quinquênio, sem prejuízo de carreira ou remuneração.","Tratamento de saúde em pessoa da família: até 6 meses; vencimentos integrais até 3 meses, depois desconto de 1/3.","Interesse particular: mais de 10 anos de serviço, até 2 anos, SEM remuneração e SEM tempo de serviço.","Gestante: 120 dias, sem prejuízo da remuneração.","Prêmio, paternidade e interesse particular podem ser interrompidos (mobilização, cumprimento de pena ou punição, denúncia ou indiciação)."],fonte:"Lei 6.513/1995, arts. 92-98"},
{cat:"Agregação, reversão e situações especiais", t:"Agregação", re:"agrega",
 fb:"Agregado deixa a vaga do quadro e fica sem número; não pode ser promovido. Agregação por licença de saúde própria após 1 ano; pessoa da família e interesse particular após 6 meses (art. 106).",
 itens:["Incapacidade temporária: após 1 ano contínuo de tratamento. Licença de saúde própria: acima de 1 ano.","Saúde de pessoa da família e interesse particular: acima de 6 meses.","Candidato com mais de 10 anos de serviço; cargo em comissão ou função temporária não eletiva.","Condenado a pena de liberdade acima de 2 anos (sem livramento condicional) ou acima de 6 meses; extraviado; desertor.","Cargo civil temporário: após 2 anos (contínuos ou não), transferência ex officio para a reserva, sem vencimentos da PM.","Agregado não pode ser promovido. Ato de agregação: Governador ou autoridade delegada."],fonte:"Lei 6.513/1995, arts. 106 e 107"},
{cat:"Agregação, reversão e situações especiais", t:"Reversão e excedente", re:"reversão|excedente",
 fb:"Reversão pode ocorrer a qualquer tempo; ao completar 2 anos de agregação (contínuos ou não) ela é automática, sem exigir ato (art. 109, parágrafo único).",
 itens:["Reversão: retorno do agregado ao quadro quando cessa o motivo; pode ser feita a qualquer tempo.","Ato: da autoridade que decretou a agregação.","Com 2 anos contínuos ou não como agregado, a reversão é AUTOMÁTICA, sem ato de reversão.","Excedente: situação transitória (ex.: reverte com o quadro completo, promovido por bravura sem vaga); conta como efetivo serviço."],fonte:"Lei 6.513/1995, arts. 108-110"},
{cat:"Inatividade e desligamento", t:"Reserva remunerada", re:"reserva remunerada|idade limite|idades limites|compulsóri|convoca",
 fb:"Reserva a pedido: 30 anos de contribuição (homem) ou 25 (mulher). Compulsória: idade 62 (oficial homem) / 60 (praça homem); mulheres 57 e 55; ou 8 anos no último posto (art. 120).",
 itens:["A pedido: 30 anos de contribuição (M) ou 25 (F).","Compulsória por idade: oficial M 62 / F 57; praça M 60 / F 55.","Compulsória: 8 anos no último posto ou graduação com mais de 30 (M) ou 25 (F) anos de serviço; 2 anos agregado em cargo civil temporário; eleito e diplomado.","Curso pago pelo Estado: de mais de 6 meses a 1 ano, espera 18 meses; acima de 1 ano, 36 meses (ou indeniza).","Convocação da reserva: voluntária, transitória, no máximo 6 meses, vedado comando ou chefia."],lon:["A LON não fixa idades nem tempo de contribuição: remete à lei do ente federado.","Reversão ao serviço ativo do militar da reserva é voluntária; a convocação é compulsória (art. 18, XXXVI e XXXVII)."],
 fonte:"Estatuto: arts. 119-122 · LON: art. 18"},
{cat:"Inatividade e desligamento", t:"Reforma", re:"reforma|reformado|alienação",
 fb:"Reforma: idade-limite na reserva de 66 (oficial M), 61 (oficial F), 64 (praça M) e 59 (praça F); ou agregado por mais de 1 ano por incapacidade definitiva (art. 125).",
 itens:["Idade-limite na reserva: oficial M 66 / F 61; praça M 64 / F 59.","Agregado por mais de 1 ano por incapacidade definitiva.","Reformado apto em nova inspeção pode voltar; se ficar mais de 2 anos reformado, vai para a reserva.","Reformado por alienação mental: interdição judicial em até 60 dias da publicação do ato."],fonte:"Lei 6.513/1995, arts. 125, 131 e 132"},
{cat:"Inatividade e desligamento", t:"Demissão a pedido do oficial", re:"demissão|oficialato",
 fb:"Demissão a pedido (só oficiais): mais de 5 anos de oficialato, sem indenização; menos de 5 anos, com indenização das despesas de formação (art. 134).",
 itens:["Só para oficiais.","Mais de 5 anos de oficialato: sem indenização.","Menos de 5 anos: com indenização das despesas de preparação e formação.","Curso de 6 a 18 meses: indeniza se não passaram 2 anos da conclusão; acima de 18 meses: 3 anos.","Sem direito a remuneração."],fonte:"Lei 6.513/1995, arts. 133 e 134"},
{cat:"Inatividade e desligamento", t:"Estabilidade", re:"estabilidade|estável",
 fb:"Pelo Estatuto PMMA (art. 62, III, a), a estabilidade das praças vem com 10 anos de efetivo serviço.",
 fbLon:"Pela Lei Orgânica Nacional (art. 18, XXVI), a estabilidade dos militares de carreira vem após 3 anos de efetivo serviço.",
 itens:["Praças com 10 anos de efetivo serviço (art. 62, III, a).","Militar de carreira é o que tem estabilidade assegurada ou presumida (art. 2º, §3º).","Estáveis (e Aspirantes) respondem a Conselho de Disciplina; sem estabilidade, a processo administrativo próprio."],
 lon:["Estabilidade dos militares de carreira após 3 anos de efetivo serviço (art. 18, XXVI)."],
 fonte:"Estatuto: Lei 6.513/1995 · LON: Lei 14.751/2023"},
{cat:"Inatividade e desligamento", t:"Candidatura a cargo eletivo", re:"candidat|eletiv|mandato",
 fb:"Pelo Estatuto (art. 64): menos de 10 anos afasta-se da atividade; mais de 10 anos é agregado e, se eleito, passa à inatividade na diplomação.",
 fbLon:"Pela LON (art. 22): menos de 10 anos é afastado no dia posterior ao registro; mais de 10 anos é agregado no dia posterior ao registro, com remuneração, e se eleito vai à reserva remunerada proporcional na diplomação.",
 itens:["Menos de 10 anos de serviço: afasta-se da atividade.","Mais de 10 anos: agregado pela autoridade superior; se eleito, passa à inatividade no ato da diplomação (agregação conta do registro da candidatura até a diplomação).","Suspende-se o pagamento de gratificações e indenizações, salvo as ressalvadas no art. 64, §1º, III.","Em atividade, não pode ser filiado a partido político; sindicalização e greve são proibidas."],
 lon:["Menos de 10 anos: afastado do serviço ativo no dia posterior ao pedido de registro da candidatura.","Mais de 10 anos: agregado no dia posterior ao registro, com remuneração durante o pleito; se eleito, reserva remunerada com remuneração proporcional ao tempo de serviço, na diplomação.","Eleito que toma posse como suplente: agregado durante o mandato, optando por uma remuneração.","Afastamento ou agregação só são remunerados nos prazos da legislação eleitoral."],
 fonte:"Estatuto: art. 64 · LON: art. 22"},
{cat:"Processos e disciplina", t:"Punição disciplinar e recursos", re:"recorr|recurso|prescrev|detenção|prisão disciplinar|reconsideração",
 fb:"Detenção ou prisão disciplinar: máximo de 30 dias. Recurso administrativo prescreve em 30 dias (Quadro de Acesso) e 120 dias corridos nos demais casos (art. 63).",
 itens:["Penas de detenção ou prisão disciplinar: no máximo 30 dias (art. 59, §1º).","Recurso administrativo: 30 dias do recebimento da comunicação, se for Quadro de Acesso para promoção.","Nos demais casos: 120 dias corridos.","Reconsideração, queixa e representação não podem ser coletivas.","Crime militar e transgressão: aplica-se só a pena do crime (art. 55, §2º)."],fonte:"Lei 6.513/1995, arts. 55, 59 e 63"},
{cat:"Processos e disciplina", t:"Conselho de Justificação x Conselho de Disciplina", re:"conselho de|PAD|sindicância|inquérito|incapaz de permanecer|incompatível",
 fb:"Conselho de Justificação é para OFICIAIS (julgado pelo Tribunal de Justiça). Conselho de Disciplina é para Aspirante e praças COM estabilidade (última instância: Conselho Superior de Polícia).",
 itens:["Justificação: oficial presumivelmente incapaz; afastado automaticamente; julgamento pelo Tribunal de Justiça; vale também para oficiais da reserva e reformados.","Disciplina: Aspirante-a-Oficial e praças COM estabilidade; afastados das atividades; julgamento em última instância pelo Conselho Superior de Polícia.","Praça SEM estabilidade: processo administrativo próprio (PAD), não o Conselho de Disciplina.","Afastamento do cargo por incompatibilidade: Governador, Gerente de Segurança Pública ou Comandante-Geral; fica sem função até a solução final.","Transferência por conveniência da disciplina após sindicância, IPM, conselhos ou condenação transitada."],fonte:"Lei 6.513/1995, arts. 57, 60 e 61"},
{cat:"Processos e disciplina", t:"Exclusão a bem da disciplina e licenciamento", re:"exclusão|licenciamento|bem da disciplina",
 fb:"Exclusão a bem da disciplina: Aspirante e praças COM estabilidade, condenados a pena acima de 2 anos; ato do Governador. Licenciamento a bem da disciplina: praça SEM estabilidade.",
 itens:["Exclusão a bem da disciplina: Aspirante e praças com estabilidade; pena de liberdade acima de 2 anos, ou culpados em Conselho de Disciplina.","Competência: Governador do Estado.","Licenciamento: só praças; a bem da disciplina para praça sem estabilidade em MAU comportamento.","Excluído não tem remuneração nem indenização e perde o grau hierárquico."],fonte:"Lei 6.513/1995, arts. 139-143"},
{cat:"Promoções e comissões", t:"Promoções, antiguidade e comissões", re:"promoç|antiguidade|comissão de promoção|CPP|CPO|quadro de acesso",
 fb:"Pelo Estatuto: promoção por antiguidade, merecimento, bravura e post mortem (praças também por tempo de serviço); agregado não é promovido e não há promoção ao passar para a reserva ou reforma.",
 fbLon:"Pela LON (art. 14): promoção por antiguidade e merecimento, além de bravura, post mortem, por completar os requisitos para a inatividade e em ressarcimento de preterição.",
 itens:["Critérios: antiguidade, merecimento, bravura e post mortem; praças também por tempo de serviço.","Ato: Governador (oficiais) e Gerente de Estado de Segurança Pública (praças).","NÃO há promoção na transferência para a reserva ou na reforma (art. 79). Post mortem ou na reserva/reforma: sem efeitos financeiros.","Agregado não pode ser promovido. Promoção irregular é nula; ressarcimento de preterição é caso extraordinário.","Antiguidade: data da promoção; precedência dos graus anteriores; data de ingresso; data de nascimento."],
 lon:["Progressão seletiva, gradual e sucessiva, por antiguidade e merecimento (com parâmetros objetivos).","Também admitidas: bravura, post mortem, promoção por completar requisitos para transferência a pedido ou compulsória para a inatividade, e ressarcimento de preterição.","Comandante-Geral promove as praças e apresenta ao Governador a lista de promoção dos oficiais (art. 29, §3º).","CPO presidida pelo Comandante-Geral e CPP pelo Subcomandante-Geral (Lei 12.896/2026, conforme o banco)."],
 fonte:"Estatuto: arts. 21 e 77-79 · LON: arts. 14 e 29"},
{cat:"Números da carreira", t:"Prazos e números da carreira", re:"plano de comando|seis anos|6 \\(seis\\) anos|transição|adicional por tempo|quinquênio|120 dias|estágio|Chefe do Estado",
 fb:"Plano de comando: até 60 dias da posse do Comandante-Geral. Escolaridade superior: transição de até 6 anos (LON). Adicional de tempo de serviço: 5% a cada 5 anos, até 35%.",
 itens:["Plano de comando do Comandante-Geral: até 60 dias da posse (LON art. 29, §2º).","Transição para exigir escolaridade superior no ingresso: até 6 anos da publicação da LON (dez/2023).","Adicional de tempo de serviço: 5% a cada 5 anos de serviço público estadual, sobre o soldo, limite de 35%.","Estágio do Quadro de Saúde (QOS): mínimo de 90 dias antes da nomeação a 1º Tenente.","QOA/QOE: Subtenente com 18 anos de serviço e 2 anos na graduação.","Quadros extintos: 120 dias para optar (Lei 12.896/2026, conforme o banco)."],fonte:"Lei 14.751/2023; Lei 6.513/1995, arts. 13, 11 e 75"},
{cat:"Números da carreira", t:"Comandante-Geral", re:"comandante-geral|comandante geral|plano de comando",
 fb:"Pelo Estatuto (art. 31), o Comandante-Geral é nomeado pelo Governador entre oficiais da ativa do último posto do Quadro de Combatentes.",
 fbLon:"Pela LON (art. 29), é nomeado pelo Governador entre oficiais da ativa do último posto do QOEM, com CCEM, e apresenta plano de comando em até 60 dias da posse.",
 itens:["Nomeado pelo Governador entre Oficiais da ativa do último posto do Quadro de Combatentes (art. 31).","Chefe do Estado-Maior (também Subcomandante) e Subchefe: Coronéis QOPM da ativa, nomeados pelo Governador (art. 32)."],
 lon:["Nomeado pelo Governador entre oficiais da ativa do último posto do QOEM; deve ter o CCEM.","Plano de comando com metas e indicadores em até 60 dias da posse.","Relatório anual público: representações e sanções, ocorrências, letalidade e vitimização, orçamento.","Pode permanecer durante o governo de quem o nomeou, a critério do Governador."],
 fonte:"Estatuto: arts. 31-32 · LON: art. 29"},
{cat:"Números da carreira", t:"Ingresso, escolaridade e permanência (LON)", re:"escolaridade|ingresso|tatuagem|permanência|unidade militar|datas comemorativas|21 de abril",
 fb:"Pela LON, a adoção do requisito de escolaridade superior no ingresso tem prazo de até 6 anos da publicação; a permanência mínima na unidade é de 1 ano (art. 18, XXIV).",
 fbLon:"Pela LON, a adoção do requisito de escolaridade superior no ingresso tem prazo de até 6 anos da publicação; a permanência mínima na unidade é de 1 ano (art. 18, XXIV).",
 itens:[],
 lon:["Escolaridade superior no ingresso: adoção em até 6 anos da publicação da lei (art. 39), publicada em dez/2023.","Permanência mínima na unidade: 1 ano, ressalvada transferência a pedido ou compulsória (art. 18, XXIV).","Ingresso exige, entre outros: exame toxicológico de larga janela de detecção; sem tatuagens visíveis com suásticas, obscenidades ou apologia à violência, drogas ou discriminação (art. 13).","Datas comemorativas: 21 de abril (PMs) e 2 de julho (bombeiros)."],
 fonte:"Lei 14.751/2023, arts. 13, 18, 35 e 39"}
];

const TEXTOS = {
"Ausente":[["est","art. 111, caput, I e II e parágrafo único","É considerado ausente o militar que por mais de 24 (vinte quatro) horas consecutivas: I - deixar de comparecer à sua Organização Policial-Militar sem comunicar qualquer motivo de impedimento; II - ausentar-se, sem licença, da Organização Policial-Militar onde deve permanecer. Parágrafo único - Decorrido o prazo mencionado neste artigo, serão observadas as formalidades previstas na legislação específica."]],
"Desertor":[["est","art. 112","O militar é considerado desertor nos casos previstos na legislação pertinente."],["est","art. 144, caput e §§ 1º a 4º","A deserção do militar acarreta uma interrupção do serviço militar, com a conseqüente demissão ex-offício para o oficial, ou exclusão do serviço ativo para a praça. § 1º - A demissão do oficial ou a exclusão da praça com estabilidade assegurada, processar-se-á após 01 (um) ano de agregação, se não houver captura ou apresentação voluntária antes do prazo. § 2º - A praça sem estabilidade assegurada será automaticamente excluída após oficialmente declarada desertora. § 3º - O militar desertor que for capturado ou que se apresentar voluntariamente depois de haver sido demitido ou excluído, será reincluído no serviço ativo, mediante parecer da JMS e a seguir agregado para se ver processar. § 4º - A reinclusão em definitivo do militar, de que trata o parágrafo anterior, dependerá da sentença do Conselho de Justiça."]],
"Desaparecido e extraviado":[["est","art. 113, caput e parágrafo único","É considerado desaparecido o militar da ativa que, no desempenho de qualquer serviço, em viagens, em operações militares ou em caso de calamidade pública, tiver paradeiro ignorado por mais de 08 (oito) dias consecutivos. Parágrafo único - A situação de desaparecido só será considerada quando não houver indícios de deserção."],["est","art. 114","O militar que, na forma do artigo anterior, permanecer desaparecido por mais de 30 (trinta) dias, será oficialmente considerado extraviado."],["est","art. 146, § 1º","A exclusão do serviço ativo será feita 06 (seis) meses após a agregação por motivo de extravio."]],
"Núpcias, luto, trânsito e instalação":[["est","art. 84, I a IV e §§ 2º e 3º","Os militares têm direito aos seguintes períodos de afastamento total do serviço e instrução, obedecidas as disposições legais e regulamentares, por motivo de: I - núpcias, 08 (oito) dias; II - luto, 08 (oito) dias, em decorrência de falecimento do cônjuge ou companheiro, pais, madrasta, padrasto, pais adotivos, filhos, menor sob guarda ou tutela e irmãos; III - trânsito, até 30 (trinta) dias; IV - instalação, até 10 (dez) dias. § 2º - Trânsito é o período de afastamento total do serviço concedido ao militar cuja movimentação implique, obrigatoriamente, mudança de sede, e destina-se aos preparativos decorrentes da mudança. § 3º - Instalação é o período de afastamento total do serviço concedido ao militar, após o término do trânsito, quando de sua apresentação na Organização Policial-Militar para onde foi transferido."]],
"Recompensas e dispensas do serviço":[["est","art. 158, § 1º","São recompensas militares: I - prêmio de Honra ao Mérito; II - condecorações por serviços prestados; III - elogios, louvores; IV - dispensas do serviço."],["est","art. 159, caput, I a III e §§ 1º e 2º","As dispensas do serviço são autorizações para o afastamento total do serviço em caráter temporário e podem ser concedidas: I - como recompensa; II - para desconto em férias; III - em decorrência de prescrição médica. § 1º - As dispensas como recompensas terão duração de 08 (oito) dias, no máximo, e as decorrentes de prescrição médica e para desconto em férias, de até 15 (quinze) dias. § 2º - As dispensas do serviço serão concedidas com a remuneração integral e sem prejuízo para a contagem de tempo de efetivo serviço."]],
"Férias":[["est","art. 80, caput e § 1º","O militar gozará por ano, obrigatoriamente, 30 (trinta) dias consecutivos de férias remuneradas, observada a escala previamente organizada. § 1º - Somente após os doze primeiros meses de efetivo exercício adquirirá o militar direito às férias."],["est","art. 82","Só é permitida a acumulação de férias até o máximo de dois anos, no caso de imperiosa necessidade de serviço."]],
"Licenças":[["est","art. 93, § 1º","A Licença-prêmio tem a duração de 03 (três) meses, gozada de uma só vez, a cada quinquênio de serviço prestado, quando solicitado pelo interessado."],["est","art. 94, parágrafo único","A licença de que trata este artigo não poderá exceder de 06 (seis) meses e será concedida com os vencimentos e vantagens percebidos à data de sua concessão até 03 (três) meses, sofrendo, se superior a tal período, o desconto de um terço."],["est","art. 95","Licença para tratar de interesse particular é a autorização para afastamento total do serviço, concedida ao militar com mais de 10 (dez) anos de efetivo serviço que a requerer, com finalidade de tratar de assuntos particulares, e será sempre concedida com prejuízo da remuneração e o do tempo de serviço, não podendo, exceder a 02 (dois) anos."],["est","art. 97","A licença à gestante será concedida sem prejuízo da remuneração e terá a duração de 120 (cento e vinte) dias."]],
