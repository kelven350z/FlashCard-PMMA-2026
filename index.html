{m:"História do Brasil",bloco:"G",tema:"Revolta da Vacina",dif:"media",fixo2:true,ordem2:19,s:"A Revolta da Vacina, ocorrida em São Paulo em 1904, teve como estopim a lei de vacinação obrigatória contra a varíola, no contexto das reformas urbanas e sanitárias conduzidas por Oswaldo Cruz e pelo prefeito Pereira Passos.",a:false,e:"ERRADO. A Revolta da Vacina ocorreu no RIO DE JANEIRO (então capital federal), não em São Paulo, tendo como estopim a vacinação obrigatória e as reformas urbanas de Pereira Passos e sanitárias de Oswaldo Cruz."},
{m:"História do Brasil",bloco:"G",tema:"Voto de cabresto",dif:"facil",fixo2:true,ordem2:20,s:"Na Primeira República, o chamado ‘voto de cabresto 1�7 traduzia o controle exercido pelos coronéis sobre o eleitorado rural, em um contexto de voto aberto, anterior à adoção do voto secreto no país.",a:true,e:"CERTO. O ‘voto de cabresto 1�7 caracterizava o controle dos coronéis sobre o eleitorado, viabilizado pelo voto ABERTO então vigente, antes da introdução do voto secreto em 1932."},
{m:"História do Maranhão",bloco:"G",tema:"Fundação de São Luís",dif:"facil",fixo2:true,ordem2:21,s:"A cidade de São Luís foi fundada em 1612 por uma expedição francesa chefiada por Daniel de La Touche, o Senhor de La Ravardière, no contexto do projeto de estabelecimento da França Equinocial, tendo recebido seu nome em homenagem ao rei francês Luís XIII.",a:true,e:"CERTO. Fato histórico consolidado: fundação francesa de São Luís em 1612, no contexto da França Equinocial, com o nome em homenagem a Luís XIII."},
{m:"História do Maranhão",bloco:"G",tema:"Batalha de Guaxenduba",dif:"dificil",fixo2:true,ordem2:22,s:"A Batalha de Guaxenduba, ocorrida em 1614, resultou na vitória das forças francesas sobre os portugueses comandados por Jerônimo de Albuquerque, episódio que antecedeu a expulsão definitiva dos franceses do Maranhão, em 1615.",a:false,e:"ERRADO. A Batalha de Guaxenduba (1614) foi vencida pelos PORTUGUESES, comandados por Jerônimo de Albuquerque, contra os franceses  1�7 e não o contrário  1�7, sendo um marco decisivo que levou à expulsão francesa em 1615."},
{m:"História do Maranhão",bloco:"G",tema:"Invasão holandesa",dif:"media",fixo2:true,ordem2:23,s:"Os holandeses, a serviço da Companhia das Índias Ocidentais, ocuparam São Luís em 1641 e foram expulsos do Maranhão em 1644, após resistência que contou com a participação de colonos e de contingentes indígenas.",a:true,e:"CERTO. A ocupação holandesa de São Luís (1641-1644) foi encerrada com a resistência luso-brasileira, que contou com apoio de colonos e indígenas."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman",dif:"media",fixo2:true,ordem2:24,s:"A Revolta de Beckman, deflagrada em 1684 em São Luís e liderada por Manuel Beckman, teve entre suas causas a insatisfação com o monopólio exercido pela Companhia de Comércio do Maranhão e com a atuação dos jesuítas na questão da mão de obra indígena.",a:true,e:"CERTO. Os colonos revoltosos se insurgiram contra o monopólio comercial da Companhia e contra os jesuítas, que defendiam a liberdade dos indígenas, contrariando os interesses dos colonos por mão de obra escravizada."},
{m:"História do Maranhão",bloco:"G",tema:"Adesão à Independência",dif:"dificil",fixo2:true,ordem2:25,s:"A adesão do Maranhão à independência do Brasil ocorreu em 1823, de forma tardia, sendo decisiva a atuação da esquadra comandada por Lord Cochrane; até então, predominava entre as elites locais um forte sentimento antilusitano que impelia a província à imediata ruptura com Portugal.",a:false,e:"ERRADO. Ao contrário do afirmado, predominava entre as elites maranhenses um forte sentimento LUSITANO (favorável a Portugal), o que explica justamente a adesão tardia e a necessidade da intervenção naval de Lord Cochrane para forçar a submissão da província."},
{m:"História do Maranhão",bloco:"G",tema:"Balaiada - repressão",dif:"media",fixo2:true,ordem2:26,s:"A Balaiada (1838 1�71841), revolta popular ocorrida no Maranhão, envolveu sertanejos, vaqueiros e escravos e teve a sua repressão conduzida por Luís Alves de Lima e Silva, que, em razão de sua atuação, recebeu o título de Barão de Caxias.",a:true,e:"CERTO. Luís Alves de Lima e Silva comandou a repressão à Balaiada e, em razão dessa atuação, recebeu o título de Barão de Caxias (viria a ser Duque de Caxias somente mais tarde, após a Guerra do Paraguai)."},
{m:"História do Maranhão",bloco:"G",tema:"Adesão ao regime republicano",dif:"dificil",fixo2:true,ordem2:27,s:"A proclamação da República, em 1889, foi acompanhada de uma adesão do Maranhão ao novo regime federativo no século XX. A Revolução de 1930 repercutiu na política estadual, inserindo o Maranhão no processo de reordenação do poder promovido nacionalmente por Getúlio Vargas.",a:false,e:"ERRADO. Há um erro de datação: a adesão do Maranhão ao novo regime republicano, decorrente da Proclamação de 1889, ocorreu ainda no SÉCULO XIX (não no século XX); a segunda parte, sobre a Revolução de 1930, está correta isoladamente, mas o item como um todo contém a inconsistência apontada."},
{m:"Geografia do Brasil",bloco:"G",tema:"Domínio da Caatinga",dif:"facil",fixo2:true,ordem2:28,s:"O domínio morfoclimático da Caatinga, característico do semiárido nordestino, apresenta vegetação xerófila, adaptada à escassez hídrica, e rede de drenagem em que predominam rios intermitentes.",a:true,e:"CERTO. A Caatinga tem vegetação xerófila (adaptada à seca) e rede hidrográfica com predomínio de rios intermitentes/temporários, que secam na estiagem."},
{m:"Geografia do Brasil",bloco:"G",tema:"Clima semiárido nordestino",dif:"media",fixo2:true,ordem2:29,s:"O clima semiárido do Nordeste, presente no chamado Polígono das Secas, apresenta médias pluviométricas elevadas e regularmente distribuídas ao longo do ano, o que assegura a perenidade da maior parte de sua rede hidrográfica.",a:false,e:"ERRADO. O semiárido nordestino apresenta BAIXAS precipitações e MAL distribuídas ao longo do ano (concentradas em poucos meses), o que explica o predomínio de rios INTERMITENTES, e não perenes."},
{m:"Geografia do Brasil",bloco:"G",tema:"Rio São Francisco",dif:"media",fixo2:true,ordem2:30,s:"O rio São Francisco, relevante eixo de integração nacional, nasce em Minas Gerais e deságua no oceano Atlântico, mantendo-se perene mesmo no trecho em que percorre a região semiárida.",a:true,e:"CERTO. O São Francisco nasce em MG e é um dos poucos rios perenes que atravessam o semiárido nordestino, sendo por isso chamado ‘rio da integração nacional 1�7."},
{m:"Geografia do Brasil",bloco:"G",tema:"Matriz elétrica brasileira",dif:"media",fixo2:true,ordem2:31,s:"A matriz de energia elétrica brasileira caracteriza-se pela predominância das usinas hidrelétricas, o que confere ao país participação de fontes renováveis na geração de eletricidade superior à média mundial.",a:true,e:"CERTO. Historicamente a matriz elétrica brasileira é predominantemente hidrelétrica (fonte renovável), com participação de renováveis bem superior à média mundial."},
{m:"Geografia do Brasil",bloco:"G",tema:"MATOPIBA",dif:"media",fixo2:true,ordem2:32,s:"A região do MATOPIBA, área de expansão recente do agronegócio de grãos, abrange porções dos estados do Maranhão, do Tocantins, do Piauí e da Bahia e situa-se predominantemente no domínio do bioma Amazônico, de floresta equatorial densa.",a:false,e:"ERRADO. O MATOPIBA situa-se predominantemente no domínio do bioma CERRADO (savana), e não da floresta Amazônica."},
{m:"Geografia do Brasil",bloco:"G",tema:"Bioma Cerrado",dif:"media",fixo2:true,ordem2:33,s:"O bioma Cerrado, segundo maior bioma brasileiro em extensão, caracteriza-se por formação florestal densa e úmida, de dossel contínuo, com elevada pluviosidade distribuída uniformemente ao longo de todo o ano.",a:false,e:"ERRADO. O Cerrado é uma formação de SAVANA (vegetação rala e tortuosa, sem dossel contínuo), com estação seca bem definida (pluviosidade concentrada em parte do ano, e não uniforme)."},
{m:"Geografia do Brasil",bloco:"G",tema:"Complexos regionais",dif:"media",fixo2:true,ordem2:34,s:"Na regionalização em complexos regionais  1�7 Amazônia, Nordeste e Centro-Sul  1�7, o Centro-Sul concentra a maior parte do parque industrial e da infraestrutura de circulação do país.",a:true,e:"CERTO. Na regionalização de Pedro Pinchas Geiger em complexos regionais, o Centro-Sul concentra historicamente a maior parte da indústria e infraestrutura de transportes do país."},
{m:"Geografia do Brasil",bloco:"G",tema:"Pré-sal",dif:"facil",fixo2:true,ordem2:35,s:"As reservas de petróleo do pré-sal localizam-se em áreas continentais do interior do país, sob espessas camadas de rocha salina, circunstância que dispensou investimentos em exploração marítima.",a:false,e:"ERRADO. As reservas do pré-sal estão localizadas em águas MARÍTIMAS (offshore), sob o leito oceânico, exigindo pesados investimentos em tecnologia de exploração em águas profundas e ultraprofundas."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Limites do Maranhão",dif:"facil",fixo2:true,ordem2:36,s:"O Maranhão localiza-se na Região Nordeste e faz limite, a leste, com o estado do Piauí, tendo o rio Parnaíba como divisa natural; a oeste, faz fronteira com o estado do Pará, ao longo do rio Gurupi.",a:true,e:"CERTO. O Maranhão faz limite a leste com o Piauí (divisa pelo rio Parnaíba) e a oeste com o Pará (parcialmente pelo rio Gurupi)."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Rios genuinamente maranhenses",dif:"dificil",fixo2:true,ordem2:37,s:"Entre os rios genuinamente maranhenses  1�7 aqueles cujas nascentes e cursos se situam no território do estado  1�7 incluem-se o Parnaíba e o Tocantins, que drenam grande parte do território e deságuam no litoral maranhense.",a:false,e:"ERRADO. Parnaíba e Tocantins NÃO são rios genuinamente maranhenses (nascem fora do estado e servem de limite/passagem); os rios genuinamente maranhenses são, por exemplo, o Mearim, o Itapecuru, o Pindaré e o Grajaú."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Mata dos Cocais",dif:"media",fixo2:true,ordem2:38,s:"A cobertura vegetal do Maranhão reflete sua posição de transição entre biomas, com a presença de floresta amazônica na porção ocidental, de cerrado nas áreas centrais e meridionais e da Mata dos Cocais; esta última é composta predominantemente por espécies de mangue típicas do litoral.",a:false,e:"ERRADO. A Mata dos Cocais é caracterizada por palmeiras como o babaçu e a carnaúba, e não por espécies de mangue (que caracterizam os manguezais litorâneos, como os das Reentrâncias Maranhenses)."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Lençóis Maranhenses",dif:"facil",fixo2:true,ordem2:39,s:"O Parque Nacional dos Lençóis Maranhenses, situado no litoral do estado, caracteriza-se por extensos campos de dunas de areia entremeados por lagoas de água doce formadas no período chuvoso; apesar da aparência, a área não constitui um deserto, dado o regime pluviométrico relativamente elevado.",a:true,e:"CERTO. Apesar da paisagem de dunas, os Lençóis Maranhenses não são um deserto, pois recebem volume de chuvas significativo, que forma as lagoas sazonais entre as dunas."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Porto do Itaqui",dif:"dificil",fixo2:true,ordem2:40,s:"O Porto do Itaqui, localizado em São Luís, no Golfão Maranhense, é um dos principais portos do país; nele, contudo, não há integração com o modal ferroviário, uma vez que a Estrada de Ferro Carajás tem seu terminal situado no estado do Pará.",a:false,e:"ERRADO. O Porto do Itaqui é justamente o terminal marítimo da Estrada de Ferro Carajás (EFC), que liga as minas do Pará ao porto em São Luís/MA; há, portanto, plena integração ferroviária, e o terminal da EFC fica no Maranhão, não no Pará."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Extrativismo do babaçu",dif:"facil",fixo2:true,ordem2:41,s:"O extrativismo vegetal do babaçu possui importância econômica e social no Maranhão, com destaque para a atuação das chamadas quebradeiras de coco, que extraem a amêndoa aproveitada, entre outros fins, na produção de óleo.",a:true,e:"CERTO. O extrativismo do babaçu é atividade tradicional e socialmente relevante no Maranhão, com destaque para as quebradeiras de coco babaçu."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Fundação de São Luís (novamente)",dif:"facil",fixo2:true,ordem2:42,s:"São Luís, capital do Maranhão, é a única capital brasileira fundada por espanhóis, fato que se reflete em manifestações culturais tradicionais como o Bumba meu boi e o Tambor de Crioula.",a:false,e:"ERRADO. São Luís é a única capital brasileira fundada por FRANCESES (não espanhóis), em 1612, no contexto da França Equinocial."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Silogismo inválido (todo/algum)",dif:"dificil",fixo2:true,ordem2:43,s:"Considere verdadeiras as proposições ‘Todo policial militar é servidor público 1�7 e ‘Alguns servidores públicos são estáveis 1�7. Dessas proposições, conclui-se logicamente que alguns policiais militares são estáveis.",a:false,e:"ERRADO. Trata-se de um silogismo INVÁLIDO: os ‘alguns servidores públicos 1�7 que são estáveis podem não incluir nenhum policial militar; não há garantia lógica dessa conclusão a partir das premissas dadas."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Silogismo inválido (nenhum/não)",dif:"dificil",fixo2:true,ordem2:44,s:"Considere verdadeiras as proposições ‘Nenhum candidato aprovado foi eliminado 1�7 e ‘João não foi eliminado 1�7. Dessas proposições, conclui-se logicamente que João não foi aprovado.",a:false,e:"ERRADO. A informação de que ‘João não foi eliminado 1�7 é perfeitamente compatível com ele TER SIDO aprovado (já que nenhum aprovado é eliminado); logo, não se pode concluir que ele não foi aprovado."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Bicondicional",dif:"media",fixo2:true,ordem2:45,s:"Considere a proposição ‘O documento é válido se, e somente se, contém a assinatura e o carimbo 1�7. Em uma situação na qual o documento não contém o carimbo e não é considerado válido, essa proposição é verdadeira.",a:true,e:"CERTO. No bicondicional (P ↄ1�7 Q), a proposição é verdadeira quando P e Q têm o mesmo valor lógico; como ‘não válido 1�7 (P falso) e ‘não contém assinatura e carimbo 1�7 (Q falso, pois falta o carimbo) são ambos falsos, o bicondicional é verdadeiro."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Modus tollens (aplicação incorreta)",dif:"media",fixo2:true,ordem2:46,s:"Considere verdadeiras as proposições ‘Se há reforço, então a ronda é ampliada 1�7 e ‘A ronda não foi ampliada 1�7. Dessas proposições, conclui-se logicamente que houve reforço.",a:false,e:"ERRADO. Pelo modus tollens (P→Q, ~Q ⊄1�7 ~P), a conclusão correta é que NÃO HOUVE reforço, e não o contrário."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Silogismo inválido (todo/algum) II",dif:"dificil",fixo2:true,ordem2:47,s:"Considere verdadeiras as afirmações ‘Todo violinista é músico 1�7 e ‘Alguns músicos são canhotos 1�7. Dessas afirmações conclui-se, necessariamente, que algum violinista é canhoto.",a:false,e:"ERRADO. Assim como no caso análogo dos policiais militares, esse silogismo é INVÁLIDO: os ‘alguns músicos 1�7 canhotos podem não incluir nenhum violinista."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Silogismo válido (nenhum/é)",dif:"media",fixo2:true,ordem2:48,s:"Considere verdadeiras as afirmações ‘Nenhum atleta profissional é sedentário 1�7 e ‘Pedro é sedentário 1�7. Dessas afirmações conclui-se, logicamente, que Pedro não é atleta profissional.",a:true,e:"CERTO. Como nenhum atleta profissional é sedentário, e Pedro é sedentário, ele necessariamente não pode ser atleta profissional  1�7 silogismo categórico válido."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Equivalência do condicional",dif:"media",fixo2:true,ordem2:49,s:"A proposição ‘Se o alarme dispara, então há energia 1�7 é logicamente equivalente à proposição ‘O alarme não dispara ou há energia 1�7.",a:true,e:"CERTO. P ↄ1�7 Q é logicamente equivalente a ~P v Q, equivalência fundamental do cálculo proposicional."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Tabela-verdade do bicondicional",dif:"media",fixo2:true,ordem2:50,s:"Sejam p e q proposições simples. Se p é falsa e q é verdadeira, então a proposição bicondicional (p <-> q) tem valor lógico verdadeiro.",a:false,e:"ERRADO. O bicondicional só é verdadeiro quando p e q têm o MESMO valor lógico; com p falsa e q verdadeira (valores diferentes), o bicondicional é FALSO."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - hierarquia e disciplina",dif:"media",fonte:"Lei nº 6.513/1995 (Estatuto dos PMs do Maranhão)",fixo2:true,ordem2:51,s:"Conforme o Estatuto da PMMA, a hierarquia militar é a ordenação da autoridade em níveis diferentes, por meio de postos e graduações, ao passo que a disciplina se traduz pela rigorosa observância e pelo acatamento integral das leis, dos regulamentos e das normas que fundamentam a instituição.",a:true,e:"CERTO. Reprodução fiel do art. 17, §§1º e 2º, da Lei nº 6.513/1995, que define hierarquia (ordenação por postos/graduações) e disciplina (observância e acatamento às leis e regulamentos)."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - valor policial-militar",dif:"media",fonte:"Lei nº 6.513/1995 (Estatuto dos PMs do Maranhão)",fixo2:true,ordem2:52,s:"São manifestações essenciais do valor policial-militar, segundo o Estatuto da PMMA, o sentimento de servir à comunidade, o civismo e o culto às tradições históricas, a fé na elevada missão da Polícia Militar e o aprimoramento técnico-profissional.",a:true,e:"CERTO. Todos os itens citados constam expressamente do rol do art. 39 do Estatuto (Lei nº 6.513/1995) como manifestações essenciais do valor policial-militar."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - critérios de antiguidade",dif:"dificil",fonte:"Lei nº 6.513/1995 (Estatuto dos PMs do Maranhão)",fixo2:true,ordem2:53,s:"Segundo o Estatuto da PMMA, a antiguidade no posto ou graduação é regulada, sucessivamente, por diversos critérios, sendo a data de nascimento do militar o primeiro deles a ser observado, seguida da data de ingresso na Corporação.",a:false,e:"ERRADO. Pelo art. 21 do Estatuto, a ordem correta dos critérios é: 1º) data da promoção; 2º) precedência sucessiva dos graus hierárquicos anteriores; 3º) data de ingresso na Corporação; e só por último, 4º) data de nascimento  1�7 exatamente o inverso do afirmado."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - deveres",dif:"facil",fonte:"Lei nº 6.513/1995 (Estatuto dos PMs do Maranhão)",fixo2:true,ordem2:54,s:"Os deveres policiais-militares, conforme o Estatuto da PMMA, compreendem, entre outros, a dedicação integral ao serviço e a fidelidade à instituição, mesmo com o sacrifício da própria vida, a probidade e a lealdade em todas as circunstâncias e o respeito à hierarquia.",a:true,e:"CERTO. Reprodução dos incisos I, III e IV do art. 43 do Estatuto (Lei nº 6.513/1995)."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - precedência ativa x inatividade",dif:"media",fonte:"Lei nº 6.513/1995 (Estatuto dos PMs do Maranhão)",fixo2:true,ordem2:55,s:"De acordo com o Estatuto da PMMA, em igualdade de posto ou graduação, os militares da inatividade têm precedência hierárquica sobre os da ativa.",a:false,e:"ERRADO. O art. 21, §3º, estabelece exatamente o contrário: em igualdade de posto ou graduação, os militares da ATIVA têm precedência sobre os da INATIVIDADE."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - círculos hierárquicos",dif:"media",fonte:"Lei nº 6.513/1995 (Estatuto dos PMs do Maranhão)",fixo2:true,ordem2:56,s:"Conforme o Estatuto da PMMA, integram o Círculo de Oficiais Superiores os postos de Coronel, Tenente-Coronel, Major e Capitão.",a:false,e:"ERRADO. Pelo art. 19, o Círculo de Oficiais Superiores é formado apenas por Coronel, Tenente-Coronel e Major; o Capitão integra o Círculo de Oficiais Intermediários, à parte."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - conceito de Comando",dif:"media",fonte:"Lei nº 6.513/1995 (Estatuto dos PMs do Maranhão)",fixo2:true,ordem2:57,s:"Nos termos do Estatuto da PMMA, o Comando é a soma de autoridade, deveres e responsabilidades de que o militar é investido legalmente, quando conduz homens ou dirige uma Organização Policial-Militar; o Comando é vinculado ao grau hierárquico e constitui uma prerrogativa impessoal, em cujo exercício o policial-militar se define e se caracteriza como chefe.",a:true,e:"CERTO. É a redação literal do art. 48 da Lei nº 6.513/1995 (o enunciado original estava truncado; o texto foi completado com base na redação oficial do Estatuto)."},
{m:"Informática",bloco:"E",tema:"Atalhos e espaço em disco",dif:"facil",fixo2:true,ordem2:58,s:"No Windows, um atalho e o arquivo original por ele referenciado ocupam, necessariamente, a mesma quantidade de espaço em disco, visto que o atalho contém uma cópia integral do conteúdo do arquivo de destino.",a:false,e:"ERRADO. O atalho é um pequeno arquivo ponteiro (.lnk), de tamanho muito reduzido, que apenas aponta para o local do arquivo original; não contém cópia do conteúdo, logo não ocupa o mesmo espaço."},
{m:"Informática",bloco:"E",tema:"Protocolo HTTPS",dif:"media",fixo2:true,ordem2:59,s:"O protocolo HTTPS combina o HTTP com uma camada de segurança baseada no TLS, responsável pela cifragem dos dados trafegados e pela autenticação do servidor mediante certificado digital.",a:true,e:"CERTO. O HTTPS é o HTTP operando sobre uma camada de segurança TLS (antigo SSL), que cifra os dados e autentica o servidor via certificado digital."},
{m:"Informática",bloco:"E",tema:"Protocolos de intranet",dif:"media",fixo2:true,ordem2:60,s:"Uma intranet, por ser uma rede corporativa interna, utiliza protocolos e tecnologias próprios, distintos dos empregados na Internet, o que impossibilita o uso de navegadores web em seu acesso.",a:false,e:"ERRADO. A intranet utiliza os MESMOS protocolos da Internet (TCP/IP, HTTP etc.), sendo plenamente possível o acesso por meio de navegadores web comuns; a diferença está apenas no escopo restrito de acesso."},
{m:"Informática",bloco:"E",tema:"Serviço DNS",dif:"facil",fixo2:true,ordem2:61,s:"O serviço de DNS é responsável por traduzir nomes de domínio, como www.exemplo.com, nos respectivos endereços IP, o que facilita o acesso aos sítios pela Internet.",a:true,e:"CERTO. O DNS (Domain Name System) converte nomes de domínio em endereços IP correspondentes, dispensando o usuário de memorizar números."},
{m:"Informática",bloco:"E",tema:"Cookies",dif:"media",fixo2:true,ordem2:62,s:"Os cookies de um sítio, por constituírem arquivos executáveis armazenados no navegador, são capazes de instalar programas no computador do usuário, sem a interação deste.",a:false,e:"ERRADO. Cookies são pequenos arquivos de TEXTO (não executáveis), usados para armazenar dados de sessão e preferências; não têm capacidade de instalar programas."},
{m:"Informática",bloco:"E",tema:"Finalidade da VPN",dif:"facil",fixo2:true,ordem2:63,s:"O uso de uma rede privada virtual (VPN) tem por finalidade principal aumentar a velocidade de conexão física de banda larga do usuário, não desempenhando função relacionada à privacidade ou à segurança do tráfego de dados.",a:false,e:"ERRADO. A finalidade principal da VPN é justamente a privacidade e a segurança do tráfego (por meio de um túnel criptografado); ela não aumenta a velocidade física da conexão, podendo até reduzi-la levemente devido à criptografia."},
{m:"Informática",bloco:"E",tema:"Campo Cco (e-mail)",dif:"facil",fixo2:true,ordem2:64,s:"No serviço de correio eletrônico, os destinatários inseridos no campo Cco de uma mensagem permanecem ocultos entre si, sem que nenhum deles tome conhecimento dos demais endereços.",a:true,e:"CERTO. Os destinatários em Cco (cópia oculta/Bcc) ficam ocultos tanto para os destinatários de Para/Cc quanto entre si mesmos."},
{m:"Informática",bloco:"E",tema:"Busca exata no Google",dif:"facil",fixo2:true,ordem2:65,s:"Em mecanismos de busca como o Google, o emprego de aspas em torno de uma expressão restringe os resultados às páginas que contenham exatamente aquela expressão, na ordem indicada.",a:true,e:"CERTO. As aspas duplas no Google restringem a busca a páginas que contenham a expressão exata, respeitando a ordem das palavras informada."},
{m:"Informática",bloco:"E",tema:"Sincronização em nuvem",dif:"dificil",fixo2:true,ordem2:66,s:"Nos serviços de armazenamento em nuvem com sincronização automática de pastas, a exclusão de um arquivo em um dos dispositivos vinculados à conta não é propagada aos demais dispositivos, os quais mantêm a própria cópia local do arquivo.",a:false,e:"ERRADO. Nos serviços de sincronização automática (Google Drive, OneDrive, Dropbox etc.), a exclusão de um arquivo normalmente É propagada para os demais dispositivos sincronizados, removendo a cópia local neles também."},
{m:"Informática",bloco:"E",tema:"Confusão phishing x ransomware",dif:"media",fixo2:true,ordem2:67,s:"O phishing é um código malicioso que criptografa os arquivos armazenados no dispositivo da vítima e exige o pagamento de resgate para o restabelecimento do acesso a eles.",a:false,e:"ERRADO. A descrição corresponde ao RANSOMWARE, não ao phishing; phishing é uma técnica de engenharia social para enganar a vítima e obter dados sigilosos (senhas, dados bancários), geralmente por e-mails ou sites falsos."},
{m:"Informática",bloco:"E",tema:"Backup diferencial",dif:"media",fixo2:true,ordem2:68,s:"Um backup do tipo diferencial copia, a cada execução, a totalidade dos dados do sistema, independentemente de terem sido ou não alterados desde o último backup completo.",a:false,e:"ERRADO. O backup diferencial copia apenas os arquivos ALTERADOS ou CRIADOS desde o último backup completo, e não a totalidade dos dados do sistema."},
{m:"Informática",bloco:"E",tema:"Autenticação em dois fatores",dif:"facil",fixo2:true,ordem2:69,s:"A autenticação em dois fatores acrescenta uma camada de segurança ao exigir, além da senha, um segundo elemento de verificação, como um código enviado ao dispositivo do usuário.",a:true,e:"CERTO. É a definição correta de autenticação em dois fatores (2FA): senha (o que se sabe) + um segundo fator de verificação (o que se possui, como um código no celular, ou o que se é, como biometria)."},
{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"As Polícias Militares e os Corpos de Bombeiros Militares dos Estados, do Distrito Federal e dos Territórios não são integrantes do Sistema Único de Segurança Pública (SUSP).",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Compete aos Corpos de Bombeiros Militares a realização geral dos atos de polícia judiciária.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Os Corpos de Bombeiros Militares não são vinculados ao sistema de governança da política de segurança pública dos Estados, do Distrito Federal e dos Territórios.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"As Polícias Militares e os Corpos de Bombeiros Militares dos Estados, do Distrito Federal e dos Territórios são integrantes do Sistema Nacional do Meio Ambiente (SISNAMA).",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"As Polícias Militares e os Corpos de Bombeiros Militares dos Estados, do Distrito Federal e dos Territórios não são considerados instituições permanentes.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O princípio da exclusividade figura expressamente entre os princípios basilares listados no Artigo 3º da Lei Orgânica Nacional das Polícias Militares e Corpos de Bombeiros Militares (Lei nº 14.751/2023).",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A publicidade, acompanhada de transparência e prestação de contas, é um princípio basilar expressamente listado no Artigo 3º da Lei nº 14.751/2023.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A universalidade na prestação do serviço é expressamente prevista como princípio no Artigo 3º da Lei nº 14.751/2023.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A hierarquia figura expressamente no rol de princípios basilares dispostos no Artigo 3º da Lei nº 14.751/2023.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O efetivo da Polícia Militar do Distrito Federal (PMDF) é fixado em lei distrital, considerando-se a extensão da área territorial, a população, os índices de criminalidade e as condições socioeconômicas locais.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Na estrutura básica hierárquica das polícias militares, generais e cadetes são considerados, respectivamente, oficiais superiores e oficiais subalternos.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Em regra, os militares do Distrito Federal têm a prerrogativa inerente ao exercício do cargo de serem presos somente por ordem escrita da autoridade judiciária competente ou em flagrante delito.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O Comandante-Geral da PMDF é nomeado por ato do Presidente da República entre os oficiais da ativa do último posto do Quadro de Oficiais de Estado-Maior (QOEM).",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Compete às polícias militares executar, prioritariamente, ressalvadas as competências da União e dos municípios, as ações de busca, salvamento e resgate e, privativamente, as ações de prevenção, combate e perícia administrativa de incêndios e de polícia judiciária militar.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"É permitido aos militares divulgar imagens de pessoas sob sua custódia sem prévia autorização judicial.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"São garantias das polícias militares e dos corpos de bombeiros militares dos Estados, do Distrito Federal e dos Territórios, bem como de seus membros ativos e veteranos da reserva remunerada e reformados, entre outras: uso dos títulos e designações hierárquicas.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O militar com menos de 10 (dez) anos de serviço que for candidato a mandato eletivo será agregado no dia posterior ao pedido de registro de sua candidatura na Justiça Eleitoral com remuneração, enquanto perdurar o pleito eleitoral, e, se eleito, no ato da diplomação passará para a reserva remunerada com remuneração proporcional ao tempo de serviço.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"É vedado aos militares, enquanto em atividade, participar de sociedade comercial, salvo como cotista, acionista e comanditário, e exercer atividade gerencial ou administrativa nessas empresas, salvo na hipótese de licença para tratar de interesse particular.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Constitui diretriz nacional a ser observada no âmbito da polícia judiciária militar a garantia do livre convencimento técnico-jurídico do oficial no seu exercício.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Compete às polícias militares executar, ressalvada a competência da União, de forma privativa, a polícia judiciária militar dos Estados, do Distrito Federal e dos Territórios.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A competência conferida às polícias militares para exercer a polícia ostensiva rodoviária e de trânsito nos Estados autoriza a absorção e substituição integral das atribuições dos agentes de trânsito concursados em carreira própria dos municípios.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"No exercício da proteção ambiental, as polícias militares possuem competência para lavrar auto de infração ambiental e aplicar as correspondentes sanções e penalidades administrativas como integrantes do Sisnama.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"É atribuição legal das polícias militares custodiar, por meio de órgão próprio ou em unidade militar, o militar condenado ou preso provisoriamente à disposição da autoridade competente.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"É atribuição expressa das polícias militares a implementação de ações e programas contínuos e permanentes de prevenção, orientação e reeducação relacionados ao desvio de conduta ético policial-militar.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Para os fins da Lei Orgânica Nacional, considera-se função de polícia judiciária militar a atividade exercida no âmbito do Código Penal Militar e do Código de Processo Penal Militar.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Cabe às polícias militares e aos corpos de bombeiros militares produzir, difundir, planejar e executar ações de inteligência e contrainteligência destinadas a neutralizar ilícitos e ameaças à ordem pública.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Compete às polícias militares cumprir mandados de prisão, busca e apreensão e demais medidas cautelares expedidos pela Justiça Militar referentes à apuração de infrações penais militares praticadas por seus membros.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Compete aos corpos de bombeiros militares executar, de forma privativa, as ações de prevenção, combate e perícia administrativa de incêndios, bem como a polícia judiciária militar.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A perícia administrativa realizada pelo corpo de bombeiros militar em local de sinistro deve preceder obrigatoriamente a atuação do perito criminal, sobrepondo-se ao laudo pericial criminal para todos os efeitos legais.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Inclui-se entre as competências dos corpos de bombeiros militares a fiscalização dos serviços de armazenamento e transporte de produtos especiais e perigosos.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Os corpos de bombeiros militares possuem competência para lavrar auto de infração ambiental nos casos de incêndio florestal e aplicar sanções administrativas, nos termos da legislação e do instrumento de parceria.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"É competência privativa dos corpos de bombeiros militares o exercício das atividades de segurança contra incêndio, pânico e emergência em edificações e eventos públicos.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"As competências conferidas pela lei orgânica aos corpos de bombeiros militares aplicam-se igualmente aos corpos de bombeiros orgânicos e integrantes da estrutura das polícias militares, respeitadas as particularidades organizacionais.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Os membros dos corpos de bombeiros militares são considerados autoridades de polícia administrativa e de polícia judiciária militar nos termos do Código de Processo Penal Militar.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"As polícias militares e os corpos de bombeiros militares são forças auxiliares e reservas do Exército Brasileiro.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A celebração de convênios e intercâmbios operacionais pelas corporações militares com outros órgãos públicos é permitida, sendo contudo vedado o esvaziamento ou a substituição de funções de outras instituições.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"É permitida às polícias militares e aos corpos de bombeiros militares a prestação de cooperação técnica financeira para a formação e o treinamento de natureza militar direcionados a guardas municipais e instituições civis.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"As corporações militares estaduais podem cooperar nas comunicações do sistema de segurança pública.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A organização das polícias militares e dos corpos de bombeiros militares estaduais deve ser fixada em lei de iniciativa privativa do Governador do Estado.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A organização e a estrutura básica da Polícia Militar e do Corpo de Bombeiros Militar do Distrito Federal são reguladas por meio de lei distrital de iniciativa privativa do Governador do Distrito Federal.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A estrutura básica preferencial das corporações militares compreende os órgãos de direção, de assessoramento, de apoio, de execução e de correição.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Na estrutura básica das corporações, os órgãos de assessoramento destinam-se precipuamente ao atendimento das atividades-meio, como recursos humanos, logística, saúde e gestão financeira.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"As funções de corregedoria-geral exercidas pelos órgãos de correição das corporações militares não suprimem a responsabilidade do poder hierárquico e disciplinar das autoridades locais.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Os órgãos de direção das corporações dividem-se em órgãos de direção-geral (planejamento estratégico e administração superior) e órgãos de direção setorial (inteligência, RH, saúde, ensino, logística e finanças).",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"As instituições militares estaduais podem contar com órgãos especializados de execução para missões específicas, com responsabilidade sobre toda a área da unidade federada.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"No plano da hierarquia militar, o posto de Capitão enquadra-se na categoria de oficial intermediário, enquanto o Major pertence à categoria de oficial superior.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O Subtenente e o Aspirante a Oficial pertencem à mesma categoria hierárquica, sendo ambos classificados legalmente como praças especiais.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"É condição básica para ingresso nas corporações militares estaduais a ausência de qualquer registro de antecedente penal, seja ele decorrente de crime doloso ou culposo.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O comprovante do grau de escolaridade de nível superior exigido para ingresso na corporação deve ser apresentado obrigatoriamente na data de admissão, incorporação ou formatura.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O edital de concurso público para ingresso na polícia militar pode proibir de forma ampla a admissão de candidatos que possuam qualquer tipo de tatuagem visível no corpo quando em uso de fardamento.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"As polícias militares e os corpos de bombeiros militares dos Estados, do Distrito Federal e dos Territórios são definidos nacionalmente como instituições militares permanentes, exclusivas e típicas de Estado, na condição de forças auxiliares e reserva do Exército.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O comando-geral das polícias militares e dos corpos de bombeiros militares estaduais pode ser exercido por oficial do quadro de reserva remunerada ou desde que tenha pertencido ao último posto do Quadro de Oficiais de Estado-Maior (QOEM).",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"No âmbito da preservação da ordem pública, cabe às polícias militares dos Estados, do Distrito Federal e dos Territórios o exercício da polícia ostensiva e da polícia judiciária militar.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Constitui princípio básico a ser observado pelas corporações militares estaduais a proteção, a promoção e o respeito aos direitos humanos, inclusive os decorrentes de compromissos internacionais assumidos pelo Brasil.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Por força do princípio constitucional da eficiência, a aplicação do princípio da publicidade e da transparência é dispensada nos atos administrativos e disciplinares internos das polícias militares e corpos de bombeiros militares.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A Polícia Militar do Maranhão (PMMA) é uma instituição militar permanente, considerada força auxiliar e reserva do Exército Brasileiro.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Hierarquicamente, a PMMA subordina-se diretamente à Secretaria de Estado da Segurança Pública, sendo esta a autoridade máxima da corporação.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Compete privativamente à PMMA a execução da polícia judiciária militar no âmbito do Estado do Maranhão.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A competência da PMMA inclui a execução do policiamento ostensivo com vistas à proteção ambiental, além da prevenção e repressão de atividades lesivas ao meio ambiente.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O Estado-Maior Geral é classificado na estrutura organizacional da corporação como um órgão de apoio, responsável pela assistência imediata ao Comando-Geral.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O Comandante-Geral deve ser nomeado pelo Governador do Estado entre os oficiais da ativa do posto de Coronel do Quadro de Oficiais de Estado-Maior (QOEM).",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Para a nomeação como Comandante-Geral, o oficial deve obrigatoriamente possuir o Curso de Comando e Estado-Maior (CCEM).",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Ao titular do cargo de Comandante-Geral são asseguradas as mesmas prerrogativas e a remuneração conferidas aos Secretários de Estado.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O Comandante-Geral deve apresentar o Plano de Comando, com metas e indicadores de sua gestão, no prazo de até 30 dias após sua nomeação.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O Subcomandante-Geral é o substituto imediato do Comandante-Geral e possui precedência funcional sobre todos os demais oficiais do último posto.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A presidência da Comissão de Promoção de Praças (CPP) da PMMA é uma atribuição do Subcomandante-Geral.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O Estado-Maior Geral (EMG) é o órgão de direção geral responsável pela direção estratégica, planejamento, coordenação e controle das atividades operacionais e administrativas.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Na estrutura do EMG, a 1ª Seção (PM/1) é responsável pelos assuntos de Inteligência Estratégica e Contrainteligência.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A 2ª Seção do EMG (PM/2) tem como competência definir e planejar a política institucional de inteligência e contrainteligência.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A 3ª Seção do EMG (PM/3) é o órgão responsável pela logística, suprimento, patrimônio e transporte da corporação.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"As Diretorias são órgãos de direção setorial encarregados do desdobramento e fiscalização da política institucional em suas respectivas áreas.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A Academia de Polícia Militar Gonçalves Dias (APMGD) deve vincular-se academicamente à Universidade Estadual do Maranhão (UEMA).",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O Comando de Missões Especiais (CME) possui, entre suas atribuições, a execução de operações de alto risco contra o crime organizado e ataques a instituições financeiras.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O Alto Comando da PMMA possui natureza estritamente consultiva, não dispondo de competência deliberativa sobre o orçamento ou atos normativos.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A Comissão de Promoção de Praças (CPP) tem como principal atribuição avaliar o mérito e a capacidade das praças para ocupar cargos de maior responsabilidade.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O Centro de Educação, Formação e Aperfeiçoamento Profissional (CEFAP) é o órgão de ensino superior responsável pela formação e capacitação das praças.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Os Comandos de Policiamento de Áreas (CPA) são órgãos de execução de nível intermediário, responsáveis pela coordenação das diretrizes operacionais em suas circunscrições.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"As Unidades de Polícia Militar (UPM) podem ser organizadas na forma de Batalhões, Regimentos, Companhias Independentes ou Esquadrões.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A Patrulha Maria da Penha é uma unidade subordinada ao Comando de Segurança Comunitária (CSC), responsável pelo acompanhamento de vítimas de violência doméstica.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A menor unidade operacional da corporação é o Grupo Policial Militar (Gp PM), que deve ser constituído por um Segundo ou Terceiro Sargento e, no mínimo, três Soldados.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O Corregedor-Geral da Polícia Militar é o substituto imediato do Subcomandante-Geral na escala de precedência.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O efetivo total fixado pela LOB PMMA para a corporação é de 15.000 policiais militares.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"No quadro hierárquico, o posto de Major é classificado como oficial superior.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O Quadro de Oficiais de Estado-Maior (QOEM) é integrado obrigatoriamente por oficiais bacharéis em Direito.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"As promoções dos militares estaduais da PMMA ocorrem obrigatoriamente nos meses de março, agosto e dezembro.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Os Colégios Militares Tiradentes (CMT) destinam-se exclusivamente ao atendimento dos dependentes de militares estaduais, sendo vedado o acesso da comunidade em geral a essas unidades de ensino.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A função de Diretor dos Colégios Militares em regime de convênio com municípios deve ser exercida prioritariamente por Coronel da reserva remunerada.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Compete ao Centro de Material Bélico (CMB) a gestão e controle dos sistemas de radiocomunicação e o emprego de aeronaves não tripuladas (drones) na corporação.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O Centro de Perícias e Saúde Ocupacional (CPPSO) é o órgão de apoio responsável pela gestão das Juntas Militares de Saúde e pela realização de perícias médicas e inspeções regulamentares.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Os Batalhões de Polícia Militar e os Regimentos de Polícia Montada classificados como Tipo I possuem efetivo fixado entre 336 e 400 policiais militares.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"As Companhias de Polícia Militar Independentes e os Esquadrões de Polícia Montada terão um efetivo máximo de até 250 policiais militares.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O município maranhense que não sediar sede de Batalhão, Companhia ou Pelotão contará com um Destacamento Policial Militar (Dst PM), estruturado minimamente por um Grupo Policial Militar (Gp PM).",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O efetivo total fixado para a Polícia Militar do Maranhão na Lei de Organização Básica é de 14.290 policiais militares.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"As vagas destinadas à promoção do militar por completar requisitos para transferência a pedido ou compulsória para a inatividade compõem o Quadro Suplementar da PMMA, sendo computadas normalmente dentro do efetivo fixado para os quadros ordinários.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O antigo Quadro de Oficiais Policiais Militares (QOPM) passa a denominar-se Quadro de Oficiais de Estado-Maior (QOEM), mantendo-se os postos e a precedência hierárquica de seus integrantes.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"É dever do Comandante-Geral assegurar a ampla divulgação pública e anual de relatório detalhado sobre as atividades da Corporação, contendo obrigatoriamente dados sobre letalidade e vitimização de policiais e de civis.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A Ouvidoria da Polícia Militar é classificada legalmente como órgão de correição da corporação, cabendo-lhe instaurar diretamente inquéritos policiais militares.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A Ajudância-Geral (AJG), órgão de apoio ao Comando-Geral, tem sob sua estrutura a Banda de Música João Carlos Dias Nazareth, reconhecida como Patrimônio Cultural Imaterial do Maranhão.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A condução dos processos licitatórios e a formalização de contratos no âmbito da PMMA são de responsabilidade da Comissão Setorial de Licitação (CSL).",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O sentimento de servir à comunidade, traduzido pela vontade inabalável de cumprir o dever e pelo integral devotamento à preservação da ordem pública, mesmo com o risco da própria vida, constitui manifestação essencial do valor policial-militar.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Os deveres policiais-militares compreendem, entre outros aspectos, a obrigação de tratar o subordinado dignamente e com urbanidade.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Cabe ao policial-militar a responsabilidade integral pelas decisões que tomar, pelas ordens que emitir e pelas atos que praticar.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"No concurso de crime militar e de transgressão disciplinar cometidos pelo mesmo agente, serão aplicadas cumulativamente as penas relativas a ambas as infrações.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Ao policial-militar da ativa é vedado comerciar ou tomar parte na administração de sociedade, sendo-lhe proibido inclusive participar de sociedades anônimas na condição de acionista ou cotista.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"As praças da Polícia Militar do Maranhão adquirem estabilidade na corporação quando contam com dez ou mais anos de efetivo serviço.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O direito de recorrer na esfera administrativa prescreverá no prazo de 30 dias a contar do recebimento da comunicação oficial, quando se tratar de ato referente à composição de Quadro de Acesso para promoção.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"É permitido ao policial-militar da ativa, enquanto permanecer em serviço ativo, estar filiado a partido político.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O adicional por tempo de serviço do militar é devido à razão de 5% a cada cinco anos de efetivo serviço público estadual, incidindo sobre o soldo, até o limite máximo de 35%.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A agregação é a situação na qual o policial-militar da ativa deixa de ocupar vaga na escala hierárquica do seu quadro, nela permanecendo sem número.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O militar que se encontra na situação de agregado não poderá ser promovido na carreira enquanto perdurar essa condição.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Considera-se ausente o militar que deixar de comparecer à sua Organização Policial-Militar, sem comunicar impedimento, por um período superior a 48 horas consecutivas.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O militar que permanecer desaparecido por mais de 8 dias consecutivos no desempenho de serviço ou viagem será officially considerado extraviado.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"As penas disciplinares de detenção ou prisão aplicadas aos policiais-militares da corporação não podem ultrapassar o limite máximo de trinta dias.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O direito à demissão a pedido, que é aplicável exclusivamente aos oficiais, será concedido com indenização das despesas se o oficial contar com menos de cinco anos de oficialato.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O período de férias do policial-militar da ativa pode ser interrompido por motivo de extrema necessidade do serviço, de grave perturbação da ordem pública, de estado de sítio, de estado de defesa ou de declaração de guerra.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Por motivo de núpcias ou de luto decorrente do falecimento de cônjuge, companheiro, pais, padrasto ou filhos, o policial-militar tem direito ao afastamento total do serviço pelo período de até dez dias consecutivos, sem prejuízo de sua remuneração.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A licença-prêmio consiste na autorização para o afastamento total do serviço, relativa a cada quinquênio de tempo de efetivo serviço prestado, possuindo a duração de três meses a serem gozados de uma só vez, sem que isso acarrete restrições para a carreira ou para a remuneração do militar.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A licença para tratar de interesse particular é a autorização para o afastamento total do serviço concedida, com prejuízo da remuneração e do tempo de serviço, ao policial-militar que contar com mais de cinco anos de efetivo serviço e que a requerer para essa finalidade.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Fora dos casos de flagrante delito, nos quais a prisão pode ser efetuada por autoridade policial ordinária, o policial-militar somente poderá ser detido ou preso mediante determinação escrita de autoridade judicial ou de autoridade militar competente.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"É vedado ao policial-militar na inatividade o uso de uniforme em reuniões, propagandas ou qualquer outra manifestação de caráter político-partidário.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O policial-militar promovido por bravura sem que haja vaga aberta em seu respectivo quadro passará automaticamente para a situação de excedente, devendo ocupar a primeira vaga que se abrir.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"A reversão do policial-militar que completou dois anos na situação de agregado ocorrerá de forma automática, independentemente da necessidade de expedição de ato formal de reversão pela autoridade administrativa competente.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O licenciamento a bem da disciplina é uma sanção de exclusão aplicada às praças da ativa, sendo de competência do Governador do Estado ou de autoridade delegada a expedição do correspondente ato para praças sem estabilidade assegurada que ingressarem no mau comportamento.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O tempo de serviço prestado pelo militar na iniciativa privada vinculada à previdência social, anteriormente ao seu ingresso na corporação, será computado como anos de serviço para efeito de transferência para a reserva remunerada e reforma, sendo vedada sua contagem para fins de percepção de gratificação por tempo de serviço.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"Conforme as disposições do Estatuto, a licença à gestante concedida à policial-militar possui a duração de cento e vinte dias, período no qual lhe é assegurada a percepção de sua remuneração de forma integral, sem que isso acarrete prejuízos financeiros.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"O policial-militar que for preso em flagrante delito por autoridade policial civil poderá permanecer custodiado nas dependências da delegacia de polícia comum durante todo o transcorrer do inquérito e do processo judicial, desde que a autoridade civil responsável fundamente a necessidade de sua manutenção no cárcere local.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},{m:"Legislação",bloco:"E",tema:"Lei Orgânica/Estatuto PMMA",dif:"media",s:"No rol das recompensas militares previstas na legislação estatutária da corporação, encontram-se as dispensas do serviço, as quais, quando forem concedidas sob o título de recompensa, terão a sua duração limitada ao patamar máximo de oito dias, mantendo-se a remuneração integral do militar e a contagem regular de seu tempo de efetivo serviço.",a:false,e:"Revisar com base na Lei 14.751/2023 e Estatuto PMMA"},
{m:"Informática",id:"Informática|Word - Quebra de Seção e orientação|594",bloco:"E",tema:"Word - Quebra de Seção e orientação",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:31,s:"Texto: Uma servidora pública da Controladoria-Geral foi incumbida de formatar um relatório de auditoria de 50 páginas no Microsoft Word 365 (em português). O documento requer uma estrutura específica: as páginas 1 a 3 (Capa e Sumário) não podem ter cabeçalho nem numeração de página; o corpo do relatório (páginas 4 a 42) deve ser formatado na orientação Retrato com numeração iniciando em \"1\"; já os anexos (páginas 43 a 50), por conterem tabelas orçamentárias muito largas, devem ser apresentados na orientação Paisagem. Julgue o item: Para aplicar a orientação Paisagem apenas nas páginas de anexos sem alterar a orientação Retrato do corpo do relatório, a servidora precisará obrigatoriamente fracionar o documento em seções lógicas independentes por meio do recurso de Quebra de Seção (como a opção \"Próxima Página\").",a:true,e:"CERTO. Para ter orientações diferentes no mesmo documento, é preciso dividi-lo em seções com Quebra de Seção (Próxima Página)."},
{m:"Informática",id:"Informática|Word - sumário automático|595",bloco:"E",tema:"Word - sumário automático",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:32,s:"Texto: Uma servidora pública da Controladoria-Geral foi incumbida de formatar um relatório de auditoria de 50 páginas no Microsoft Word 365 (em português). O documento requer uma estrutura específica: as páginas 1 a 3 (Capa e Sumário) não podem ter cabeçalho nem numeração de página; o corpo do relatório (páginas 4 a 42) deve ser formatado na orientação Retrato com numeração iniciando em \"1\"; já os anexos (páginas 43 a 50), por conterem tabelas orçamentárias muito largas, devem ser apresentados na orientação Paisagem. Julgue o item: Para que o Sumário do relatório seja gerado de forma automática no Word, a servidora deve digitar previamente todos os títulos no documento e marcá-los manualmente com a ferramenta Pincel de Formatação antes de clicar no comando Inserir Sumário da guia Referências.",a:false,e:"ERRADO. O sumário automático depende dos Estilos de Título (Título 1, Título 2...) aplicados aos títulos, não do Pincel de Formatação. Depois se usa Referências > Sumário."},
{m:"Informática",id:"Informática|LibreOffice Writer - extensão nativa|596",bloco:"E",tema:"LibreOffice Writer - extensão nativa",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:33,s:"Texto: Uma servidora pública da Controladoria-Geral foi incumbida de formatar um relatório de auditoria de 50 páginas no Microsoft Word 365 (em português). O documento requer uma estrutura específica: as páginas 1 a 3 (Capa e Sumário) não podem ter cabeçalho nem numeração de página; o corpo do relatório (páginas 4 a 42) deve ser formatado na orientação Retrato com numeração iniciando em \"1\"; já os anexos (páginas 43 a 50), por conterem tabelas orçamentárias muito largas, devem ser apresentados na orientação Paisagem. Julgue o item: Caso a servidora opte por salvar uma cópia desse relatório no formato nativo do editor de textos LibreOffice Writer (em português), o arquivo gerado terá a extensão .ods, assegurando a aderência ao padrão internacional aberto ODF (OpenDocument Format).",a:false,e:"ERRADO. O formato nativo do Writer é .odt. A extensão .ods é do Calc (planilhas)."},
{m:"Informática",id:"Informática|LibreOffice Writer - Registrar Alterações|597",bloco:"E",tema:"LibreOffice Writer - Registrar Alterações",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:34,s:"Texto: Dois analistas jurídicos estão revisando um parecer técnico de forma colaborativa no LibreOffice Writer (em português). O primeiro analista ativou uma ferramenta de revisão para registrar todas as inserções, exclusões e alterações de texto feitas no documento. Julgue o item: A ferramenta de revisão utilizada é o recurso Registrar Alterações. No LibreOffice Writer, a combinação de teclas de atalho padrão utilizada para ativar ou desativar o registro de alterações é Ctrl + Shift + C.",a:true,e:"CERTO. No Writer, Ctrl + Shift + C ativa/desativa o registro de alterações."},
{m:"Informática",id:"Informática|LibreOffice Writer - Negrito (Ctrl + B)|598",bloco:"E",tema:"LibreOffice Writer - Negrito (Ctrl + B)",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:35,s:"Texto: Dois analistas jurídicos estão revisando um parecer técnico de forma colaborativa no LibreOffice Writer (em português). O primeiro analista ativou uma ferramenta de revisão para registrar todas as inserções, exclusões e alterações de texto feitas no documento. Julgue o item: Se o primeiro analista desejar aplicar a formatação de Negrito em um trecho do texto selecionado no LibreOffice Writer em português, ele deverá utilizar a combinação de teclas Ctrl + N, idêntica à utilizada no Microsoft Word em português.",a:false,e:"ERRADO. Diferente do Word em português (Ctrl + N), no LibreOffice Writer o negrito é Ctrl + B (de \"Bold\"). No Writer, Ctrl + N cria um novo documento."},
{m:"Informática",id:"Informática|Word - Ctrl + Espaço (limpar formatação de caracteres)|599",bloco:"E",tema:"Word - Ctrl + Espaço (limpar formatação de caracteres)",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:36,s:"Texto: Durante a formatação de uma minuta de decreto no Microsoft Word, um secretário precisava limpar todas as formatações diretas (como fontes, cores e tamanhos manuais) aplicadas a um parágrafo para que ele voltasse ao estilo padrão do documento. Julgue o item: No MS Word, a combinação de teclas de atalho que permite remover rapidamente a formatação direta de caracteres do texto selecionado, restaurando o estilo padrão, é Ctrl + Espaço.",a:true,e:"CERTO. Ctrl + Espaço remove a formatação manual de caracteres do texto selecionado, voltando ao estilo do parágrafo."},
{m:"Informática",id:"Informática|Word - Mala Direta|600",bloco:"E",tema:"Word - Mala Direta",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:37,s:"Texto: Durante a formatação de uma minuta de decreto no Microsoft Word, um secretário precisava limpar todas as formatações diretas (como fontes, cores e tamanhos manuais) aplicadas a um parágrafo para que ele voltasse ao estilo padrão do documento. Julgue o item: Caso o secretário precise criar um lote de 100 cartas personalizadas com nome, CPF e endereço de diferentes cidadãos a partir de um único documento modelo e de uma tabela de dados do Excel, ele deverá utilizar a ferramenta Mala Direta, disponível na guia Correspondências do Word.",a:true,e:"CERTO. A Mala Direta (guia Correspondências) mescla um documento modelo com uma fonte de dados, como uma planilha do Excel."},
{m:"Informática",id:"Informática|Excel - função SE e referência relativa|601",bloco:"E",tema:"Excel - função SE e referência relativa",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:38,s:"Texto: Um fiscal de receitas elaborou uma planilha no Microsoft Excel (em português) para auditoria do cumprimento de metas de arrecadação de cinco unidades regionais. Colunas: A = Unidade; B = Meta R$; C = Arrecadado R$; D = Situação (ainda vazia). Linha 1 (Regional 1): Meta = 200.000 | Arrecadado = 250.000. Linha 2 (Regional 2): Meta = 150.000 | Arrecadado = 120.000. Linha 3 (Regional 3): Meta = 300.000 | Arrecadado = 300.000. Linha 4 (Regional 4): Meta = 100.000 | Arrecadado = 90.000. Linha 5 (Regional 5): Meta = 250.000 | Arrecadado = 280.000. Julgue o item: Para preencher a coluna \"Situação\" (célula D1) indicando \"Superou\" caso a arrecadação (coluna C) seja estritamente maior que a meta (coluna B), e \"Abaixo\" caso contrário, o fiscal digitou =SE(C1>B1; \"Superou\"; \"Abaixo\"). Ao arrastar a alça de preenchimento de D1 até D5, a fórmula se ajustará automaticamente para as linhas subsequentes devido ao emprego de referências relativas.",a:true,e:"CERTO. A fórmula usa referências relativas, que se ajustam ao arrastar a alça de preenchimento (D1 ↄ1�7 C1>B1; D2 ↄ1�7 C2>B2...). Como o operador > é estrito, a Regional 3 (300.000 = 300.000) resulta em \"Abaixo\"."},
{m:"Informática",id:"Informática|Excel - MÉDIA.SE|602",bloco:"E",tema:"Excel - MÉDIA.SE",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:39,s:"Texto: Um fiscal de receitas elaborou uma planilha no Microsoft Excel (em português) para auditoria do cumprimento de metas de arrecadação de cinco unidades regionais. Colunas: A = Unidade; B = Meta R$; C = Arrecadado R$; D = Situação (ainda vazia). Linha 1 (Regional 1): Meta = 200.000 | Arrecadado = 250.000. Linha 2 (Regional 2): Meta = 150.000 | Arrecadado = 120.000. Linha 3 (Regional 3): Meta = 300.000 | Arrecadado = 300.000. Linha 4 (Regional 4): Meta = 100.000 | Arrecadado = 90.000. Linha 5 (Regional 5): Meta = 250.000 | Arrecadado = 280.000. Julgue o item: Para calcular a média aritmética apenas das arrecadações (intervalo C1:C5) que foram iguais ou superiores a R$ 200.000,00, o fiscal inseriu a fórmula =MÉDIA.SE(C1:C5; \">=200000\"). O valor retornado por essa fórmula será R$ 276.666,67.",a:true,e:"CERTO. Arrecadações ≄1�7 200.000: 250.000, 300.000 e 280.000. Média = 830.000 ÷ 3 = 276.666,67."},
{m:"Informática",id:"Informática|Excel - CONT.NÚM|603",bloco:"E",tema:"Excel - CONT.NÚM",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:40,s:"Texto: Um fiscal de receitas elaborou uma planilha no Microsoft Excel (em português) para auditoria do cumprimento de metas de arrecadação de cinco unidades regionais. Colunas: A = Unidade; B = Meta R$; C = Arrecadado R$; D = Situação (ainda vazia). Linha 1 (Regional 1): Meta = 200.000 | Arrecadado = 250.000. Linha 2 (Regional 2): Meta = 150.000 | Arrecadado = 120.000. Linha 3 (Regional 3): Meta = 300.000 | Arrecadado = 300.000. Linha 4 (Regional 4): Meta = 100.000 | Arrecadado = 90.000. Linha 5 (Regional 5): Meta = 250.000 | Arrecadado = 280.000. Julgue o item: Se o fiscal utilizar a fórmula =CONT.NÚM(A1:D5) na célula C7, o valor retornado será 20, pois todas as 20 células da matriz selecionada estão devidamente preenchidas com informações.",a:false,e:"ERRADO. CONT.NÚM conta apenas células com números. Em A1:D5 só há números nas colunas B e C (10 células); a coluna A tem texto e a D está vazia. O resultado é 10, não 20."},
{m:"Informática",id:"Informática|LibreOffice Calc - F4 (referência absoluta)|604",bloco:"E",tema:"LibreOffice Calc - F4 (referência absoluta)",dif:"dificil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:41,s:"Texto: Um fiscal de receitas elaborou uma planilha no Microsoft Excel (em português) para auditoria do cumprimento de metas de arrecadação de cinco unidades regionais. Colunas: A = Unidade; B = Meta R$; C = Arrecadado R$; D = Situação (ainda vazia). Linha 1 (Regional 1): Meta = 200.000 | Arrecadado = 250.000. Linha 2 (Regional 2): Meta = 150.000 | Arrecadado = 120.000. Linha 3 (Regional 3): Meta = 300.000 | Arrecadado = 300.000. Linha 4 (Regional 4): Meta = 100.000 | Arrecadado = 90.000. Linha 5 (Regional 5): Meta = 250.000 | Arrecadado = 280.000. Julgue o item: Caso o fiscal abra a mesma planilha no LibreOffice Calc e deseje alternar o tipo de referência da célula B1 dentro de uma fórmula (de relativa para absoluta ou mista), ele deverá utilizar a tecla de atalho F4, assim como feito no Microsoft Excel.",a:true,e:"CERTO. No Calc (desde a versão 5.1) a tecla F4 alterna entre referência relativa, absoluta e mista, como no Excel. Shift + F4 também funciona."},
{m:"Informática",id:"Informática|Excel - SOMASE|605",bloco:"E",tema:"Excel - SOMASE",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:42,s:"Texto: Um fiscal de receitas elaborou uma planilha no Microsoft Excel (em português) para auditoria do cumprimento de metas de arrecadação de cinco unidades regionais. Colunas: A = Unidade; B = Meta R$; C = Arrecadado R$; D = Situação (ainda vazia). Linha 1 (Regional 1): Meta = 200.000 | Arrecadado = 250.000. Linha 2 (Regional 2): Meta = 150.000 | Arrecadado = 120.000. Linha 3 (Regional 3): Meta = 300.000 | Arrecadado = 300.000. Linha 4 (Regional 4): Meta = 100.000 | Arrecadado = 90.000. Linha 5 (Regional 5): Meta = 250.000 | Arrecadado = 280.000. Julgue o item: Para somar os valores das metas (coluna B) apenas para as regionais cuja arrecadação tenha sido maior ou igual a R$ 250.000,00, a sintaxe correta da função no Excel é =SOMASE(C1:C5; \">=250000\"; B1:B5).",a:true,e:"CERTO. Sintaxe: =SOMASE(intervalo_critério; critério; intervalo_soma). Regionais com arrecadação ≄1�7 250.000: 1, 3 e 5, cujas metas somam 750.000."},
