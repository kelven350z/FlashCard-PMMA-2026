{m:"Informática",id:"Informática|Excel - PROCV|606",bloco:"E",tema:"Excel - PROCV",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:43,s:"Texto: Em uma planilha do MS Excel (em português), um contador precisa realizar operações com buscas e estatísticas sobre o cadastro de colaboradores de um órgão público. Julgue o item: A função =PROCV(\"João Silva\"; A1:D100; 3; FALSO) busca o nome \"João Silva\" especificamente na terceira coluna do intervalo A1:D100 e retorna o valor contido na primeira coluna da mesma linha.",a:false,e:"ERRADO. O PROCV procura o valor na PRIMEIRA coluna do intervalo e retorna o conteúdo da coluna indicada (aqui, a 3ª). O item inverteu as colunas."},
{m:"Informática",id:"Informática|Excel - função MAIOR|607",bloco:"E",tema:"Excel - função MAIOR",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:44,s:"Texto: Em uma planilha do MS Excel (em português), um contador precisa realizar operações com buscas e estatísticas sobre o cadastro de colaboradores de um órgão público. Julgue o item: Para identificar o segundo maior salário dentro de uma lista de valores localizada no intervalo E1:E50, o contador pode utilizar corretamente a fórmula =MAIOR(E1:E50; 2).",a:true,e:"CERTO. MAIOR(intervalo; k) retorna o k-ésimo maior valor; com k = 2, o segundo maior."},
{m:"Informática",id:"Informática|Excel - MÉDIA com célula vazia|608",bloco:"E",tema:"Excel - MÉDIA com célula vazia",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:45,s:"Texto: Em uma planilha do MS Excel (em português), um contador precisa realizar operações com buscas e estatísticas sobre o cadastro de colaboradores de um órgão público. Julgue o item: Caso a célula A1 contenha o valor 10 e a célula A2 esteja vazia, a fórmula =MÉDIA(A1:A2) no Excel retornará o valor 5, pois a célula vazia é interpretada como o valor numérico zero na divisão da média.",a:false,e:"ERRADO. A função MÉDIA ignora células vazias (não as trata como zero). Logo, MÉDIA(A1:A2) = 10, não 5."},
{m:"Informática",id:"Informática|PowerPoint - Slide Mestre|609",bloco:"E",tema:"PowerPoint - Slide Mestre",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:46,s:"Texto: Um instrutor da Escola de Governo está montando uma apresentação pedagógica sobre licitações no Microsoft PowerPoint 365. A apresentação contém 40 slides. Ele precisa garantir a identidade visual do órgão, aplicar efeitos e dominar os comandos durante a exibição. Julgue o item: Para incluir o brasão oficial do Estado e o título do curso no topo de todos os slides da apresentação automaticamente, sem precisar colar a imagem slide por slide, o instrutor deve acessar a guia Modos de Exibição e realizar a alteração no Slide Mestre.",a:true,e:"CERTO. Alterações no Slide Mestre (guia Exibir) valem para todos os slides, como logotipo e título fixos."},
{m:"Informática",id:"Informática|PowerPoint - Transição x Animação|610",bloco:"E",tema:"PowerPoint - Transição x Animação",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:47,s:"Texto: Um instrutor da Escola de Governo está montando uma apresentação pedagógica sobre licitações no Microsoft PowerPoint 365. A apresentação contém 40 slides. Ele precisa garantir a identidade visual do órgão, aplicar efeitos e dominar os comandos durante a exibição. Julgue o item: O efeito visual ou sonoro configurado para ocorrer no exato momento em que a apresentação muda do slide 5 para o slide 6 é classificado no PowerPoint como uma Animação de Entrada.",a:false,e:"ERRADO. O efeito na mudança de um slide para outro é uma Transição. Animações atuam sobre objetos dentro do slide."},
{m:"Informática",id:"Informática|PowerPoint - F5 x Shift + F5|611",bloco:"E",tema:"PowerPoint - F5 x Shift + F5",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:48,s:"Texto: Um instrutor da Escola de Governo está montando uma apresentação pedagógica sobre licitações no Microsoft PowerPoint 365. A apresentação contém 40 slides. Ele precisa garantir a identidade visual do órgão, aplicar efeitos e dominar os comandos durante a exibição. Julgue o item: Enquanto estiver editando o slide 15 da apresentação, se o instrutor pressionar a tecla F5, o PowerPoint iniciará a exibição em tela cheia a partir do slide 15 (slide ativo).",a:false,e:"ERRADO. F5 inicia a apresentação a partir do PRIMEIRO slide. Para iniciar a partir do slide atual, usa-se Shift + F5."},
{m:"Informática",id:"Informática|PowerPoint - tela preta na apresentação|612",bloco:"E",tema:"PowerPoint - tela preta na apresentação",dif:"dificil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:49,s:"Texto: Um instrutor da Escola de Governo está montando uma apresentação pedagógica sobre licitações no Microsoft PowerPoint 365. A apresentação contém 40 slides. Ele precisa garantir a identidade visual do órgão, aplicar efeitos e dominar os comandos durante a exibição. Julgue o item: Durante uma apresentação em tela cheia no PowerPoint, se o palestrante quiser direcionar a atenção do público para a sua explicação oral pausando o slide visualmente, ele pode pressionar a tecla B (ou C no PowerPoint em português) para deixar a tela inteiramente preta.",a:false,e:"ERRADO. Durante a apresentação, B (ou ponto) deixa a tela preta e W (ou vírgula) deixa a tela branca. Não existe atalho \"C\" para isso no PowerPoint em português."},
{m:"Informática",id:"Informática|LibreOffice Impress - extensão .odp|613",bloco:"E",tema:"LibreOffice Impress - extensão .odp",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:50,s:"Texto: Um instrutor da Escola de Governo está montando uma apresentação pedagógica sobre licitações no Microsoft PowerPoint 365. A apresentação contém 40 slides. Ele precisa garantir a identidade visual do órgão, aplicar efeitos e dominar os comandos durante a exibição. Julgue o item: No LibreOffice Impress (em português), o formato de arquivo padrão utilizado para salvar apresentações de slides editáveis baseia-se no padrão aberto ODF e possui a extensão .odp.",a:true,e:"CERTO. Apresentações do Impress usam o padrão ODF com extensão .odp."},
{m:"Informática",id:"Informática|Word - controle de alterações|614",bloco:"E",tema:"Word - controle de alterações",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:51,s:"No Microsoft Word 365, o recurso controle de alterações, quando ativado, registra as edições feitas pelos usuários. No entanto, ao salvar e fechar o arquivo, essas alterações tornam-se definitivas no documento de forma automática.",a:false,e:"ERRADO. As alterações registradas continuam pendentes, mesmo ao salvar e fechar, até serem aceitas ou rejeitadas na guia Revisão."},
{m:"Informática",id:"Informática|LibreOffice Calc - limite de linhas|615",bloco:"E",tema:"LibreOffice Calc - limite de linhas",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:52,s:"No LibreOffice Calc, o número máximo de linhas suportado em uma única planilha é de 1.048.576, valor identicamente encontrado nas versões modernas do Microsoft Excel.",a:true,e:"CERTO. O Calc atual suporta 1.048.576 linhas por planilha, o mesmo limite do Excel moderno."},
{m:"Informática",id:"Informática|Word e Writer - F7 (ortografia)|616",bloco:"E",tema:"Word e Writer - F7 (ortografia)",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:53,s:"Tanto no Microsoft Word quanto no LibreOffice Writer, a tecla de função F7 é o atalho padrão utilizado para acionar a ferramenta de Verificação Ortográfica e Gramatical.",a:true,e:"CERTO. F7 aciona a verificação ortográfica e gramatical tanto no Word quanto no Writer."},
{m:"Informática",id:"Informática|Excel - SOMA com vários argumentos|617",bloco:"E",tema:"Excel - SOMA com vários argumentos",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:54,s:"No MS Excel, a fórmula =SOMA(A1:A3; A4) executa exatamente a mesma operação matemática que a fórmula =SOMA(A1:A4).",a:true,e:"CERTO. A função SOMA aceita vários argumentos separados por ponto e vírgula. SOMA(A1:A3; A4) equivale a SOMA(A1:A4)."},
{m:"Informática",id:"Informática|PowerPoint - Classificação de Slides|618",bloco:"E",tema:"PowerPoint - Classificação de Slides",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:55,s:"No Microsoft PowerPoint, o modo de exibição \"Classificação de Slides\" (Slide Sorter) exibe as miniaturas de todos os slides da apresentação dispostos em grade, sendo o modo ideal para reordenar a sequência dos slides, agrupar seções e aplicar transições em massa.",a:true,e:"CERTO. O modo Classificação de Slides mostra miniaturas em grade, ideal para reordenar slides, criar seções e aplicar transições."},
{m:"Informática",id:"Informática|Office em português - atalho Salvar|619",bloco:"E",tema:"Office em português - atalho Salvar",dif:"dificil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:56,s:"No Microsoft Excel em português, a combinação de teclas de atalho utilizada para abrir a caixa de diálogo \"Salvar Como\" ou salvar o arquivo ativo é Ctrl + S.",a:false,e:"ERRADO. No Office em português, Salvar é Ctrl + B. Ctrl + S é Sublinhado. \"Salvar Como\" é F12."},
{m:"Informática",id:"Informática|LibreOffice Writer - AutoTexto (Ctrl + F3)|620",bloco:"E",tema:"LibreOffice Writer - AutoTexto (Ctrl + F3)",dif:"dificil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:57,s:"No LibreOffice Writer, o recurso AutoTexto, acionado pela combinação de teclas Ctrl + F3, permite salvar blocos de texto, tabelas ou gráficos pré-formatados para serem inseridos rapidamente no documento mediante a digitação de um atalho de texto seguido da tecla F3.",a:true,e:"CERTO. Ctrl + F3 abre o AutoTexto, que guarda blocos de texto para inserir digitando o atalho e pressionando F3."},
{m:"Informática",id:"Informática|Excel - função E|621",bloco:"E",tema:"Excel - função E",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:58,s:"Na planilha eletrônica MS Excel, a expressão =E(A1>10; B1<5) retornará o valor lógico VERDADEIRO apenas se ambas as condições forem satisfeitas simultaneamente; caso uma delas seja falsa, a função retornará FALSO.",a:true,e:"CERTO. A função E retorna VERDADEIRO só se todas as condições forem verdadeiras."},
{m:"Informática",id:"Informática|LibreOffice Writer - quebra de página manual|622",bloco:"E",tema:"LibreOffice Writer - quebra de página manual",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:59,s:"No LibreOffice Writer, para aplicar uma quebra de página manual e enviar o cursor imediatamente para o início da página seguinte, o usuário deve utilizar a combinação de teclas Shift + Enter.",a:false,e:"ERRADO. No Writer a quebra de página manual é Ctrl + Enter. Shift + Enter insere apenas uma quebra de linha."},
{m:"Informática",id:"Informática|Formatos DOCX e ODT (ZIP + XML)|623",bloco:"E",tema:"Formatos DOCX e ODT (ZIP + XML)",dif:"dificil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:60,s:"Os arquivos salvos com a extensão .docx no Microsoft Word 2016/365 e os arquivos salvos com a extensão .odt no LibreOffice Writer 7.x são estruturados internamente como repositórios compactados no formato ZIP contendo arquivos em linguagem XML e pastas de mídia.",a:true,e:"CERTO. Tanto o .docx quanto o .odt são pacotes ZIP com arquivos XML e pastas de mídia."},
{m:"Informática",id:"Informática|Excel - função MOD|624",bloco:"E",tema:"Excel - função MOD",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:61,s:"Julgue o item a seguir, acerca de funções matemáticas e trigonométricas no Microsoft Excel: A função MOD é a instrução padrão do Microsoft Excel utilizada para retornar o resto de uma divisão inteira, sendo sua sintaxe básica representada por =MOD(núm; divisor).",a:true,e:"CERTO. MOD(núm; divisor) retorna o resto da divisão."},
{m:"Informática",id:"Informática|Excel - função INT|625",bloco:"E",tema:"Excel - função INT",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:62,s:"Julgue o item a seguir, relativo ao uso da função INT em planilhas eletrônicas do Excel: A aplicação da fórmula =INT(-4,3) em uma célula do Excel resulta no valor -5, pois a função arredonda o número para baixo até o número inteiro mais próximo no sentido negativo da reta numérica.",a:true,e:"CERTO. INT arredonda para baixo, ao inteiro menor. INT(-4,3) = -5."},
{m:"Informática",id:"Informática|Excel - SOMA com vários intervalos|626",bloco:"E",tema:"Excel - SOMA com vários intervalos",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:63,s:"Julgue o item a seguir, relativo a erros comuns em fórmulas do Microsoft Excel: A utilização de um operador aritmético diretamente entre dois intervalos distintos de células  1�7 como =SOMA(A1:A3; B1:B2)  1�7 viola as regras estruturais de sintaxe, resultando na exibição do código de erro #VALOR!.",a:false,e:"ERRADO. SOMA aceita vários intervalos como argumentos separados por ponto e vírgula. =SOMA(A1:A3; B1:B2) é válida e não gera #VALOR!."},
{m:"Informática",id:"Informática|Excel - cópia de fórmulas e referências mistas|627",bloco:"E",tema:"Excel - cópia de fórmulas e referências mistas",dif:"dificil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:64,s:"Julgue o item a seguir, acerca de referências relativas, absolutas e mistas no Microsoft Excel: Considerando que a fórmula =SOMA(GS6:$L10) inserida na célula A3 seja copiada e colada na célula C5, a fórmula resultante será =SOMA(IS6:$L10).",a:false,e:"ERRADO. De A3 para C5, deslocam-se 2 colunas e 2 linhas: GS6 (relativa) vira GU8 e $L10 (coluna fixa, linha relativa) vira $L12. Resultado: =SOMA(GU8:$L12)."},
{m:"Informática",id:"Informática|Excel - TRUNCAR x INT|628",bloco:"E",tema:"Excel - TRUNCAR x INT",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:65,s:"Julgue o item a seguir, relativo a funções de arredondamento e manipulação de inteiros no Excel: Enquanto a função TRUNCAR(-4,3) retorna -4 por simplesmente eliminar a parte fracionária do número, a função INT(-4,3) retorna -5 por arredondar o valor para baixo em direção ao menor inteiro na reta numérica.",a:true,e:"CERTO. TRUNCAR só corta a parte decimal (-4,3 ↄ1�7 -4). INT arredonda para baixo (-4,3 ↄ1�7 -5)."},
{m:"Informática",id:"Informática|Excel - operador & (concatenação)|629",bloco:"E",tema:"Excel - operador & (concatenação)",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:66,s:"Julgue o item a seguir, acerca da manipulação de textos no Microsoft Excel: O operador de cálculo & (E comercial) é o recurso nativo do Excel utilizado para unir ou concatenar duas ou mais sequências de texto ou valores de células, produzindo resultado equivalente à função CONCATENAR.",a:true,e:"CERTO. O & une textos e valores, com resultado equivalente ao de CONCATENAR."},
{m:"Informática",id:"Informática|Excel - SE sem valor_se_falso|630",bloco:"E",tema:"Excel - SE sem valor_se_falso",dif:"dificil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:67,s:"Julgue o item a seguir, relativo à função condicional SE no Microsoft Excel: Caso o argumento opcional valor_se_falso seja omitido na função SE e a condição lógica avaliada resulte em FALSO, o Excel retornará automaticamente o valor numérico zero.",a:false,e:"ERRADO. Se valor_se_falso for omitido e a condição for falsa, o Excel retorna o valor lógico FALSO, e não 0."},
{m:"Informática",id:"Informática|Excel - erro #NOME?|631",bloco:"E",tema:"Excel - erro #NOME?",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:68,s:"Julgue o item a seguir, acerca de códigos de erro exibidos no Microsoft Excel: A ocorrência do erro #NOME? em uma célula indica inequivocamente que o Excel não reconheceu o texto inserido na fórmula, o que ocorre tipicamente devido a erros de digitação no nome de uma função.",a:true,e:"CERTO. #NOME? indica texto não reconhecido na fórmula, como função digitada errado ou nome inexistente."},
{m:"Informática",id:"Informática|Excel - extensões xlsx, xlsm e xlsb|632",bloco:"E",tema:"Excel - extensões xlsx, xlsm e xlsb",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:69,s:"Julgue o item a seguir, acerca das extensões de arquivos associadas ao Microsoft Excel: As extensões .xlsx, .xlsm e .xlsb representam, respectivamente, o formato padrão sem macros, o formato habilitado para macros baseadas em VBA, e o formato binário otimizado para desempenho em pastas de trabalho volumosas.",a:true,e:"CERTO. .xlsx é o padrão sem macros, .xlsm permite macros VBA e .xlsb é o formato binário, mais leve para arquivos grandes."},
{m:"Informática",id:"Informática|Excel - função ARRED|633",bloco:"E",tema:"Excel - função ARRED",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:70,s:"Julgue o item a seguir, relativo a funções de arredondamento no Microsoft Excel: Para arredondar um número contido em uma célula para um número específico de casas decimais segundo as regras matemáticas tradicionais, emprega-se a função ARRED.",a:true,e:"CERTO. ARRED(núm; núm_dígitos) arredonda pelas regras matemáticas tradicionais."},
{m:"Informática",id:"Informática|Excel - CONT.VALORES|634",bloco:"E",tema:"Excel - CONT.VALORES",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:71,s:"Julgue o item a seguir, acerca de funções de contagem no Microsoft Excel: A função CONT.VALORES calcula o número de células preenchidas em um intervalo, contabilizando dados de qualquer tipo, como números, textos, valores lógicos e mensagens de erro.",a:true,e:"CERTO. CONT.VALORES conta células não vazias de qualquer tipo (números, texto, lógicos e erros)."},
{m:"Informática",id:"Informática|Excel - referência mista|635",bloco:"E",tema:"Excel - referência mista",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:72,s:"Julgue o item a seguir, relativo a referências de células no Excel: Uma referência mista é caracterizada quando apenas um dos eixos  1�7 seja a linha ou a coluna  1�7 é travado com o caractere de cifrão ($), enquanto o outro permanece relativo, a exemplo de A$1 e $A1.",a:true,e:"CERTO. Na referência mista só a linha ou só a coluna é travada com $ (A$1 ou $A1)."},
{m:"Informática",id:"Informática|Excel - função MULT|636",bloco:"E",tema:"Excel - função MULT",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:73,s:"Julgue o item a seguir, acerca de funções matemáticas no Microsoft Excel: A função MULT tem por objetivo multiplicar todos os números especificados como argumentos e retornar o produto total dos elementos englobados nos intervalos informados.",a:true,e:"CERTO. MULT multiplica todos os números informados como argumentos e retorna o produto."},
{m:"Informática",id:"Informática|Word - recursos modernos|637",bloco:"E",tema:"Word - recursos modernos",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:74,s:"Julgue o item a seguir, relativo aos recursos modernos integrados ao Microsoft Word: Dentre os recursos nativos presentes na aplicação atual, incluem-se o salvamento automático com integração ao OneDrive, a coautoria em tempo real e a execução direta de consultas relacionais em banco de dados SQL nas margens da página do documento.",a:false,e:"ERRADO. Salvamento automático no OneDrive e coautoria em tempo real existem, mas o Word não executa consultas SQL nas margens da página."},
{m:"Informática",id:"Informática|Excel - função MAIOR|638",bloco:"E",tema:"Excel - função MAIOR",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:75,s:"Julgue o item a seguir, relativo ao uso da função MAIOR no Microsoft Excel: Aplicando a fórmula =MAIOR(A3:D4; 3) a um conjunto de dados cujos valores ordenados em ordem decrescente são 50, 35, 23, 12 e 9, o resultado retornado corresponderá ao valor 23.",a:true,e:"CERTO. Em 50, 35, 23, 12 e 9, o 3º maior valor é 23."},
{m:"Informática",id:"Informática|Segurança - confidencialidade e criptografia|639",bloco:"E",tema:"Segurança - confidencialidade e criptografia",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:76,s:"Durante uma auditoria de segurança da informação em uma instituição bancária, o analista responsável constatou que a infraestrutura tecnológica implementada garantia que os dados armazenados e em trânsito só pudessem ser interpretados por usuários expressamente autorizados. Para atingir esse objetivo no âmbito da Tríade CIA, o mecanismo tecnológico fundamental empregado foi a criptografia. Com base nesse cenário, é correto afirmar que a confidencialidade constitui o pilar diretamente protegido por essa abordagem.",a:true,e:"CERTO. A criptografia protege a confidencialidade: só quem tem a chave consegue ler os dados."},
{m:"Informática",id:"Informática|Segurança - não repúdio e assinatura digital|640",bloco:"E",tema:"Segurança - não repúdio e assinatura digital",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:77,s:"Em um processo de transação eletrônica de alta criticidade envolvendo a assinatura de contratos corporativos digitais, a legislação e a arquitetura de segurança exigem um atributo que impeça uma das partes de negar posteriormente a autoria da emissão ou o recebimento do documento. Esse requisito essencial de segurança da informação, denominado irretratabilidade ou não repúdio, é tecnologicamente viabilizado pelo uso de assinaturas digitais.",a:true,e:"CERTO. O não repúdio (irretratabilidade) impede negar a autoria e é viabilizado pela assinatura digital."},
{m:"Informática",id:"Informática|Malware - vírus x worm|641",bloco:"E",tema:"Malware - vírus x worm",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:78,s:"Um analista de suporte técnico foi acionado para conter um incidente em um computador. Um código malicioso infiltra-se em estações de trabalho anexando-se a arquivos executáveis legítimos, exigindo obrigatoriamente que o usuário executasse o programa hospedeiro para iniciar sua propagação. Durante a análise técnica, o profissional classificou o agente nocivo como um worm de alta periculosidade.",a:false,e:"ERRADO. O código que se anexa a arquivos executáveis e precisa que o hospedeiro seja executado é um vírus. O worm é independente e se propaga sozinho pela rede."},
{m:"Informática",id:"Informática|Malware - cavalo de Tróia x worm|642",bloco:"E",tema:"Malware - cavalo de Tróia x worm",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:79,s:"Determinada empresa sofreu um ataque cibernético após um colaborador baixar da internet um utilitário de otimização de sistema que aparentava ser legítimo, mas que continha rotinas ocultas para roubo de dados. No relatório técnico de pós-incidente, a praga foi descrita como um Cavalo de Tróia (Trojan) dotado de capacidade autónoma de replicação e varredura de rede, espalhando-se ativamente de servidor para servidor sem a intervenção humana.",a:false,e:"ERRADO. O Trojan se disfarça de programa legítimo, mas não se replica sozinho. A replicação autônoma pela rede é característica do worm."},
{m:"Informática",id:"Informática|Malware - ransomware|643",bloco:"E",tema:"Malware - ransomware",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:80,s:"Uma empresa de médio porte teve todos os seus arquivos operacionais criticamente bloqueados por um código malicioso que aplicou um algoritmo de criptografia de ponta sobre as bases de dados, exigindo o pagamento de um valor financeiro em criptomoedas para a liberação da chave de descriptografia. Esse tipo específico de ameaça cibernética é corretamente classificado como ransomware.",a:true,e:"CERTO. Ransomware criptografa os arquivos e exige resgate para liberar a chave."},
{m:"Informática",id:"Informática|Malware - keylogger|644",bloco:"E",tema:"Malware - keylogger",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:81,s:"Durante o monitoramento de uma rede corporativa, a equipe de segurança cibernética identificou um software espião instalado silenciosamente em um terminal de atendimento cujo objetivo específico era capturar e registrar cada tecla acionada pelo operador, enviando o histórico para um servidor externo controlado por criminosos. Essa ferramenta maliciosa enquadra-se na categoria de spyware do tipo keylogger.",a:true,e:"CERTO. O keylogger é um spyware que registra as teclas digitadas."},
{m:"Informática",id:"Informática|Malware - rootkit|645",bloco:"E",tema:"Malware - rootkit",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:82,s:"Um administrador de sistemas identificou a presença de um rootkit em um servidor crítico da organização e concluiu que sua finalidade principal era expandir a capacidade de processamento da CPU e otimizar a velocidade de execução das rotinas de backup noturno.",a:false,e:"ERRADO. O rootkit esconde a presença do invasor e de outros malwares no sistema, mantendo acesso privilegiado. Não melhora desempenho."},
{m:"Informática",id:"Informática|Malware - botnet e DDoS|646",bloco:"E",tema:"Malware - botnet e DDoS",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:83,s:"Para desestabilizar os servidores de um portal governamental de grande circulação, um grupo mal-intencionado utilizou centenas de milhares de computadores previamente infectados e controlados remotamente de forma coordenada e sem o conhecimento de seus respectivos donos. Essa estrutura computacional articulada é conhecida como botnet, sendo amplamente empregada em ataques de negação de serviço distribuído (DDoS).",a:true,e:"CERTO. Botnet é uma rede de computadores infectados (zumbis) controlados remotamente, usada em ataques DDoS."},
{m:"Informática",id:"Informática|Segurança - firewall x antivírus|647",bloco:"E",tema:"Segurança - firewall x antivírus",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:84,s:"Ao planejar a política de segurança da informação de uma nova filial corporativa, o gestor de TI determinou a instalação de um firewall perimetral avançado, argumentando perante a diretoria que o equipamento dispensaria por completo a necessidade de instalação de antivírus ou soluções de proteção de endpoint nas máquinas dos usuários.",a:false,e:"ERRADO. O firewall filtra o tráfego de rede e não substitui o antivírus, que detecta e remove malware nas máquinas."},
{m:"Informática",id:"Informática|Redes - servidor proxy|648",bloco:"E",tema:"Redes - servidor proxy",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:85,s:"Uma grande corporação implementou um servidor proxy intermediando todas as requisições de acesso à Internet feitas por seus colaboradores. Entre os benefícios observados pela equipe técnica destacam-se a economia de largura de banda e a aceleração no carregamento de páginas corporativas frequentemente visitadas, graças à capacidade de armazenamento em cache proporcionada por essa ferramenta.",a:true,e:"CERTO. O proxy intermedia acessos à Internet e, com cache, economiza banda e acelera o carregamento."},
{m:"Informática",id:"Informática|Criptografia simétrica x assimétrica|649",bloco:"E",tema:"Criptografia simétrica x assimétrica",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:86,s:"Em um simpósio sobre segurança de dados, um palestrante afirmou que a criptografia simétrica opera fundamentada em um par de chaves assimétricas e matematicamente complexas  1�7 uma chave pública e uma chave privada  1�7, onde os dados cifrados com uma delas exigem obrigatoriamente a outra para a reversão do processo.",a:false,e:"ERRADO. A criptografia simétrica usa uma única chave secreta. O par de chaves pública/privada é da criptografia assimétrica."},
{m:"Informática",id:"Informática|Criptografia - velocidade assimétrica x simétrica|650",bloco:"E",tema:"Criptografia - velocidade assimétrica x simétrica",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:87,s:"Ao comparar os dois principais modelos criptográficos em uma sessão de planejamento estratégico de TI, o arquiteto de redes ressaltou que a criptografia assimétrica, embora ofereça excelente segurança na distribuição de chaves, apresenta como desvantagem inerente uma velocidade de processamento computacional significativamente menor se comparada à criptografia simétrica.",a:true,e:"CERTO. A assimétrica facilita a distribuição de chaves, mas é bem mais lenta que a simétrica."},
{m:"Informática",id:"Informática|Assinatura digital - verificação|651",bloco:"E",tema:"Assinatura digital - verificação",dif:"dificil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:88,s:"Um perito forense digital analisa um arquivo de texto assinado eletronicamente. Ele constata que, ao aplicar a chave pública do suposto autor sobre a mensagem cifrada, o conteúdo é decodificado com sucesso e o resumo lógico confere. Com base nessa verificação, conclui-se validamente que a operação atestou a autenticidade e a irretratabilidade da autoria do documento.",a:true,e:"CERTO. Se a chave pública do autor decifra o resumo e ele confere com o hash do documento, comprova-se a autenticidade e o não repúdio, pois só o dono da chave privada poderia ter assinado."},
{m:"Informática",id:"Informática|Hash - integridade|652",bloco:"E",tema:"Hash - integridade",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:89,s:"Para assegurar que arquivos confidenciais transferidos via nuvem não sofressem alterações indevidas ou corrompimentos em trânsito, a equipe de desenvolvimento aplicou uma função hash criptográfica unidirecional sobre os pacotes, gerando sequências de tamanho fixo que permitem detectar qualquer modificação milimétrica no conteúdo original.",a:true,e:"CERTO. A função hash unidirecional gera um resumo de tamanho fixo. Qualquer alteração no conteúdo muda o hash, o que permite verificar a integridade."},
{m:"Informática",id:"Informática|Assinatura digital - hash e chave privada|653",bloco:"E",tema:"Assinatura digital - hash e chave privada",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:90,s:"Durante uma aula sobre infraestrutura de chaves públicas, um estudante afirmou que a assinatura digital de um documento eletrônico é gerada mediante a aplicação direta de um algoritmo de criptografia simétrica sobre o texto integral do arquivo, tornando totalmente dispensável o uso de funções hash.",a:false,e:"ERRADO. A assinatura digital calcula o hash do documento e o cifra com a chave PRIVADA do assinante (criptografia assimétrica). Não é criptografia simétrica sobre o texto inteiro, e o hash é essencial."},
{m:"Informática",id:"Informática|Certificado digital - ICP-Brasil e AC|654",bloco:"E",tema:"Certificado digital - ICP-Brasil e AC",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:91,s:"Em um sistema de compras governamentais que exige validade jurídica em todas as etapas eletrônicas, a identificação unívoca das partes interessadas é realizada por meio de certificados digitais vinculados a um par de chaves públicas, emitidos sob a governança hierárquica de uma Autoridade Certificadora (AC) credenciada à ICP-Brasil.",a:true,e:"CERTO. O certificado vincula uma identidade a um par de chaves e é emitido por uma Autoridade Certificadora credenciada na ICP-Brasil."},
{m:"Informática",id:"Informática|Backup - diferencial x incremental|655",bloco:"E",tema:"Backup - diferencial x incremental",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:92,s:"Avaliando as opções de rotinas de cópia para o plano de desastre da empresa, o gerente de TI pontuou que a principal distinção operacional entre o backup diferencial e o incremental reside no fato de que o diferencial acumula todas as alterações desde o último backup completo, o que torna o processo de restauração subsequente mais simples e rápido do que na modalidade incremental.",a:true,e:"CERTO. O diferencial copia tudo o que mudou desde o último backup completo. Para restaurar, bastam o completo e o último diferencial."},
{m:"Informática",id:"Informática|Backup - incremental|656",bloco:"E",tema:"Backup - incremental",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:93,s:"Configurando uma política de backup otimizada para economizar espaço de armazenamento e tempo de execução diária, o técnico optou pelo backup incremental, que copia exclusivamente os arquivos alterados desde a última execução de backup (seja full ou incremental), limpando o bit de modificação logo após copiar os dados.",a:true,e:"CERTO. O incremental copia só o que mudou desde o último backup (completo ou incremental) e limpa o bit de arquivo."},
{m:"Informática",id:"Informática|Backup - restauração com incrementais|657",bloco:"E",tema:"Backup - restauração com incrementais",dif:"dificil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:94,s:"Uma empresa adota uma rotina de segurança baseada em um backup completo semanal combinado com backups incrementais diários. No cenário em que seja necessária a restauração total do sistema em virtude de uma pane severa, o operador precisará recuperar apenas o último arquivo incremental gerado na véspera, ignorando os backups incrementais anteriores da cadeia.",a:false,e:"ERRADO. É preciso restaurar o backup completo e TODOS os incrementais em sequência, até o último. Só o último incremental não basta."},
{m:"Informática",id:"Informática|Backup - diferencial e bit de arquivo|658",bloco:"E",tema:"Backup - diferencial e bit de arquivo",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:95,s:"Ao estruturar a política de salvaguarda de dados da empresa, o analista optou por utilizar backups diferenciais diários em conjunto com um backup completo semanal. Como característica operacional desse modelo, o backup diferencial copia todas as alterações feitas desde o último backup completo, mas preserva intacto o bit de arquivo modificado, sem limpá-lo ao término da rotina.",a:true,e:"CERTO. O diferencial copia o que mudou desde o último completo e NÃO limpa o bit de arquivo."},
{m:"Informática",id:"Informática|Segurança - ataque DoS e disponibilidade|659",bloco:"E",tema:"Segurança - ataque DoS e disponibilidade",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:96,s:"Um grupo de crackers lançou um ataque massivo de negação de serviço (DoS) direcionado ao portal de atendimento de uma agência reguladora, inundando o servidor com requisições espúrias até esgotar sua capacidade de processamento e deixá-lo inacessível aos cidadãos. Essa ocorrência compromete diretamente o pilar da disponibilidade da Tríade CIA.",a:true,e:"CERTO. O DoS visa tornar o serviço indisponível, atingindo o pilar da Disponibilidade."},
{m:"Informática",id:"Informática|Malware - worm|660",bloco:"E",tema:"Malware - worm",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:97,s:"Diferentemente dos vírus tradicionais, os worms caracterizam-se por sua autonomia estrutural, propagando-se ativamente pelas redes de computadores através da exploração de falhas de sistemas sem necessitar da execução de arquivos hospedeiros nem da ação direta do usuário.",a:true,e:"CERTO. O worm é autônomo: propaga-se pela rede explorando falhas, sem hospedeiro nem ação do usuário."},
{m:"Informática",id:"Informática|Malware - screenlogger|661",bloco:"E",tema:"Malware - screenlogger",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:98,s:"Investigando um caso de invasão de privacidade corporativa, os peritos descobriram um componente malicioso que realizava capturas sequenciais da tela do computador sempre que o usuário preenchia formulários com senhas bancárias virtuais. Essa praga foi corretamente identificada como um screenlogger.",a:true,e:"CERTO. O screenlogger é um spyware que captura imagens da tela (ou da região do clique), usado para roubar senhas digitadas em teclados virtuais."},
{m:"Informática",id:"Informática|Firewall - limites de atuação|662",bloco:"E",tema:"Firewall - limites de atuação",dif:"dificil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:99,s:"Um usuário corporativo obteve autorização para acessar uma página Web recreativa externa cujas regras de filtragem do firewall da empresa permitiam o tráfego. Durante a navegação, o usuário realizou o download voluntário de um instalador compactado infectado. O firewall perimetral, por sua vez, bloqueou automaticamente o arquivo no momento exato do download na máquina interna.",a:false,e:"ERRADO. O firewall controla o tráfego por regras (IPs, portas, protocolos) e não analisa o conteúdo de arquivos baixados. Vírus em arquivo permitido é tarefa do antivírus."},
{m:"Informática",id:"Informática|Backup - completo (full)|663",bloco:"E",tema:"Backup - completo (full)",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:100,s:"Um administrador de redes executa periodicamente uma rotina de backup completo (full) em um servidor corporativo. Ao término da execução, o procedimento padrão do sistema consiste em copiar todos os arquivos selecionados e, em seguida, desativar (limpar) o bit de arquivo modificado associado a cada um dos itens salvos.",a:true,e:"CERTO. O backup completo copia todos os arquivos selecionados e limpa o bit de arquivo."},
{m:"Informática",id:"Informática|Hash - detecção de adulteração|664",bloco:"E",tema:"Hash - detecção de adulteração",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:101,s:"Durante a transmissão de um relatório financeiro sensível através de uma rede pública aberta, um atacante interceptou os pacotes e modificou valores numéricos estratégicos. No entanto, ao chegar ao destino, o sistema receptor detectou a adulteração imediatamente graças à conferência do resumo gerado por uma função hash, comprovando que a integridade dos dados havia sido violada.",a:true,e:"CERTO. A diferença entre os hashes revela que a integridade dos dados foi violada em trânsito."},
{m:"Informática",id:"Informática|HTTPS e TLS|665",bloco:"E",tema:"HTTPS e TLS",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:102,s:"Para garantir que o acesso a um sistema web corporativo ocorra de forma protegida contra interceptações indevidas no trajeto entre o navegador do usuário e o servidor da aplicação, utiliza-se o protocolo HTTPS, que integra camadas de segurança criptográfica (como o TLS) sobre os protocolos de transporte da internet.",a:true,e:"CERTO. O HTTPS é o HTTP sobre TLS, que criptografa a comunicação entre navegador e servidor."},
{m:"Informática",id:"Informática|Engenharia social|666",bloco:"E",tema:"Engenharia social",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:103,s:"Em um treinamento de conscientização sobre segurança digital, o palestrante enfatizou que a engenharia social explora unicamente falhas lógicas e vulnerabilidades de código-fonte em sistemas operacionais desatualizados, desconsiderando por completo a manipulação comportamental dos usuários.",a:false,e:"ERRADO. A engenharia social explora justamente o fator humano (confiança, medo, pressa) para enganar pessoas, e não apenas falhas técnicas."},
{m:"Informática",id:"Informática|Certificado digital - revogação (LCR)|667",bloco:"E",tema:"Certificado digital - revogação (LCR)",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:104,s:"Um certificado digital emitido para uma empresa de comércio eletrônico teve sua chave privada comprometida antes do término do prazo de validade oficial impresso no documento. Para mitigar riscos sistêmicos, o fato foi comunicado à Autoridade Certificadora, que incluiu o certificado nas listas de revogação de certificados (LCR) para que as aplicações deixassem de confiar nele.",a:true,e:"CERTO. Certificados comprometidos ou inválidos são incluídos na Lista de Certificados Revogados (LCR) pela AC."},
{m:"Informática",id:"Informática|Criptografia simétrica - distribuição de chaves|668",bloco:"E",tema:"Criptografia simétrica - distribuição de chaves",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:105,s:"Um analista de infraestrutura argumentou em uma reunião técnica que a criptografia simétrica soluciona plenamente o desafio clássico da distribuição segura de chaves em canais abertos de comunicação, uma vez que dispensa o compartilhamento prévio e sigiloso da chave secreta entre os correspondentes.",a:false,e:"ERRADO. A distribuição segura da chave secreta é justamente o problema da criptografia simétrica, pois as partes precisam compartilhá-la antes por canal seguro."},
{m:"Informática",id:"Informática|Backup e disponibilidade|669",bloco:"E",tema:"Backup e disponibilidade",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:106,s:"O mecanismo de cópia de segurança (backup) é uma política essencial de segurança da informação focada precipuamente em garantir o atributo da Disponibilidade.",a:true,e:"CERTO. O backup permite recuperar dados após perda ou falha, protegendo a Disponibilidade."},
{m:"Informática",id:"Informática|Hash/checksum - integridade de downloads|670",bloco:"E",tema:"Hash/checksum - integridade de downloads",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:107,s:"A verificação de Hash ou Checksum de um arquivo baixado na Internet permite ao usuário confirmar a integridade do pacote, verificando se o arquivo não sofreu alterações ou corrupções durante o download.",a:true,e:"CERTO. Comparar o hash do arquivo baixado com o publicado confirma que ele não foi alterado nem corrompido."},
{m:"Informática",id:"Informática|Linux - diretório raiz (/)|671",bloco:"E",tema:"Linux - diretório raiz (/)",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:108,s:"Em distribuições do sistema operacional Linux, a estrutura de pastas e arquivos é organizada de forma hierárquica a partir de um diretório raiz representado pelo símbolo de barra (/).",a:true,e:"CERTO. No Linux, tudo parte do diretório raiz, representado por /."},
{m:"Informática",id:"Informática|Windows - contas de usuário padrão|672",bloco:"E",tema:"Windows - contas de usuário padrão",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:109,s:"No ambiente Windows, contas de usuário com perfil padrão (convidado ou normal) possuem plenos poderes para alterar definições globais do sistema e instalar aplicações para todos os perfis.",a:false,e:"ERRADO. Contas padrão têm privilégios limitados. Alterações globais e instalações para todos os usuários exigem conta de Administrador."},
{m:"Informática",id:"Informática|Linux - comando chmod|673",bloco:"E",tema:"Linux - comando chmod",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:110,s:"No Linux, o comando chmod é utilizado primariamente para gerenciar e alterar as permissões de acesso a arquivos e diretórios.",a:true,e:"CERTO. chmod altera as permissões de leitura, escrita e execução de arquivos e diretórios."},
{m:"Informática",id:"Informática|Windows - unidades de rede mapeadas|674",bloco:"E",tema:"Windows - unidades de rede mapeadas",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:111,s:"No Explorador de Arquivos do Windows, as unidades de rede mapeadas correspondem a pastas compartilhadas em uma rede local às quais é atribuída uma letra de identificação dedicada.",a:true,e:"CERTO. Mapear uma unidade de rede associa uma pasta compartilhada a uma letra (Z:, por exemplo)."},
{m:"Informática",id:"Informática|Windows - Win + D|675",bloco:"E",tema:"Windows - Win + D",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:112,s:"O atalho de teclado Win + D no Windows tem como função minimizar todas as janelas abertas e exibir imediatamente a área de trabalho.",a:true,e:"CERTO. Win + D minimiza todas as janelas e mostra a Área de Trabalho."},
{m:"Informática",id:"Informática|Windows - exclusão em unidade de rede|676",bloco:"E",tema:"Windows - exclusão em unidade de rede",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:113,s:"Os arquivos apagados de uma unidade de rede mapeada no Windows são sempre encaminhados para a Lixeira local do computador do usuário.",a:false,e:"ERRADO. Arquivos excluídos de uma unidade de rede mapeada geralmente são apagados em definitivo, sem passar pela Lixeira local."},
{m:"Informática",id:"Informática|Linux - usuário root|677",bloco:"E",tema:"Linux - usuário root",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:114,s:"No Linux, o usuário administrador com privilégios absolutos e irrestritos sobre todas as operações do sistema operacional é tradicionalmente designado por root.",a:true,e:"CERTO. O root é o superusuário do Linux, com privilégios irrestritos."},
{m:"Informática",id:"Informática|Redes - camadas OSI x TCP/IP|678",bloco:"E",tema:"Redes - camadas OSI x TCP/IP",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:115,s:"O modelo OSI é estruturado em sete camadas funcionais, enquanto a arquitetura TCP/IP, amplamente adotada na Internet, divide-se tipicamente em quatro camadas.",a:true,e:"CERTO. O OSI tem 7 camadas. O TCP/IP costuma ser descrito em 4: aplicação, transporte, internet e acesso à rede."},
{m:"Informática",id:"Informática|Redes - IPv4 x IPv6|679",bloco:"E",tema:"Redes - IPv4 x IPv6",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:116,s:"O endereço IPv4 é composto por 128 bits divididos em blocos hexadecimais, enquanto o IPv6 utiliza 32 bits representados por quatro octetos decimais.",a:false,e:"ERRADO. Estão invertidos: o IPv4 tem 32 bits (quatro octetos decimais) e o IPv6 tem 128 bits (blocos hexadecimais)."},
{m:"Informática",id:"Informática|Redes - protocolo DHCP|680",bloco:"E",tema:"Redes - protocolo DHCP",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:117,s:"O protocolo DHCP (Dynamic Host Configuration Protocol) opera na camada de aplicação e tem como principal funcionalidade atribuir dinamicamente endereços IP aos hosts da rede.",a:true,e:"CERTO. O DHCP atribui automaticamente endereços IP (e outros parâmetros) aos hosts, na camada de aplicação."},
{m:"Informática",id:"Informática|Redes - protocolo DNS|681",bloco:"E",tema:"Redes - protocolo DNS",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:118,s:"O protocolo DNS (Domain Name System) é responsável por traduzir nomes de domínios legíveis por humanos em endereços IP, operando primordialmente sobre a porta 53.",a:true,e:"CERTO. O DNS traduz nomes de domínio em endereços IP e usa a porta 53."},
{m:"Informática",id:"Informática|Redes - switch x hub|682",bloco:"E",tema:"Redes - switch x hub",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:119,s:"Um switch é um dispositivo de rede que opera na camada de enlace e encaminha quadros direcionando-os especificamente para a porta de destino, ao contrário do hub, que faz difusão (broadcast).",a:true,e:"CERTO. O switch (camada 2) encaminha quadros só para a porta de destino, enquanto o hub repete o sinal para todas as portas."},
{m:"Informática",id:"Informática|Redes - loopback 127.0.0.1|683",bloco:"E",tema:"Redes - loopback 127.0.0.1",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:120,s:"O endereço IP 127.0.0.1 é classificado como o endereço de loopback, utilizado para que uma máquina envie tráfego de rede para si própria para fins de teste.",a:true,e:"CERTO. 127.0.0.1 é o loopback (localhost): a máquina se comunica consigo mesma."},
{m:"Informática",id:"Informática|Redes - Intranet|684",bloco:"E",tema:"Redes - Intranet",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:121,s:"Uma Intranet corporativa utiliza os mesmos protocolos e padrões técnicos da Internet pública, mas restringe o acesso aos seus recursos exclusivamente a usuários autorizados.",a:true,e:"CERTO. A Intranet usa as mesmas tecnologias da Internet, mas com acesso restrito à organização."},
{m:"Informática",id:"Informática|Protocolos - FTP|685",bloco:"E",tema:"Protocolos - FTP",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:122,s:"O protocolo FTP é projetado especificamente para a entrega e encaminhamento de mensagens de correio eletrônico entre servidores postais.",a:false,e:"ERRADO. O FTP transfere arquivos. O envio de e-mail é feito pelo SMTP."},
{m:"Informática",id:"Informática|Redes - roteador (camada de rede)|686",bloco:"E",tema:"Redes - roteador (camada de rede)",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:123,s:"Os roteadores operam na camada de enlace do modelo OSI, sem capacidade para interligar redes IP distintas ou determinar rotas de pacotes.",a:false,e:"ERRADO. O roteador opera na camada de Rede (3) e serve justamente para interligar redes e definir rotas dos pacotes."},
{m:"Informática",id:"Informática|E-mail - SMTP|687",bloco:"E",tema:"E-mail - SMTP",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:124,s:"O protocolo SMTP (Simple Mail Transfer Protocol) é o padrão utilizado para o envio e encaminhamento de mensagens de correio eletrônico.",a:true,e:"CERTO. O SMTP é o protocolo de envio de e-mail."},
{m:"Informática",id:"Informática|E-mail - POP3|688",bloco:"E",tema:"E-mail - POP3",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:125,s:"O protocolo POP3 descarrega as mensagens do servidor para o dispositivo local do usuário e, por omissão, elimina-as da origem após a conclusão da transferência.",a:true,e:"CERTO. O POP3 baixa as mensagens para o dispositivo e, por padrão, as remove do servidor."},
{m:"Informática",id:"Informática|E-mail - IMAP|689",bloco:"E",tema:"E-mail - IMAP",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:126,s:"O protocolo IMAP mantém as mensagens armazenadas no servidor, permitindo a sincronização do correio eletrônico em múltiplos dispositivos em simultâneo.",a:true,e:"CERTO. O IMAP mantém as mensagens no servidor e sincroniza vários dispositivos."},
{m:"Informática",id:"Informática|E-mail - Thunderbird e autenticação|690",bloco:"E",tema:"E-mail - Thunderbird e autenticação",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:127,s:"O uso de clientes de correio eletrônico como o Mozilla Thunderbird dispensa totalmente a necessidade de autenticação por protocolos de envio ou recepção.",a:false,e:"ERRADO. O Thunderbird é um cliente de e-mail e precisa de autenticação nos servidores de envio e de recebimento."},
{m:"Informática",id:"Informática|Windows - caracteres proibidos (pipe)|691",bloco:"E",tema:"Windows - caracteres proibidos (pipe)",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:128,s:"No Windows, o caractere | (pipe) é proibido na nomenclatura de arquivos, mas permitido na criação de pastas.",a:false,e:"ERRADO. O caractere | é proibido tanto em nomes de arquivos quanto de pastas."},
{m:"Informática",id:"Informática|Windows - atributo Somente Leitura|692",bloco:"E",tema:"Windows - atributo Somente Leitura",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:129,s:"O atributo de arquivo \"Somente Leitura\" impede que o conteúdo do arquivo seja visualizado por outros usuários na rede, protegendo a privacidade dos dados.",a:false,e:"ERRADO. Somente Leitura impede a alteração do arquivo, não sua visualização por outros usuários."},
{m:"Informática",id:"Informática|Windows - arrastar entre unidades diferentes|693",bloco:"E",tema:"Windows - arrastar entre unidades diferentes",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:130,s:"Ao arrastar um arquivo de uma unidade de disco C: para uma unidade D: usando o mouse, a ação padrão do Windows é copiar o arquivo, criando uma duplicata na unidade D:.",a:true,e:"CERTO. Entre unidades diferentes (C: para D:) o padrão é copiar. Na mesma unidade, o padrão é mover."},
{m:"Informática",id:"Informática|Sistema de arquivos - caminho absoluto|694",bloco:"E",tema:"Sistema de arquivos - caminho absoluto",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:131,s:"O caminho absoluto de um arquivo indica sua localização exata partindo da raiz da unidade de disco, como em C:\\Windows\\System32\\config.",a:true,e:"CERTO. O caminho absoluto parte da raiz da unidade (C:\\...)."},
{m:"Informática",id:"Informática|Sistemas de arquivos - ext4 x NTFS|695",bloco:"E",tema:"Sistemas de arquivos - ext4 x NTFS",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:132,s:"O sistema de arquivos ext4 é comumente utilizado em distribuições Linux, sendo o padrão para a maioria dos sistemas operacionais baseados em Unix, em vez do NTFS que é proprietário da Microsoft.",a:true,e:"CERTO. O ext4 é o padrão da maioria das distribuições Linux (sistemas tipo Unix). O NTFS é proprietário da Microsoft."},
{m:"Informática",id:"Informática|Segurança - phishing|696",bloco:"E",tema:"Segurança - phishing",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:133,s:"Phishing consiste na prática de manipulação psicológica em que o atacante se passa por uma autoridade no presencial para convencer a vítima a entregar pessoalmente seus crachás de acesso físico.",a:false,e:"ERRADO. Phishing é fraude digital, por e-mail, mensagens ou sites falsos, para roubar dados. Não é abordagem presencial para obter crachás."},
{m:"Informática",id:"Informática|Segurança - e-mail spoofing|697",bloco:"E",tema:"Segurança - e-mail spoofing",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:134,s:"A técnica de E-mail Spoofing consiste em falsificar o cabeçalho/remetente de um e-mail para fazer com que a mensagem pareça ter sido enviada por uma fonte confiável.",a:true,e:"CERTO. No e-mail spoofing o remetente/cabeçalho é falsificado para parecer uma fonte confiável."},
{m:"Informática",id:"Informática|Segurança - autenticação multifator (MFA)|698",bloco:"E",tema:"Segurança - autenticação multifator (MFA)",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:135,s:"A Autenticação Multifator (MFA) reforça a confidencialidade e o controle de acesso ao exigir duas ou mais formas independentes de evidência antes de conceder acesso ao sistema.",a:true,e:"CERTO. A MFA exige dois ou mais fatores independentes (algo que se sabe, se tem ou se é)."},
{m:"Informática",id:"Informática|Redes - host x cliente|699",bloco:"E",tema:"Redes - host x cliente",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:136,s:"No âmbito da arquitetura de redes de computadores, o termo host refere-se exclusivamente às aplicações cliente encarregadas de solicitar serviços, ao passo que o termo cliente engloba qualquer elemento físico atrelado à infraestrutura que participe do tráfego de dados.",a:false,e:"ERRADO. Host é qualquer dispositivo conectado à rede (com endereço IP), seja cliente ou servidor. Os conceitos do item estão trocados e restritos."},
{m:"Informática",id:"Informática|Redes - LAN (alcance geográfico)|700",bloco:"E",tema:"Redes - LAN (alcance geográfico)",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:137,s:"Uma Local Area Network (LAN) define-se precipuamente pelo seu alcance geográfico delimitado. Por essa razão, a implementação de cabos do padrão Ethernet em detrimento de ondas de radiofrequência (Wi-Fi) descaracteriza a rede como LAN, convertendo-a em MAN.",a:false,e:"ERRADO. A LAN é definida pelo alcance limitado (casa, prédio, campus). Usar cabo Ethernet ou Wi-Fi não muda a classificação; a MAN cobre uma cidade."},
{m:"Informática",id:"Informática|Redes - topologia em estrela|701",bloco:"E",tema:"Redes - topologia em estrela",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:138,s:"Na topologia física em estrela, a interrupção no cabo que conecta um nó individual ao dispositivo central de comutação (switch) inviabiliza a comunicação desse nó específico, porém preserva o tráfego de dados entre os demais nós da rede.",a:true,e:"CERTO. Na estrela cada nó liga-se ao switch por cabo próprio, então o rompimento afeta só aquele nó. A falha do dispositivo central é que derruba toda a rede."},
{m:"Informática",id:"Informática|Internet - URL x endereço IP|702",bloco:"E",tema:"Internet - URL x endereço IP",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:139,s:"O Uniform Resource Locator (URL) é uma sintaxe padronizada para a localização de recursos digitais na rede, sendo composta por parâmetros como protocolo, domínio e caminho, não se confundindo conceitualmente com o endereço IP do servidor.",a:true,e:"CERTO. A URL (protocolo, domínio, caminho) localiza um recurso e não é o mesmo que o IP. O DNS faz a tradução do domínio."},
{m:"Informática",id:"Informática|Navegação - HTTPS e cadeado|703",bloco:"E",tema:"Navegação - HTTPS e cadeado",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:140,s:"A presença do protocolo HTTPS e a exibição do ícone de cadeado na barra de endereços do navegador atestam a criptografia do canal de comunicação, o que garante, de forma inequívoca, a idoneidade moral do site e a ausência de conteúdos maliciosos.",a:false,e:"ERRADO. O cadeado indica canal criptografado, mas não garante que o site seja idôneo nem livre de malware. Sites de golpe também usam HTTPS."},
{m:"Informática",id:"Informática|Internet - upload x download|704",bloco:"E",tema:"Internet - upload x download",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:141,s:"Quando um servidor público envia um relatório armazenado em sua estação local de trabalho para o sistema de protocolo eletrônico hospedado em um servidor web da instituição, essa operação configura um upload.",a:true,e:"CERTO. Enviar um arquivo do computador local para um servidor é upload."},
{m:"Informática",id:"Informática|Navegador - histórico, cookies e cache|705",bloco:"E",tema:"Navegador - histórico, cookies e cache",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:142,s:"O procedimento de eliminação do histórico de navegação em um browser promove a exclusão integral e simultânea de todos os arquivos de cookies de sessão e dados armazenados em cache, visto que essas estruturas compartilham o mesmo diretório lógico.",a:false,e:"ERRADO. Histórico, cookies e cache são itens distintos, com opções de exclusão separadas. Limpar o histórico não apaga necessariamente cookies e cache."},
{m:"Informática",id:"Informática|Navegador x mecanismo de busca|706",bloco:"E",tema:"Navegador x mecanismo de busca",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:143,s:"O Google Chrome consiste em um software aplicativo de navegação (browser), ao passo que o Google Search é um serviço baseado em web (search engine) indexador de conteúdos; logo, possuem naturezas funcionais distintas.",a:true,e:"CERTO. Chrome é um navegador (software). Google Search é um mecanismo de busca (serviço web)."},
{m:"Informática",id:"Informática|Internet Explorer - navegador|707",bloco:"E",tema:"Internet Explorer - navegador",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:144,s:"Em razão de ter sido descontinuado e substituído pelo Microsoft Edge nos sistemas operacionais recentes, o Internet Explorer, quando citado em editais de concursos, passa a ser considerado conceitualmente um mecanismo de busca na web.",a:false,e:"ERRADO. O Internet Explorer é um navegador (browser), descontinuado e substituído pelo Edge. Nunca foi mecanismo de busca."},
{m:"Informática",id:"Informática|Navegação anônima|708",bloco:"E",tema:"Navegação anônima",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:145,s:"Ao acionar o modo de navegação anônima no Google Chrome ou a janela privativa no Mozilla Firefox, o usuário estabelece um túnel criptografado que oculta seu endereço IP, impedindo que o provedor de acesso e os administradores de rede monitorem seu tráfego.",a:false,e:"ERRADO. A navegação anônima apenas não guarda histórico, cookies e dados de formulário localmente. Não oculta o IP nem impede que o provedor ou a rede vejam o tráfego."},
{m:"Informática",id:"Informática|Webmail x cliente de e-mail|709",bloco:"E",tema:"Webmail x cliente de e-mail",dif:"media",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:146,s:"O acesso à caixa de entrada de e-mails realizado por meio do protocolo HTTPS em um navegador web caracteriza o uso de Webmail, modelo no qual a gestão das mensagens não exige a instalação prévia de um cliente dedicado, como o Mozilla Thunderbird.",a:true,e:"CERTO. No webmail o acesso é pelo navegador (por HTTPS), sem instalar cliente de e-mail como o Thunderbird."},
{m:"Informática",id:"Informática|E-mail - campo Cco|710",bloco:"E",tema:"E-mail - campo Cco",dif:"facil",fonte:"Lista Informática 147  1�7 PMMA 2026",lote:"info147",ordem3:147,s:"Caso um usuário envie uma mensagem inserindo múltiplos endereços no campo Cco (Com Cópia Oculta), cada destinatário oculto conseguirá visualizar os endereços dos demais presentes na mesma linha de cópia oculta.",a:false,e:"ERRADO. Os destinatários em Cco (Com Cópia Oculta) não veem os endereços uns dos outros."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:1,s:"O processo de transição da ditadura militar para o regime democrático, anunciado pela Constituição Federal de 1988, foi súbito e rápido, como previsto por Ernesto Geisel, o último dos presidentes generais.",a:false,e:"ERRADO. A transição foi lenta, gradual e negociada (abertura política), não súbita. Além disso, Ernesto Geisel não foi o último presidente militar: João Figueiredo (1979-1985) foi o último."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:2,s:"A Constituição de 1967 seria alterada dois anos depois de sua outorga, em decorrência do AI-5, que restringiu a pena de morte à legislação militar, em casos de guerra externa, uma das principais mudanças instituídas pelo referido ato.",a:false,e:"ERRADO. A Constituição de 1967 foi alterada em 1968 (um ano depois, não dois) pelo AI-5. A pena de morte para casos de guerra externa e subversão foi instituída pelo AI-14 (1969), que alterou a Constituição  1�7 não diretamente pelo AI-5."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:3,s:"O Ato Institucional n.º 5 representou a primeira atitude concreta dos militares no sentido de preparar o regime para a abertura política lenta, gradual e segura.",a:false,e:"ERRADO. O AI-5 (1968) foi o ato de maior repressão do regime, não um passo para a abertura. A abertura política \"lenta, gradual e segura\" só começou no governo Geisel, a partir de 1974."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:4,s:"O regime militar instituído em 1964 buscou interromper a política reformista de Goulart, tendo sido uma de suas vítimas o governador sergipano Seixas Dória, que foi preso e teve seu mandato cassado.",a:true,e:"CERTO. Seixas Dória foi eleito governador de Sergipe em 1962 e teve o mandato cassado logo após o golpe de 1964, por seu perfil reformista, alinhado a Jango."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:5,s:"Os conceitos de segurança nacional e de inimigo interno, desenvolvidos na Escola Superior de Guerra, foram importantes elementos de legitimação do regime instaurado em 1964 e subsidiaram o expurgo de mais de uma centena de oficiais das Forças Armadas.",a:true,e:"CERTO. A Doutrina de Segurança Nacional, formulada na Escola Superior de Guerra, definia o \"inimigo interno\" e serviu de base ideológica para expurgos e cassações, inclusive dentro das próprias Forças Armadas."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:6,s:"A Constituição de 1967 restabeleceu a pena de morte no Brasil para condenados por guerra revolucionária ou subversiva.",a:false,e:"ERRADO. Foi o Ato Institucional nº 14 (1969), que alterou a Constituição de 1967, que instituiu a pena de morte para guerra externa e guerra revolucionária ou subversiva  1�7 não a redação original da Constituição de 1967."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:7,s:"Denunciado à Comissão de Direitos Humanos da ONU no relatório da Anistia Internacional de 1972, o Brasil foi impedido de participar como membro daquela comissão até a abertura política do país, em meados da década de 80 do século XX.",a:false,e:"ERRADO. Não há registro de que o Brasil tenha sido formalmente impedido de integrar a Comissão de Direitos Humanos da ONU por causa das denúncias da Anistia Internacional; o país seguiu participando de organismos internacionais durante o regime."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:8,s:"Em 1985, com o fim da ditadura militar no Brasil, trabalhadores, intelectuais e representantes do movimento popular fundaram o primeiro sindicato dos trabalhadores, com a proposta de melhorar as condições da classe trabalhadora.",a:false,e:"ERRADO. O sindicalismo brasileiro é muito anterior a 1985: os primeiros sindicatos surgiram ainda no final do século XIX e início do XX. Em 1985 houve o fim da ditadura, não a fundação do \"primeiro sindicato\" do país."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:9,s:"Ernesto Geisel promulgou o Ato Institucional nº 5 (AI-5), fechando o Congresso, decretando estado de sítio, cassando mandatos de prefeitos e governadores, e proibindo reuniões. O AI-5 permitiu punições arbitrárias aos inimigos do regime. Esse período ficou conhecido como \"anos de chumbo\".",a:false,e:"ERRADO. Quem promulgou o AI-5, em 1968, foi o presidente Costa e Silva, e não Ernesto Geisel (presidente entre 1974 e 1979)."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:10,s:"Os governos militares instaurados em 1964 exerceram um controle rigoroso sobre a disciplina de História, alinhando o ensino à ideologia do regime ditatorial que buscava formar cidadãos dóceis, obedientes e ordeiros, glorificando os feitos dos autoproclamados heróis do regime.",a:true,e:"CERTO. O regime militar controlou os currículos escolares, criou disciplinas como Educação Moral e Cívica e usou o ensino de História para reforçar o civismo e legitimar o próprio regime."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:11,s:"Em 1965, com a promulgação do primeiro Ato Institucional nº 1 (AI-1), todos os partidos políticos foram dissolvidos e adotou-se o bipartidarismo, resultando na existência de apenas dois partidos: ARENA e MDB. O AI-1 também modificou dispositivos constitucionais, alterando o funcionamento do Poder Judiciário e concentrando cada vez mais poder no Executivo.",a:false,e:"ERRADO. A dissolução dos partidos e a criação do bipartidarismo (ARENA e MDB) ocorreram pelo Ato Institucional nº 2 (AI-2), de outubro de 1965  1�7 e não pelo AI-1 (1964), que teve outro escopo (cassações e eleição indireta para presidente)."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:12,s:"A Agência dos Estados Unidos para o Desenvolvimento Internacional (USAID) é uma agência governamental dos EUA que administra ajuda externa para o desenvolvimento. Durante a ditadura militar no Brasil, a USAID, juntamente com o Ministério da Educação (MEC), implementou reformas educacionais no Brasil e deu suporte ao MEC para o desenvolvimento de reformas educacionais progressistas.",a:false,e:"ERRADO. Os acordos MEC-USAID (1964-1968) foram amplamente criticados por subordinarem a política educacional brasileira aos interesses dos EUA, e não por promoverem reformas \"progressistas\"."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:13,s:"O governo de Ernesto Geisel (1974-79) é considerado o período de maior repressão da Ditadura Militar no Brasil. A censura dos meios de comunicação se intensificou e muitos prisioneiros políticos foram torturados. Os movimentos de oposição ao regime eram reprimidos de diversas maneiras pelas frentes do governo militar.",a:false,e:"ERRADO. O período de maior repressão foi o governo de Médici (1969-1974), os chamados \"anos de chumbo\". Geisel (1974-1979) foi, ao contrário, quem iniciou o processo de abertura (\"distensão lenta, gradual e segura\")."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:14,s:"Durante o período da ditadura militar no Brasil, que teve início em 1964 e se estendeu até 1985, houve participação direta da população nas eleições presidenciais, quando os presidentes militares foram eleitos através do voto em um processo democrático.",a:false,e:"ERRADO. Os presidentes militares foram eleitos de forma indireta, pelo Congresso Nacional (depois pelo Colégio Eleitoral), sem voto direto da população."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:15,s:"A ditadura militar no Brasil ocorreu de 1964 a 1985. Durante esse período, o país vivenciou censura à imprensa, suspensão das eleições democráticas, perseguição a movimentos políticos considerados dissidentes e uma forte centralização do poder político.",a:true,e:"CERTO. Esse é o resumo correto do período: 1964-1985, com censura, suspensão de eleições diretas, perseguição política e centralização de poder no Executivo."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:16,s:"Não se pode afirmar que, durante o regime militar, houve qualquer violação dos direitos humanos no Brasil.",a:false,e:"ERRADO. Houve amplas e documentadas violações de direitos humanos durante a ditadura: tortura, prisões arbitrárias, desaparecimentos forçados e mortes de opositores, reconhecidas inclusive pela Comissão Nacional da Verdade."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:17,s:"A Lei Falcão foi criada durante a ditadura militar no Brasil com o objetivo de limitar a propaganda política nas eleições e restringir a liberdade de expressão dos partidos de oposição.",a:true,e:"CERTO. A Lei Falcão (1976) restringiu a propaganda eleitoral no rádio e na TV a fotos e currículos dos candidatos, sem debates, prejudicando principalmente a oposição (MDB)."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:18,s:"Em 1979, ante a iminência de nova derrota eleitoral, Geisel fechou temporariamente o Congresso e editou um conjunto de regras eleitorais conhecido como Pacote de Abril. Entre as principais mudanças, estavam a ampliação das bancadas do Sul e Sudeste na Câmara dos Deputados  1�7 o que garantia maioria parlamentar à Arena  1�7, o aumento do quórum para mudar a Constituição de 50% dos parlamentares para mais de dois terços, medida que seria decisiva, em 1984, para a não aprovação da emenda das Diretas Já.",a:false,e:"ERRADO. O \"Pacote de Abril\", com o fechamento temporário do Congresso por Geisel e as novas regras eleitorais, ocorreu em 1977, não em 1979."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:19,s:"Os direitos trabalhistas e sociais experimentaram um importante avanço com o advento da ditadura civil-militar no Brasil em 1964. O golpe ocorrido em 1º de abril, respaldado pelo imperialismo norte-americano, por segmentos conservadores da alta cúpula da Igreja Católica, bem como pela burguesia tanto internacional quanto nacional, foi um evento determinante nesse processo.",a:false,e:"ERRADO. O golpe de 1964 não trouxe avanço para os direitos trabalhistas: o FGTS (1966) substituiu a estabilidade após dez anos de serviço, enfraquecendo a proteção do trabalhador, e o regime reprimiu sindicatos e greves."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:20,s:"A Nova República teve seu início sob o governo de João Figueiredo (1979-1985), um período em que o Brasil estava em processo de transição em direção à redemocratização.",a:false,e:"ERRADO. A Nova República começa em 1985, com a posse de José Sarney (após a morte de Tancredo Neves), e não durante o governo de Figueiredo, último presidente militar."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:21,s:"No período do regime militar, um total de 17 atos institucionais foram promulgados. No entanto, dentre esses atos, o mais controverso e marcado por violência foi o Ato Institucional Número 5, conhecido como AI-5. Emitido em 13 de dezembro de 1968, o AI-5 reafirmou os princípios estabelecidos pelo AI-1, suspendeu o princípio do habeas corpus, e, de maneira explícita e direta, autorizou o uso da tortura e da violência física contra opositores do regime.",a:false,e:"ERRADO. O AI-5 suspendeu garantias constitucionais (como o habeas corpus) e deu poderes excepcionais ao Executivo, mas não autorizou \"de maneira explícita e direta\" a tortura em seu texto; a tortura foi prática sistemática do regime, não um dispositivo literal do AI-5."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:22,s:"A colonização da região Norte do Brasil teve início com o Governo Militar, após 1964, quando foi estabelecido um apoio financeiro para imigrantes italianos estabelecerem fazendas de café onde hoje localizam-se os estados do Amapá e Roraima.",a:false,e:"ERRADO. A colonização da Amazônia pelo regime militar se deu por projetos de integração nacional, como a construção da Transamazônica e assentamentos de colonos nordestinos e sulistas  1�7 não por imigrantes italianos cultivando café no Amapá e em Roraima."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:23,s:"A hiperinflação no Brasil atingiu níveis alarmantes durante a década de 1970, chegando a taxas mensais que alcançavam centenas de porcentagens. O Plano Real foi desenvolvido para estabilizar a economia e criar as condições necessárias para o crescimento sustentável. Alguns dos principais elementos do Plano Real incluíram a criação de uma nova moeda, o Real, que substituiu o Cruzado Real.",a:false,e:"ERRADO. A hiperinflação mais grave ocorreu nos anos 1980 e início dos 1990, não na década de 1970. Além disso, o Real (1994) substituiu o Cruzeiro Real, e não uma moeda chamada \"Cruzado Real\" (que nunca existiu com esse nome)."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:24,s:"O governo militar no Brasil foi a resistência capitalista às possibilidades de reformas e avanços sociais. Por meio da violência, os setores reacionários atuaram com prisões de lideranças, torturas, assassinatos, expulsão de líderes esquerdistas do país e intervenção em sindicatos. Apesar dessas questões, no campo trabalhista, houve avanço, como a lei que garantia estabilidade aos trabalhadores após dez anos de trabalho na mesma empresa.",a:false,e:"ERRADO. A estabilidade após dez anos de serviço já existia antes de 1964 (CLT) e foi justamente enfraquecida pelo regime militar com a criação do FGTS (1966)  1�7 um retrocesso, não um avanço trabalhista do período."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:25,s:"O regime militar implementou uma série de medidas, incluindo a promulgação de uma nova Constituição em 1967, que conferia amplos poderes ao Executivo; e a aprovação do Ato Institucional nº 5 (AI-5), em 1968. O AI-5 foi um dos instrumentos mais repressivos do regime, concedendo poderes extraordinários ao governo, permitindo a censura, a prisão arbitrária de opositores políticos e a suspensão de garantias constitucionais.",a:true,e:"CERTO. A Constituição de 1967 ampliou os poderes do Executivo, e o AI-5 (1968) foi o instrumento mais repressivo do regime, suspendendo garantias constitucionais e autorizando censura e prisões arbitrárias."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:26,s:"Mesmo com a Lei de Anistia de 1979, na última década do século XX, diversos militares que cometeram crimes na ditadura militar foram condenados pela justiça penal a prisão.",a:false,e:"ERRADO. A Lei de Anistia de 1979 foi interpretada como bilateral e, mesmo diante de recomendações da Comissão Nacional da Verdade, o STF (ADPF 153, 2010) manteve seu alcance amplo; na prática, nenhum agente do regime foi efetivamente condenado e preso por esses crimes."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:27,s:"Na ditadura militar, a censura abarcava os meios de comunicação e diferentes práticas artísticas.",a:true,e:"CERTO. A censura atingiu jornais, rádio, TV, e também música, teatro, cinema e literatura, com órgãos como o DCDP (Divisão de Censura de Diversões Públicas)."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:28,s:"A tortura era utilizada nesse período como um meio de extrair informações de prisioneiros políticos.",a:true,e:"CERTO. A tortura foi usada sistematicamente pelos órgãos de repressão (DOI-CODI, DOPS) para obter informações e intimidar opositores do regime."},
