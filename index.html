{m:"Raciocínio Lógico",id:"Simulado3|046",bloco:"G",tema:"Condicional e equivalências - modus ponens",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:46,s:"Acerca de estruturas lógicas, negações, valores lógicos e equivalências, julgue o item: Considere verdadeiras as proposições \"Se o preço sobe, então a demanda cai\" e \"O preço subiu\". Dessas proposições conclui-se, logicamente, que a demanda caiu.",a:true,e:"CERTO. Modus ponens: de 'p ↄ1�7 q' e 'p' conclui-se q (a demanda caiu)."},
{m:"Raciocínio Lógico",id:"Simulado3|047",bloco:"G",tema:"Negações e De Morgan - conjunção",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:47,s:"A respeito de negações, argumentação lógica e equivalências, julgue o item: A negação da proposição \"A casa é ampla e arejada\" é \"A casa não é ampla ou não é arejada\".",a:true,e:"CERTO. De Morgan: ~(p ∄1�7 q) = ~p ∄1�7 ~q."},
{m:"Raciocínio Lógico",id:"Simulado3|048",bloco:"G",tema:"Silogismos e diagramas - todo e algum",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:48,s:"A respeito de negações, argumentação lógica e equivalências, julgue o item: Considere verdadeiras as proposições \"Todo gerente é funcionário\" e \"Alguns funcionários fazem hora extra\". Dessas proposições conclui-se, necessariamente, que algum gerente faz hora extra.",a:false,e:"ERRADO. Não há garantia de que os funcionários que fazem hora extra sejam gerentes (os conjuntos podem não se cruzar)."},
{m:"Raciocínio Lógico",id:"Simulado3|049",bloco:"G",tema:"Proposições, conectivos e tabela-verdade - bicondicional",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:49,s:"A respeito de negações, argumentação lógica e equivalências, julgue o item: A proposição \"Um número é múltiplo de 3 se, e somente se, a soma de seus algarismos é múltipla de 3\" é logicamente equivalente à conjunção das proposições \"se o número é múltiplo de 3, então a soma de seus algarismos é múltipla de 3\" e \"se a soma de seus algarismos é múltipla de 3, então o número é múltiplo de 3\".",a:true,e:"CERTO. O bicondicional (p ↄ1�7 q) equivale à conjunção (p ↄ1�7 q) ∄1�7 (q ↄ1�7 p)."},
{m:"Raciocínio Lógico",id:"Simulado3|050",bloco:"G",tema:"Condicional e equivalências - contrapositiva",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:50,s:"A respeito de negações, argumentação lógica e equivalências, julgue o item: A proposição \"Se estuda, então passa\" é logicamente equivalente à proposição \"Se passa, então estuda\".",a:false,e:"ERRADO. Essa é a recíproca. A equivalente do condicional é a contrapositiva: 'Se não passa, então não estuda'."},
{m:"Legislação Institucional",id:"Simulado3|051",bloco:"E",tema:"Estatuto PMMA - hierarquia e disciplina",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:51,s:"À luz da Lei estadual nº 6.513/1995 (Estatuto dos Policiais Militares do Maranhão), no que se refere à hierarquia, à precedência e à antiguidade, julgue o item: A hierarquia e a disciplina são as bases institucionais da Polícia Militar, e nela a autoridade e a responsabilidade crescem com o grau hierárquico.",a:true,e:"CERTO. Hierarquia e disciplina são a base institucional, e a autoridade e a responsabilidade crescem com o grau hierárquico."},
{m:"Legislação Institucional",id:"Simulado3|052",bloco:"E",tema:"Estatuto PMMA - precedência das praças especiais",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:52,s:"À luz da Lei estadual nº 6.513/1995 (Estatuto dos Policiais Militares do Maranhão), no que se refere à hierarquia, à precedência e à antiguidade, julgue o item: Na precedência entre as praças especiais e as demais praças, os Cadetes são hierarquicamente superiores aos Subtenentes.",a:true,e:"CERTO. As praças especiais (Aspirante e Cadete) precedem as demais praças, inclusive os Subtenentes."},
{m:"Legislação Institucional",id:"Simulado3|053",bloco:"E",tema:"Estatuto PMMA - antiguidade",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:53,s:"À luz da Lei estadual nº 6.513/1995 (Estatuto dos Policiais Militares do Maranhão), no que se refere à hierarquia, à precedência e à antiguidade, julgue o item: Nos casos de nomeação mediante concurso, de declaração de Aspirante-a-Oficial, de promoção às graduações de Terceiro-Sargento e de Cabo e de incorporação de Soldado, prevalece, para efeito de antiguidade, a ordem de classificação obtida no respectivo curso ou concurso.",a:true,e:"CERTO. Nesses casos, a antiguidade segue a ordem de classificação no respectivo curso ou concurso."},
{m:"Legislação Institucional",id:"Simulado3|054",bloco:"E",tema:"Estatuto PMMA - cargo policial-militar",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:54,s:"Com base na Lei estadual nº 6.513/1995, no que se refere ao cargo e à função policial-militar, julgue o item: Cargo policial-militar é aquele criado por lei e que somente pode ser exercido por policial-militar em serviço ativo, correspondendo a cada cargo um conjunto de atribuições, deveres e responsabilidades.",a:true,e:"CERTO. Cargo policial-militar é criado por lei, exercido só por PM da ativa, com atribuições, deveres e responsabilidades."},
{m:"Legislação Institucional",id:"Simulado3|055",bloco:"E",tema:"Estatuto PMMA - cargo interino",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:55,s:"Com base na Lei estadual nº 6.513/1995, no que se refere ao cargo e à função policial-militar, julgue o item: Considera-se interina a situação do militar que desempenha as obrigações do cargo sem satisfazer aos requisitos de grau hierárquico, de quadro e de especialização exigidos para o provimento efetivo.",a:true,e:"CERTO. Interino é quem exerce as obrigações do cargo sem cumprir todos os requisitos de grau, quadro e especialização do provimento efetivo."},
{m:"Legislação Institucional",id:"Simulado3|056",bloco:"E",tema:"Estatuto PMMA - provimento de cargo",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:56,s:"Com base na Lei estadual nº 6.513/1995, no que se refere ao cargo e à função policial-militar, julgue o item: O provimento de cargo policial-militar dar-se-á por ato de nomeação do Comandante-Geral da Polícia Militar, a quem incumbe, privativamente, a designação dos titulares dos cargos previstos nos Quadros de Organização.",a:false,e:"ERRADO. A assertiva troca a autoridade do provimento: o Estatuto não dá ao Comandante-Geral, privativamente, a nomeação; confira o artigo sobre provimento de cargos. (Gabarito oficial.)"},
{m:"Legislação Institucional",id:"Simulado3|057",bloco:"E",tema:"Estatuto PMMA - nomeação do Comandante-Geral",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:57,s:"Com base na Lei estadual nº 6.513/1995, no que se refere ao cargo e à função policial-militar, julgue o item: O Comandante-Geral da Polícia Militar será nomeado pelo Governador do Estado e escolhido entre oficiais da ativa do último posto do Quadro de Combatentes, observada também a legislação federal em vigor.",a:true,e:"CERTO. O Comandante-Geral é nomeado pelo Governador entre oficiais da ativa do último posto do Quadro de Combatentes."},
{m:"Legislação Institucional",id:"Simulado3|058",bloco:"E",tema:"Estatuto PMMA - Gabinete do Subcomandante-Geral",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:58,s:"Com base na Lei estadual nº 6.513/1995, no que se refere ao cargo e à função policial-militar, julgue o item: O Gabinete do Subcomandante-Geral, órgão de apoio direto e imediato, é constituído de assistência, ajudância de ordens, seção administrativa e seção de segurança.",a:false,e:"ERRADO. A composição indicada para o Gabinete do Subcomandante-Geral não confere com a prevista no Estatuto; revise o artigo da organização básica. (Gabarito oficial.)"},
{m:"Legislação Institucional",id:"Simulado3|059",bloco:"E",tema:"Estatuto PMMA - cargos vagos",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:59,s:"Com base na Lei estadual nº 6.513/1995, no que se refere ao cargo e à função policial-militar, julgue o item: Consideram-se vagos, além dos cargos criados e ainda não providos, aqueles cujos ocupantes tenham falecido ou tenham sido considerados extraviados ou desertores.",a:true,e:"CERTO. Cargo vago: criado e não provido, ou cujo ocupante faleceu, foi considerado extraviado ou desertor."},
{m:"Legislação Institucional",id:"Simulado3|060",bloco:"E",tema:"Estatuto PMMA - exercício de função",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:60,s:"Com base na Lei estadual nº 6.513/1995, no que se refere ao cargo e à função policial-militar, julgue o item: Ainda que não haja militar qualificado para determinada função, é vedado designar para o seu exercício militar de posto ou graduação inferior, devendo a função permanecer sem titular até que surja militar habilitado.",a:false,e:"ERRADO. Na falta de militar qualificado, admite-se designar militar de posto ou graduação inferior; a função não fica vaga por vedação absoluta."},
{m:"Legislação Institucional",id:"Simulado3|061",bloco:"E",tema:"Estatuto PMMA - deveres policiais-militares",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:61,s:"No que diz respeito aos deveres, às obrigações e à responsabilidade do policial-militar, à luz da Lei estadual nº 6.513/1995, julgue o item: Entre os deveres policiais-militares inclui-se a dedicação integral ao serviço policial-militar e a fidelidade à instituição a que o militar pertence, mesmo com o sacrifício da própria vida.",a:true,e:"CERTO. Dedicação integral ao serviço e fidelidade à instituição, mesmo com o sacrifício da própria vida, são deveres policiais-militares."},
{m:"Legislação Institucional",id:"Simulado3|062",bloco:"E",tema:"Estatuto PMMA - vedações ao policial-militar",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:62,s:"No que diz respeito aos deveres, às obrigações e à responsabilidade do policial-militar, à luz da Lei estadual nº 6.513/1995, julgue o item: Ao policial-militar da ativa é vedado comerciar ou tomar parte na administração ou na gerência de sociedade, ou dela ser sócio ou participar, ressalvada a condição de acionista ou de quotista em sociedade anônima ou por quotas de responsabilidade limitada.",a:true,e:"CERTO. É vedado comerciar ou participar da administração/gerência de sociedade, salvo como acionista ou quotista de S.A. ou de sociedade por quotas de responsabilidade limitada."},
{m:"Legislação Institucional",id:"Simulado3|063",bloco:"E",tema:"Estatuto PMMA - informação sobre bens",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:63,s:"No que diz respeito aos deveres, às obrigações e à responsabilidade do policial-militar, à luz da Lei estadual nº 6.513/1995, julgue o item: O Comandante-Geral da Polícia Militar poderá determinar aos policiais-militares da ativa que informem sobre a origem e a natureza de seus bens, sempre que houver razões que recomendem a medida, no interesse da salvaguarda da dignidade destes.",a:true,e:"CERTO. O Comandante-Geral pode determinar que informem a origem e a natureza de seus bens quando houver razões que recomendem, em defesa da dignidade."},
{m:"Legislação Institucional",id:"Simulado3|064",bloco:"E",tema:"Estatuto PMMA - afastamento por incompatibilidade",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:64,s:"No que diz respeito aos deveres, às obrigações e à responsabilidade do policial-militar, à luz da Lei estadual nº 6.513/1995, julgue o item: São competentes para determinar o imediato afastamento do cargo ou o impedimento do exercício da função do policial-militar que se torne incompatível com o cargo o Governador do Estado, o titular da pasta estadual de segurança pública e o Comandante-Geral da Polícia Militar.",a:true,e:"CERTO. Governador, titular da pasta de segurança pública e Comandante-Geral podem determinar o afastamento imediato de quem se torne incompatível com o cargo."},
{m:"Legislação Institucional",id:"Simulado3|065",bloco:"E",tema:"Estatuto PMMA - Justiça Militar estadual (art. 58)",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:65,s:"No que diz respeito aos deveres, às obrigações e à responsabilidade do policial-militar, à luz da Lei estadual nº 6.513/1995, julgue o item: Enquanto o Estado do Maranhão não dispuser de Tribunal Militar, a Auditoria da Justiça Militar Estadual é competente para processar e julgar os militares estaduais nos crimes definidos em lei como militares, cabendo ao Superior Tribunal Militar o julgamento em segunda instância.",a:false,e:"ERRADO. Sem Tribunal Militar, a Auditoria da Justiça Militar Estadual julga em 1ª instância e a 2ª instância é o Tribunal de Justiça do Estado, e não o STM (art. 58)."},
{m:"Legislação Institucional",id:"Simulado3|066",bloco:"E",tema:"Lei 14.751/2023 (LON) - subordinação",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:66,s:"Considerando a Lei federal nº 14.751/2023 (Lei Orgânica Nacional das PMs e dos CBMs), julgue o item: As polícias militares e os corpos de bombeiros militares dos estados, instituições militares permanentes, subordinam-se ao Ministério da Justiça e Segurança Pública, cabendo aos governadores tão somente a direção do seu emprego operacional cotidiano.",a:false,e:"ERRADO. PMs e CBMs são instituições militares subordinadas aos governadores dos Estados, e não ao Ministério da Justiça e Segurança Pública."},
{m:"Legislação Institucional",id:"Simulado3|067",bloco:"E",tema:"Lei 14.751/2023 (LON) - cooperação para formação e treinamento",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:67,s:"Considerando a Lei federal nº 14.751/2023 (Lei Orgânica Nacional das PMs e dos CBMs), julgue o item: Admite-se a cooperação das polícias militares e dos corpos de bombeiros militares para a formação e o treinamento de natureza militar destinados a instituições e órgãos de segurança pública de natureza civil, federais, estaduais ou municipais.",a:false,e:"ERRADO. A assertiva amplia a cooperação de formação e treinamento além do que a LON admite; confira o artigo sobre cooperação da Lei 14.751/2023. (Gabarito oficial.)"},
{m:"Legislação Institucional",id:"Simulado3|068",bloco:"E",tema:"Lei 14.751/2023 (LON) - estrutura básica",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:68,s:"Considerando a Lei federal nº 14.751/2023 (Lei Orgânica Nacional das PMs e dos CBMs), julgue o item: A organização das polícias militares e dos corpos de bombeiros militares deve observar preferencialmente estrutura básica composta de órgãos de direção, de assessoramento, de apoio, de execução e de correição.",a:true,e:"CERTO. A LON prevê estrutura básica preferencial composta por esses tipos de órgãos. (Gabarito oficial.)"},
{m:"Legislação Institucional",id:"Simulado3|069",bloco:"E",tema:"Lei 14.751/2023 (LON) - efetivos",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:69,s:"Considerando a Lei federal nº 14.751/2023 (Lei Orgânica Nacional das PMs e dos CBMs), julgue o item: Os efetivos das polícias militares e dos corpos de bombeiros militares são fixados por ato do respectivo Comandante-Geral, considerada exclusivamente a disponibilidade orçamentária da unidade federada.",a:false,e:"ERRADO. Os efetivos são fixados em lei estadual, e não por ato do Comandante-Geral nem só pela disponibilidade orçamentária."},
{m:"Legislação Institucional",id:"Simulado3|070",bloco:"E",tema:"Lei 14.751/2023 (LON) - atribuições constitucionais",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:70,s:"Considerando a Lei federal nº 14.751/2023 (Lei Orgânica Nacional das PMs e dos CBMs), julgue o item: Nas suas atribuições constitucionais, as polícias militares são titulares da polícia ostensiva e da preservação da ordem pública e os corpos de bombeiros militares, da defesa civil, subordinados uns e outros aos governadores.",a:true,e:"CERTO. PMs: polícia ostensiva e preservação da ordem pública; CBMs: defesa civil; ambos subordinados aos governadores (CF, art. 144)."},
{m:"Legislação Institucional",id:"Simulado3|071",bloco:"E",tema:"Lei 14.751/2023 (LON) - mobilização pela União",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:71,s:"Ainda a respeito da Lei federal nº 14.751/2023, julgue o item: As polícias militares e os corpos de bombeiros militares somente poderão ser mobilizados pela União, no caso de guerra, mediante prévia autorização da assembleia legislativa da respectiva unidade federada.",a:false,e:"ERRADO. A mobilização pela União não depende de autorização prévia da assembleia legislativa e não se limita ao caso de guerra."},
{m:"Legislação Institucional",id:"Simulado3|072",bloco:"E",tema:"Lei 14.751/2023 (LON) - parcerias com outros entes",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:72,s:"Ainda a respeito da Lei federal nº 14.751/2023, julgue o item: Os governadores poderão celebrar termos de parceria, convênios, consórcios e acordos de colaboração com unidades federadas limítrofes para atuação integrada em regiões de fronteiras e divisas, vedada a celebração com unidades federadas não limítrofes.",a:false,e:"ERRADO. A assertiva cria uma vedação (não limítrofes) que a LON não impõe."},
{m:"Legislação Institucional",id:"Simulado3|073",bloco:"E",tema:"Lei 14.751/2023 (LON) - Inspetoria-Geral",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:73,s:"Ainda a respeito da Lei federal nº 14.751/2023, julgue o item: A Inspetoria-Geral das Polícias Militares e dos Corpos de Bombeiros Militares integra a estrutura do Ministério da Justiça e Segurança Pública e a ela incumbem os estudos, a coleta e o registro de dados relativos à condição de força auxiliar e reserva do Exército.",a:false,e:"ERRADO. A Inspetoria-Geral integra a estrutura do Exército (Ministério da Defesa), e não a do Ministério da Justiça e Segurança Pública."},
{m:"Legislação Institucional",id:"Simulado3|074",bloco:"E",tema:"Lei 14.751/2023 (LON) - convocação",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:74,s:"Ainda a respeito da Lei federal nº 14.751/2023, julgue o item: Nas hipóteses de convocação, o ato respectivo dispensa a fixação de prazo, de local e das condições de execução, os quais serão definidos pelo comando da unidade a que estiver subordinado o militar convocado.",a:false,e:"ERRADO. O ato de convocação deve fixar prazo, local e condições de execução; não os dispensa."},
{m:"Legislação Institucional",id:"Simulado3|075",bloco:"E",tema:"Lei 14.751/2023 (LON) - precedência entre militares",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:75,s:"Ainda a respeito da Lei federal nº 14.751/2023, julgue o item: A precedência entre militares observará o previsto no Estatuto dos Militares, Lei nº 6.880/1980, salvo os casos de precedência funcional estabelecida em lei.",a:true,e:"CERTO. A precedência entre militares segue o Estatuto dos Militares (Lei 6.880/1980), ressalvadas as precedências funcionais previstas em lei."},
{m:"Legislação Institucional",id:"Simulado3|076",bloco:"E",tema:"Lei 12.896/2026 - nomeação do Comandante-Geral",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:76,s:"Com base na Lei estadual nº 12.896/2026 (Organização Básica da PMMA), julgue o item: O Comandante-Geral será nomeado pelo Governador do Estado entre os oficiais da ativa a partir do posto de Tenente-Coronel, dispensada a exigência de curso de altos estudos militares.",a:false,e:"ERRADO. A assertiva reduz o posto exigido e dispensa o curso; confira os requisitos do Comandante-Geral na Lei 12.896/2026. (Gabarito oficial.)"},
{m:"Legislação Institucional",id:"Simulado3|077",bloco:"E",tema:"Lei 12.896/2026 - Plano de Comando",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:77,s:"Com base na Lei estadual nº 12.896/2026 (Organização Básica da PMMA), julgue o item: O Comandante-Geral deve apresentar o Plano de Comando no prazo de até cento e oitenta dias após a sua nomeação, documento que estabelecerá as diretrizes e os objetivos de sua gestão.",a:false,e:"ERRADO. O prazo indicado (180 dias) não confere com o da Lei 12.896/2026; confira o prazo do Plano de Comando. (Gabarito oficial.)"},
{m:"Legislação Institucional",id:"Simulado3|078",bloco:"E",tema:"Lei 12.896/2026 - substituto do Comandante-Geral",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:78,s:"Com base na Lei estadual nº 12.896/2026 (Organização Básica da PMMA), julgue o item: O substituto imediato do Comandante-Geral é o Chefe do Estado-Maior Geral, a quem cabe assumir a direção da Corporação nos impedimentos e nas ausências daquele.",a:false,e:"ERRADO. O substituto imediato do Comandante-Geral é o Subcomandante-Geral; o Chefe do Estado-Maior Geral substitui o Subcomandante."},
{m:"Legislação Institucional",id:"Simulado3|079",bloco:"E",tema:"Lei 12.896/2026 - órgãos de direção geral",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:79,s:"Com base na Lei estadual nº 12.896/2026 (Organização Básica da PMMA), julgue o item: São órgãos de direção geral da Polícia Militar do Maranhão o Comando-Geral, o Subcomando-Geral e o Estado-Maior Geral, responsáveis pela elaboração da política institucional, pelo planejamento estratégico e pela administração superior da instituição.",a:true,e:"CERTO. Comando-Geral, Subcomando-Geral e Estado-Maior Geral são os órgãos de direção geral."},
{m:"Legislação Institucional",id:"Simulado3|080",bloco:"E",tema:"Lei 12.896/2026 - relatório anual de transparência",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:80,s:"Com base na Lei estadual nº 12.896/2026 (Organização Básica da PMMA), julgue o item: Incumbe ao Comandante-Geral assegurar a ampla divulgação pública e anual de relatório detalhado sobre as atividades da Corporação, do qual devem constar, no mínimo, as representações recebidas e apuradas contra membros da instituição, o número de ocorrências policiais atendidas por tipo e os dados de letalidade e vitimização de policiais.",a:true,e:"CERTO. O Comandante-Geral deve assegurar a divulgação pública e anual do relatório, com esses dados mínimos de transparência."},
{m:"Legislação Institucional",id:"Simulado3|081",bloco:"E",tema:"Lei 12.896/2026 - Estado-Maior Geral",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:81,s:"Ainda com fundamento na Lei estadual nº 12.896/2026, julgue o item: Ao Estado-Maior Geral, órgão de direção geral, cabem a direção estratégica, o planejamento, a coordenação e o controle das atividades operacionais e administrativas, atuando como órgão de apoio técnico ao Comandante-Geral.",a:true,e:"CERTO. O Estado-Maior Geral é órgão de direção geral, com direção estratégica, planejamento, coordenação e controle, e apoio técnico ao Comandante-Geral."},
{m:"Legislação Institucional",id:"Simulado3|082",bloco:"E",tema:"Lei 12.896/2026 - Gabinete do Comandante-Geral",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:82,s:"Ainda com fundamento na Lei estadual nº 12.896/2026, julgue o item: O Gabinete do Comandante-Geral, órgão de apoio direto e imediato, responde pela gestão da segurança pessoal do Comandante-Geral e de seus familiares, além da coordenação, da supervisão e do controle das atividades institucionais e administrativas do gabinete.",a:true,e:"CERTO. O Gabinete é órgão de apoio direto e imediato, com a segurança pessoal do Comandante-Geral e familiares e a coordenação das atividades do gabinete."},
{m:"Legislação Institucional",id:"Simulado3|083",bloco:"E",tema:"Lei 12.896/2026 - seções do Estado-Maior Geral",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:83,s:"Ainda com fundamento na Lei estadual nº 12.896/2026, julgue o item: O Estado-Maior Geral é constituído de quatro seções, numeradas de PM/1 a PM/4, às quais cabem, respectivamente, as áreas de pessoal, de inteligência, de operações e de logística.",a:false,e:"ERRADO. O número ou as áreas das seções do Estado-Maior Geral não conferem com a Lei 12.896/2026; revise a estrutura do Estado-Maior Geral. (Gabarito oficial.)"},
{m:"Legislação Institucional",id:"Simulado3|084",bloco:"E",tema:"Lei 12.896/2026 - competências do Comandante-Geral",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:84,s:"Ainda com fundamento na Lei estadual nº 12.896/2026, julgue o item: Compete ao Comandante-Geral estabelecer a política de comando e emprego da Corporação, com vistas aos seus objetivos institucionais, e assessorar o Governador do Estado e o titular da pasta estadual de segurança pública em assuntos relativos à missão constitucional da Polícia Militar.",a:true,e:"CERTO. Compete ao Comandante-Geral estabelecer a política de comando e emprego e assessorar o Governador e o titular da segurança pública."},
{m:"Legislação Institucional",id:"Simulado3|085",bloco:"E",tema:"Lei 12.896/2026 - Chefe do Estado-Maior Geral",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:85,s:"Ainda com fundamento na Lei estadual nº 12.896/2026, julgue o item: O Chefe do Estado-Maior Geral é nomeado pelo Governador do Estado mediante indicação, e é o substituto imediato do Subcomandante-Geral.",a:true,e:"CERTO. O Chefe do Estado-Maior Geral é nomeado pelo Governador por indicação e substitui imediatamente o Subcomandante-Geral."},
{m:"Informática",id:"Simulado3|086",bloco:"E",tema:"Windows: arquivos, pastas e ferramentas - lixeira",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:86,s:"Acerca de sistemas operacionais e do gerenciamento de arquivos, julgue o item: No Windows, os arquivos excluídos de uma unidade removível, como um pen drive, são enviados à Lixeira do sistema, de onde podem ser restaurados enquanto não houver esvaziamento.",a:false,e:"ERRADO. Arquivos excluídos de pen drive (unidade removível) são apagados definitivamente, sem passar pela Lixeira."},
{m:"Informática",id:"Simulado3|087",bloco:"E",tema:"Atalhos do Windows - Ctrl + Shift + Esc",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:87,s:"Acerca de sistemas operacionais e do gerenciamento de arquivos, julgue o item: No Windows, a combinação de teclas Ctrl + Shift + Esc abre o Explorador de Arquivos na pasta do usuário conectado.",a:false,e:"ERRADO. Ctrl + Shift + Esc abre o Gerenciador de Tarefas. O Explorador de Arquivos abre com Win + E."},
{m:"Informática",id:"Simulado3|088",bloco:"E",tema:"Linux - permissões chmod",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:88,s:"Acerca de sistemas operacionais e do gerenciamento de arquivos, julgue o item: No Linux, o comando chmod 644 aplicado a um arquivo concede ao seu proprietário as permissões de leitura, escrita e execução.",a:false,e:"ERRADO. No chmod 644 o dono recebe leitura e escrita (6 = rw-) e grupo e outros só leitura (4); ninguém recebe execução."},
{m:"Informática",id:"Simulado3|089",bloco:"E",tema:"Linux - diretório /etc",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:89,s:"Acerca de sistemas operacionais e do gerenciamento de arquivos, julgue o item: No Linux, o diretório /etc destina-se ao armazenamento dos arquivos pessoais dos usuários do sistema, sendo criado um subdiretório para cada conta.",a:false,e:"ERRADO. O /etc guarda arquivos de configuração do sistema; os arquivos pessoais ficam em /home (um subdiretório por usuário)."},
{m:"Informática",id:"Simulado3|090",bloco:"E",tema:"Linux - comando sudo",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:90,s:"Acerca de sistemas operacionais e do gerenciamento de arquivos, julgue o item: No Linux, o comando sudo permite que usuário autorizado execute determinado comando com privilégios de superusuário, mediante autenticação.",a:true,e:"CERTO. O sudo executa comandos com privilégios de superusuário (root) para usuário autorizado, mediante autenticação."},
{m:"Informática",id:"Simulado3|091",bloco:"E",tema:"Atalhos do Windows - Win + E",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:91,s:"Acerca de sistemas operacionais e do gerenciamento de arquivos, julgue o item: No Windows, a combinação de teclas Win + E abre o Explorador de Arquivos.",a:true,e:"CERTO. Win + E abre o Explorador de Arquivos."},
{m:"Informática",id:"Simulado3|092",bloco:"E",tema:"Windows: arquivos, pastas e ferramentas - arrastar arquivo",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:92,s:"Acerca de sistemas operacionais e do gerenciamento de arquivos, julgue o item: No Windows, arrastar um arquivo de uma pasta para outra situada na mesma unidade de disco, sem o acionamento de teclas adicionais, copia o arquivo e preserva o original na pasta de origem.",a:false,e:"ERRADO. Arrastar dentro da mesma unidade MOVE o arquivo; para copiar usa-se Ctrl (ou arrasta-se para outra unidade)."},
{m:"Informática",id:"Simulado3|093",bloco:"E",tema:"Atalhos do Windows - Win + V",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:93,s:"Acerca de sistemas operacionais e do gerenciamento de arquivos, julgue o item: No Windows, o histórico da área de transferência pode ser acessado pela combinação Win + V, desde que o recurso tenha sido previamente habilitado nas configurações do sistema.",a:true,e:"CERTO. Win + V abre o histórico da área de transferência (após habilitar o recurso nas configurações)."},
{m:"Informática",id:"Simulado3|094",bloco:"E",tema:"Word - controle de alterações",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:94,s:"A respeito de editores de texto, julgue o item: O recurso de controle de alterações registra as modificações introduzidas no documento e permite que sejam aceitas ou rejeitadas individualmente, preservando a identificação do autor de cada uma delas.",a:true,e:"CERTO. O controle de alterações registra as edições, identifica o autor de cada uma e permite aceitar ou rejeitar individualmente. (Obs.: o gabarito divulgado marca ERRADO, mas a assertiva descreve corretamente o recurso.)"},
{m:"Informática",id:"Simulado3|095",bloco:"E",tema:"Word - sumário automático",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:95,s:"A respeito de editores de texto, julgue o item: A geração de sumário automático depende da aplicação de estilos de título aos parágrafos correspondentes, e a sua atualização pode restringir-se apenas aos números de página, sem alteração dos textos das entradas.",a:true,e:"CERTO. O sumário automático depende dos estilos de título e pode ser atualizado só nos números de página ou em todo o índice."},
{m:"Informática",id:"Simulado3|096",bloco:"E",tema:"Word - mala direta",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:96,s:"A respeito de editores de texto, julgue o item: A mala direta exige que a fonte de dados esteja contida em documento do próprio editor de texto, não se admitindo o uso de planilha eletrônica como origem dos registros.",a:false,e:"ERRADO. A mala direta aceita como fonte planilhas (Excel), listas, contatos e bancos de dados, e não só documento do editor."},
{m:"Informática",id:"Simulado3|097",bloco:"E",tema:"Word - marca d'água",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:97,s:"A respeito de editores de texto, julgue o item: A marca d'água precisa ser inserida individualmente em cada página do documento, inexistindo recurso que a aplique de uma só vez a toda a sua extensão.",a:false,e:"ERRADO. A marca d'água é inserida uma única vez e se aplica a todas as páginas do documento."},
{m:"Informática",id:"Simulado3|098",bloco:"E",tema:"Excel e planilhas - função PROCV",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:98,s:"Considerando o uso de planilhas eletrônicas, julgue o item: A função PROCV procura o valor especificado na primeira linha do intervalo indicado e retorna, como resultado, o conteúdo de uma coluna dessa mesma matriz.",a:false,e:"ERRADO. O PROCV procura o valor na primeira COLUNA do intervalo e devolve o conteúdo de outra coluna da mesma linha (o PROCH é que procura na primeira linha)."},
{m:"Informática",id:"Simulado3|099",bloco:"E",tema:"Excel e planilhas - função SOMASE",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:99,s:"Considerando o uso de planilhas eletrônicas, julgue o item: A função SOMASE soma os valores de um intervalo que satisfaçam a determinado critério, admitindo que o intervalo de soma seja distinto do intervalo de avaliação.",a:true,e:"CERTO. O SOMASE soma as células que atendem a um critério, e o intervalo de soma pode ser diferente do intervalo de avaliação."},
{m:"Informática",id:"Simulado3|100",bloco:"E",tema:"Excel e planilhas - referência mista",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:100,s:"Considerando o uso de planilhas eletrônicas, julgue o item: Na referência $B2, a coluna permanece sempre fixa e a linha se ajusta quando a fórmula é copiada para linhas diferentes, caracterizando referência mista.",a:true,e:"CERTO. Em $B2 a coluna é fixa e a linha é relativa: referência mista."},
{m:"Informática",id:"Simulado3|101",bloco:"E",tema:"Excel e planilhas - erro #DIV/0!",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:101,s:"Considerando o uso de planilhas eletrônicas, julgue o item: O resultado #DIV/0! indica que a fórmula faz referência a célula que foi excluída da planilha ou que se encontra fora do intervalo válido.",a:false,e:"ERRADO. #DIV/0! indica divisão por zero (ou por célula vazia). Referência a célula excluída gera #REF!."},
{m:"Informática",id:"Simulado3|102",bloco:"E",tema:"Excel e planilhas - formatação condicional",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:102,s:"Considerando o uso de planilhas eletrônicas, julgue o item: A formatação condicional altera de modo permanente o valor armazenado na célula quando a regra definida pelo usuário for satisfeita.",a:false,e:"ERRADO. A formatação condicional altera só a aparência (cor, fonte etc.), e não o valor armazenado na célula."},
{m:"Informática",id:"Simulado3|103",bloco:"E",tema:"Excel e planilhas - tabela dinâmica",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:103,s:"Considerando o uso de planilhas eletrônicas, julgue o item: A tabela dinâmica permite resumir grandes volumes de registros por agrupamento e agregação, sem que a base de dados de origem seja alterada.",a:true,e:"CERTO. A tabela dinâmica resume grandes volumes por agrupamento e agregação sem alterar a base de origem."},
{m:"Informática",id:"Simulado3|104",bloco:"E",tema:"PowerPoint - modo de exibição do apresentador",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:104,s:"Acerca de apresentações eletrônicas e de conceitos de Internet e de redes, julgue o item: O modo de exibição do apresentador permite que o palestrante visualize as anotações e o próximo slide em sua tela, enquanto a plateia vê apenas a apresentação em execução.",a:true,e:"CERTO. No modo apresentador, só o palestrante vê anotações e o próximo slide; a plateia vê a apresentação."},
{m:"Informática",id:"Simulado3|105",bloco:"E",tema:"PowerPoint - hiperlink",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:105,s:"Acerca de apresentações eletrônicas e de conceitos de Internet e de redes, julgue o item: Em uma apresentação eletrônica, o hiperlink só pode apontar para endereço da Internet, não sendo possível vinculá-lo a outro slide do mesmo arquivo.",a:false,e:"ERRADO. O hiperlink pode apontar para site, outro slide do mesmo arquivo, outro arquivo ou e-mail."},
{m:"Informática",id:"Simulado3|106",bloco:"E",tema:"Redes e protocolos - DNS",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:106,s:"Acerca de apresentações eletrônicas e de conceitos de Internet e de redes, julgue o item: O sistema de nomes de domínio (DNS) traduz nomes de domínio em endereços IP, o que dispensa o usuário de memorizar a numeração associada a cada servidor.",a:true,e:"CERTO. O DNS traduz nomes de domínio em endereços IP, dispensando o usuário de memorizar números."},
{m:"Informática",id:"Simulado3|107",bloco:"E",tema:"Navegação e e-mail - navegação anônima",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:107,s:"Acerca de apresentações eletrônicas e de conceitos de Internet e de redes, julgue o item: A navegação anônima impede que o provedor de acesso e os sítios visitados identifiquem a atividade do usuário, uma vez que suprime os registros mantidos fora do dispositivo.",a:false,e:"ERRADO. A navegação anônima só evita guardar histórico e cookies no dispositivo; o provedor e os sites ainda identificam o acesso."},
{m:"Informática",id:"Simulado3|108",bloco:"E",tema:"Segurança da informação - HTTPS e TLS",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:108,s:"Acerca de apresentações eletrônicas e de conceitos de Internet e de redes, julgue o item: O HTTPS emprega obrigatoriamente o protocolo TLS para cifrar a comunicação entre o navegador e o servidor, o que protege os dados enquanto trafegam pela rede.",a:true,e:"CERTO. O HTTPS usa TLS (antes SSL) para criptografar a comunicação entre navegador e servidor."},
{m:"Informática",id:"Simulado3|109",bloco:"E",tema:"Navegação e e-mail - cookies",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:109,s:"Acerca de apresentações eletrônicas e de conceitos de Internet e de redes, julgue o item: Cookies são arquivos gravados pelo navegador a pedido do sítio visitado e podem manter a sessão do usuário autenticado entre requisições sucessivas.",a:true,e:"CERTO. Cookies são gravados pelo navegador a pedido do site e podem manter a sessão autenticada."},
{m:"Informática",id:"Simulado3|110",bloco:"E",tema:"Redes e protocolos - intranet",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:110,s:"Acerca de apresentações eletrônicas e de conceitos de Internet e de redes, julgue o item: Uma intranet, por ter acesso restrito ao público interno da organização, não utiliza os protocolos da família TCP/IP, empregando padrões proprietários de rede local.",a:false,e:"ERRADO. A intranet usa a mesma pilha TCP/IP da internet; o que muda é o acesso restrito."},
{m:"Informática",id:"Simulado3|111",bloco:"E",tema:"Segurança da informação - VPN",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:111,s:"Acerca de apresentações eletrônicas e de conceitos de Internet e de redes, julgue o item: A rede privada virtual (VPN) eleva a velocidade da conexão do usuário, uma vez que dispensa a cifragem dos dados transmitidos entre o dispositivo e a rede de destino.",a:false,e:"ERRADO. A VPN cria um túnel CIFRADO e tende a reduzir a velocidade (overhead), e não a elevá-la."},
{m:"Informática",id:"Simulado3|112",bloco:"E",tema:"Navegação e e-mail - campo Cco",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:112,s:"No que se refere a correio eletrônico, computação em nuvem e segurança da informação, julgue o item: Os endereços incluídos no campo de cópia oculta são exibidos aos destinatários indicados no campo \"Para\", embora estes não possam responder diretamente àqueles.",a:false,e:"ERRADO. Os endereços em Cco (cópia oculta) NÃO aparecem aos demais destinatários."},
{m:"Informática",id:"Simulado3|113",bloco:"E",tema:"Redes e protocolos - IMAP e POP3",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:113,s:"No que se refere a correio eletrônico, computação em nuvem e segurança da informação, julgue o item: O protocolo IMAP mantém as mensagens no servidor e sincroniza o seu estado entre os dispositivos do usuário, ao passo que o POP3, em sua configuração usual, transfere as mensagens para o cliente local.",a:true,e:"CERTO. O IMAP mantém as mensagens no servidor e sincroniza; o POP3, por padrão, baixa para o cliente local."},
{m:"Informática",id:"Simulado3|114",bloco:"E",tema:"Segurança da informação - phishing",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:114,s:"No que se refere a correio eletrônico, computação em nuvem e segurança da informação, julgue o item: O phishing é técnica que explora exclusivamente falhas do sistema operacional da vítima e dispensa qualquer interação desta com a mensagem recebida.",a:false,e:"ERRADO. Phishing é engenharia social: depende de a vítima interagir (clicar, informar dados) e não explora só falha do sistema."},
{m:"Informática",id:"Simulado3|115",bloco:"E",tema:"Segurança da informação - firewall x antivírus",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:115,s:"No que se refere a correio eletrônico, computação em nuvem e segurança da informação, julgue o item: O firewall examina o conteúdo dos arquivos armazenados no dispositivo em busca de assinaturas de códigos maliciosos, função que o torna equivalente ao antivírus.",a:false,e:"ERRADO. O firewall filtra o tráfego de rede por regras; procurar assinaturas de malware em arquivos é função do antivírus."},
{m:"Informática",id:"Simulado3|116",bloco:"E",tema:"Malware (pragas virtuais) - ransomware",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:116,s:"No que se refere a correio eletrônico, computação em nuvem e segurança da informação, julgue o item: O ransomware caracteriza-se por apagar definitivamente os arquivos da vítima, de modo que a recuperação dos dados é impossível ainda que haja pagamento de resgate.",a:false,e:"ERRADO. O ransomware sequestra os dados (em geral cifrando-os) e exige resgate; não os apaga definitivamente."},
{m:"Informática",id:"Simulado3|117",bloco:"E",tema:"Segurança da informação - autenticação em dois fatores",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:117,s:"No que se refere a correio eletrônico, computação em nuvem e segurança da informação, julgue o item: A autenticação em dois fatores combina obrigatoriamente fatores de naturezas distintas, como algo que o usuário sabe e algo que ele possui, o que reduz o risco decorrente do comprometimento isolado da senha.",a:true,e:"CERTO. A autenticação em dois fatores combina categorias distintas (saber, ter, ser), reduzindo o risco de a senha ser comprometida."},
{m:"Informática",id:"Simulado3|118",bloco:"E",tema:"Backup - incremental",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:118,s:"No que se refere a correio eletrônico, computação em nuvem e segurança da informação, julgue o item: O backup incremental copia todos os arquivos criados ou alterados desde o último backup completo, razão por que cada nova cópia incremental tende a ser maior que a anterior.",a:false,e:"ERRADO. O incremental copia o que mudou desde o ÚLTIMO backup (completo ou incremental); quem copia desde o último completo é o diferencial."},
{m:"Informática",id:"Simulado3|119",bloco:"E",tema:"Navegação e e-mail - sincronização em nuvem",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:119,s:"No que se refere a correio eletrônico, computação em nuvem e segurança da informação, julgue o item: Em serviços de sincronização em nuvem, as alterações efetuadas na cópia local são replicadas no servidor remoto, de modo que a exclusão de um arquivo no dispositivo pode propagar-se aos demais equipamentos vinculados à conta.",a:true,e:"CERTO. Na sincronização em nuvem, alterações e exclusões locais são replicadas ao servidor e aos demais dispositivos da conta."},
{m:"Informática",id:"Simulado3|120",bloco:"E",tema:"Segurança da informação - engenharia social",dif:"media",fonte:"3º Simulado PM-MA  1�7 Potencial Concursos (27/09/2026)",lote:"sim3",fixo3:true,ordem4:120,s:"No que se refere a correio eletrônico, computação em nuvem e segurança da informação, julgue o item: A engenharia social explora a confiança e o comportamento das pessoas para obter informações ou acessos indevidos, podendo prescindir de qualquer falha técnica no sistema atacado.",a:true,e:"CERTO. A engenharia social explora a confiança das pessoas e pode dispensar qualquer falha técnica."},
{m:"Informática",bloco:"E",tema:"Requisitos mínimos Windows 11",dif:"media",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"Os requisitos mínimos de hardware estipulados pela Microsoft para a instalação nativa do Windows 11 visam garantir melhor desempenho e segurança por meio de recursos de hardware dedicados. Nesse sentido, exige-se, entre outros requisitos oficiais, o mínimo de 4 GB de memória RAM e 64 GB de espaço disponível em disco.",a:true,e:"CERTO. Os requisitos mínimos oficiais incluem 4 GB de RAM e 64 GB de armazenamento, além de processador compatível, UEFI com Secure Boot e TPM 2.0."},
{m:"Informática",bloco:"E",tema:"Barra de Tarefas",dif:"media",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"Por padrão de fábrica, a Barra de Tarefas do Windows 11 vem configurada para permanecer fixada obrigatoriamente na extremidade superior da tela, atuando adicionalmente como repositório físico permanente de arquivos temporários eliminados pelo usuário.",a:false,e:"ERRADO. Por padrão, a Barra de Tarefas fica na extremidade inferior (podendo ser reposicionada) e não armazena arquivos excluídos  1�7 essa função é da Lixeira."},
{m:"Informática",bloco:"E",tema:"Restaurar arquivo da Lixeira",dif:"media",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"Caso o usuário decida restaurar um arquivo a partir da Lixeira, o sistema operacional irá movê-lo automaticamente para o diretório 'Meus Documentos', independentemente do caminho de origem onde o arquivo estava salvo.",a:false,e:"ERRADO. Ao restaurar, o Windows devolve o arquivo à pasta original de onde foi excluído, não para 'Meus Documentos'."},
{m:"Informática",bloco:"E",tema:"Exclusão em mídia removível",dif:"media",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"Quando a exclusão de um arquivo é executada em dispositivos de armazenamento removíveis, como pen drives formatados em sistemas compatíveis, o item não é enviado para a Lixeira, ocorrendo eliminação direta e permanente da mídia.",a:true,e:"CERTO. Arquivos excluídos de unidades removíveis normalmente não passam pela Lixeira, sendo apagados direta e permanentemente."},
{m:"Informática",bloco:"E",tema:"Atalho Menu Iniciar",dif:"facil",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"Caso o usuário pretenda abrir o Menu Iniciar sem utilizar a tecla com o logotipo do Windows, ele poderá obter o mesmo resultado pressionando simultaneamente as teclas CTRL + ESC.",a:true,e:"CERTO. CTRL+ESC abre o Menu Iniciar como alternativa à tecla Windows."},
{m:"Informática",bloco:"E",tema:"Gadgets x Widgets",dif:"dificil",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"Os painéis dinâmicos que exibem informações em tempo real no Windows 11 (previsão do tempo, cotações, notícias, calendário) são denominados Gadgets do Sistema, herdando exatamente a mesma nomenclatura e arquitetura de código introduzida no Windows 7.",a:false,e:"ERRADO. No Windows 11 esse recurso é chamado de Widgets, com arquitetura própria; os Gadgets do Windows 7 foram descontinuados por falhas de segurança."},
{m:"Informática",bloco:"E",tema:"Assistente de Foco",dif:"facil",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"O recurso nativo do Windows 11 que permite ao usuário definir regras para o silenciamento ou exibição seletiva de alertas e notificações é denominado Assistente de Foco.",a:true,e:"CERTO. O Assistente de Foco (Focus Assist) permite configurar regras de silenciamento por horário ou atividade."},
{m:"Informática",bloco:"E",tema:"Explorador de Arquivos - modo Detalhes",dif:"facil",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"Ao utilizar o Explorador de Arquivos, o usuário pode selecionar o modo de exibição 'Detalhes', que estrutura os elementos em forma de tabela, com colunas ordenáveis como nome, data de modificação, tipo e tamanho.",a:true,e:"CERTO. O modo 'Detalhes' exibe os arquivos em tabela com colunas ordenáveis."},
{m:"Informática",bloco:"E",tema:"Barra de Título",dif:"facil",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"A estrutura situada na parte superior da janela, responsável por exibir o nome do arquivo em edição e a identificação do programa proprietário, é denominada Barra de Título.",a:true,e:"CERTO. A Barra de Título fica no topo da janela e exibe o nome do arquivo e do programa."},
{m:"Informática",bloco:"E",tema:"Arrastar e soltar - mesma unidade",dif:"dificil",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"Se o usuário arrastar um elemento de uma pasta para outra situada na mesma unidade de disco, o comportamento padrão do sistema será a cópia do arquivo, mantendo o original intacto.",a:false,e:"ERRADO. Na mesma unidade o padrão é MOVER; entre unidades diferentes o padrão é COPIAR."},
{m:"Informática",bloco:"E",tema:"Caracteres proibidos em nomes de arquivo",dif:"facil",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"Entre os caracteres reservados que não podem ser empregados na nomeação de arquivos ou diretórios no Windows 11 inclui-se o ponto de interrogação (?).",a:true,e:"CERTO. Caracteres como \\\\ / : * ? \" < > | são reservados pelo sistema de arquivos."},
{m:"Informática",bloco:"E",tema:"Limpeza de Disco",dif:"media",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"A ferramenta nativa 'Limpeza de Disco' do Windows 11 possui como atribuição primária a análise da desfragmentação física dos setores do disco rígido.",a:false,e:"ERRADO. A 'Limpeza de Disco' exclui arquivos desnecessários para liberar espaço; quem desfragmenta é a ferramenta 'Otimizar e Desfragmentar Unidades'."},
{m:"Informática",bloco:"E",tema:"Otimizar e Desfragmentar Unidades",dif:"media",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"Para mitigar o impacto de desempenho decorrente da dispersão de fragmentos de um arquivo pelo disco, a ferramenta 'Otimizar e Desfragmentar Unidades' reúne esses fragmentos em blocos contínuos.",a:true,e:"CERTO. A desfragmentação reorganiza os fragmentos espalhados em blocos contíguos, reduzindo o tempo de acesso em HDs."},
{m:"Informática",bloco:"E",tema:"Painel de Controle - modos de exibição",dif:"facil",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"No Painel de Controle do Windows 11, a exibição dos itens pode ser configurada nos modos: Categoria, Ícones grandes e Ícones pequenos.",a:true,e:"CERTO. O Painel de Controle oferece essas três opções de exibição."},
{m:"Informática",bloco:"E",tema:"Central de Facilidade de Acesso",dif:"facil",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"A 'Central de Facilidade de Acesso' concentra utilitários de acessibilidade, incluindo Lupa, Teclado Virtual, Narrador e adaptação de contraste da tela.",a:true,e:"CERTO. Reúne recursos como Lupa, Teclado Virtual, Narrador e alto contraste."},
{m:"Informática",bloco:"E",tema:"Microsoft Defender",dif:"media",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"O Microsoft Defender atua de maneira exclusiva na filtragem de tráfego de rede (firewall), sendo desprovido de mecanismos de detecção e remoção de malwares.",a:false,e:"ERRADO. O Defender inclui antivírus com detecção e remoção de vírus, spywares e trojans, além do firewall."},
{m:"Informática",bloco:"E",tema:"BitLocker",dif:"facil",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"O BitLocker é ferramenta nativa do Windows 11 capaz de realizar a criptografia completa do volume de disco onde o sistema e os dados estão armazenados.",a:true,e:"CERTO. O BitLocker criptografa volumes inteiros contra acesso não autorizado."},
{m:"Informática",bloco:"E",tema:"Sistema de arquivos NTFS",dif:"media",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"O NTFS, padrão em instalações modernas do Windows 11, incorpora suporte a listas de controle de acesso (ACLs), auditoria, diário de transações (journaling) e criptografia individual via EFS.",a:true,e:"CERTO. O NTFS oferece ACLs, auditoria, journaling e criptografia via EFS."},
{m:"Informática",bloco:"E",tema:"Atalho Windows + I",dif:"media",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"O atalho de teclado Windows + I executa o acionamento direto do Explorador de Arquivos.",a:false,e:"ERRADO. Windows + I abre as Configurações; o Explorador de Arquivos é aberto por Windows + E."},
{m:"Informática",bloco:"E",tema:"Atalho nova pasta",dif:"facil",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"A criação de uma nova pasta pode ser realizada instantaneamente por meio do atalho CTRL + SHIFT + N.",a:true,e:"CERTO. CTRL+SHIFT+N cria uma nova pasta no diretório atual."},
{m:"Informática",bloco:"E",tema:"Snap Layouts",dif:"media",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"O recurso Snap Layouts é ativado, por meio do mouse, ao posicionar o cursor sobre o botão 'Maximizar' de uma janela compatível.",a:true,e:"CERTO. Ao pairar o mouse sobre o botão Maximizar, o Windows 11 exibe as opções de Snap Layouts."},
{m:"Informática",bloco:"E",tema:"Área de Transferência (Win+V)",dif:"media",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"O acesso ao histórico da Área de Transferência avançada, que armazena múltiplos itens copiados, é realizado pelo atalho Windows + V.",a:true,e:"CERTO. Windows + V abre o histórico da Área de Transferência."},
{m:"Informática",bloco:"E",tema:"Ferramenta de Captura (Win+Shift+S)",dif:"facil",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"A combinação Windows + Shift + S ativa a ferramenta de captura, permitindo selecionar e recortar uma região da tela.",a:true,e:"CERTO. Esse atalho aciona a ferramenta de recorte de tela."},
{m:"Informática",bloco:"E",tema:"Menu de Links Rápidos (Win+X)",dif:"media",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"O Menu de Links Rápidos, com atalhos para o Gerenciamento de Disco e o Gerenciador de Dispositivos, é invocado pela combinação Windows + X.",a:true,e:"CERTO. Windows + X abre o menu com acesso a ferramentas administrativas."},
{m:"Informática",bloco:"E",tema:"Áreas de Trabalho Virtuais (Win+Tab)",dif:"media",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"A interface de gerenciamento de Múltiplas Áreas de Trabalho Virtuais (Visão de Tarefas) pode ser acessada pelo atalho Windows + Tab.",a:true,e:"CERTO. Windows + Tab abre a Visão de Tarefas para gerenciar áreas de trabalho virtuais."},
{m:"Informática",bloco:"E",tema:"Gerenciador de Tarefas (Ctrl+Shift+Esc)",dif:"facil",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"O Gerenciador de Tarefas pode ser chamado diretamente, sem tela intermediária, pelo atalho CTRL + SHIFT + ESC.",a:true,e:"CERTO. Diferente de CTRL+ALT+DEL, o CTRL+SHIFT+ESC abre o Gerenciador de Tarefas diretamente."},
{m:"Informática",bloco:"E",tema:"Abas no Explorador de Arquivos",dif:"media",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"A partir do Windows 11, o Explorador de Arquivos passou a oferecer suporte à navegação por abas, permitindo abrir múltiplos diretórios em uma única janela.",a:true,e:"CERTO. Uma atualização do Windows 11 (2022) adicionou suporte a abas no Explorador de Arquivos."},
{m:"Informática",bloco:"E",tema:"Win+A x Central de Notificações",dif:"dificil",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"No Windows 11, Windows + A é utilizada para abrir a central de Notificações e o Calendário, enquanto as Configurações Rápidas são acionadas exclusivamente pelo mouse.",a:false,e:"ERRADO. É o inverso: Windows + A abre as Configurações Rápidas; Notificações/Calendário abrem por Windows + N ou clique na data/hora."},
{m:"Informática",bloco:"E",tema:"Windows Hello",dif:"facil",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"O Windows Hello provê autenticação biométrica segura (reconhecimento facial, digital ou PIN), dispensando a digitação de senha tradicional.",a:true,e:"CERTO. O Windows Hello permite login por biometria ou PIN, sem precisar digitar a senha."},
{m:"Informática",bloco:"E",tema:"Alinhamento da Barra de Tarefas",dif:"media",fonte:"Simulado Informática PM Maranhão - Prof. Joelson Cei (25/09/26)",s:"Por padrão de instalação, o botão do Menu Iniciar e os ícones fixados na Barra de Tarefas vêm alinhados no canto inferior esquerdo da tela.",a:false,e:"ERRADO. Por padrão, o Windows 11 centraliza o botão Iniciar e os ícones; o alinhamento à esquerda pode ser restaurado manualmente."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - equivalência de expressões",dif:"facil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Para os efeitos do Estatuto, as expressões 'Polícia Militar do Estado do Maranhão', 'Polícia Militar do Estado', 'Polícia Militar Estadual', 'Polícia Militar do Maranhão', 'Instituição Policial Militar', 'Instituição Militar Estadual' e 'Organização Policial-Militar' são consideradas equivalentes.",a:true,e:"CERTO. O Estatuto trata essas expressões como sinônimas para seus efeitos."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - situações da ativa",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"As expressões 'na ativa', 'da ativa', 'em serviço ativo', 'em serviço na ativa' e 'em atividade ou em atividade policial militar' possuem significados jurídicos distintos no Estatuto, sendo vedada a sua equivalência no desempenho de cargo ou comissão.",a:false,e:"ERRADO. Essas expressões são consideradas equivalentes pelo Estatuto, e não distintas."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - nomenclaturas da ativa",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"As nomenclaturas 'na ativa', 'da ativa', 'em serviço ativo', 'em serviço na ativa' e 'em atividade' são conferidas aos policiais militares que estejam no efetivo desempenho de cargo, comissão, encargos, incumbência ou missão.",a:true,e:"CERTO. É exatamente essa a definição dada pelo Estatuto a essas nomenclaturas."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - honra pessoal e devido processo",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Os atos que afetem a honra pessoal, o pundonor militar e o decoro da classe, referentes aos conceitos profissional e moral do policial militar, devem estar devidamente comprovados mediante o devido processo legal.",a:true,e:"CERTO. A aferição desses conceitos exige devido processo legal, e não mera constatação sumária."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - dispensa do devido processo legal",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Por expressa previsão estatutária, a aferição de atos que atinjam o decoro da classe e a honra pessoal do militar prescinde da instauração do devido processo legal, bastando a constatação sumária da autoridade de comando.",a:false,e:"ERRADO. O Estatuto exige o devido processo legal para a aferição desses conceitos, não bastando constatação sumária."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - Comissão de Promoção de Praças",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A apreciação dos conceitos profissional e moral do policial militar cabe à Comissão de Promoção de Praças PM, mediante o exame da documentação e demais informações recebidas.",a:true,e:"CERTO. Compete a essa Comissão apreciar tais conceitos com base na documentação do militar."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - CEGESP e CAS (antiguidade)",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Na seleção para o CEGESP e para o CAS, a escolha entre os candidatos inscritos e julgados aptos nos exames de saúde e aptidão física recairá sobre os mais antigos na escala hierárquica.",a:true,e:"CERTO. Entre aptos, prevalece o critério de antiguidade na escala hierárquica."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - convocação para CAS",dif:"dificil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Nos exames de seleção para o CAS, a convocação dos candidatos aptos dá-se exclusivamente pelo critério de merecimento intelectual obtido em concurso interno, sem interferência da antiguidade na escala hierárquica.",a:false,e:"ERRADO. A convocação para o CAS, em regra, observa a antiguidade na escala hierárquica entre os aptos, e não apenas o merecimento."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - dependentes do militar",dif:"facil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Os dependentes do policial militar do Maranhão são definidos pela legislação específica do Sistema de Previdência do Estado.",a:true,e:"CERTO. A definição de dependentes remete à legislação previdenciária específica do Estado."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - servidores militares da ativa",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Os servidores públicos militares na ativa compreendem os militares de carreira, os incluídos voluntariamente durante o tempo do compromisso, os componentes da reserva remunerada quando convocados e os alunos dos cursos de formação.",a:true,e:"CERTO. É essa a composição estatutária dos militares na ativa."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - reformados e nova convocação",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Os policiais militares reformados encontram-se na situação de inatividade e permanecem permanentemente sujeitos a nova convocação compulsória para o serviço ativo.",a:false,e:"ERRADO. O militar reformado, em regra, não pode ser convocado compulsoriamente de volta ao serviço ativo."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - início da carreira policial-militar",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A carreira policial-militar é privativa do pessoal da ativa e inicia-se no momento da promoção ao primeiro posto de Oficial.",a:false,e:"ERRADO. A carreira tem início no momento do ingresso na corporação, e não apenas na promoção a Oficial."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - carreira de Oficial e nacionalidade",dif:"facil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Por expressa previsão estatutária, é privativa de brasileiro nato a carreira de Oficial da Polícia Militar do Maranhão.",a:true,e:"CERTO. A carreira de Oficial é privativa de brasileiro nato."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - convocação da reserva remunerada",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"É facultada a convocação de policiais militares da reserva remunerada para o serviço ativo, em caráter transitório, mediante aceitação voluntária e proposta do Comandante-Geral.",a:true,e:"CERTO. Trata-se de convocação facultativa, transitória e voluntária, formalizada por decreto governamental mediante proposta do Comandante-Geral."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - nacionalidade no quadro de praças",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O ingresso no quadro de praças da PMMA exige obrigatoriamente a nacionalidade brasileira nata para todos os candidatos.",a:false,e:"ERRADO. A exigência de nacionalidade nata é restrita à carreira de Oficial; praças podem ser brasileiros natos ou naturalizados."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - Círculos Hierárquicos",dif:"facil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Os Círculos Hierárquicos são âmbitos de convivência entre policiais militares da mesma categoria e destinam-se a desenvolver o espírito de camaradagem em ambiente de estima e confiança.",a:true,e:"CERTO. É essa a finalidade estatutária dos Círculos Hierárquicos."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - posto x graduação",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O posto é o grau hierárquico da Praça, concedido por ato do Comandante-Geral da PMMA.",a:false,e:"ERRADO. O posto é o grau hierárquico do Oficial (conferido por Carta Patente); a Praça possui graduação."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - graduação x carta patente",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A graduação é o grau hierárquico do Oficial, conferido por Carta Patente expedida pelo Governador do Estado.",a:false,e:"ERRADO. A graduação é o grau hierárquico da Praça; o Oficial possui posto, conferido por Carta Patente."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - Aspirantes e Cadetes",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Os Aspirantes a Oficial e os Cadetes são classificados estatutariamente na categoria de Praças Especiais.",a:true,e:"CERTO. Aspirantes e Cadetes integram a categoria de Praças Especiais."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - antiguidade no posto",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A antiguidade em cada posto ou graduação é regulada precipuamente pela data da promoção ou nomeação correspondente.",a:true,e:"CERTO. A data de promoção/nomeação é o critério primordial de antiguidade."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - precedência por sorteio",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Em caso de igualdade de antiguidade entre oficiais de mesmo posto, a precedência é decidida exclusivamente por sorteio em sessão pública do Comando-Geral.",a:false,e:"ERRADO. Existem critérios estatutários específicos de desempate (não apenas sorteio) para definir a precedência."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - alunos de cursos de formação",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Os alunos dos cursos de formação de praças têm precedência hierárquica automática sobre todas as praças já formadas da corporação.",a:false,e:"ERRADO. Alunos em formação não têm precedência automática sobre praças já formadas."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - cargo policial-militar",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Cargo policial-militar é aquele que só pode ser provido e exercido por policial militar em serviço ativo.",a:true,e:"CERTO. É essa a definição estatutária de cargo policial-militar."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - deveres policiais-militares",dif:"facil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"As obrigações que decorrem da responsabilidade do cargo policial-militar são denominadas deveres policiais-militares.",a:true,e:"CERTO. É essa a definição de deveres policiais-militares no Estatuto."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - manifestações do valor militar",dif:"facil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"São manifestações essenciais do valor militar o civismo, o patriotismo, a fé na missão policial e o aprimoramento técnico-profissional contínuo.",a:true,e:"CERTO. Esses são elementos do valor militar previstos no Estatuto."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - dever, pundonor e decoro",dif:"facil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O sentimento do dever, o pundonor militar e o decoro da classe impõem a cada integrante da PMMA conduta moral e profissional ilibada (exemplar).",a:true,e:"CERTO. É essa a exigência estatutária de conduta ilibada."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - manifestação coletiva vedada",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"É permitido aos policiais militares da ativa manifestarem-se coletivamente sobre atos de superiores, desde que a manifestação seja de caráter estritamente reivindicatório ou político.",a:false,e:"ERRADO. É vedada a manifestação coletiva de caráter reivindicatório ou político por militares da ativa."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - vedação à gerência comercial",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O policial militar em serviço ativo pode tomar parte na administração ou gerência de sociedade comercial privada ou dela ser sócio gerente.",a:false,e:"ERRADO. É vedado ao militar da ativa exercer gerência ou administração de sociedade comercial."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - vedação absoluta à gerência",dif:"dificil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A vedação estatutária ao exercício de gerência comercial na ativa é absoluta, não admitindo exceção nem autorização administrativa temporária.",a:true,e:"CERTO. Trata-se de vedação absoluta, sem exceções, no Estatuto."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - estabilidade e perda do cargo",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"As praças com estabilidade assegurada só perderão o cargo em virtude de sentença judicial transitada em julgado ou por processo administrativo disciplinar em que lhe seja assegurada ampla defesa.",a:true,e:"CERTO. A perda do cargo de praça estável exige sentença judicial transitada em julgado ou PAD com ampla defesa."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - LTIP a qualquer tempo",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A licença para tratar de interesse particular (LTIP) pode ser concedida ao policial militar a qualquer tempo, independente de seu tempo de serviço ativo.",a:false,e:"ERRADO. A LTIP normalmente exige tempo mínimo de serviço para ser concedida, não podendo ser a qualquer tempo."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - LTIP e remuneração",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A licença para tratar de interesse particular é concedida com a manutenção integral da remuneração e das vantagens do cargo.",a:false,e:"ERRADO. A LTIP é concedida sem remuneração, pois o militar se afasta do serviço por interesse próprio."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - licença saúde em família (prazo)",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O tempo máximo de duração da licença para tratamento de saúde em pessoa da família do policial militar é de até 6 (seis) meses.",a:true,e:"CERTO. O prazo máximo dessa licença é de 6 meses."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - licença saúde em família (remuneração)",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Na licença para tratamento de saúde em pessoa da família, o militar percebe remuneração integral nos primeiros 3 meses, sofrendo desconto de um terço se o afastamento for superior a esse período.",a:true,e:"CERTO. Há remuneração integral nos primeiros 3 meses e desconto de 1/3 no excedente."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - adicional por tempo de serviço",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O adicional por tempo de serviço (quinquênio) é devido à razão de 5% a cada cinco anos de efetivo serviço público, até o limite máximo de 35%.",a:true,e:"CERTO. O quinquênio é de 5% a cada 5 anos, com teto de 35%."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - início do quinquênio",dif:"facil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O policial militar faz jus ao adicional por tempo de serviço a partir do mês em que completar o respectivo quinquênio.",a:true,e:"CERTO. O direito ao adicional surge no mês da conclusão do quinquênio."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - promoção por bravura",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A promoção por bravura independe da existência de vaga no quadro de efetivo e resulta de ato de excepcional coragem no cumprimento do dever, ficando o promovido como excedente no quadro.",a:true,e:"CERTO. A promoção por bravura ocorre mesmo sem vaga, gerando excedente temporário no quadro."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - promoção post mortem",dif:"facil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A promoção post mortem destina-se a homenagear o militar falecido em consequência do cumprimento do dever ou de acidente em serviço.",a:true,e:"CERTO. É essa a finalidade da promoção post mortem."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - porte de arma na reserva a pedido",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O militar transferido para a reserva remunerada a pedido mantém o direito ao porte de arma de fogo na inatividade, salvas as restrições judiciais ou de saúde.",a:true,e:"CERTO. O direito ao porte é mantido na inatividade, ressalvadas restrições legais."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - Carta Patente",dif:"facil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"É garantida aos oficiais da PMMA a expedição de Carta Patente, documento oficial que formaliza seus postos, títulos e prerrogativas.",a:true,e:"CERTO. A Carta Patente formaliza o posto do oficial."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - agregação",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A agregação é a situação na qual o policial militar da ativa deixa de ocupar vaga na escala hierárquica do seu quadro, nela permanecendo sem número.",a:true,e:"CERTO. É essa a definição estatutária de agregação."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - agregação por incapacidade temporária",dif:"dificil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O militar será agregado quando for afastado temporariamente do serviço ativo por ter sido julgado incapaz temporariamente, após 2 anos contínuos de tratamento de saúde.",a:true,e:"CERTO. A agregação por incapacidade temporária ocorre após período contínuo de tratamento (regra geral de 2 anos), e não apenas 1 ano."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - militar agregado e promoção",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O policial militar agregado fica impedido de ser promovido por qualquer critério durante todo o período em que permanecer na agregação.",a:false,e:"ERRADO. A agregação por motivo de saúde não impede necessariamente a promoção, pois o agregado não ocupa vaga no quadro."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - reversão do agregado",dif:"facil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A reversão é o ato pelo qual o policial militar agregado retorna ao respectivo quadro tão logo cesse o motivo que determinou a sua agregação.",a:true,e:"CERTO. É essa a definição estatutária de reversão."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - reforma ex officio",dif:"facil",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"A reforma do policial militar é efetuada ex officio por incapacidade definitiva para o serviço ativo ou por ter atingido a idade limite.",a:true,e:"CERTO. São essas as hipóteses típicas de reforma ex officio."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - proventos por ferimento em serviço",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"O policial militar reformado por incapacidade definitiva em decorrência de ferimento recebido em serviço perceberá proventos integrais correspondentes à sua graduação ou posto.",a:true,e:"CERTO. Nesse caso os proventos são integrais."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto - computação concomitante de tempo",dif:"media",fonte:"Simulado Legislação PMMA - Prof. Gilson Ferreira (17/09/26)",s:"Na contagem dos anos de serviço para inatividade, admite-se a computação concomitante de tempo de serviço prestado simultaneamente a dois órgãos públicos diferentes.",a:false,e:"ERRADO. Não se admite a contagem concomitante de tempo de serviço em dois órgãos públicos diferentes para o mesmo período."},
