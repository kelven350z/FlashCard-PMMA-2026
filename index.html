{m:"Português",bloco:"G",tema:"Conjunções concessivas",dif:"media",fixo:true,ordem:1,s:"Texto: “A atuação da polícia ostensiva no espaço urbano contemporâneo não se resume à repressão de delitos. Cada vez mais, exige-se do agente de segurança pública uma postura preventiva, pautada pela mediação de conflitos e pela aproximação com a comunidade. Embora parte da população ainda reduza o trabalho policial ao confronto, a rotina das corporações revela um cotidiano em que orientar, fiscalizar e acolher pesam tanto quanto intervir. Por isso, a formação do policial moderno privilegia competências que ultrapassam o vigor físico: exige-se dele discernimento, equilíbrio emocional e domínio das normas que regem sua conduta. 1�7 Com base no texto, julgue: a conjunção ‘Embora 1�7, que inicia o terceiro período, introduz oração subordinada adverbial concessiva, estabelecendo contraste entre a percepção de parte da população acerca do trabalho policial e a realidade cotidiana descrita para as corporações.",a:true,e:"CERTO. ‘Embora 1�7 é conjunção concessiva clássica, introduzindo ideia que contrasta com a informação da oração principal (percepção da população x rotina real das corporações)."},
{m:"Português",bloco:"G",tema:"Conjunções causais x conclusivas",dif:"dificil",fixo:true,ordem:2,s:"Texto: “A atuação da polícia ostensiva no espaço urbano contemporâneo não se resume à repressão de delitos. Cada vez mais, exige-se do agente de segurança pública uma postura preventiva, pautada pela mediação de conflitos e pela aproximação com a comunidade. Embora parte da população ainda reduza o trabalho policial ao confronto, a rotina das corporações revela um cotidiano em que orientar, fiscalizar e acolher pesam tanto quanto intervir. Por isso, a formação do policial moderno privilegia competências que ultrapassam o vigor físico: exige-se dele discernimento, equilíbrio emocional e domínio das normas que regem sua conduta. 1�7 Com base no texto, julgue: a substituição da expressão ‘Por isso 1�7, no início do último período, pela conjunção ‘Porquanto 1�7 preservaria a correção gramatical e a relação lógica de causa e consequência estabelecida no texto.",a:false,e:"ERRADO. ‘Por isso 1�7 é conclusiva (introduz consequência); ‘porquanto 1�7 é causal (equivale a ‘porque 1�7). A troca inverteria a relação lógica, e não apenas a preservaria."},
{m:"Português",bloco:"G",tema:"Concordância verbal com infinitivos",dif:"media",fixo:true,ordem:3,s:"Texto: “A atuação da polícia ostensiva no espaço urbano contemporâneo não se resume à repressão de delitos. Cada vez mais, exige-se do agente de segurança pública uma postura preventiva, pautada pela mediação de conflitos e pela aproximação com a comunidade. Embora parte da população ainda reduza o trabalho policial ao confronto, a rotina das corporações revela um cotidiano em que orientar, fiscalizar e acolher pesam tanto quanto intervir. Por isso, a formação do policial moderno privilegia competências que ultrapassam o vigor físico: exige-se dele discernimento, equilíbrio emocional e domínio das normas que regem sua conduta. 1�7 Com base no texto, julgue: no trecho ‘orientar, fiscalizar e acolher pesam tanto quanto intervir 1�7, os vocábulos ‘orientar 1�7, ‘fiscalizar 1�7 e ‘acolher 1�7 constituem, em conjunto, o sujeito da forma verbal ‘pesam 1�7, o que justifica a flexão do verbo no plural.",a:true,e:"CERTO. Os três infinitivos substantivados formam sujeito composto, o que exige a concordância do verbo ‘pesar 1�7 no plural."},
{m:"Português",bloco:"G",tema:"Interpretação textual",dif:"media",fixo:true,ordem:4,s:"Texto: “A atuação da polícia ostensiva no espaço urbano contemporâneo não se resume à repressão de delitos. Cada vez mais, exige-se do agente de segurança pública uma postura preventiva, pautada pela mediação de conflitos e pela aproximação com a comunidade. Embora parte da população ainda reduza o trabalho policial ao confronto, a rotina das corporações revela um cotidiano em que orientar, fiscalizar e acolher pesam tanto quanto intervir. Por isso, a formação do policial moderno privilegia competências que ultrapassam o vigor físico: exige-se dele discernimento, equilíbrio emocional e domínio das normas que regem sua conduta. 1�7 Com base no texto, julgue: depreende-se do texto que a repressão de delitos deixou de integrar as atribuições da polícia ostensiva, tendo sido inteiramente substituída pela mediação de conflitos e pela aproximação com a comunidade.",a:false,e:"ERRADO. O texto afirma que a atuação policial ‘não se resume 1�7 à repressão, e que orientar/fiscalizar/acolher pesam ‘tanto quanto 1�7 intervir  1�7 ou seja, a repressão continua presente, apenas dividindo espaço com outras funções."},
{m:"Português",bloco:"G",tema:"Classe gramatical do ‘que 1�7",dif:"dificil",fixo:true,ordem:5,s:"Texto: “A atuação da polícia ostensiva no espaço urbano contemporâneo não se resume à repressão de delitos. Cada vez mais, exige-se do agente de segurança pública uma postura preventiva, pautada pela mediação de conflitos e pela aproximação com a comunidade. Embora parte da população ainda reduza o trabalho policial ao confronto, a rotina das corporações revela um cotidiano em que orientar, fiscalizar e acolher pesam tanto quanto intervir. Por isso, a formação do policial moderno privilegia competências que ultrapassam o vigor físico: exige-se dele discernimento, equilíbrio emocional e domínio das normas que regem sua conduta. 1�7 Com base no texto, julgue: no segmento ‘competências que ultrapassam o vigor físico 1�7, o vocábulo ‘que 1�7 classifica-se como conjunção integrante, uma vez que introduz oração subordinada substantiva completiva do nome ‘competências 1�7.",a:false,e:"ERRADO. Nesse trecho, ‘que 1�7 retoma o antecedente ‘competências 1�7 e introduz oração subordinada adjetiva (restritiva); trata-se, portanto, de pronome relativo, não de conjunção integrante (que introduziria oração substantiva)."},
{m:"Português",bloco:"G",tema:"Vozes verbais",dif:"dificil",fixo:true,ordem:6,s:"Texto: “A atuação da polícia ostensiva no espaço urbano contemporâneo não se resume à repressão de delitos. Cada vez mais, exige-se do agente de segurança pública uma postura preventiva, pautada pela mediação de conflitos e pela aproximação com a comunidade. Embora parte da população ainda reduza o trabalho policial ao confronto, a rotina das corporações revela um cotidiano em que orientar, fiscalizar e acolher pesam tanto quanto intervir. Por isso, a formação do policial moderno privilegia competências que ultrapassam o vigor físico: exige-se dele discernimento, equilíbrio emocional e domínio das normas que regem sua conduta. 1�7 Com base no texto, julgue: a forma verbal ‘exige-se 1�7, empregada no texto, encontra-se na voz passiva sintética, admitindo a transposição para a voz passiva analítica sem prejuízo do sentido, como em ‘são exigidos discernimento, equilíbrio emocional e domínio das normas 1�7.",a:true,e:"CERTO. ‘Exige-se 1�7 + substantivo(s) que sofrem a ação caracteriza voz passiva sintética (‘se 1�7 apassivador); a transposição para ‘são exigidos... 1�7 mantém o sentido, concordando com o sujeito composto."},
{m:"Português",bloco:"G",tema:"Orações subordinadas temporais",dif:"media",fixo:true,ordem:7,s:"Texto: “A prevenção, mais do que a resposta imediata, constitui a essência de uma segurança pública eficaz. De nada adianta um efetivo bem treinado se a sociedade desconhece condutas básicas de autoproteção e se as políticas públicas não atacam as causas estruturais da violência. Investir em educação e em cidadania, portanto, é combater o crime antes mesmo que ele se concretize. 1�7 Com base no texto, julgue: a oração ‘antes mesmo que ele se concretize 1�7 exprime circunstância de tempo em relação à oração a que se subordina, sendo introduzida por locução conjuntiva de valor temporal.",a:true,e:"CERTO. ‘Antes que 1�7 é locução conjuntiva subordinativa temporal, indicando anterioridade em relação ao fato da oração principal."},
{m:"Português",bloco:"G",tema:"Função sintática de advérbios",dif:"dificil",fixo:true,ordem:8,s:"Texto: “A prevenção, mais do que a resposta imediata, constitui a essência de uma segurança pública eficaz. De nada adianta um efetivo bem treinado se a sociedade desconhece condutas básicas de autoproteção e se as políticas públicas não atacam as causas estruturais da violência. Investir em educação e em cidadania, portanto, é combater o crime antes mesmo que ele se concretize. 1�7 Com base no texto, julgue: no período ‘De nada adianta um efetivo bem treinado 1�7, a expressão ‘De nada 1�7, por estar anteposta ao verbo, exerce a função sintática de sujeito da forma verbal ‘adianta 1�7.",a:false,e:"ERRADO. ‘De nada 1�7 é adjunto adverbial (de intensidade/negação); o sujeito de ‘adianta 1�7 é ‘um efetivo bem treinado 1�7."},
{m:"Português",bloco:"G",tema:"Concordância nominal",dif:"facil",fixo:true,ordem:9,s:"Texto: “A prevenção, mais do que a resposta imediata, constitui a essência de uma segurança pública eficaz. De nada adianta um efetivo bem treinado se a sociedade desconhece condutas básicas de autoproteção e se as políticas públicas não atacam as causas estruturais da violência. Investir em educação e em cidadania, portanto, é combater o crime antes mesmo que ele se concretize. 1�7 Com base no texto, julgue: no trecho ‘as políticas públicas não atacam as causas estruturais da violência 1�7, o vocábulo ‘estruturais 1�7 é um adjetivo que se flexiona no plural para concordar com o substantivo ‘causas 1�7.",a:true,e:"CERTO. ‘Estruturais 1�7 concorda em número com ‘causas 1�7 (substantivo feminino plural); o adjetivo é de dois gêneros, variando apenas em número."},
{m:"Português",bloco:"G",tema:"Verbo ‘fazer 1�7 indicando tempo",dif:"media",fixo:true,ordem:10,s:"Na frase ‘Fazem três anos que o soldado ingressou na corporação 1�7, julgue: o verbo ‘fazer 1�7, por indicar tempo decorrido, deve ser flexionado no plural para concordar com a expressão ‘três anos 1�7.",a:false,e:"ERRADO. Indicando tempo decorrido, ‘fazer 1�7 é impessoal e permanece sempre na 3ª pessoa do singular: o correto é ‘Faz três anos... 1�7."},
{m:"Português",bloco:"G",tema:"Índice de indeterminação do sujeito",dif:"dificil",fixo:true,ordem:11,s:"Na oração ‘Trata-se de medidas administrativas rigorosas 1�7, julgue: a partícula ‘se 1�7 funciona como índice de indeterminação do sujeito, razão pela qual a forma verbal permanece na terceira pessoa do singular.",a:true,e:"CERTO. Em ‘tratar-se de 1�7, o verbo é usado de forma intransitiva seguido de preposição, o que caracteriza ‘se 1�7 como índice de indeterminação do sujeito (IIS); por isso o verbo fica sempre no singular."},
{m:"Português",bloco:"G",tema:"Pronome apassivador e próclise",dif:"dificil",fixo:true,ordem:12,s:"Em ‘Não se conhecem todas as consequências do episódio 1�7, julgue: a próclise é obrigatória em virtude do advérbio de negação ‘Não 1�7, que atua como fator de atração do pronome átono, ao passo que a partícula ‘se 1�7 funciona como pronome apassivador, o que impõe a concordância do verbo com ‘todas as consequências 1�7.",a:true,e:"CERTO. ‘Não 1�7 é palavra atrativa que exige próclise; e como ‘se 1�7 é apassivador (voz passiva sintética), o verbo concorda com o sujeito paciente ‘todas as consequências 1�7 (daí o plural ‘conhecem-se 1�7)."},
{m:"História do Brasil",bloco:"G",tema:"Política dos governadores",dif:"media",fixo:true,ordem:13,s:"Durante a Primeira República (1889 1�71930), a denominada ‘política dos governadores 1�7, articulada no governo de Campos Sales, consistiu em um acordo de sustentação mútua entre o poder central e as oligarquias estaduais, tendo por instrumento eleitoral o voto secreto, que assegurava a lisura dos pleitos e neutralizava a influência dos coronéis.",a:false,e:"ERRADO. O instrumento eleitoral da época era o voto ABERTO (a descoberto), o que favorecia fraudes e o voto de cabresto controlado pelos coronéis; o voto secreto só foi instituído pelo Código Eleitoral de 1932."},
{m:"História do Brasil",bloco:"G",tema:"Convênio de Taubaté",dif:"dificil",fixo:true,ordem:14,s:"A política de valorização do café, consolidada no Convênio de Taubaté, de 1906, previa a intervenção do governo federal na aquisição dos excedentes da produção para sustentar os preços no mercado externo, mecanismo que transferia à coletividade o ônus das crises de superprodução.",a:false,e:"ERRADO. O Convênio de Taubaté foi um acordo firmado pelos governos ESTADUAIS de São Paulo, Minas Gerais e Rio de Janeiro (não pelo governo federal, inicialmente reticente) para comprar os excedentes de café."},
{m:"História do Brasil",bloco:"G",tema:"Revolução de 1930",dif:"facil",fixo:true,ordem:15,s:"A Revolução de 1930 rompeu a hegemonia política das oligarquias cafeeiras e conduziu Getúlio Vargas ao poder, inaugurando um período de centralização política e de crescente intervenção do Estado na economia e nas relações de trabalho.",a:true,e:"CERTO. A Revolução de 1930 encerrou a República Velha e deu início à Era Vargas, marcada por forte centralização e intervencionismo estatal."},
{m:"História do Brasil",bloco:"G",tema:"Estado Novo",dif:"media",fixo:true,ordem:16,s:"O Estado Novo (1937 1�71945), instaurado por Getúlio Vargas e fundamentado na Constituição de 1937, caracterizou-se pelo fechamento do Congresso Nacional e pela censura à imprensa, mas manteve a realização periódica de eleições diretas para a Presidência da República.",a:false,e:"ERRADO. O Estado Novo foi uma ditadura que suspendeu as eleições; não houve eleições diretas para presidente durante todo o período (1937-1945)."},
{m:"História do Brasil",bloco:"G",tema:"Plano de Metas (JK)",dif:"facil",fixo:true,ordem:17,s:"O Plano de Metas do governo Juscelino Kubitschek (1956 1�71961), sintetizado no lema ‘cinquenta anos em cinco 1�7, priorizou os setores de energia, transporte e indústria de base, tendo como obra-símbolo a construção de Brasília.",a:true,e:"CERTO. O Plano de Metas de JK abrangia energia, transportes e indústria de base, culminando na construção da nova capital, Brasília, inaugurada em 1960."},
{m:"História do Brasil",bloco:"G",tema:"Ditadura militar - AI-5",dif:"media",fixo:true,ordem:18,s:"Após o golpe civil-militar de 1964, os governos militares editaram diversos atos institucionais, e a Constituição de 1946 só foi formalmente substituída em 1967; nesse contexto, o Ato Institucional nº 5, de 1968, restabeleceu as garantias constitucionais e devolveu ao Congresso Nacional a plenitude de suas atribuições.",a:false,e:"ERRADO. O AI-5 fez exatamente o oposto: suspendeu garantias constitucionais (como o habeas corpus para crimes políticos), permitiu o fechamento do Congresso Nacional e ampliou os poderes do Executivo."},
{m:"História do Brasil",bloco:"G",tema:"Constituição de 1988",dif:"facil",fixo:true,ordem:19,s:"A promulgação da Constituição de 1988, resultante dos trabalhos da Assembleia Nacional Constituinte instalada em 1987, consolidou o processo de redemocratização e ampliou significativamente o rol de direitos e garantias fundamentais.",a:true,e:"CERTO. Conhecida como ‘Constituição Cidadã 1�7, a Carta de 1988 marcou a redemocratização do país e ampliou substancialmente os direitos e garantias fundamentais."},
{m:"História do Brasil",bloco:"G",tema:"Trabalho indígena e africano",dif:"media",fixo:true,ordem:20,s:"A contribuição dos povos indígenas e dos africanos escravizados foi decisiva na formação econômica, social e cultural do Brasil, embora, no período colonial, o trabalho compulsório desses grupos tenha sido elemento estruturante do sistema produtivo.",a:true,e:"CERTO. É consenso historiográfico que a mão de obra indígena e, principalmente, africana escravizada foi central na economia colonial, com legado profundo na formação social e cultural do país."},
{m:"História do Maranhão",bloco:"G",tema:"Fundação de São Luís",dif:"facil",fixo:true,ordem:21,s:"A cidade de São Luís foi fundada em 1612 por expedição francesa chefiada por Daniel de La Touche, senhor de La Ravardière, no contexto do projeto da França Equinocial, e o seu nome homenageia o rei Luís XIII da França.",a:true,e:"CERTO. São Luís é a única capital brasileira fundada por franceses (1612), no contexto da França Equinocial, e recebeu esse nome em homenagem a Luís XIII."},
{m:"História do Maranhão",bloco:"G",tema:"Expulsão dos franceses",dif:"media",fixo:true,ordem:22,s:"A presença francesa no Maranhão foi encerrada com a vitória das forças luso-brasileiras e a consequente rendição dos franceses, tendo Jerônimo de Albuquerque desempenhado papel de destaque no comando das tropas portuguesas.",a:true,e:"CERTO. Jerônimo de Albuquerque liderou as forças que expulsaram os franceses do Maranhão, consolidando o domínio português na região a partir de 1615."},
{m:"História do Maranhão",bloco:"G",tema:"Estado do Maranhão colonial",dif:"dificil",fixo:true,ordem:23,s:"Durante o domínio filipino, o Maranhão foi incorporado ao Estado do Brasil, com sede em Salvador, do qual não chegou a se desmembrar administrativamente em nenhum momento do período colonial.",a:false,e:"ERRADO. Em 1621 foi criado o Estado do Maranhão (depois Grão-Pará e Maranhão), administrativamente autônomo e subordinado diretamente a Lisboa, separado do Estado do Brasil."},
{m:"História do Maranhão",bloco:"G",tema:"Companhia de Comércio",dif:"media",fixo:true,ordem:24,s:"A Companhia Geral do Comércio do Grão-Pará e Maranhão, instituída no período pombalino, no século XVIII, dinamizou a economia regional e favoreceu a expansão das lavouras de algodão e de arroz, com forte incremento do tráfico de escravizados africanos para a região.",a:true,e:"CERTO. Criada em 1755 por Pombal, a Companhia impulsionou o algodão e o arroz maranhenses e ampliou significativamente a introdução de africanos escravizados na região."},
{m:"História do Maranhão",bloco:"G",tema:"Revolta de Beckman",dif:"dificil",fixo:true,ordem:25,s:"A Revolta de Beckman, ocorrida em São Luís em 1684, foi motivada, entre outros fatores, pelo monopólio comercial da companhia de comércio e resultou na imediata extinção da escravidão indígena na região, atendida a reivindicação central do movimento.",a:false,e:"ERRADO. Os colonos revoltosos defendiam, na verdade, a manutenção da escravidão indígena (contrariando os jesuítas) e o fim do monopólio comercial; o movimento foi derrotado e os irmãos Beckman, executados."},
{m:"História do Maranhão",bloco:"G",tema:"Balaiada",dif:"media",fixo:true,ordem:26,s:"A Balaiada, revolta ocorrida no Maranhão entre 1838 e 1841, reuniu vaqueiros, sertanejos e escravizados, tendo Antônio Conselheiro comandado o contingente de escravizados rebelados na região de Caxias.",a:false,e:"ERRADO. Quem liderou o contingente de escravizados na Balaiada foi Cosme Bento das Chagas (‘Preto Cosme 1�7); Antônio Conselheiro é figura ligada a Canudos, décadas depois, sem relação com a Balaiada."},
{m:"História do Maranhão",bloco:"G",tema:"Patrimônio da Humanidade",dif:"facil",fixo:true,ordem:27,s:"São Luís, capital do Maranhão, é reconhecida por seu conjunto arquitetônico revestido de azulejos de origem portuguesa e teve o seu Centro Histórico inscrito na lista de Patrimônio Cultural da Humanidade pela UNESCO.",a:true,e:"CERTO. O Centro Histórico de São Luís, com seus azulejos portugueses, foi tombado pela UNESCO como Patrimônio da Humanidade em 1997."},
{m:"Geografia do Brasil",bloco:"G",tema:"Industrialização",dif:"media",fixo:true,ordem:28,s:"O processo de industrialização brasileiro, historicamente concentrado na Região Sudeste, sobretudo no eixo São Paulo–Rio de Janeiro, contribuiu para a formação de desigualdades regionais, ainda que, nas últimas décadas, tenham ocorrido movimentos de desconcentração industrial em direção a outras regiões.",a:true,e:"CERTO. A concentração histórica no eixo SP-RJ gerou desigualdades regionais, mas há desconcentração industrial recente rumo a outras regiões, como Sul, Centro-Oeste e Nordeste."},
{m:"Geografia do Brasil",bloco:"G",tema:"Matriz de transportes",dif:"facil",fixo:true,ordem:29,s:"A matriz de transportes brasileira caracteriza-se pela predominância do modal ferroviário no deslocamento de cargas e de passageiros, resultado de investimentos realizados ao longo do século XX que relegaram o transporte rodoviário a papel secundário.",a:false,e:"ERRADO. A matriz brasileira é predominantemente RODOVIÁRIA, resultado de investimentos concentrados nesse modal a partir do século XX; o ferroviário tem papel secundário."},
{m:"Geografia do Brasil",bloco:"G",tema:"Urbanização",dif:"media",fixo:true,ordem:30,s:"A intensa urbanização ocorrida no Brasil a partir de meados do século XX foi acompanhada da formação de grandes metrópoles e de regiões metropolitanas, processo marcado pela expansão de periferias e pela ocorrência de problemas como a segregação socioespacial.",a:true,e:"CERTO. A urbanização acelerada gerou metrópoles e regiões metropolitanas, com expansão periférica e segregação socioespacial como problemas característicos."},
{m:"Geografia do Brasil",bloco:"G",tema:"Fronteira agrícola",dif:"media",fixo:true,ordem:31,s:"A expansão da fronteira agrícola em direção ao Centro-Oeste e à Amazônia, associada à modernização da agricultura e ao avanço do cultivo de grãos como a soja, produziu impactos ambientais expressivos, entre os quais o desmatamento de áreas de Cerrado e de floresta.",a:true,e:"CERTO. A expansão da soja e da pecuária sobre o Centro-Oeste e a Amazônia é amplamente associada ao desmatamento do Cerrado e de áreas florestais."},
{m:"Geografia do Brasil",bloco:"G",tema:"Estrutura etária",dif:"media",fixo:true,ordem:32,s:"A estrutura etária da população brasileira permanece essencialmente jovem e em franca expansão, dado que o país ainda registra elevadas taxas de natalidade e de fecundidade, sem indícios de envelhecimento populacional.",a:false,e:"ERRADO. O Brasil vive processo de transição demográfica, com queda das taxas de natalidade e fecundidade e envelhecimento populacional crescente."},
{m:"Geografia do Brasil",bloco:"G",tema:"Migrações internas",dif:"media",fixo:true,ordem:33,s:"Os movimentos migratórios internos no Brasil, historicamente marcados pelo deslocamento de nordestinos em direção ao Sudeste industrializado, passaram, em período mais recente, a apresentar fluxos de retorno e novas direções, como a atração exercida por áreas de expansão agrícola.",a:true,e:"CERTO. Além do histórico fluxo Nordeste-Sudeste, hoje há migrações de retorno e novos destinos, como o Centro-Oeste e o Matopiba, ligados à expansão agrícola."},
{m:"Geografia do Brasil",bloco:"G",tema:"Unidades de conservação",dif:"dificil",fixo:true,ordem:34,s:"As unidades de conservação de proteção integral têm por finalidade compatibilizar a conservação da natureza com o uso sustentável e direto de parcela de seus recursos naturais, admitindo, por exemplo, a extração vegetal por populações tradicionais em seu interior.",a:false,e:"ERRADO. Essa descrição corresponde às unidades de USO SUSTENTÁVEL (como RESEX e Florestas Nacionais); as de PROTEÇÃO INTEGRAL visam preservar a natureza, admitindo apenas o uso indireto dos recursos (sem exploração direta)."},
{m:"Geografia do Brasil",bloco:"G",tema:"Abertura comercial",dif:"media",fixo:true,ordem:35,s:"A integração da economia brasileira ao processo de internacionalização, intensificada a partir da abertura comercial da década de 1990, ampliou a exposição do país à concorrência externa e alterou a organização do espaço produtivo nacional.",a:true,e:"CERTO. A abertura comercial dos anos 1990 (governo Collor em diante) expôs a indústria nacional à concorrência internacional e reorganizou o espaço produtivo do país."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Zona de transição",dif:"media",fixo:true,ordem:36,s:"O território maranhense situa-se em zona de transição entre os domínios da Amazônia, do Cerrado e da Caatinga, o que se reflete na diversidade de sua cobertura vegetal, com destaque para a Mata dos Cocais.",a:true,e:"CERTO. O Maranhão é uma área de transição entre três domínios (Amazônia, Cerrado e Caatinga), o que explica a diversidade vegetal, com destaque para a Mata dos Cocais (babaçuais)."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Clima maranhense",dif:"media",fixo:true,ordem:37,s:"O clima do Maranhão é homogêneo em todo o estado, do tipo equatorial úmido, com elevados índices pluviométricos e ausência de estação seca, inclusive nas porções leste e sul.",a:false,e:"ERRADO. O clima maranhense não é homogêneo: no leste e no sul do estado há estação seca bem definida (clima tropical com tendência à semiaridez), diferente do clima mais úmido do litoral e do oeste."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Baixada Maranhense",dif:"facil",fixo:true,ordem:38,s:"A Baixada Maranhense, extensa planície sujeita a inundações sazonais, abriga campos alagados e é reconhecida como Área de Proteção Ambiental e sítio Ramsar de importância internacional para a conservação de zonas úmidas.",a:true,e:"CERTO. A Baixada Maranhense é APA estadual e está na lista de sítios Ramsar (Convenção sobre Zonas Úmidas de Importância Internacional)."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Rio Mearim",dif:"dificil",fixo:true,ordem:39,s:"No rio Mearim é comum a ocorrência da pororoca, fenômeno decorrente do encontro das águas fluviais com as marés oceânicas, desaguando esse rio diretamente no rio Parnaíba, na divisa com o Piauí.",a:false,e:"ERRADO. O rio Mearim deságua na Baía de São Marcos, e não no rio Parnaíba (que é outra bacia, na divisa com o Piauí); a pororoca no Mearim, de fato, ocorre, mas a foz descrita está incorreta."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Expansão da soja",dif:"media",fixo:true,ordem:40,s:"No sul do Maranhão, em municípios como Balsas, expandiu-se, nas últimas décadas, a produção mecanizada de soja, associada ao avanço do agronegócio sobre áreas originalmente cobertas pela Floresta Amazônica de terra firme.",a:false,e:"ERRADO. A região de Balsas está inserida no domínio do Cerrado (parte do Matopiba), e não da Floresta Amazônica; a expansão da soja avançou sobre áreas de cerrado."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Reentrâncias Maranhenses",dif:"media",fixo:true,ordem:41,s:"As Reentrâncias Maranhenses, situadas no litoral do estado, abrigam um dos maiores conjuntos contínuos de manguezais do país, ecossistema de grande relevância para a reprodução de espécies aquáticas.",a:true,e:"CERTO. As Reentrâncias Maranhenses concentram um dos maiores contínuos de manguezais do Brasil, ecossistema-berçário para diversas espécies marinhas."},
{m:"Geografia do Maranhão",bloco:"G",tema:"Delta do Parnaíba",dif:"media",fixo:true,ordem:42,s:"O Delta do Parnaíba, situado entre o Maranhão e o Piauí, é apontado como um dos poucos deltas em mar aberto das Américas e integra área de proteção ambiental compartilhada por esses estados.",a:true,e:"CERTO. O Delta do Parnaíba é um dos raros deltas em mar aberto do continente americano e está protegido por unidades de conservação compartilhadas entre MA e PI."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Contrapositiva",dif:"media",fixo:true,ordem:43,s:"A proposição ‘Se o soldado cumpre o regulamento, então ele evita a punição 1�7 é logicamente equivalente à proposição ‘Se o soldado não evita a punição, então ele não cumpre o regulamento 1�7.",a:true,e:"CERTO. A segunda proposição é a contrapositiva da primeira (~Q ↄ1�7 ~P), que é sempre logicamente equivalente ao condicional original (P ↄ1�7 Q)."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Negação de conjunção",dif:"media",fixo:true,ordem:44,s:"A negação da proposição ‘O policial é assíduo e pontual 1�7 é corretamente expressa por ‘O policial não é assíduo e não é pontual 1�7.",a:false,e:"ERRADO. Pela Lei de De Morgan, a negação de uma conjunção (E) é a disjunção das negações: o correto seria ‘O policial não é assíduo OU não é pontual 1�7."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Equivalência do condicional",dif:"media",fixo:true,ordem:45,s:"A proposição ‘Se chove, então a operação é suspensa 1�7 é logicamente equivalente à proposição ‘Não chove ou a operação é suspensa 1�7.",a:true,e:"CERTO. P ↄ1�7 Q é logicamente equivalente a ~P v Q, uma das equivalências mais cobradas em provas de raciocínio lógico."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Tabela-verdade do condicional",dif:"media",fixo:true,ordem:46,s:"Uma proposição condicional do tipo ‘Se P, então Q 1�7 assume valor lógico falso na situação em que P é falsa e Q é verdadeira.",a:false,e:"ERRADO. O condicional só é falso quando P é verdadeira e Q é falsa. Quando P é falsa, o condicional é sempre verdadeiro (verdade vácua), independentemente do valor de Q."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Cálculo proposicional",dif:"dificil",fixo:true,ordem:47,s:"Considere as proposições simples p: ‘Ana viaja 1�7 e q: ‘Bruno trabalha 1�7. Se p é verdadeira e q é falsa, então a proposição composta (p ↄ1�7 q) v (~p) tem valor lógico verdadeiro.",a:false,e:"ERRADO. Com p=V e q=F: (p→q) = V→F = F; ~p = F. Logo, F v F = FALSO, e não verdadeiro."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Contrapositiva II",dif:"media",fixo:true,ordem:48,s:"A proposição ‘Se Marina estuda, então é aprovada 1�7 é logicamente equivalente à proposição ‘Se Marina não é aprovada, então não estuda 1�7.",a:true,e:"CERTO. Trata-se novamente da contrapositiva (~Q→~P), sempre equivalente à condicional original."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Silogismo categórico",dif:"dificil",fixo:true,ordem:49,s:"Considere verdadeiras as afirmações ‘Todo livro de matemática está na estante A 1�7 e ‘Nenhum livro da estante A é de ficção 1�7. Dessas afirmações conclui-se, logicamente, que nenhum livro de matemática é de ficção.",a:true,e:"CERTO. Trata-se de um silogismo válido: todo M é A; nenhum A é F; logo, nenhum M é F (transitividade entre ‘todo 1�7 e ‘nenhum 1�7)."},
{m:"Raciocínio Lógico",bloco:"G",tema:"Negação de disjunção",dif:"media",fixo:true,ordem:50,s:"A negação da proposição ‘O produto é barato ou é durável 1�7 é ‘O produto não é barato ou não é durável 1�7.",a:false,e:"ERRADO. Pela Lei de De Morgan, a negação de uma disjunção (OU) é a conjunção das negações: o correto seria ‘O produto não é barato E não é durável 1�7."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - militar de carreira",dif:"media",fonte:"Lei nº 6.513/1995 (Estatuto dos PMs do Maranhão)",fixo:true,ordem:51,s:"Com base nas definições gerais do Estatuto da PMMA, os militares de carreira são aqueles que, no desempenho voluntário e permanente do serviço, possuem estabilidade assegurada ou presumida.",a:true,e:"CERTO. É a definição literal do art. 2º, §3º, da Lei nº 6.513/1995: militares de carreira são os que, no desempenho voluntário e permanente do serviço, têm estabilidade assegurada ou presumida."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - serviço policial-militar",dif:"dificil",fonte:"Lei nº 6.513/1995 (Estatuto dos PMs do Maranhão)",fixo:true,ordem:52,s:"O serviço policial-militar consiste no exercício de atividades inerentes à Polícia Militar e compreende todos os encargos previstos na legislação geral e peculiar relacionadas com o policiamento investigativo e preservação da ordem pública.",a:false,e:"ERRADO. O art. 3º do Estatuto fala em legislação ESPECÍFICA (não ‘geral 1�7) e peculiar, relacionada ao policiamento OSTENSIVO (não ‘investigativo 1�7, que é atribuição da polícia judiciária/civil) e à preservação da ordem pública."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - disciplina",dif:"media",fonte:"Lei nº 6.513/1995 (Estatuto dos PMs do Maranhão)",fixo:true,ordem:53,s:"A disciplina militar, compreendida como a rigorosa observância das leis e regulamentos, deve ser mantida em todas as circunstâncias, inclusive nas relações entre militares da ativa e militares reformados.",a:true,e:"CERTO. O art. 17, §3º, determina que a disciplina e o respeito à hierarquia devem ser mantidos em todas as circunstâncias, entre militares da ativa, da reserva remunerada e reformados."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - antiguidade",dif:"media",fonte:"Lei nº 6.513/1995 (Estatuto dos PMs do Maranhão)",fixo:true,ordem:54,s:"Na promoção à graduação de Terceiro Sargento, o critério de antiguidade é regulado pela ordem de classificação obtida no respectivo curso ou concurso.",a:true,e:"CERTO. O art. 21, §1º, estabelece que, na promoção à graduação de Terceiro-Sargento (entre outros casos), prevalece, para efeito de antiguidade, a ordem de classificação obtida no curso ou concurso."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - vedações comerciais",dif:"dificil",fonte:"Lei nº 6.513/1995 (Estatuto dos PMs do Maranhão)",fixo:true,ordem:55,s:"É permitido ao policial militar da ativa exercer diretamente a gestão de seus bens e tomar parte na administração ou gerência de sociedades comerciais, desde que não seja em organizações que prestem serviços ao Estado.",a:false,e:"ERRADO. O art. 41 veda ao militar da ativa comerciar ou tomar parte na administração/gerência de sociedade, EXCETO como acionista ou quotista (sem função de gestão); a gestão de bens próprios é permitida à parte (art. 41, §2º), mas não a participação na gerência de empresas, seja qual for o cliente delas."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - comando e subordinação",dif:"media",fonte:"Lei nº 6.513/1995 (Estatuto dos PMs do Maranhão)",fixo:true,ordem:56,s:"Em relação ao tema Comando e Subordinação é possível concluir que os subtenentes e sargentos auxiliam e complementam as atividades dos oficiais, quer no adestramento e no emprego dos meios, quer na instrução e na administração ou na execução de atividades de Polícia Ostensiva.",a:true,e:"CERTO. É a redação literal do art. 51 do Estatuto (Lei nº 6.513/1995)."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - ressarcimento de preterição",dif:"media",fonte:"Lei nº 6.513/1995 (Estatuto dos PMs do Maranhão)",fixo:true,ordem:57,s:"A promoção em ressarcimento de preterição é um ato administrativo de natureza extraordinária, devendo o militar receber o número que lhe competir na escala hierárquica como se houvesse sido promovido na época devida.",a:true,e:"CERTO. Conforme o art. 78, §§1º e 2º, em casos extraordinários cabe promoção em ressarcimento de preterição, recebendo o militar o número que lhe competir como se tivesse sido promovido na época devida."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - licença para interesse particular",dif:"media",fonte:"Lei nº 6.513/1995 (Estatuto dos PMs do Maranhão)",fixo:true,ordem:58,s:"A licença para tratar de interesse particular, concedida ao militar com mais de dez anos de serviço, implica o afastamento total do serviço com prejuízo tanto da remuneração quanto da contagem do tempo de serviço.",a:true,e:"CERTO. O art. 95 dispõe exatamente isso: licença concedida a militar com mais de 10 anos de efetivo serviço, sempre com prejuízo da remuneração e do tempo de serviço, por até 2 anos."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - agregação",dif:"media",fonte:"Lei nº 6.513/1995 (Estatuto dos PMs do Maranhão)",fixo:true,ordem:59,s:"O policial militar que se encontra na condição de agregado, embora continue a ser considerado em serviço ativo em certas hipóteses, fica impedido de ser promovido enquanto durar essa situação.",a:true,e:"CERTO. O art. 106, §2º, prevê hipóteses em que o agregado continua em serviço ativo, e o §8º do mesmo artigo veda a promoção do militar enquanto durar a agregação."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto PMMA - reversão",dif:"dificil",fonte:"Lei nº 6.513/1995 (Estatuto dos PMs do Maranhão)",fixo:true,ordem:60,s:"A reintegração é o ato pelo qual o militar agregado retorna ao respectivo quadro tão logo cesse o motivo que determinou a sua agregação, voltando a ocupar o lugar que lhe couber na respectiva escala numérica.",a:false,e:"ERRADO. O nome correto do instituto é REVERSÃO (art. 108), não ‘reintegração 1�7 (que tem outro sentido no direito administrativo, ligado ao retorno após anulação de demissão)."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional - direitos humanos",dif:"facil",fonte:"Lei nº 14.751/2023 (Lei Orgânica Nacional das PMs e CBMs)",fixo:true,ordem:61,s:"A proteção, a promoção e o respeito aos direitos humanos, inclusive aqueles decorrentes de compromissos internacionais assumidos pela República Federativa do Brasil, constituem princípios básicos a serem observados pelas instituições militares estaduais.",a:true,e:"CERTO. A Lei nº 14.751/2023 inclui expressamente a proteção e promoção dos direitos humanos, inclusive de tratados internacionais, entre os princípios que orientam as PMs e CBMs estaduais."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional - natureza das PMs",dif:"facil",fonte:"Lei nº 14.751/2023 (Lei Orgânica Nacional das PMs e CBMs)",fixo:true,ordem:62,s:"As polícias militares são definidas como instituições militares permanentes e exclusivas de Estado, sendo classificadas como forças auxiliares e reserva do Exército, indispensáveis à preservação da ordem pública e ao regime democrático.",a:true,e:"CERTO. Reprodução praticamente literal do art. 15, caput, da Lei nº 14.751/2023, que classifica as PMs como forças auxiliares e reserva do Exército, indispensáveis à ordem pública e ao regime democrático."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional - QOEM",dif:"media",fonte:"Lei nº 14.751/2023 (Lei Orgânica Nacional das PMs e CBMs)",fixo:true,ordem:63,s:"Para o ingresso no Quadro de Oficiais de Estado-Maior (QOEM), a lei exige o título de bacharel em direito, embora seja permitida a exigência de outra graduação de nível superior para os oficiais pertencentes aos corpos de bombeiros militares.",a:true,e:"CERTO. O art. 15, I, da Lei nº 14.751/2023 exige bacharelado em direito para o QOEM; para os oficiais bombeiros, os estados podem definir outras áreas de formação além do direito."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional - tatuagens",dif:"dificil",fonte:"Lei nº 14.751/2023 (Lei Orgânica Nacional das PMs e CBMs)",fixo:true,ordem:64,s:"Depreende-se do texto legal que a proibição de tatuagens visíveis para o ingresso na corporação é absoluta, alcançando qualquer tipo de imagem ou símbolo, independentemente da mensagem que este venha a transmitir.",a:false,e:"ERRADO. Conforme entendimento consolidado pelo STF (Tema 838) e refletido na legislação, a restrição a tatuagens não pode ser absoluta nem estética; só é legítima quando o conteúdo for ofensivo ou incompatível com os valores institucionais (racismo, apologia ao crime, etc.)."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional - promoções extraordinárias",dif:"media",fonte:"Lei nº 14.751/2023 (Lei Orgânica Nacional das PMs e CBMs)",fixo:true,ordem:65,s:"A progressão do militar na hierarquia deve ser fundamentada no valor moral e profissional, sendo admitidas, de forma extraordinária, as promoções por bravura, post mortem e em ressarcimento de preterição.",a:true,e:"CERTO. Essas três modalidades extraordinárias de promoção (bravura, post mortem e ressarcimento de preterição) são consagradas na legislação militar, inclusive na Lei Orgânica Nacional."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional - estabilidade",dif:"dificil",fonte:"Lei nº 14.751/2023 (Lei Orgânica Nacional das PMs e CBMs)",fixo:true,ordem:66,s:"A estabilidade dos militares de carreira é um direito assegurado após o cumprimento de 3 (três) anos de efetivo serviço nas respectivas corporações militares.",a:true,e:"CERTO. Entre as garantias trazidas pela Lei nº 14.751/2023 está a estabilidade de carreira após três anos de efetivo serviço."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional - porte de arma",dif:"media",fonte:"Lei nº 14.751/2023 (Lei Orgânica Nacional das PMs e CBMs)",fixo:true,ordem:67,s:"O documento de identidade militar, com fé pública em todo o território nacional, garante o livre porte de arma tanto para o militar em serviço ativo quanto para aquele que se encontra na reserva remunerada ou reformado.",a:true,e:"CERTO. O art. 18, IV, assegura a expedição de identidade militar com livre porte de arma e fé pública nacional para militares da ativa, da reserva remunerada e da reforma."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional - custodiados",dif:"dificil",fonte:"Lei nº 14.751/2023 (Lei Orgânica Nacional das PMs e CBMs)",fixo:true,ordem:68,s:"É vedado ao militar em atividade, sob pena de responsabilização, a divulgação de imagens de pessoas que estejam sob sua custódia, a menos que haja autorização judicial prévia para tal ato.",a:true,e:"CERTO. A proteção da dignidade da pessoa custodiada, com vedação à divulgação não autorizada de suas imagens, é um princípio geral de proteção a direitos fundamentais aplicado à atuação policial."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional - candidatura eletiva",dif:"dificil",fonte:"Lei nº 14.751/2023 (Lei Orgânica Nacional das PMs e CBMs)",fixo:true,ordem:69,s:"O militar alistável com menos de 10 (dez) anos de serviço que se candidatar a mandato eletivo deve ser afastado definitivamente do serviço ativo no dia posterior ao pedido de registro de sua candidatura na Justiça Eleitoral.",a:false,e:"ERRADO. Embora o militar com menos de 10 anos de serviço realmente deva afastar-se da atividade para concorrer a cargo eletivo (art. 14, §8º, I, da CF), a legislação não fixa esse marco temporal específico (‘dia posterior ao pedido de registro 1�7); trata-se de um detalhe procedimental inventado para confundir o candidato."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional - transição de escolaridade",dif:"media",fonte:"Lei nº 14.751/2023 (Lei Orgânica Nacional das PMs e CBMs)",fixo:true,ordem:70,s:"O prazo máximo estabelecido pela legislação federal para que as instituições militares processem a adoção do requisito de escolaridade superior para o ingresso em seus quadros é de 6 (seis) anos, contados da data de publicação da lei.",a:true,e:"CERTO. A Lei nº 14.751/2023 estabeleceu prazo de até 6 anos, a contar de sua publicação (dezembro de 2023), para a adoção do requisito de escolaridade superior no ingresso."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei 12.896/2026 - subordinação",dif:"facil",fonte:"Lei Estadual nº 12.896/2026 (Organização Básica da PMMA)",fixo:true,ordem:71,s:"A Polícia Militar do Maranhão é definida como uma instituição militar permanente, exclusiva e típica de Estado, sendo subordinada ao Exército Brasileiro, além de integrante do Sistema Único de Segurança Pública.",a:false,e:"ERRADO. A PMMA é considerada força AUXILIAR e reserva do Exército (não subordinada a ele); nos termos do art. 3º da Lei nº 12.896/2026, ela se subordina hierarquicamente ao GOVERNADOR DO ESTADO, vinculando-se à Secretaria de Estado da Segurança Pública."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei 12.896/2026 - competências",dif:"media",fonte:"Lei Estadual nº 12.896/2026 (Organização Básica da PMMA)",fixo:true,ordem:72,s:"Compete privativamente à Polícia Militar do Maranhão a execução do policiamento ostensivo e a polícia judiciária militar do Estado, ressalvadas apenas as missões peculiares das Forças Armadas.",a:true,e:"CERTO. O art. 4º, I, da Lei nº 12.896/2026 atribui à PMMA a execução, com exclusividade, do policiamento ostensivo (ressalvadas as missões peculiares das Forças Armadas), além da polícia judiciária militar estadual."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei 12.896/2026 - Comandante-Geral",dif:"media",fonte:"Lei Estadual nº 12.896/2026 (Organização Básica da PMMA)",fixo:true,ordem:73,s:"O Comandante-Geral da corporação deve ser nomeado obrigatoriamente entre os oficiais da ativa do posto de Tenente-Coronel do Quadro de Oficiais de Estado-Maior, devendo este possuir o Curso de Comando e Estado-Maior.",a:false,e:"ERRADO. O art. 7º, §1º, exige que o Comandante-Geral seja nomeado entre os oficiais da ativa do posto de CORONEL (e não Tenente-Coronel) do QOEM."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei 12.896/2026 - substituição de comando",dif:"dificil",fonte:"Lei Estadual nº 12.896/2026 (Organização Básica da PMMA)",fixo:true,ordem:74,s:"O Comandante-Geral, na qualidade de órgão de direção geral, exerce a presidência da Comissão de Promoção de Praças da corporação, além de ser o substituto imediato do Corregedor-Geral.",a:false,e:"ERRADO. A estrutura de substituição prevista na lei é diferente: o Chefe do Estado-Maior Geral é o substituto imediato do Subcomandante-Geral, e não há previsão de que o Corregedor-Geral substitua o Comandante-Geral."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei 12.896/2026 - Estado-Maior",dif:"media",fonte:"Lei Estadual nº 12.896/2026 (Organização Básica da PMMA)",fixo:true,ordem:75,s:"De acordo com a estruturação das seções do Estado-Maior Geral, a 2ª Seção (PM/2) é responsável pela política institucional de Inteligência Estratégica e Contrainteligência.",a:true,e:"CERTO. Seguindo o padrão de estados-maiores militares, a 2ª Seção (P/2 ou PM/2) trata de assuntos de Inteligência, enquanto a 1ª cuida de Pessoal, a 3ª de Operações e a 4ª de Logística."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei 12.896/2026 - Grandes Comandos",dif:"dificil",fonte:"Lei Estadual nº 12.896/2026 (Organização Básica da PMMA)",fixo:true,ordem:76,s:"Os Grandes Comandos, como o Comando de Policiamento Metropolitano e o Comando de Policiamento do Interior, possuem circunscrição em todo o território estadual, sem restrições geográficas específicas para sua atuação estratégica.",a:false,e:"ERRADO. A própria lei estabelece o oposto: os Grandes Comandos têm circunscrição em todo o Estado À EXCEÇÃO do Comando de Policiamento Metropolitano (CPM) e do Comando de Policiamento do Interior (CPI), cujas áreas de atuação são restritas, respectivamente, à Região Metropolitana e aos demais municípios."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei 12.896/2026 - Comissão de Promoção de Praças",dif:"media",fonte:"Lei Estadual nº 12.896/2026 (Organização Básica da PMMA)",fixo:true,ordem:77,s:"A Comissão de Promoção de Praças é classificada como um órgão de assessoramento, competindo-lhe analisar e recomendar a promoção dos oficiais, bem como avaliar o mérito e a capacidade técnica dos militares.",a:false,e:"ERRADO. A Comissão de Promoção de PRAÇAS (CPP) analisa e recomenda a promoção de PRAÇAS (não de oficiais, que têm comissão própria), avaliando seu mérito e capacidade."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei 12.896/2026 - praças especiais",dif:"facil",fonte:"Lei Estadual nº 12.896/2026 (Organização Básica da PMMA)",fixo:true,ordem:78,s:"Conforme a hierarquia militar estabelecida, os integrantes das praças especiais incluem os postos de Aspirante a oficial, Cadete e Aluno-oficial.",a:true,e:"CERTO. Aspirante-a-Oficial, Cadete e Aluno-Oficial são classificados como praças especiais na hierarquia da PMMA."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei 12.896/2026 - ingresso no QP",dif:"dificil",fonte:"Lei Estadual nº 12.896/2026 (Organização Básica da PMMA)",fixo:true,ordem:79,s:"O ingresso no Quadro de Praças (QP) da PMMA é destinado a candidatos aprovados em concurso público que possuam, obrigatoriamente, nível de escolaridade superior.",a:false,e:"ERRADO. Durante o período de transição previsto na Lei nº 14.751/2023 (até 6 anos), o ingresso no QP ainda pode exigir apenas ensino médio completo (ou técnico equivalente), como de fato ocorreu no edital do concurso PM-MA 2026 para Soldado."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei 12.896/2026 - quadros extintos",dif:"dificil",fonte:"Lei Estadual nº 12.896/2026 (Organização Básica da PMMA)",fixo:true,ordem:80,s:"Os oficiais das especialidades extintas, como Motomecanização e Comunicação, possuem o prazo de 120 dias para optar pela permanência em seus quadros atuais ou pelo ingresso no novo Quadro de Oficiais Especialistas.",a:true,e:"CERTO. A reorganização da PMMA extinguiu quadros específicos como os de Motomecanização e Comunicações, prevendo regra de transição para o novo Quadro de Oficiais Especialistas (QOE)."},
{m:"Informática",bloco:"E",tema:"Atalhos Windows",dif:"facil",fixo:true,ordem:81,s:"No sistema operacional Windows 10, o atalho de teclado Ctrl + Shift + Esc abre diretamente o Gerenciador de Tarefas, sem a necessidade de passar pela tela de opções do sistema.",a:true,e:"CERTO. Ctrl+Shift+Esc é o atalho direto para o Gerenciador de Tarefas no Windows, sem precisar passar pela tela de segurança (Ctrl+Alt+Del)."},
{m:"Informática",bloco:"E",tema:"Comandos Linux",dif:"facil",fixo:true,ordem:82,s:"No ambiente Linux, o comando ls -l é utilizado para listar os arquivos e diretórios contidos na pasta atual, apresentando informações detalhadas como permissões, proprietário, tamanho e data de modificação.",a:true,e:"CERTO. A opção  1�7-l 1�7 do comando ‘ls 1�7 apresenta a listagem em formato longo, com permissões, dono, grupo, tamanho e data."},
{m:"Informática",bloco:"E",tema:"Sistemas de arquivos",dif:"media",fixo:true,ordem:83,s:"Diferentemente do Linux, que diferencia letras maiúsculas de minúsculas no nome dos arquivos (case-sensitive), o sistema de arquivos padrão do Windows (NTFS) permite a criação de dois arquivos com nomes exatamente iguais no mesmo diretório, desde que um esteja em maiúsculas e o outro em minúsculas (ex: documento.txt e DOCUMENTO.TXT).",a:false,e:"ERRADO. O NTFS é case-insensitive na prática (embora preserve a caixa digitada), não permitindo dois arquivos no mesmo diretório diferindo apenas por maiúsculas/minúsculas."},
{m:"Informática",bloco:"E",tema:"Permissões Linux (chmod)",dif:"media",fixo:true,ordem:84,s:"No Linux, o comando chmod 777 arquivo.txt atribui permissão total de leitura, escrita e execução apenas ao proprietário do arquivo.",a:false,e:"ERRADO. chmod 777 atribui permissão total (leitura, escrita e execução) para TODOS: proprietário, grupo e outros usuários, não apenas ao dono."},
{m:"Informática",bloco:"E",tema:"Word - controle de alterações",dif:"facil",fixo:true,ordem:85,s:"No Microsoft Word, a funcionalidade ‘Controle de Alterações 1�7 permite rastrear as edições feitas no documento, mas não possibilita ao usuário aceitar ou rejeitar individualmente cada modificação sugerida.",a:false,e:"ERRADO. O Controle de Alterações do Word permite, sim, aceitar ou rejeitar cada alteração individualmente, além de aceitar/rejeitar todas de uma vez."},
{m:"Informática",bloco:"E",tema:"Excel - fórmula SOMA",dif:"facil",fixo:true,ordem:86,s:"No Microsoft Excel, a fórmula =SOMA(A1:A5) realiza a soma de todos os valores numéricos compreendidos no intervalo da célula A1 até a célula A5, inclusive.",a:true,e:"CERTO. A função SOMA soma os valores numéricos do intervalo especificado, incluindo as células inicial e final."},
{m:"Informática",bloco:"E",tema:"Calc x Excel - separadores",dif:"dificil",fixo:true,ordem:87,s:"No programa de planilha eletrônica Calc (pertencente à suíte BrOffice/LibreOffice), o caractere utilizado para separar argumentos dentro de uma função é a vírgula ',', enquanto no Microsoft Excel utiliza-se obrigatoriamente o ponto e vírgula ';'.",a:false,e:"ERRADO. O separador de argumentos depende da configuração regional do sistema/idioma, não do programa em si; em configuração de português do Brasil, tanto o Excel quanto o Calc costumam usar o ponto e vírgula (já que a vírgula é o separador decimal)."},
{m:"Informática",bloco:"E",tema:"PowerPoint - apresentação de slides",dif:"facil",fixo:true,ordem:88,s:"No Microsoft PowerPoint, a exibição de apresentação de slides pode ser iniciada a partir do primeiro slide pressionando-se a tecla F5.",a:true,e:"CERTO. F5 inicia a apresentação a partir do primeiro slide; Shift+F5 inicia a partir do slide atual."},
{m:"Informática",bloco:"E",tema:"Intranet",dif:"media",fixo:true,ordem:89,s:"Uma Intranet se diferencia da Internet principalmente por utilizar tecnologias e protocolos de rede proprietários e totalmente incompatíveis com o protocolo TCP/IP.",a:false,e:"ERRADO. A Intranet utiliza os MESMOS protocolos da Internet (TCP/IP, HTTP etc.); a diferença está no escopo de acesso, restrito a uma organização, e não nos protocolos empregados."},
{m:"Informática",bloco:"E",tema:"VPN",dif:"media",fixo:true,ordem:90,s:"A tecnologia VPN (Virtual Private Network) permite criar um túnel de comunicação criptografado sobre uma rede pública, como a Internet, garantindo a trafegabilidade segura de dados privados.",a:true,e:"CERTO. A VPN cria um túnel virtual criptografado sobre redes públicas, protegendo o tráfego de dados entre pontos remotos."},
{m:"Informática",bloco:"E",tema:"Endereçamento IPv4",dif:"media",fixo:true,ordem:91,s:"O endereço IP (versão 4) é composto por 128 bits e representado em notação hexadecimal, o que garante a alocação de bilhões de novos endereços globais.",a:false,e:"ERRADO. O IPv4 é composto por 32 bits, representado em notação decimal (ex: 192.168.0.1); é o IPv6 que usa 128 bits e notação hexadecimal."},
{m:"Informática",bloco:"E",tema:"Protocolo HTTP",dif:"facil",fixo:true,ordem:92,s:"O protocolo HTTP é nativamente seguro, pois utiliza criptografia de chave pública por padrão para proteger todas as requisições enviadas entre o navegador do usuário e o servidor web.",a:false,e:"ERRADO. O HTTP, por padrão, NÃO é seguro (não criptografa o tráfego); a versão segura, com criptografia, é o HTTPS."},
{m:"Informática",bloco:"E",tema:"Navegação anônima",dif:"media",fixo:true,ordem:93,s:"No Google Chrome, o recurso de navegação anônima garante que a navegação do usuário seja completamente invisível para provedores de acesso e administradores de redes corporativas.",a:false,e:"ERRADO. A navegação anônima apenas evita salvar histórico, cookies e dados de formulário localmente; o provedor de internet (ISP) e administradores de rede ainda podem ver o tráfego."},
{m:"Informática",bloco:"E",tema:"Atalhos de navegadores",dif:"facil",fixo:true,ordem:94,s:"Nos navegadores web modernos, tais como Mozilla Firefox e Google Chrome, a combinação de teclas Ctrl + H é comumente utilizada para abrir o painel do histórico de navegação.",a:true,e:"CERTO. Ctrl+H é o atalho padrão para abrir o histórico de navegação nos principais navegadores, incluindo Chrome e Firefox."},
{m:"Informática",bloco:"E",tema:"Cookies",dif:"media",fixo:true,ordem:95,s:"Os cookies mantidos pelos navegadores são pequenos programas executáveis enviados pelos sites para rodar scripts de limpeza automática na máquina do usuário.",a:false,e:"ERRADO. Cookies são pequenos arquivos de TEXTO (dados), não programas executáveis; servem para armazenar informações de sessão, preferências etc., não para executar scripts."},
{m:"Informática",bloco:"E",tema:"Extensões de navegador",dif:"facil",fixo:true,ordem:96,s:"O navegador Mozilla Firefox permite o uso de extensões (add-ons) para adicionar novas funcionalidades ou integrar serviços externos ao navegador.",a:true,e:"CERTO. O Firefox suporta instalação de extensões (add-ons) que ampliam suas funcionalidades."},
{m:"Informática",bloco:"E",tema:"Protocolo IMAP",dif:"media",fixo:true,ordem:97,s:"O protocolo IMAP permite que o usuário acesse e organize suas mensagens de e-mail diretamente no servidor, mantendo as pastas sincronizadas em múltiplos dispositivos.",a:true,e:"CERTO. O IMAP mantém as mensagens no servidor e sincroniza pastas entre diferentes dispositivos, diferente do POP3, que normalmente baixa e remove as mensagens do servidor."},
{m:"Informática",bloco:"E",tema:"Protocolo POP3",dif:"media",fixo:true,ordem:98,s:"O protocolo POP3 é utilizado primariamente para o envio de mensagens de e-mail entre servidores na Internet.",a:false,e:"ERRADO. O POP3 é usado para RECEBER/baixar e-mails do servidor para o cliente; o envio de e-mails entre servidores é função do protocolo SMTP."},
{m:"Informática",bloco:"E",tema:"Campo Cco (e-mail)",dif:"facil",fixo:true,ordem:99,s:"Ao enviar uma mensagem utilizando o campo Cco (Cópia Oculta), os destinatários especificados neste campo receberão o e-mail sem que os demais destinatários (campos Para e Cc) saibam de sua inclusão.",a:true,e:"CERTO. O campo Cco (cópia oculta/Bcc) oculta os destinatários nele incluídos dos demais destinatários da mensagem."},
{m:"Informática",bloco:"E",tema:"Thunderbird - filtros",dif:"media",fixo:true,ordem:100,s:"No cliente de e-mail Mozilla Thunderbird, a funcionalidade de filtros de mensagens permite automatizar ações, como mover e-mails recebidos para pastas específicas com base em regras pré-definidas.",a:true,e:"CERTO. Os filtros de mensagens do Thunderbird permitem automatizar ações (mover, marcar, excluir etc.) conforme critérios definidos pelo usuário."},
{m:"Informática",bloco:"E",tema:"Busca avançada no Google",dif:"facil",fixo:true,ordem:101,s:"Ao realizar uma busca no Google utilizando aspas duplas em torno de uma expressão (ex: “direito administrativo 1�7), o buscador retornará apenas resultados que contenham essa frase exata.",a:true,e:"CERTO. As aspas duplas no Google indicam busca por correspondência exata da expressão entre elas."},
{m:"Informática",bloco:"E",tema:"Busca por tipo de arquivo",dif:"facil",fixo:true,ordem:102,s:"A sintaxe filetype:pdf combinada a um termo de busca no Google restringe os resultados da pesquisa exclusivamente a arquivos no formato PDF.",a:true,e:"CERTO. O operador ‘filetype: 1�7 filtra os resultados por tipo de arquivo especificado, como PDF, DOC, XLS etc."},
{m:"Informática",bloco:"E",tema:"Grupos de discussão",dif:"media",fixo:true,ordem:103,s:"Os grupos de discussão na Internet funcionam exclusivamente em tempo real (comunicação síncrona), exigindo que todos os participantes estejam online simultaneamente para enviar e responder mensagens.",a:false,e:"ERRADO. Grupos de discussão (fóruns, listas de e-mail) costumam ser assíncronos, permitindo que os participantes leiam e respondam em momentos diferentes."},
{m:"Informática",bloco:"E",tema:"Hashtags",dif:"facil",fixo:true,ordem:104,s:"Nas redes sociais corporativas e profissionais, o uso de hashtags (#) serve unicamente para marcar a localização geográfica de onde a publicação foi feita.",a:false,e:"ERRADO. Hashtags servem para categorizar e indexar publicações por assunto/tema, facilitando buscas; não têm relação com geolocalização (essa é feita por outros recursos, como marcação de local)."},
{m:"Informática",bloco:"E",tema:"Modelo SaaS",dif:"media",fixo:true,ordem:105,s:"O modelo de serviço SaaS (Software as a Service) fornece ao usuário final a aplicação pronta para uso via web, sem a necessidade de instalar, gerenciar ou manter a infraestrutura subjacente.",a:true,e:"CERTO. No SaaS, o usuário acessa a aplicação pronta pela internet, sem se preocupar com infraestrutura, servidores ou instalação."},
{m:"Informática",bloco:"E",tema:"Nuvem privada",dif:"media",fixo:true,ordem:106,s:"Na Computação em Nuvem, o modelo de implantação do tipo Nuvem Privada caracteriza-se por ter sua infraestrutura compartilhada abertamente entre várias organizações concorrentes para reduzir custos.",a:false,e:"ERRADO. A Nuvem Privada é dedicada a UMA única organização; a infraestrutura compartilhada entre várias organizações é característica da nuvem pública ou comunitária."},
{m:"Informática",bloco:"E",tema:"Cloud storage",dif:"facil",fixo:true,ordem:107,s:"Serviços de Cloud Storage, como Google Drive e OneDrive, oferecem sincronização automática de arquivos localizados em pastas selecionadas do computador do usuário com a nuvem.",a:true,e:"CERTO. Serviços como Google Drive e OneDrive sincronizam automaticamente pastas locais selecionadas com o armazenamento em nuvem."},
{m:"Informática",bloco:"E",tema:"Modelo PaaS",dif:"media",fixo:true,ordem:108,s:"No modelo PaaS (Platform as a Service), o desenvolvedor dispõe de um ambiente configurado para criar, testar e implantar aplicações, sem precisar gerenciar diretamente o sistema operacional base ou os servidores físicos.",a:true,e:"CERTO. No PaaS, o provedor gerencia a infraestrutura e o sistema operacional, cabendo ao desenvolvedor apenas cuidar da aplicação."},
{m:"Informática",bloco:"E",tema:"Lixeira do Windows",dif:"media",fixo:true,ordem:109,s:"No Windows Explorer (ou Explorador de Arquivos), a exclusão de um arquivo armazenado em um pendrive envia o item diretamente para a Lixeira do sistema operacional, de onde pode ser restaurado a qualquer momento.",a:false,e:"ERRADO. Arquivos excluídos de unidades removíveis (como pendrives) normalmente são apagados PERMANENTEMENTE, sem passar pela Lixeira do Windows."},
{m:"Informática",bloco:"E",tema:"Atalhos (shortcuts) no Windows",dif:"facil",fixo:true,ordem:110,s:"No sistema operacional Windows, um atalho é um arquivo de ponteiro de tamanho reduzido que redireciona o acesso a um arquivo, pasta ou programa executável original.",a:true,e:"CERTO. O atalho é um pequeno arquivo (.lnk) que aponta para o local real de um arquivo, pasta ou programa, sem duplicar seu conteúdo."},
{m:"Informática",bloco:"E",tema:"Compactação ZIP",dif:"media",fixo:true,ordem:111,s:"Arquivos compactados com a extensão .zip reduzem o tamanho original dos dados contidos, mas exigem ferramentas proprietárias e pagas para que possam ser descompactados no Windows 11.",a:false,e:"ERRADO. O Windows possui suporte NATIVO e GRATUITO para compactar e descompactar arquivos .zip, sem necessidade de programas proprietários pagos."},
{m:"Informática",bloco:"E",tema:"Bibliotecas do Windows",dif:"media",fixo:true,ordem:112,s:"O recurso de bibliotecas no Windows permite agrupar e visualizar conteúdos armazenados em diferentes pastas do sistema em um único local, sem a necessidade de mover fisicamente os arquivos.",a:true,e:"CERTO. As bibliotecas do Windows reúnem virtualmente o conteúdo de várias pastas em um só local de exibição, sem mover os arquivos originais."},
{m:"Informática",bloco:"E",tema:"Ransomware",dif:"facil",fixo:true,ordem:113,s:"Um ransomware é um tipo de código malicioso que sequestra dados do usuário por meio de criptografia e exige o pagamento de um resgate para restaurar o acesso aos arquivos.",a:true,e:"CERTO. É a definição clássica de ransomware: criptografa os dados da vítima e exige pagamento (resgate) para a liberação."},
{m:"Informática",bloco:"E",tema:"Phishing",dif:"media",fixo:true,ordem:114,s:"A técnica de Phishing consiste na instalação automática de um programa espião no computador da vítima no momento em que ela abre uma imagem formatada em JPG recebida por e-mail.",a:false,e:"ERRADO. Phishing é uma técnica de ENGENHARIA SOCIAL que engana a vítima para que forneça dados sigilosos (senhas, dados bancários) por meio de mensagens/sites falsos; a descrição do enunciado se aproxima mais de um exploit ou malware disfarçado."},
{m:"Informática",bloco:"E",tema:"Firewall",dif:"facil",fixo:true,ordem:115,s:"Um Firewall tem como função primária a varredura e eliminação de vírus já instalados no sistema operacional.",a:false,e:"ERRADO. A função do firewall é controlar e filtrar o tráfego de rede (entrada/saída), não detectar e remover vírus já instalados  1�7 essa é função do antivírus."},
{m:"Informática",bloco:"E",tema:"Worm",dif:"media",fixo:true,ordem:116,s:"O Worm (verme) diferencia-se do vírus tradicional por ser capaz de se propagar automaticamente pelas redes de computadores, sem a necessidade de se anexar a um arquivo hospedeiro ou de intervenção humana direta.",a:true,e:"CERTO. O worm se autorreplica e se propaga sozinho pela rede, diferente do vírus, que precisa se anexar a um arquivo hospedeiro e geralmente depende de ação humana para se espalhar."},
{m:"Informática",bloco:"E",tema:"Autenticação em dois fatores",dif:"facil",fixo:true,ordem:117,s:"A autenticação em dois fatores (2FA) adiciona uma camada extra de segurança ao processo de login, exigindo algo que o usuário sabe (senha) e algo que ele possui (como um código enviado ao celular) ou é (biometria).",a:true,e:"CERTO. O 2FA combina dois fatores distintos de autenticação (conhecimento, posse ou característica biométrica) para aumentar a segurança do login."},
{m:"Informática",bloco:"E",tema:"Spyware",dif:"media",fixo:true,ordem:118,s:"Os programas do tipo Spyware são desenvolvidos com o objetivo principal de realizar cópias de segurança (backup) preventivas dos dados sensíveis do usuário.",a:false,e:"ERRADO. O spyware tem como objetivo espionar e coletar informações da vítima sem seu consentimento, geralmente enviando-as a terceiros mal-intencionados  1�7 não se trata de uma ferramenta de backup."},
{m:"Informática",bloco:"E",tema:"Backup incremental",dif:"dificil",fixo:true,ordem:119,s:"O backup do tipo Incremental realiza a cópia apenas dos arquivos que foram alterados ou criados desde o último backup realizado (seja ele completo ou incremental), marcando-os como copiados.",a:true,e:"CERTO. O backup incremental copia somente os arquivos modificados/criados desde o último backup de qualquer tipo, e desmarca (limpa) o atributo de arquivamento após copiá-los."},
{m:"Informática",bloco:"E",tema:"Backup diferencial",dif:"dificil",fixo:true,ordem:120,s:"O procedimento de backup Diferencial copia todos os arquivos modificados desde o último backup completo, sem desmarcar o atributo de modificação do arquivo, o que faz com que cada backup diferencial acumule as alterações até que um novo backup completo seja feito.",a:true,e:"CERTO. O backup diferencial sempre parte do último backup completo, copiando tudo que mudou desde então, sem limpar o atributo de arquivamento  1�7 por isso acumula dados a cada novo diferencial, até o próximo completo."},

{m:"Português",bloco:"G",tema:"Oração explicativa",dif:"media",fixo2:true,ordem2:1,s:"Texto: “A leitura, na era digital, disputa a atenção do indivíduo com um sem-número de estímulos. Se antes o livro impunha um ritmo pausado, hoje as telas fragmentam a concentração e estimulam a passagem veloz de um conteúdo a outro. Não se trata, contudo, de demonizar a tecnologia: cabe ao leitor, a quem se atribui o protagonismo do ato de ler, disciplinar-se para que o meio não desfoque a profundidade. Quando se cultivam o silêncio e a paciência, a leitura reencontra a sua vocação primordial, que é a de formar o pensamento crítico. 1�7 Com base no texto, julgue: a oração ‘a quem se atribui o protagonismo do ato de ler 1�7, isolada por vírgulas, tem natureza explicativa e poderia ser suprimida do período sem prejuízo da correção gramatical.",a:true,e:"CERTO. Isolada por vírgulas, a oração é explicativa (acrescenta uma informação sobre ‘o leitor 1�7, sem restringir seu sentido); pode ser suprimida sem comprometer a correção gramatical, embora se perca a informação."},
{m:"Português",bloco:"G",tema:"Sinonímia e substituição lexical",dif:"facil",fixo2:true,ordem2:2,s:"Texto: “A leitura, na era digital, disputa a atenção do indivíduo com um sem-número de estímulos. Se antes o livro impunha um ritmo pausado, hoje as telas fragmentam a concentração e estimulam a passagem veloz de um conteúdo a outro. Não se trata, contudo, de demonizar a tecnologia: cabe ao leitor, a quem se atribui o protagonismo do ato de ler, disciplinar-se para que o meio não desfoque a profundidade. Quando se cultivam o silêncio e a paciência, a leitura reencontra a sua vocação primordial, que é a de formar o pensamento crítico. 1�7 Com base no texto, julgue: a substituição da expressão ‘um sem-número de estímulos 1�7 por ‘inúmeros estímulos 1�7 preservaria o sentido original do texto, dado que o vocábulo ‘sem-número 1�7 exprime quantidade indeterminada e elevada.",a:true,e:"CERTO. ‘Sem-número 1�7 é expressão que indica quantidade indeterminada e grande, equivalente a ‘inúmeros 1�7; a substituição preserva o sentido."},
{m:"Português",bloco:"G",tema:"Pronome apassivador x IIS",dif:"dificil",fixo2:true,ordem2:3,s:"Texto: “A leitura, na era digital, disputa a atenção do indivíduo com um sem-número de estímulos. Se antes o livro impunha um ritmo pausado, hoje as telas fragmentam a concentração e estimulam a passagem veloz de um conteúdo a outro. Não se trata, contudo, de demonizar a tecnologia: cabe ao leitor, a quem se atribui o protagonismo do ato de ler, disciplinar-se para que o meio não desfoque a profundidade. Quando se cultivam o silêncio e a paciência, a leitura reencontra a sua vocação primordial, que é a de formar o pensamento crítico. 1�7 Com base no texto, julgue: na oração ‘a quem se atribui o protagonismo do ato de ler 1�7, a partícula ‘se 1�7 é índice de indeterminação do sujeito, o que justifica a manutenção da forma verbal ‘atribui 1�7 na terceira pessoa do singular.",a:false,e:"ERRADO. Como ‘atribuir 1�7 é verbo transitivo direto e indireto e há objeto direto (‘o protagonismo 1�7) capaz de se tornar sujeito paciente, ‘se 1�7 é pronome APASSIVADOR (voz passiva sintética: ‘o protagonismo é atribuído... 1�7), e não índice de indeterminação do sujeito."},
{m:"Português",bloco:"G",tema:"Oração adjetiva explicativa",dif:"media",fixo2:true,ordem2:4,s:"Texto: “A leitura, na era digital, disputa a atenção do indivíduo com um sem-número de estímulos. Se antes o livro impunha um ritmo pausado, hoje as telas fragmentam a concentração e estimulam a passagem veloz de um conteúdo a outro. Não se trata, contudo, de demonizar a tecnologia: cabe ao leitor, a quem se atribui o protagonismo do ato de ler, disciplinar-se para que o meio não desfoque a profundidade. Quando se cultivam o silêncio e a paciência, a leitura reencontra a sua vocação primordial, que é a de formar o pensamento crítico. 1�7 Com base no texto, julgue: no trecho ‘a sua vocação primordial, que é a de formar o pensamento crítico 1�7, o vocábulo ‘que 1�7 introduz oração subordinada adjetiva restritiva, cujo antecedente é ‘vocação primordial 1�7.",a:false,e:"ERRADO. A vírgula antes de ‘que 1�7 indica oração adjetiva EXPLICATIVA (não restritiva), pois apenas acrescenta uma informação sobre um antecedente já definido (‘vocação primordial 1�7)."},
{m:"Português",bloco:"G",tema:"Objeto direto",dif:"media",fixo2:true,ordem2:5,s:"Texto: “A leitura, na era digital, disputa a atenção do indivíduo com um sem-número de estímulos. Se antes o livro impunha um ritmo pausado, hoje as telas fragmentam a concentração e estimulam a passagem veloz de um conteúdo a outro. Não se trata, contudo, de demonizar a tecnologia: cabe ao leitor, a quem se atribui o protagonismo do ato de ler, disciplinar-se para que o meio não desfoque a profundidade. Quando se cultivam o silêncio e a paciência, a leitura reencontra a sua vocação primordial, que é a de formar o pensamento crítico. 1�7 Com base no texto, julgue: em ‘a leitura reencontra a sua vocação primordial 1�7, a expressão ‘a sua vocação primordial 1�7 desempenha a função de objeto direto da forma verbal ‘reencontra 1�7.",a:true,e:"CERTO. ‘Reencontrar 1�7 é verbo transitivo direto, e ‘a sua vocação primordial 1�7 é o termo que sofre diretamente a ação verbal, exercendo função de objeto direto."},
{m:"Português",bloco:"G",tema:"Transitividade verbal",dif:"dificil",fixo2:true,ordem2:6,s:"Texto: “A leitura, na era digital, disputa a atenção do indivíduo com um sem-número de estímulos. Se antes o livro impunha um ritmo pausado, hoje as telas fragmentam a concentração e estimulam a passagem veloz de um conteúdo a outro. Não se trata, contudo, de demonizar a tecnologia: cabe ao leitor, a quem se atribui o protagonismo do ato de ler, disciplinar-se para que o meio não desfoque a profundidade. Quando se cultivam o silêncio e a paciência, a leitura reencontra a sua vocação primordial, que é a de formar o pensamento crítico. 1�7 Com base no texto, julgue: caso se substituísse ‘disputa a atenção do indivíduo 1�7 por ‘disputa pela atenção do indivíduo 1�7, a forma verbal ‘disputar 1�7 passaria a ser empregada como verbo intransitivo, sem alteração do sentido de concorrência expresso no texto.",a:false,e:"ERRADO. ‘Disputar algo 1�7 (transitivo direto) e ‘disputar por algo 1�7 (transitivo indireto) são ambas construções TRANSITIVAS; a mudança altera a regência (direta para indireta), mas o verbo não se torna intransitivo."},
{m:"Português",bloco:"G",tema:"Pronome apassivador com verbo intransitivo (regência)",dif:"dificil",fixo2:true,ordem2:7,s:"Texto: “As cidades brasileiras convivem, há décadas, com enchentes que se repetem a cada estação chuvosa. Embora se invista em obras de drenagem, a impermeabilização do solo avança mais depressa que as soluções de engenharia. Especialistas advertem que, enquanto não se planejar o crescimento urbano de modo integrado, os episódios de alagamento tenderão a agravar-se. 1�7 Com base no texto, julgue: em ‘Embora se invista em obras de drenagem 1�7, a partícula ‘se 1�7 é pronome apassivador, e ‘obras de drenagem 1�7 é o sujeito paciente, com o qual a forma verbal deveria concordar, na terceira pessoa do plural: ‘Embora se invistam em obras de drenagem 1�7.",a:false,e:"ERRADO. ‘Investir EM algo 1�7 é regência indireta (transitivo indireto), que não admite voz passiva; nesse caso, ‘se 1�7 é índice de indeterminação do sujeito, e o verbo permanece sempre na terceira pessoa do singular (‘se investe 1�7), não concordando com ‘obras de drenagem 1�7."},
{m:"Português",bloco:"G",tema:"Futuro do presente e sujeito",dif:"facil",fixo2:true,ordem2:8,s:"Texto: “As cidades brasileiras convivem, há décadas, com enchentes que se repetem a cada estação chuvosa. Embora se invista em obras de drenagem, a impermeabilização do solo avança mais depressa que as soluções de engenharia. Especialistas advertem que, enquanto não se planejar o crescimento urbano de modo integrado, os episódios de alagamento tenderão a agravar-se. 1�7 Com base no texto, julgue: no segmento ‘os episódios de alagamento tenderão a agravar-se 1�7, a forma verbal ‘tenderão 1�7 está flexionada no futuro do presente do indicativo e tem como sujeito a expressão ‘os episódios de alagamento 1�7.",a:true,e:"CERTO. ‘Tenderão 1�7 é futuro do presente do indicativo (tender + ão), concordando com o sujeito plural ‘os episódios de alagamento 1�7."},
{m:"Português",bloco:"G",tema:"Comparação de superioridade",dif:"media",fixo2:true,ordem2:9,s:"Texto: “As cidades brasileiras convivem, há décadas, com enchentes que se repetem a cada estação chuvosa. Embora se invista em obras de drenagem, a impermeabilização do solo avança mais depressa que as soluções de engenharia. Especialistas advertem que, enquanto não se planejar o crescimento urbano de modo integrado, os episódios de alagamento tenderão a agravar-se. 1�7 Com base no texto, julgue: em ‘a impermeabilização do solo avança mais depressa que as soluções de engenharia 1�7, o vocábulo ‘que 1�7 introduz o segundo termo de uma estrutura comparativa de igualdade estabelecida pelo advérbio ‘mais 1�7.",a:false,e:"ERRADO. A estrutura ‘mais...que 1�7 estabelece comparação de SUPERIORIDADE, não de igualdade (esta seria expressa por ‘tão...quanto/como 1�7)."},
{m:"Português",bloco:"G",tema:"Regência verbal (aspirar)",dif:"media",fixo2:true,ordem2:10,s:"Na oração ‘Aspira-se a uma sociedade mais justa 1�7, julgue: o emprego da preposição ‘a 1�7 decorre da regência da forma verbal ‘aspira 1�7, empregada no sentido de almejar, sendo o termo ‘a uma sociedade mais justa 1�7 objeto indireto.",a:true,e:"CERTO. No sentido de ‘almejar 1�7, ‘aspirar 1�7 é transitivo indireto, regendo a preposição ‘a 1�7; o termo regido é objeto indireto."},
{m:"Português",bloco:"G",tema:"Crase",dif:"dificil",fixo2:true,ordem2:11,s:"Na frase ‘O relatório foi entregue à diretora às pressas 1�7, julgue: ambos os sinais indicativos de crase se justificam: o primeiro, pela regência de ‘entregue 1�7 combinada ao artigo definido feminino; o segundo, por integrar locução adverbial de base feminina.",a:true,e:"CERTO. ‘Entregar algo A alguém 1�7 rege a preposição ‘a 1�7, que se funde ao artigo feminino antes de ‘diretora 1�7 (à); ‘às pressas 1�7 é locução adverbial feminina fixa que também exige crase."},
{m:"Português",bloco:"G",tema:"Pontuação: vírgula entre sujeito e predicado",dif:"media",fixo2:true,ordem2:12,s:"Na frase ‘Os candidatos que se prepararam com afinco, obtiveram os melhores resultados 1�7, julgue: a vírgula está corretamente empregada, pois isola o sujeito do predicado, conferindo-lhe o devido destaque estilístico.",a:false,e:"ERRADO. É regra gramatical básica que a vírgula NUNCA deve separar sujeito e predicado; a vírgula empregada nessa frase está INCORRETA."},
{m:"História do Brasil",bloco:"G",tema:"Constituição de 1824 - Poder Moderador",dif:"media",fixo2:true,ordem2:13,s:"A Constituição de 1824, outorgada por D. Pedro I, instituiu o Poder Moderador, privativo do imperador e considerado a chave de toda a organização política, ao lado dos Poderes Legislativo, Executivo e Judiciário.",a:true,e:"CERTO. O Poder Moderador, exclusivo do Imperador, foi definido na própria Constituição de 1824 (art. 98) como ‘a chave de toda a organização política 1�7, coexistindo com os demais três poderes."},
{m:"História do Brasil",bloco:"G",tema:"Ato Adicional de 1834",dif:"media",fixo2:true,ordem2:14,s:"O Ato Adicional de 1834, ao instituir a Regência Una e criar as Assembleias Legislativas Provinciais, caracterizou-se como medida de natureza centralizadora, por haver retirado das províncias a autonomia de que até então dispunham.",a:false,e:"ERRADO. O Ato Adicional de 1834 é classicamente apontado como medida DESCENTRALIZADORA, pois AMPLIOU a autonomia das províncias ao criar as Assembleias Legislativas Provinciais, e não o contrário."},
{m:"História do Brasil",bloco:"G",tema:"Leis abolicionistas - ordem cronológica",dif:"dificil",fixo2:true,ordem2:15,s:"No processo de abolição gradual da escravidão, a Lei dos Sexagenários foi promulgada anteriormente à Lei do Ventre Livre, a qual conferia liberdade aos filhos de mulheres escravizadas nascidos a partir de sua vigência.",a:false,e:"ERRADO. A ordem cronológica correta é: Lei do Ventre Livre (1871) e, somente depois, a Lei dos Sexagenários (1885)  1�7 esta última veio DEPOIS, não antes."},
{m:"História do Brasil",bloco:"G",tema:"Lei Eusébio de Queirós",dif:"facil",fixo2:true,ordem2:16,s:"A Lei Eusébio de Queirós, de 1850, ao proibir o tráfico transatlântico de escravizados para o Brasil, concorreu para estimular a imigração europeia e a difusão do trabalho assalariado nas lavouras de café.",a:true,e:"CERTO. Com o fim do tráfico negreiro em 1850, os cafeicultores passaram a investir na imigração europeia como alternativa de mão de obra, estimulando o trabalho assalariado."},
{m:"História do Brasil",bloco:"G",tema:"Guerra do Paraguai",dif:"facil",fixo2:true,ordem2:17,s:"A Guerra do Paraguai (1864 1�71870), maior conflito armado da história da América do Sul, encerrou-se com a vitória da Tríplice Aliança, integrada por Brasil, Argentina e Uruguai, e contribuiu para o fortalecimento político do Exército brasileiro.",a:true,e:"CERTO. A Guerra do Paraguai foi o maior conflito armado do continente sul-americano, vencida pela Tríplice Aliança, e fortaleceu politicamente o Exército, fator relevante para a Proclamação da República em 1889."},
{m:"História do Brasil",bloco:"G",tema:"Proclamação da República",dif:"media",fixo2:true,ordem2:18,s:"A Proclamação da República, em 15 de novembro de 1889, foi conduzida por setores militares e caracterizou-se pela ampla mobilização popular, que acompanhou ativamente a deposição de D. Pedro II.",a:false,e:"ERRADO. A Proclamação da República foi um movimento essencialmente militar/elitista, sem participação popular ativa; é famosa a frase de Aristides Lobo de que o povo assistiu a tudo ‘bestializado 1�7, sem entender o que se passava."},
