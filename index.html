{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:29,s:"O período em questão foi marcado pela violação dos direitos humanos no Brasil por meio de diferentes práticas, entre as quais, torturas.",a:true,e:"CERTO. Torturas, prisões arbitrárias, desaparecimentos e mortes foram práticas documentadas de violação de direitos humanos durante o regime militar."},
{m:"História do Brasil",bloco:"E",tema:"Ditadura Militar (1964-1985)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:30,s:"No início da década de 60 do século passado, após a renúncia de Jânio Quadros, os chefes militares das três Forças Armadas tentaram impedir a posse do vice-presidente João Goulart no cargo de presidente da República.",a:true,e:"CERTO. Após a renúncia de Jânio Quadros (agosto de 1961), os ministros militares tentaram impedir a posse de João Goulart; a posse só ocorreu graças à Campanha da Legalidade, liderada por Brizola, sob regime parlamentarista."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:31,s:"A Revolta de Beckman costuma ser classificada como um dos movimentos nativistas do período colonial brasileiro, uma vez que não contestava, de nenhuma forma, a dominação portuguesa.",a:true,e:"CERTO. A Revolta de Beckman é um movimento nativista: contestava o monopólio da Companhia de Comércio, não a dominação portuguesa em si  1�7 os revoltosos declaravam fidelidade ao rei."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:32,s:"A partir de 1650, com a expulsão dos holandeses do Nordeste brasileiro, o Estado do Maranhão entrou em declínio. A crise econômica havia se instalado em função da carência de mão de obra escrava, bem como do abastecimento e escoamento de produtos.",a:true,e:"CERTO. Após a expulsão dos holandeses (1654), o Maranhão sofreu com escassez de mão de obra escrava e dificuldades de abastecimento e escoamento, o que motivou a criação da Companhia de Comércio em 1682."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:33,s:"A Companhia do Comércio do Maranhão, criada pela Coroa Portuguesa em 1682, deveria resolver os problemas mencionados. A Companhia efetuaria o comércio de escravizados africanos e forneceria produtos vindos de Espanha.",a:false,e:"ERRADO. A Companhia Geral de Comércio do Maranhão fornecia produtos vindos de Portugal (metrópole), e não da Espanha."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:34,s:"Os altos preços praticados pela Companhia de Comércio e o monopólio (também chamado de estanco) causaram revolta entre os proprietários e a população em geral.",a:true,e:"CERTO. O estanco (monopólio comercial) da Companhia, com preços abusivos, foi uma das principais causas da revolta de 1684."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:35,s:"A população maranhense passou a viver em condições de extrema pobreza no período pré-revolta. As pessoas sofriam com a falta de abastecimento de gêneros básicos, como alimentos e manufaturados, normalmente de péssima qualidade e vendidos a preços altíssimos.",a:true,e:"CERTO. O monopólio da Companhia gerava desabastecimento crônico, produtos de má qualidade e preços altíssimos, agravando a miséria da população."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:36,s:"Os comerciantes locais foram muito lesados pelo monopólio da Companhia de Comércio do Maranhão, enquanto os proprietários rurais recebiam preços justos pelos seus produtos.",a:false,e:"ERRADO. Os proprietários rurais também eram prejudicados: recebiam preços baixos da Companhia por seus produtos e pagavam caro pelas mercadorias importadas, dentro do monopólio."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:37,s:"Os colonos maranhenses se sublevaram, em 1684, para reivindicar a extinção da Companhia Geral de Comércio do Estado do Maranhão e a expulsão dos jesuítas da província, que defendiam os indígenas contra a escravização.",a:true,e:"CERTO. A revolta de 1684 teve entre suas reivindicações a extinção da Companhia de Comércio e a expulsão dos jesuítas, que se opunham à escravização indígena (não confundir com a expulsão geral dos jesuítas do Brasil, feita por Pombal só em 1759-1760)."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:38,s:"Em março de 1684 ocorreu a Revolta de Beckman no Maranhão, durante a ausência do governador Francisco de Sá e Menezes, que se encontrava na cidade de Belém.",a:false,e:"ERRADO. A Revolta de Beckman eclodiu em fevereiro de 1684 (24 de fevereiro), não em março."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:39,s:"Os líderes da Revolta de Beckman foram os irmãos Manuel e Tomás Beckman, juntamente com Jorge de Sampaio de Carvalho. Eles contaram com o apoio da população local, comerciantes e proprietários rurais.",a:true,e:"CERTO. Manuel Beckman, seu irmão Tomás Beckman e Jorge de Sampaio de Carvalho lideraram a revolta, com apoio de senhores de engenho, comerciantes e da população."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:40,s:"Os revoltosos renderam o Corpo da Guarda em São Luís, capturaram o Capitão-mor Baltasar Fernandes e saquearam um depósito da Companhia de Comércio do Maranhão, dando início à revolta.",a:true,e:"CERTO. Os revoltosos tomaram o Corpo da Guarda, prenderam o capitão-mor Baltasar Fernandes e saquearam o armazém da Companhia  1�7 o estopim da revolta."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:41,s:"Em 25 de fevereiro de 1684, os insurgentes já haviam tomado a Câmara Municipal de São Luís e estabelecido uma Junta Geral de Governo, composta por latifundiários, comerciantes e clero.",a:true,e:"CERTO. Os revoltosos assumiram a Câmara e formaram uma Junta de Governo local, composta pelas elites da colônia."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:42,s:"Assim que foram empossados, os revoltosos depuseram o Capitão-mor e o Prefeito, bem como decretaram o fim do estanco (monopólio) e da Companhia de Comércio.",a:false,e:"ERRADO. O cargo correto da época era \"governador\", não \"prefeito\" (anacronismo)  1�7 os revoltosos depuseram o capitão-mor e o governador, além de decretar o fim do estanco e da Companhia de Comércio."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:43,s:"A junta de governo maranhense despachou seus emissários para Belém do Pará, a fim de comunicar a deposição do governador. Outros emissários foram despachados para Portugal, destacando-se Tomás Beckman, enviado a Lisboa para jurar fidelidade ao rei e à Coroa e para denunciar a Companhia de Comércio.",a:true,e:"CERTO. A Junta enviou emissários a Belém e a Portugal; Tomás Beckman foi a Lisboa jurar fidelidade ao rei e denunciar os abusos da Companhia de Comércio."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:44,s:"Ao desembarcar em Lisboa, Tomás Beckman recebeu voz de prisão e foi trazido de volta ao Maranhão, onde foi condenado ao desterro (exílio).",a:true,e:"CERTO. Tomás Beckman foi preso em Lisboa e, de volta ao Maranhão, condenado ao desterro para Portugal."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:45,s:"Em 1685, no Brasil, os revoltosos ocuparam o Colégio dos Mascates e expulsaram os jesuítas que viviam ali. Por cerca de um ano, Manuel Beckman controlou uma junta revolucionária e governou a Província do Maranhão.",a:false,e:"ERRADO. O nome do colégio jesuíta ocupado em São Luís não era \"Colégio dos Mascates\"  1�7 essa expressão remete à Guerra dos Mascates, em Pernambuco (1710-1711), episódio totalmente diferente."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:46,s:"Em 15 de maio de 1685, no comando de tropas portuguesas, o novo governador, Gomes Freire de Andrade, desembarcou em São Luís, onde não encontrou resistência. Ele reempossou as autoridades e, com a confirmação das acusações feitas à Companhia do Comércio do Maranhão, solicitou o fim de suas atividades.",a:true,e:"CERTO. Gomes Freire de Andrade chegou como novo governador em 1685, restabeleceu a ordem e a Companhia de Comércio do Maranhão foi extinta pela Coroa, reconhecendo que as denúncias dos revoltosos procediam."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:47,s:"Os líderes da Revolta de Beckman, Manuel Beckman e Jorge de Sampaio, foram presos, julgados e condenados à morte na forca, enquanto os outros envolvidos foram condenados à prisão perpétua.",a:true,e:"CERTO. Manuel Beckman e Jorge de Sampaio foram condenados à forca; os demais líderes tiveram penas de prisão perpétua ou degredo."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:48,s:"Manuel Beckman é considerado por alguns historiadores um precursor dos movimentos de contestação ao domínio português no Brasil, décadas antes da figura de Tiradentes. Seu sobrenome, de origem germânica, é frequentemente grafado em sua forma aportuguesada, Bequimão.",a:true,e:"CERTO. Manuel Beckman (Bequimão) é considerado por alguns historiadores um precursor de movimentos de contestação, décadas antes de Tiradentes, ainda que seus objetivos fossem distintos dos da Inconfidência Mineira."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:49,s:"A pena capital foi aplicada a Manuel Beckman em 10 de novembro de 1685, mais de 20 meses após a eclosão da Revolta de Beckman.",a:true,e:"CERTO. Da eclosão da revolta (fevereiro de 1684) até a execução de Manuel Beckman (10 de novembro de 1685) passaram-se cerca de 21 meses."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:50,s:"A Coroa reagiu à Revolta de Beckman enviando, em 1685, nova guarnição militar sob o comando do general Gomes Freire de Andrade, que restabeleceu as autoridades depostas e restaurou a ordem colonial. Manuel Beckman foi preso, julgado militarmente e executado por enforcamento no segundo semestre de 1685, assim como Jorge de Sampaio.",a:true,e:"CERTO. Gomes Freire de Andrade restabeleceu a ordem, e Manuel Beckman e Jorge de Sampaio foram condenados à forca e executados no segundo semestre de 1685."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:51,s:"A repressão à Revolta de Beckman foi dura: além das execuções, vários revoltosos receberam penas de degredo e confisco de bens. No caso de Beckman, as propriedades confiscadas foram leiloadas, mas o próprio governador Gomes Freire adquiriu-as e as devolveu posteriormente à viúva e filhas de Beckman.",a:true,e:"CERTO. Além das execuções, houve degredo e confisco de bens; consta que Gomes Freire de Andrade adquiriu os bens confiscados de Beckman e depois os devolveu à família."},
{m:"História do Maranhão",bloco:"E",tema:"Revolta de Beckman (1684-1685)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:52,s:"A Revolta de Beckman foi liderada pelos irmãos Manuel e Tomás Beckman, os quais contestavam o monopólio da Companhia de Comércio do Maranhão e a falta de acesso à mão de obra escravizada, sobretudo africana.",a:true,e:"CERTO. Os irmãos Beckman lideraram a revolta contra o monopólio comercial e em defesa do acesso à mão de obra escravizada africana, já que os jesuítas protegiam os indígenas da escravidão."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Cultura Maranhense (Bumba Meu Boi, Tambor de Crioula, Reggae)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:53,s:"A formação cultural do Maranhão resulta do encontro e da fusão de três matrizes principais: a indígena, a africana e a europeia (principalmente portuguesa e francesa).",a:true,e:"CERTO. A cultura maranhense funde as matrizes indígena, africana e europeia (sobretudo portuguesa e francesa)."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Cultura Maranhense (Bumba Meu Boi, Tambor de Crioula, Reggae)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:54,s:"A herança indígena na cultura maranhense reflete-se no artesanato de palha de tucum, no uso da mandioca na culinária e em lendas locais.",a:true,e:"CERTO. O artesanato de palha de tucum, o uso da mandioca e do tucupi na culinária e as lendas locais são heranças indígenas na cultura maranhense."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Cultura Maranhense (Bumba Meu Boi, Tambor de Crioula, Reggae)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:55,s:"O centro histórico de São Luís destaca-se pela arquitetura colonial portuguesa e francesa, com casarões revestidos por azulejos.",a:true,e:"CERTO. O Centro Histórico de São Luís, Patrimônio da Humanidade, tem arquitetura colonial de influência portuguesa e francesa, com casarões azulejados."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Cultura Maranhense (Bumba Meu Boi, Tambor de Crioula, Reggae)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:56,s:"O Bumba Meu Boi do Maranhão é reconhecido pela UNESCO como Patrimônio Cultural Imaterial da Humanidade.",a:true,e:"CERTO. O Bumba Meu Boi do Maranhão foi reconhecido pela UNESCO como Patrimônio Cultural Imaterial da Humanidade em 2019."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Cultura Maranhense (Bumba Meu Boi, Tambor de Crioula, Reggae)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:57,s:"As festividades do Bumba Meu Boi ocorrem predominantemente durante o período do Carnaval, no início do ano.",a:false,e:"ERRADO. O Bumba Meu Boi ocorre principalmente nos meses de junho e julho (festejos juninos), e não no Carnaval."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Cultura Maranhense (Bumba Meu Boi, Tambor de Crioula, Reggae)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:58,s:"O Sotaque de Matraca do Bumba Meu Boi é caracterizado pelo ritmo marcado por instrumentos de sopro e cordas luxuosas.",a:false,e:"ERRADO. O Sotaque de Matraca é marcado por pedaços de madeira (matracas) e grandes pandeiros. Instrumentos de sopro e cordas caracterizam o Sotaque de Zabumba/Orquestra."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Cultura Maranhense (Bumba Meu Boi, Tambor de Crioula, Reggae)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:59,s:"O Sotaque de Zapona (ou Orquestra) utiliza instrumentos como clarinetes, saxofones e violões em suas apresentações.",a:true,e:"CERTO. O Sotaque de Zabumba (Orquestra) usa instrumentos de sopro e cordas, como clarinetes, saxofones e violões, com indumentárias luxuosas."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Cultura Maranhense (Bumba Meu Boi, Tambor de Crioula, Reggae)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:60,s:"O Sotaque de Costa de Mão é originário da região de Cururupu e caracteriza-se pelo toque no pandeiro utilizando as costas das mãos.",a:true,e:"CERTO. O Sotaque de Costa de Mão, típico de Cururupu, se caracteriza pelo toque nos pandeiros com as costas das mãos."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Cultura Maranhense (Bumba Meu Boi, Tambor de Crioula, Reggae)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:61,s:"O Tambor de Crioula é uma dança de origem predominantemente europeia, executada em homenagem a São João.",a:false,e:"ERRADO. O Tambor de Crioula é de origem afro-brasileira e é praticado tradicionalmente em louvor a São Benedito, não a São João."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Cultura Maranhense (Bumba Meu Boi, Tambor de Crioula, Reggae)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:62,s:"A \"pungada\" ou umbigada é um gesto característico do Tambor de Crioula, trocado entre as dançarinas (coureiras).",a:true,e:"CERTO. A pungada (umbigada) é o toque de quadris trocado entre as coureiras no Tambor de Crioula."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Cultura Maranhense (Bumba Meu Boi, Tambor de Crioula, Reggae)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:63,s:"Os instrumentos do Tambor de Crioula consistem em um conjunto de três tambores artesanais feitos de tronco de árvore, chamados de parelha.",a:true,e:"CERTO. A parelha do Tambor de Crioula é formada por três tambores de tronco: o tambor grande, o meião e o crivo."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Cultura Maranhense (Bumba Meu Boi, Tambor de Crioula, Reggae)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:64,s:"O reggae chegou ao Maranhão por volta da década de 1970 e transformou São Luís em um dos maiores polos do gênero no país, rendendo-lhe o apelido de \"Jamaica Brasileira\".",a:true,e:"CERTO. A partir dos anos 1970, o reggae jamaicano se popularizou em São Luís, que ganhou o apelido de \"Jamaica Brasileira\"."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Cultura Maranhense (Bumba Meu Boi, Tambor de Crioula, Reggae)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:65,s:"Uma das marcas do reggae no Maranhão é a forma de dançar em dupla (\"agarradinho\") e a presença das \"radiolas\" de som.",a:true,e:"CERTO. O \"agarradinho\" (dança colada em dupla) e as radiolas (paredões de som) são marcas do reggae maranhense."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Cultura Maranhense (Bumba Meu Boi, Tambor de Crioula, Reggae)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:66,s:"A Festa do Divino Espírito Santo, com grande relevância na cidade de Alcântara, mistura elementos do catolicismo popular com tradições afro-maranhenses.",a:true,e:"CERTO. A Festa do Divino Espírito Santo, célebre em Alcântara, mescla fé católica popular, símbolos da coroa portuguesa e elementos afro-maranhenses."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Cultura Maranhense (Bumba Meu Boi, Tambor de Crioula, Reggae)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:67,s:"As \"Caixeiras\" são figuras centrais na Festa do Divino Espírito Santo, responsáveis por tocar caixas (tambores pequenos) e cantar hinos e louvores.",a:true,e:"CERTO. As caixeiras tocam caixas (pequenos tambores) e cantam hinos na Festa do Divino Espírito Santo."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Cultura Maranhense (Bumba Meu Boi, Tambor de Crioula, Reggae)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:68,s:"O Arroz de Cuxá tem como ingrediente principal a folha de vinagreira, combinada com camarão seco, gergelim e farinha de mandioca.",a:true,e:"CERTO. O arroz de cuxá, prato mais tradicional do Maranhão, leva folha de vinagreira, camarão seco, gergelim e farinha de mandioca."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Cultura Maranhense (Bumba Meu Boi, Tambor de Crioula, Reggae)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:69,s:"O Guaraná Jesus é um refrigerante típico maranhense de cor rosa, conhecido pelo sabor levemente adocicado que remete a cravo e canela.",a:true,e:"CERTO. O Guaraná Jesus é um refrigerante rosa, típico do Maranhão, com sabor adocicado de cravo e canela."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Cultura Maranhense (Bumba Meu Boi, Tambor de Crioula, Reggae)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:70,s:"O \"Doce de Espécie\" é uma iguaria tradicional da cidade de Alcântara feita à base de coco e açúcar.",a:true,e:"CERTO. Os \"doces de espécie\", à base de coco e açúcar, são tradicionais de Alcântara."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Cultura Maranhense (Bumba Meu Boi, Tambor de Crioula, Reggae)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:71,s:"O artesanato feito com fibra e palha de buriti e tucum é uma importante atividade cultural e econômica no Maranhão.",a:true,e:"CERTO. O artesanato com fibra e palha de buriti e tucum é uma atividade cultural e econômica relevante no Maranhão."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Cultura Maranhense (Bumba Meu Boi, Tambor de Crioula, Reggae)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:72,s:"A lenda da Serpente Encantada conta que um grande réptil adormecido vive no subsolo de São Luís e que, se sua cabeça encontrar o rabo, a ilha afundará.",a:true,e:"CERTO. Essa é uma lenda popular maranhense sobre a Serpente Encantada, associada ao folclore de São Luís."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto e Lei Orgânica das Polícias Militares",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:73,s:"O acesso à hierarquia militar é seletivo, gradual e sucessivo, e será feito mediante promoções, de conformidade com a legislação pertinente, de modo a obter-se um fluxo regular e equilibrado.",a:true,e:"CERTO. O acesso à hierarquia militar se dá de forma seletiva, gradual e sucessiva, por meio de promoções, garantindo fluxo regular na carreira."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto e Lei Orgânica das Polícias Militares",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:74,s:"O oficial presumivelmente incapaz de permanecer como policial-militar da ativa será submetido a Conselho de Disciplina na forma prevista na legislação específica e peculiar.",a:false,e:"ERRADO. O oficial presumivelmente incapaz de permanecer na ativa é submetido a Conselho de Justificação, não a Conselho de Disciplina (este é o órgão aplicável às praças)."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto e Lei Orgânica das Polícias Militares",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:75,s:"Os Subtenentes e Sargentos são essencialmente os elementos de execução e deverão pautar-se pelo conhecimento das normas necessárias à execução dos serviços e das missões que lhes forem atribuídas.",a:false,e:"ERRADO. Subtenentes e sargentos não são apenas \"elementos de execução\": cabe a eles também cooperar na instrução e na liderança das praças, servindo de elo entre oficiais e praças."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto e Lei Orgânica das Polícias Militares",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:76,s:"Policial militar da ativa da Polícia Militar do Maranhão que for posto à disposição de órgão de inteligência da Polícia Militar do Piauí será considerado em exercício na função de policial militar.",a:true,e:"CERTO. O militar posto à disposição de órgão de inteligência policial-militar de outro Estado é considerado em efetivo exercício da função de policial militar."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto e Lei Orgânica das Polícias Militares",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:77,s:"A aprovação em concurso público é requisito único e indispensável para que um policial militar ingresse na graduação de terceiro sargento.",a:false,e:"ERRADO. O ingresso na graduação de terceiro-sargento normalmente ocorre por promoção interna na carreira, e não apenas por aprovação em concurso público externo."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto e Lei Orgânica das Polícias Militares",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:78,s:"De acordo com a Lei nº 6.513 de 30 de novembro de 1995, o ingresso na Polícia Militar do Maranhão é obrigatório a todos os brasileiros, sem distinção de raça ou crença religiosa, mediante matrícula ou nomeação, após aprovação em concurso público de provas e/ou de provas e títulos.",a:false,e:"ERRADO. O ingresso na Polícia Militar do Maranhão é facultativo (voluntário), não obrigatório, ainda que aberto a todos os brasileiros sem distinção de raça ou crença, mediante concurso público."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto e Lei Orgânica das Polícias Militares",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:79,s:"Quanto à Lei Estadual nº 6.513 de 30 de novembro de 1995, é possível destacar que a hierarquia e a disciplina são as bases institucionais da Polícia Militar, sendo que a autoridade e a responsabilidade crescem com o grau hierárquico.",a:true,e:"CERTO. Hierarquia e disciplina são as bases institucionais da PM; autoridade e responsabilidade crescem proporcionalmente ao grau hierárquico."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto e Lei Orgânica das Polícias Militares",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:80,s:"As Polícias Militares dos Estados são integrantes do Sistema Único de Segurança Pública (SUSP).",a:true,e:"CERTO. As Polícias Militares dos Estados integram o SUSP, instituído pela Lei nº 13.675/2018."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto e Lei Orgânica das Polícias Militares",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:81,s:"Compete às Polícias Militares e aos Corpos de Bombeiros Militares dos Estados, do DF e dos Territórios a realização de atos de polícia judiciária.",a:false,e:"ERRADO. A realização de atos de polícia judiciária é atribuição da Polícia Civil (e da Polícia Federal), e não das Polícias Militares e dos Corpos de Bombeiros Militares."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto e Lei Orgânica das Polícias Militares",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:82,s:"As Polícias Militares e os Corpos de Bombeiros Militares dos Estados, do DF e dos Territórios são instituições permanentes.",a:true,e:"CERTO. A Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023) as define como instituições permanentes, organizadas com base na hierarquia e disciplina."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto e Lei Orgânica das Polícias Militares",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:83,s:"A \"exclusividade\" não é um princípio expressamente listado no artigo 3º da Lei nº 14.751/2023, que rege as polícias militares e os corpos de bombeiros militares dos Estados, do DF e dos Territórios.",a:true,e:"CERTO. O art. 3º da Lei 14.751/2023 lista princípios como legalidade, hierarquia, disciplina, publicidade com transparência e universalidade, entre outros  1�7 mas não a \"exclusividade\"."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto e Lei Orgânica das Polícias Militares",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:84,s:"É permitido aos militares divulgar imagens de pessoas sob sua custódia sem prévia autorização judicial.",a:false,e:"ERRADO. Divulgar imagens de pessoas sob custódia sem autorização judicial fere direitos de imagem e dignidade da pessoa, não sendo permitido pela legislação."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto e Lei Orgânica das Polícias Militares",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:85,s:"São garantias das polícias militares e dos corpos de bombeiros militares dos Estados, do DF e dos Territórios, bem como de seus membros ativos e veteranos da reserva remunerada e reformados, entre outras: o uso dos títulos e designações hierárquicas.",a:true,e:"CERTO. O uso dos títulos e designações hierárquicas, mesmo na reserva ou reforma, é uma garantia prevista para os militares estaduais."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto e Lei Orgânica das Polícias Militares",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:86,s:"O militar com menos de 10 (dez) anos de serviço que for candidato a mandato eletivo será agregado no dia posterior ao pedido de registro de sua candidatura na Justiça Eleitoral com remuneração, enquanto perdurar o pleito eleitoral, e, se eleito, no ato da diplomação passará para a reserva remunerada com remuneração proporcional ao tempo de serviço.",a:true,e:"CERTO. O militar com menos de dez anos de serviço, candidato a cargo eletivo, é agregado (com remuneração) durante o pleito e, se eleito, passa à reserva remunerada proporcional ao tempo de serviço, na diplomação."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto e Lei Orgânica das Polícias Militares",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:87,s:"O militar eleito e que tomar posse como suplente será agregado ao respectivo quadro, enquanto perdurar o mandato temporário, podendo manter as duas remunerações.",a:false,e:"ERRADO. O militar agregado por exercício de mandato eletivo não pode acumular as duas remunerações; recebe apenas a remuneração do cargo que estiver exercendo."},
{m:"Legislação Institucional",bloco:"E",tema:"Estatuto e Lei Orgânica das Polícias Militares",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:88,s:"É vedado aos militares, enquanto em atividade, participar de sociedade comercial, salvo como cotista, acionista e comanditário, e exercer atividade gerencial ou administrativa nessas empresas, salvo na hipótese de licença para tratar de interesse particular.",a:true,e:"CERTO. Militares da ativa podem ser cotistas, acionistas ou comanditários em sociedades comerciais, mas não podem exercer função gerencial ou administrativa nelas, salvo em licença para tratar de interesse particular."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:89,s:"A região de MATOPIBA abrange territórios dos estados do Maranhão, Tocantins, Piauí e Bahia, sendo reconhecida como uma importante fronteira agrícola do agronegócio no Brasil.",a:true,e:"CERTO. MATOPIBA é a sigla para Maranhão, Tocantins, Piauí e Bahia, considerada a última fronteira agrícola do país."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:90,s:"O município de Balsas, localizado no Sul do Maranhão, destaca-se como o principal polo de produção de grãos e agronegócio de alta tecnologia do estado.",a:true,e:"CERTO. Balsas é o principal polo do agronegócio de alta tecnologia no Maranhão, referência na produção de soja."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:91,s:"A cultura da soja ocupa a maior área plantada no estado do Maranhão, sendo o principal produto de pauta de exportação do agronegócio local.",a:true,e:"CERTO. A soja é o maior produto agrícola do estado, ocupando mais de 65% das áreas cultivadas, e o Maranhão é o 2º maior produtor da Região Nordeste."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:92,s:"A produção de milho no Maranhão é predominantemente cultivada em regime de primeira safra, sendo inviável a sua utilização como safrinha devido às condições climáticas.",a:false,e:"ERRADO. O milho no Maranhão costuma ser cultivado como segunda safra (safrinha), plantado após a colheita da soja."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:93,s:"O Porto do Itaqui, em São Luís, desempenha papel irrelevante no escoamento da safra agrícola do Maranhão, sendo o transporte prioritariamente feito por rodovias rumo ao Sudeste.",a:false,e:"ERRADO. O Porto do Itaqui é fundamental no escoamento da produção agrícola maranhense (soja e milho do MATOPIBA), com acesso direto por ferrovia, e não pouco relevante."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:94,s:"A Baixada Maranhense destaca-se no cenário pecuário pela criação expressiva de búfalos, adaptados às áreas úmidas e alagáveis da região.",a:true,e:"CERTO. A Baixada Maranhense abriga um dos maiores rebanhos de búfalos do país, adaptados ao ambiente alagado da região."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:95,s:"O Maranhão é o maior produtor nacional do extrativismo de coco babaçu, atividade tradicional desenvolvida principalmente pelas comunidades de quebradeiras de coco.",a:true,e:"CERTO. O Maranhão é o maior produtor nacional de amêndoa de babaçu, atividade tradicional das quebradeiras de coco."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:96,s:"O rebanho bovino do Maranhão ultrapassa a marca de 10 milhões de cabeças, posicionando o estado entre os líderes do setor na Região Nordeste.",a:true,e:"CERTO. O Maranhão tem o 2º maior rebanho bovino de corte do Nordeste, superando 10 milhões de cabeças."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:97,s:"A produção de arroz no Maranhão é restrita à agricultura comercial do Sul, não havendo cultivo representativo por pequenos produtores na Baixada Maranhense.",a:false,e:"ERRADO. O Maranhão lidera a produção de arroz no Nordeste, com forte presença da agricultura familiar na Baixada Maranhense e no Vale do Pindaré, não só do agronegócio do Sul."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:98,s:"A agricultura familiar no Maranhão desempenha papel fundamental no abastecimento do mercado interno com culturas como a mandioca e o feijão.",a:true,e:"CERTO. A agricultura familiar maranhense é essencial para a segurança alimentar local, com destaque para a mandioca e o feijão."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:99,s:"O cultivo da cana-de-açúcar no Maranhão tem crescido com destino à fabricação de biocombustíveis e cachaça em polos do Leste Maranhense.",a:true,e:"CERTO. A cana-de-açúcar no Maranhão é voltada à produção de etanol e cachaça, com força no Leste Maranhense e no Alto Parnaíba."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:100,s:"O bioma caatinga ocupa mais de 80% do território maranhense, condicionando a agricultura estadual a técnicas exclusivas de convivência com o semiárido severo.",a:false,e:"ERRADO. A Caatinga ocupa apenas uma pequena parte (cerca de 5%) do território maranhense, no leste do estado; a maior parte do território é de transição entre Amazônia e Cerrado."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:101,s:"A cultura do algodão herbáceo destaca-se na região Sul do estado, integrando a rotação de culturas em grandes propriedades mecanizadas.",a:true,e:"CERTO. O algodão herbáceo é cultivado no Sul do Maranhão, em rotação com soja e milho em propriedades mecanizadas do MATOPIBA."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:102,s:"A exportação de boi vivo (gado em pé) pelo Porto do Itaqui é um dos destaques do setor pecuário maranhense no comércio internacional.",a:true,e:"CERTO. A exportação de boi vivo pelo Porto do Itaqui é um destaque recente do agronegócio pecuário maranhense."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:103,s:"A bacia leiteira de Açailândia representa um importante polo de produção e processamento de derivados do leite na região Oeste do Maranhão.",a:true,e:"CERTO. Açailândia se destaca como polo leiteiro na região Oeste do estado."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:104,s:"A Lei do Livre Babaçu busca garantir o acesso extrativista das quebradeiras de coco às palmeiras de babaçu, mesmo em propriedades privadas.",a:true,e:"CERTO. Leis do \"Babaçu Livre\", adotadas em municípios maranhenses, garantem às quebradeiras acesso aos babaçuais mesmo em terras privadas."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:105,s:"A mandioca no Maranhão destina-se prioritariamente à exportação in natura para os países da União Europeia.",a:false,e:"ERRADO. A mandioca maranhense é destinada, sobretudo, ao abastecimento interno e à produção de farinha, e não à exportação in natura para a Europa."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:106,s:"O Corredor Nacala é a principal ferrovia responsável por transportar os grãos do Sul do Maranhão até os portos do estado.",a:false,e:"ERRADO. O Corredor Nacala fica em Moçambique, na África. No Maranhão, o escoamento de grãos se dá pela Ferrovia Norte-Sul (FNS) e pela Estrada de Ferro Carajás (EFC)."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:107,s:"O uso de queimadas não controladas para renovação de pastagens e roçados ainda representa um desafio socioambiental para a agricultura tradicional no estado.",a:true,e:"CERTO. Queimadas não controladas seguem como um desafio ambiental na agricultura tradicional e na pecuária extensiva maranhense."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:108,s:"A avicultura e a suinocultura maranhenses passam por expansão para abastecer os grandes centros urbanos do estado, como São Luís e Imperatriz.",a:true,e:"CERTO. Avicultura e suinocultura crescem na região central e oeste do estado para atender centros urbanos como São Luís e Imperatriz."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:109,s:"As Quebradeiras de Coco Babaçu representam um movimento social que busca proibir qualquer exploração comercial dos babaçuais no estado.",a:false,e:"ERRADO. As quebradeiras de coco lutam pelo livre acesso às palmeiras de babaçu e por melhores condições de trabalho, não pela proibição da exploração comercial."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:110,s:"A extração de cera de carnaúba no Maranhão ocorre exclusivamente nos ecossistemas de manguezal ao longo do litoral.",a:false,e:"ERRADO. A carnaúba é extraída principalmente em áreas de várzea e beira de rios no interior do estado, não exclusivamente em manguezais litorâneos."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:111,s:"O Maranhão é desprovido de depósitos de gás natural, importando o insumo para atender suas demandas energéticas.",a:false,e:"ERRADO. O Maranhão possui gás natural na Bacia do Parnaíba, explorado para geração de energia termelétrica, não dependendo de importação."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:112,s:"A bauxita é um recurso mineral extraído no estado do Maranhão e processado para suprir a cadeia de produção do alumínio.",a:true,e:"CERTO. A bauxita extraída no oeste maranhense abastece a produção de alumina e alumínio, inclusive via Consórcio Alumar."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Agropecuária e Extrativismo do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:113,s:"As atividades extrativas no Maranhão têm importância estritamente voltada à exportação, sem impacto na segurança alimentar das famílias do estado.",a:false,e:"ERRADO. O extrativismo (babaçu, mandioca, pesca etc.) também é fundamental para a segurança alimentar e a subsistência de famílias maranhenses, não só para exportação."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Portos e Logística de Transportes do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:114,s:"O Porto do Itaqui é um porto público administrado pela EMAP (Empresa Maranhense de Administração Portuária), destacando-se no escoamento de grãos (como a soja através do TEGRAM) e no recebimento de combustíveis e fertilizantes.",a:true,e:"CERTO. O Porto do Itaqui é público, administrado pela EMAP, referência no escoamento de grãos (soja pelo TEGRAM) e recebimento de combustíveis e fertilizantes."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Portos e Logística de Transportes do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:115,s:"O Terminal Marítimo de Ponta da Madeira é um terminal de uso privado mantido pela Vale S.A., operando prioritariamente o embarque de minério de ferro extraído das minas de Carajás.",a:true,e:"CERTO. Ponta da Madeira é operado pela Vale e é voltado ao escoamento de minério de ferro de Carajás."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Portos e Logística de Transportes do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:116,s:"O Porto da Alumar é voltado para a movimentação de insumos industriais específicos, como bauxita, alumina, soda cáustica e carvão, atendendo ao complexo produtor de alumínio.",a:true,e:"CERTO. O Terminal da Alumar, privado, movimenta bauxita, alumina, soda cáustica e carvão para o complexo de alumínio."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Portos e Logística de Transportes do Maranhão",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:117,s:"A profundidade (calado) das águas na Baía de São Marcos é rasa, o que exige dragagem constante para permitir a atracação de navios de grande porte, como o Valemax.",a:false,e:"ERRADO. A Baía de São Marcos tem calado naturalmente profundo (podendo passar de 20 metros), o que dispensa dragagem constante e permite a atracação de navios como os Valemax."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Portos e Logística de Transportes do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:118,s:"A BR-135 é a única via de acesso terrestre à Ilha de São Luís (Região Metropolitana de São Luís).",a:false,e:"ERRADO. Embora a BR-135 seja a principal ligação rodoviária federal à Ilha de São Luís, não é a única via de acesso terrestre à Região Metropolitana."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Portos e Logística de Transportes do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:119,s:"O sistema de transporte por ferry-boat realiza a travessia de veículos e passageiros entre São Luís (Terminal do Cujupe) e Alcântara.",a:true,e:"CERTO. O ferry-boat faz a travessia de veículos e passageiros entre São Luís (Terminal do Cujupe/Ponta da Espera) e Alcântara."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Portos e Logística de Transportes do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:120,s:"A malha viária do Maranhão apresenta predominância absoluta do modal hidroviário para o transporte de cargas gerais no interior do estado, em detrimento do modal rodoviário.",a:false,e:"ERRADO. No Maranhão predomina o modal rodoviário para o transporte de cargas gerais e de pessoas no interior do estado, e não o hidroviário."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Portos e Logística de Transportes do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:121,s:"A Estrada de Ferro Carajás (EFC) é utilizada exclusivamente para o escoamento de minério, não realizando transporte de passageiros nem de outras cargas.",a:false,e:"ERRADO. Além do minério, a Estrada de Ferro Carajás (EFC) também transporta passageiros (trem entre São Luís e Parauapebas) e outras cargas, como grãos."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Portos e Logística de Transportes do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:122,s:"O Terminal Marítimo de Ponta da Madeira é operado pela Petrobras e tem como foco o desembarque de petróleo bruto para o litoral maranhense.",a:false,e:"ERRADO. Ponta da Madeira é operado pela Vale, com foco no embarque (exportação) de minério de ferro  1�7 e não no desembarque de petróleo pela Petrobras."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Indústria e Parque Industrial do Maranhão",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:123,s:"A indústria de base no Maranhão é caracterizada por uma restrição severa de calado, o que impede a atracação de embarcações das classes Panamax e Valemax, sendo o Consórcio Alumar um dos principais expoentes no setor.",a:false,e:"ERRADO. O complexo portuário maranhense é caracterizado por calado profundo (não restrição severa), o que justamente permite a atracação de navios de grande porte, como Panamax e Valemax, inclusive os que atendem a Alumar."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Clima, Relevo e Biomas do Maranhão",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:124,s:"O clima predominante no Maranhão é o Tropical, o que explica a baixa pluviosidade em quase todo o estado, com exceção da região da Caatinga.",a:false,e:"ERRADO. O clima predominante no Maranhão tem pluviosidade elevada na maior parte do território; é a região da Caatinga, no leste, que apresenta baixa pluviosidade (semiárido), e não o contrário."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Clima, Relevo e Biomas do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:125,s:"Diferente da maioria dos estados brasileiros, a capital do Maranhão, São Luís, foi inicialmente fundada por colonizadores franceses, no século XVII.",a:true,e:"CERTO. Diferente da maioria das capitais brasileiras, São Luís foi fundada por colonizadores franceses (1612), antes de passar ao domínio português."},
{m:"Geografia do Maranhão",bloco:"E",tema:"Clima, Relevo e Biomas do Maranhão",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote3",ordem3:126,s:"O relevo maranhense é marcado pela predominância de grandes altitudes, com cadeias montanhosas que ultrapassam os 2.000 metros na região central do estado.",a:false,e:"ERRADO. O relevo maranhense é predominantemente de baixas altitudes (planícies e planaltos suaves), sem cadeias montanhosas que ultrapassem 2.000 metros."},
{m:"Português",bloco:"E",tema:"Sintaxe: Orações Subordinadas Substantivas e Adjetivas",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:1,s:"De acordo com um texto sobre saúde mental no trabalho, os dados relativos a esse tema, tanto no contexto mundial quanto no nacional, evidenciam a necessidade de ampliação do debate sobre o assunto.",a:true,e:"CERTO. O texto cita dados da OMS (mundial) e do INSS (nacional) sobre afastamentos por transtornos mentais, reforçando a necessidade de ampliar o debate."},
{m:"Português",bloco:"E",tema:"Sintaxe: Orações Subordinadas Substantivas e Adjetivas",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:2,s:"Em um trecho como \"...confirmam a necessidade de se trazer o debate ainda mais à tona\", o vocábulo \"ainda\" classifica-se como advérbio e expressa circunstância de intensidade, podendo ser substituído por \"muito\", sem prejuízo ao sentido e à correção gramatical do texto.",a:true,e:"CERTO. Nesse contexto, \"ainda\" reforça o comparativo \"mais\", funcionando como advérbio de intensidade; a substituição por \"muito\" preserva o sentido e a gramaticalidade."},
{m:"Português",bloco:"E",tema:"Sintaxe: Orações Subordinadas Substantivas e Adjetivas",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:3,s:"Em \"Estima-se que...\" (início de um período), a colocação do pronome \"se\" após o verbo (ênclise) se deve à presença da conjunção \"que\", que viria logo em seguida.",a:false,e:"ERRADO. A ênclise em início de período ocorre porque a língua portuguesa não admite iniciar frase com pronome átono, e não por causa da conjunção \"que\", que vem depois do verbo."},
{m:"Português",bloco:"E",tema:"Sintaxe: Orações Subordinadas Substantivas e Adjetivas",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:4,s:"Entende-se da leitura de um texto sobre saúde mental que o relatório publicado pela Organização Mundial da Saúde tem como público-alvo principal empresas públicas e privadas.",a:false,e:"ERRADO. O relatório da OMS traz estratégias para governos, empregadores e trabalhadores (e suas organizações), não apenas \"empresas públicas e privadas\" como público-alvo principal."},
{m:"Português",bloco:"E",tema:"Sintaxe: Orações Subordinadas Substantivas e Adjetivas",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:5,s:"Os sentidos e a correção gramatical de um parágrafo seriam preservados se, no período anterior, a vírgula antes de uma conjunção como \"enquanto\" fosse substituída por ponto, a conjunção fosse omitida e fosse feito o devido ajuste de letra inicial minúscula e maiúscula na palavra que inicia o novo período.",a:true,e:"CERTO. Esse tipo de reestruturação (separar em dois períodos independentes, com o devido ajuste de maiúscula) é gramaticalmente válida e costuma preservar o sentido geral do texto."},
{m:"Português",bloco:"E",tema:"Sintaxe: Orações Subordinadas Substantivas e Adjetivas",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:6,s:"De acordo com as normas gramaticais, é facultativo o emprego do sinal indicativo de crase na expressão \"à tona\".",a:false,e:"ERRADO. \"À tona\" é uma locução consagrada (como \"às pressas\", \"à mão\") em que o emprego do acento indicativo de crase é obrigatório, não facultativo."},
{m:"Português",bloco:"E",tema:"Sintaxe: Orações Subordinadas Substantivas e Adjetivas",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:7,s:"(CESPE/CEBRASPE - 2025 - PC/DF - Agente Administrativo) Em \"Temia-se, nesse sentido, que as inestimáveis riquezas naturais do Brasil despertassem a cobiça internacional...\", a vírgula empregada após \"sentido\" sinaliza que a oração \"que as inestimáveis riquezas naturais do Brasil despertassem a cobiça internacional\" tem função adjetiva e sentido explicativo.",a:false,e:"ERRADO. A oração \"que as inestimáveis riquezas... despertassem a cobiça internacional\" é subordinada substantiva objetiva direta (complementa \"temia-se que...\"), e não adjetiva explicativa; a vírgula apenas isola o adjunto intercalado \"nesse sentido\"."},
{m:"Português",bloco:"E",tema:"Sintaxe: Orações Subordinadas Substantivas e Adjetivas",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:8,s:"(CESPE/CEBRASPE - 2025 - EMBRAPA - Analista) Em \"há manchas verdes, três ou quatro, perto das ilhas que estão mais nítidas\", o segmento \"que estão mais nítidas\" restringe o sentido de \"ilhas\".",a:true,e:"CERTO. Sem vírgula antes de \"que\", a oração é adjetiva restritiva, delimitando quais ilhas estão mais nítidas."},
{m:"Português",bloco:"E",tema:"Sintaxe: Orações Subordinadas Substantivas e Adjetivas",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:9,s:"(CESPE/CEBRASPE - 2024 - BACEN - Analista) Em \"a mediação de plataformas digitais, que conectam ofertantes e demandantes de trabalho\", a oração \"que conectam ofertantes e demandantes de trabalho\" restringe o sentido do segmento \"plataformas digitais\".",a:false,e:"ERRADO. A vírgula antes de \"que\" indica que a oração é adjetiva explicativa (acrescenta uma informação sobre as plataformas digitais), e não restritiva."},
{m:"Português",bloco:"E",tema:"Sintaxe: Orações Subordinadas Substantivas e Adjetivas",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:10,s:"(CESPE/CEBRASPE - 2024 - Prefeitura de Cachoeiro de Itapemirim/ES - Professor) Na frase \"as habilidades de leitura e de escrita necessárias para uma participação... nas práticas sociais e profissionais que envolvem a língua escrita\", a oração \"que envolvem a língua escrita\" classifica-se como subordinada adjetiva restritiva.",a:true,e:"CERTO. Sem vírgula antes de \"que\", a oração restringe o sentido de \"práticas sociais e profissionais\", classificando-se como adjetiva restritiva."},
{m:"Português",bloco:"E",tema:"Sintaxe: Orações Subordinadas Substantivas e Adjetivas",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:11,s:"(CESPE/CEBRASPE - 2024 - SME do Recife - Professor) Em \"esses livros que nos fascinam e que nos vão transformando em leitores paulatinamente\", as orações \"que nos fascinam e que nos vão transformando em leitores paulatinamente\" são classificadas como adjetivas explicativas, pois qualificam e explicam o termo antecedente, \"esses livros\".",a:false,e:"ERRADO. Como não há vírgula isolando as orações antes de \"que\", elas são subordinadas adjetivas restritivas (restringem quais livros), e não explicativas."},
{m:"Português",bloco:"E",tema:"Sintaxe: Orações Subordinadas Substantivas e Adjetivas",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:12,s:"(CESPE/CEBRASPE - 2023 - SME do Recife - Professor) Em \"isso mostra que a docência se torna opção pela facilidade em ingressar no ensino superior, não pela vocação\", o vocábulo \"que\" introduz uma oração subordinada substantiva objetiva direta.",a:true,e:"CERTO. \"Que\" introduz o complemento direto do verbo \"mostrar\" (\"mostra que a docência...\"), caracterizando uma oração subordinada substantiva objetiva direta."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:13,s:"A complementação da retribuição pecuniária conferida ao Coronel no exercício do cargo de Comandante-Geral da PMMA sofre incidência obrigatória de contribuição previdenciária para o custeio da inatividade dos militares estaduais.",a:false,e:"ERRADO. A Lei 12.896/2026 estabelece, para as complementações de retribuição de cargos de comando (Comandante-Geral, Subcomandante-Geral, Chefe do EMG), que elas NÃO sofrem incidência de contribuição para custeio da inatividade dos militares (Lei Complementar 224/2020)."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:14,s:"O relatório detalhado de atividades da Corporação, de divulgação pública e anual obrigatória pelo Comandante-Geral, deve abranger, entre outros aspectos, o número de ocorrências policiais atendidas por tipo, o orçamento previsto e executado, bem como dados relativos à letalidade e à vitimização de policiais e de civis.",a:true,e:"CERTO. O art. 10 da Lei 12.896/2026 exige que esse relatório anual contenha exatamente esses itens, além das representações apuradas contra membros da instituição."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:15,s:"As atribuições de assessoramento direto, segurança, apoio administrativo e gestão documental necessárias ao eficiente funcionamento do Comando-Geral competem ao Gabinete do Comandante-Geral, desempenhadas sob a coordenação do Ajudante de Ordens da corporação.",a:false,e:"ERRADO. Essas atribuições são desempenhadas sob a coordenação do Assistente do Comandante-Geral, e não do Ajudante de Ordens, que é apenas uma das unidades do Gabinete."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:16,s:"Ao Coronel no exercício do cargo de Subcomandante-Geral é assegurada uma complementação indenizatória temporária correspondente a 50% da complementação da retribuição pecuniária atribuída ao Comandante-Geral.",a:true,e:"CERTO. A Lei 12.896/2026 (art. 13, §2º) fixa exatamente esse percentual de 50% para a complementação do Subcomandante-Geral."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:17,s:"No âmbito do Estado-Maior Geral, a formulação, definição e planejamento da política institucional relacionada a pessoal, saúde e legislação são de atribuição da 1ª Seção do EMG (PM/1).",a:true,e:"CERTO. A 1ª Seção do Estado-Maior Geral (PM/1) trata de Pessoal, Saúde e Legislação, conforme a Lei 12.896/2026."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:18,s:"A 4ª Seção do Estado-Maior Geral (PM/4) tem como competência institucional planejar, definir e elaborar a política de comunicação social, marketing, publicidade e ação social da corporação.",a:false,e:"ERRADO. A 4ª Seção (PM/4) trata de Logística, Suprimento, Patrimônio e Transporte; comunicação social é atribuição da Diretoria de Comunicação Social (DCS), vinculada à 5ª Seção (Comunicação Social e Eventos)."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:19,s:"Compete à 6ª Seção do Estado-Maior Geral (PM/6) definir, elaborar e planejar a política institucional de proposições sobre planejamento orçamentário, finanças e controle da corporação.",a:true,e:"CERTO. A 6ª Seção (PM/6) trata exatamente de Planejamento Orçamentário, Finanças e Controle."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:20,s:"A definição e o planejamento da política institucional de Doutrina Operacional e Administrativa, Ensino e Cultura incumbem à 7ª Seção do Estado-Maior Geral (PM/7).",a:true,e:"CERTO. A 7ª Seção (PM/7) é responsável por definir, elaborar e planejar a política institucional de Doutrina Operacional e Administrativa, Ensino e Cultura."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:21,s:"A Diretoria-Geral de Ensino Regular (DGER) é responsável pela gestão da política institucional de ensino regular da corporação, sucedendo formalmente a antiga Diretoria de Ensino Regular (DER).",a:true,e:"CERTO. A DGER sucede a antiga DER (criada pela Lei nº 10, de 26 de março de 2018) em todas as suas competências, atribuições e responsabilidades."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:22,s:"O Comando de Missões Especiais (CME) possui entre suas competências legais a coordenação e execução de operações de alto risco contra o crime organizado, crimes violentos e ataques a instituições financeiras.",a:true,e:"CERTO. O art. 43 da Lei 12.896/2026 atribui exatamente essa competência ao CME, além do apoio aos demais comandos de policiamento."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:23,s:"Por força da fixação de suas sedes na Região Metropolitana de São Luís, todos os Grandes Comandos possuem circunscrição restrita a essa região metropolitana, dependendo de autorização legislativa prévia para atuar nos demais municípios do interior.",a:false,e:"ERRADO. Todos os Grandes Comandos têm sede na Região Metropolitana de São Luís, mas a maioria tem circunscrição em todo o Estado; apenas o Comando de Policiamento Metropolitano (CPM) e o Comando de Policiamento do Interior (CPI) têm área de atuação geograficamente restrita (à metrópole e ao interior, respectivamente), e não por exigência de autorização legislativa prévia."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:24,s:"A implementação, coordenação e monitoramento do Programa de Integridade, visando à promoção da ética, transparência, gestão de riscos e combate à corrupção na PMMA, competem à Unidade de Gestão de Integridade e Compliance (UGI).",a:true,e:"CERTO. A UGI, órgão de assessoramento da PMMA (Lei 12.896/2026), é responsável pela integridade institucional, incluindo o Programa de Integridade."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:25,s:"A Comissão de Promoção de Oficiais (CPO) e a Comissão de Promoção de Praças (CPP) são presididas, respectivamente, pelo Comandante-Geral e pelo Subcomandante-Geral da corporação.",a:true,e:"CERTO. A Lei 12.896/2026 estabelece que a CPO é presidida pelo Comandante-Geral e a CPP, pelo Subcomandante-Geral."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:26,s:"A condução dos processos licitatórios e a formalização de contratos e convênios no âmbito da PMMA são de responsabilidade da Comissão Setorial de Licitação (CSL), enquadrada como órgão de apoio ao Comando-Geral.",a:true,e:"CERTO. A CSL integra os órgãos de apoio ao Comando-Geral e é responsável pelos processos licitatórios da corporação."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote4",ordem3:27,s:"O Centro de Educação, Formação e Aperfeiçoamento Profissional (CEFAP) sucede o antigo Centro de Formação e Aperfeiçoamento de Praças (CFAP) em todas as suas competências e atribuições.",a:true,e:"CERTO (provável, seguindo o padrão de sucessão institucional adotado pela Lei 12.896/2026 para outros órgãos renomeados, como a DGER em relação à DER, e a DGPL em relação à DAL)."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:1,s:"Cabe ao Subcomandante-Geral da PMMA assegurar a disponibilização de policiais militares para a segurança de autoridades e pessoas ameaçadas, prescindindo de deliberação prévia do Conselho Estadual de Segurança Pública.",a:false,e:"ERRADO. Segundo a Lei 12.896/2026 (art. 14), essa atribuição do Subcomandante-Geral não prescinde da deliberação do Conselho Estadual de Segurança Pública, sendo necessária a sua manifestação prévia."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:2,s:"Na indisponibilidade de Coronel da reserva remunerada para exercer a função de Diretor dos Colégios Militares mantidos em regime de convênio com municípios, a função poderá ser exercida por Oficial Superior da reserva remunerada e, na ausência deste, por Oficial Superior da ativa.",a:false,e:"ERRADO. A ordem de substituição prevista na lei é a inversa: primeiro se busca Oficial Superior da ATIVA e, na ausência deste, Oficial Superior da reserva remunerada."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:3,s:"O planejamento, a coordenação e a fiscalização do emprego de sistemas de aeronaves não tripuladas (drones) e do sistema de radiocomunicação na PMMA são atribuições institucionais do Centro de Material Bélico (CMB).",a:false,e:"ERRADO. Essa atribuição é do Centro de Tecnologia e Telemática (CTT), e não do Centro de Material Bélico (CMB), que trata de armamentos e munições."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:4,s:"O atendimento clínico e cirúrgico dos animais da corporação, como cães e cavalos, garantindo sua higidez para o serviço operacional, é de responsabilidade da Policlínica Veterinária da Polícia Militar (PVPM).",a:true,e:"CERTO. A PVPM é o órgão responsável pela saúde dos animais de serviço da corporação."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:5,s:"O Centro de Perícias e Saúde Ocupacional (CPPSO) responde pela execução das perícias médicas, inspeções de saúde regulamentares e pelo funcionamento das Juntas Militar de Saúde.",a:true,e:"CERTO. O CPPSO (art. 67 da Lei 12.896/2026) é responsável pelas perícias médicas, inspeções de saúde e funcionamento das Juntas de Saúde."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"facil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:6,s:"A prestação de assistência religiosa, espiritual e moral aos membros da corporação e suas famílias é realizada por meio da Capelania Militar Monsenhor Hélio Maranhão.",a:true,e:"CERTO. A Capelania Militar Monsenhor Hélio Maranhão é o órgão responsável pela assistência religiosa na PMMA."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:7,s:"As Companhias de Polícia Militar Independentes e os Esquadrões de Polícia Montada da PMMA possuem efetivo regulamentar fixado entre 271 e 335 policiais militares.",a:false,e:"ERRADO. O efetivo regulamentar dessas unidades (Tipo I) é fixado em até 250 policiais militares, e não entre 271 e 335."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:8,s:"O Corregedor-Geral da Polícia Militar é o substituto imediato do Chefe do Estado-Maior Geral, possuindo precedência hierárquica e funcional sobre os demais oficiais do último posto.",a:true,e:"CERTO. O Corregedor-Geral substitui imediatamente o Chefe do Estado-Maior Geral, com a precedência hierárquica correspondente."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:9,s:"O Presídio Militar da PMMA, subordinado à Corregedoria-Geral, destina-se exclusivamente ao cumprimento de sentenças penais condenatórias transitadas em julgado, sendo vedada a custódia de policiais militares presos provisoriamente.",a:false,e:"ERRADO. É justamente o contrário: o Presídio Militar também recebe (ou é destinado prioritariamente a) presos provisórios, não sendo restrito apenas às sentenças transitadas em julgado."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:10,s:"Os Oficiais integrantes do Quadro de Oficiais Músicos (QOMus.), oriundos do Quadro de Praças Músicos, possuem a prerrogativa de progredir na carreira militar até o posto de Coronel.",a:false,e:"ERRADO. A progressão dos Oficiais Músicos oriundos do Quadro de Praças vai até o posto de Tenente-Coronel, e não até Coronel."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:11,s:"O ingresso no Quadro de Oficiais Capelães (QOC) dá-se no posto inicial de Segundo-Tenente PM, sendo permitida a progressão na hierarquia militar até o posto de Capitão PM.",a:true,e:"CERTO. Os Oficiais Capelães ingressam como 2º Tenente e podem progredir até o posto de Capitão."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:12,s:"Na inexistência de militar que detenha o posto ou a graduação exigidos para determinada função na PMMA, admite-se a designação de militar de hierarquia imediatamente inferior, contanto que haja compatibilidade técnica.",a:true,e:"CERTO. A lei permite essa designação excepcional por hierarquia imediatamente inferior, desde que haja compatibilidade técnica para a função."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei de Organização Básica da PMMA (Lei 12.896/2026)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:13,s:"Os Coronéis que não possuem o Curso de Comando e Estado-Maior (CCEM) na data de entrada em vigor da Lei ficam imediatamente impedidos de assumir cargos de direção ou comando superior na corporação.",a:true,e:"CERTO. A Lei 12.896/2026 estabelece essa restrição para Coronéis sem o CCEM a partir de sua entrada em vigor."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:14,s:"A função de fiscal de contrato no âmbito dos órgãos e unidades da PMMA deve ser exercida prioritariamente por servidor civil ocupante de cargo efetivo lotado no órgão ou unidade.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:15,s:"Na promoção de Oficiais ao posto de Capitão PM, a proporção fixada na legislação é de cinco vagas por merecimento para uma vaga por antiguidade.",a:false,e:"ERRADO. É ao contrário: a proporção é de cinco vagas por antiguidade para uma vaga por merecimento."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:16,s:"As polícias militares e os corpos de bombeiros militares dos Estados, do Distrito Federal e dos Territórios são definidos por lei como instituições militares permanentes, exclusivas e típicas de Estado, essenciais à Justiça Militar e componentes das forças auxiliares e reserva do Exército.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:17,s:"Dentre os princípios básicos enumerados na Lei Orgânica Nacional, prevê-se expressamente o princípio da publicidade, acrescido do dever legal de transparência e prestação de contas.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:18,s:"Constitui diretriz nacional impositiva para a atuação das corporações militares estaduais o uso racional da força e o uso progressivo dos meios no exercício de suas competências.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:19,s:"A apuração de infrações penais militares realizada sob a presidência de oficial militar consubstancia função dotada de natureza jurídica essencial e exclusiva de Estado.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:20,s:"As corporações militares estaduais podem firmar contratos administrativos para transferir a empresas privadas a execução direta de suas funções constitucionais de preservação da ordem pública e polícia ostensiva.",a:false,e:"ERRADO. Trata-se de atividade exclusiva de Estado, indelegável a empresas privadas."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:21,s:"É competência privativa das polícias militares estaduais a execução da polícia de preservação da ordem pública, da polícia ostensiva e da polícia judiciária civil.",a:false,e:"ERRADO. A polícia judiciária civil é atribuição da Polícia Civil; à PM cabe a polícia judiciária militar."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:22,s:"A atuação da Polícia Militar na fiscalização de trânsito rodoviário e urbano afasta e extingue as competências específicas dos agentes de trânsito concursados em carreira própria dos municípios.",a:false,e:"ERRADO. A atuação da PM no trânsito é concorrente/complementar, não extingue as competências dos agentes municipais de trânsito."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:23,s:"As polícias militares possuem competência legal para lavrar autos de infração ambiental e aplicar as sanções e penalidades administrativas correspondentes, na condição de integrantes do Sistema Nacional do Meio Ambiente (Sisnama).",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:24,s:"Compete aos corpos de bombeiros militares executar com exclusividade absoluta todas as ações de busca, salvamento e resgate, sobrepondo-se inclusive às competências da União.",a:false,e:"ERRADO. A palavra correta é \"prioritariamente\", não \"exclusividade absoluta\", que sobreporia indevidamente às competências da União."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:25,s:"As ações de prevenção, combate a incêndio e perícia administrativa de incêndio e explosão constituem competências executadas privativamente pelos corpos de bombeiros militares.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:26,s:"A realização de perícia administrativa em local de incêndio pelo corpo de bombeiros militar deve ocorrer após a liberação da cena pelo perito criminal da polícia científica, salvo em caso de manifesta impossibilidade da presença deste.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:27,s:"Cabe aos corpos de bombeiros militares a atribuição de regulamentar, credenciar e fiscalizar empresas, escolas formadoras e brigadas civis de incêndio relativas à prestação de serviços de segurança contra incêndio e emergência.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:28,s:"A organização das polícias militares e dos corpos de bombeiros militares do Distrito Federal e dos Territórios é regulada por meio de lei distrital de iniciativa do Governador do Distrito Federal.",a:false,e:"ERRADO. A organização das PMs/CBMs do DF e dos Territórios é regulada por LEI FEDERAL, já que são organizados e mantidos pela União."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:29,s:"Na estrutura básica das corporações militares estaduais, os órgãos de direção setorial destinam-se a realizar a administração das atividades de inteligência, recursos humanos, saúde, ensino, logística e gestão orçamentária.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:30,s:"Os órgãos de apoio das corporações militares estaduais responsabilizam-se pela execução das atividades-fim da instituição, enquanto os órgãos de execução respondem pelas atividades-meio.",a:false,e:"ERRADO. É o inverso: órgãos de apoio cuidam das atividades-meio; órgãos de execução, das atividades-fim."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"dificil",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:31,s:"A atuação dos órgãos de correição desconcentrada nas corporações militares estaduais extingue a responsabilidade e o exercício do poder hierárquico disciplinar das autoridades militares locais.",a:false,e:"ERRADO. A correição desconcentrada não extingue o poder disciplinar das autoridades locais."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:32,s:"A estrutura dos quadros de oficiais estabelecida na Lei Orgânica Nacional classifica o posto de Capitão como oficial intermediário, situando os postos de Major, Tenente-Coronel e Coronel na categoria de oficiais superiores.",a:true,e:"CERTO."},
{m:"Legislação Institucional",bloco:"E",tema:"Lei Orgânica Nacional das PMs e CBMs (Lei 14.751/2023)",dif:"media",fonte:"Simulados Potencial Concursos",lote:"lote5",ordem3:33,s:"Dentre os requisitos de ingresso nas corporações militares, exige-se a comprovação de aprovação em exame de saúde e exame toxicológico com larga janela de detecção.",a:true,e:"CERTO."},
